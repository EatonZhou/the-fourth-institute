<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="white"/>
<text x="28" y="41.56" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#275D85">Workbench 示例：体验结果、解释机制、直接反馈</text>
<polyline points="28,62 1172,62" fill="none" stroke="#91A2AE" stroke-width="1.7"/>
<text x="30" y="583.0300000000001" text-anchor="start" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#61717E">设计示意 · 实线：工作或依赖关系；虚线：反馈或关联；不表示实验测量</text>
<rect x="35" y="90" width="1130" height="55" fill="#F3F4F5" stroke="#263442" stroke-width="1.5"/>
<text x="600.0" y="123.39000000000001" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#263442">任务平台  /  运行中的任务  /  取消体验</text>
<rect x="35" y="165" width="220" height="370" fill="#FFFFFF" stroke="#91A2AE" stroke-width="1.5"/>
<text x="145.0" y="355.89" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#91A2AE"></text>
<text x="43" y="190.7" text-anchor="start" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#275D85">导航与关注点</text>
<text x="55" y="277.16999999999996" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442">功能体验</text>
<text x="55" y="301.94999999999993" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442"></text>
<text x="55" y="326.72999999999996" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442">架构与协议</text>
<text x="55" y="351.50999999999993" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442"></text>
<text x="55" y="376.28999999999996" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442">本次变化</text>
<text x="55" y="401.06999999999994" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442"></text>
<text x="55" y="425.8499999999999" text-anchor="start" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#263442">验证范围</text>
<rect x="280" y="165" width="530" height="370" fill="#FFFFFF" stroke="#91A2AE" stroke-width="1.5"/>
<text x="545.0" y="355.89" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#91A2AE"></text>
<text x="288" y="190.7" text-anchor="start" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#275D85">任务 A：模拟演示</text>
<rect x="305" y="220" width="480" height="85" fill="#EFF4F8" stroke="#275D85" stroke-width="1.5"/>
<text x="545.0" y="268.39" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#275D85">运行中 → 请求已接收 → 停止已确认</text>
<rect x="305" y="340" width="140" height="55" fill="#EFF4F8" stroke="#275D85" stroke-width="1.5"/>
<text x="375.0" y="373.39000000000004" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#275D85">启动任务</text>
<rect x="475" y="340" width="140" height="55" fill="#EFF4F8" stroke="#275D85" stroke-width="1.5"/>
<text x="545.0" y="373.39000000000004" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#275D85">请求取消</text>
<rect x="645" y="340" width="140" height="55" fill="#EFF4F8" stroke="#275D85" stroke-width="1.5"/>
<text x="715.0" y="373.39000000000004" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#275D85">重置演示</text>
<text x="545.0" y="457.18" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#263442">观察：资源释放完成后确认停止</text>
<text x="545.0" y="479.6" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#263442">可保留的输出在结果区继续查看</text>
<rect x="835" y="165" width="330" height="370" fill="#FFFFFF" stroke="#91A2AE" stroke-width="1.5"/>
<text x="1000.0" y="355.89" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#91A2AE"></text>
<text x="843" y="190.7" text-anchor="start" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#275D85">机制与证据</text>
<text x="855" y="277.71000000000004" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#263442">协议：取消请求／停止确认</text>
<text x="855" y="297.77000000000004" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#263442">证据：关联的测试与记录</text>
<text x="855" y="317.83000000000004" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#263442">范围：正常／重复／并发取消</text>
<rect x="855" y="395" width="290" height="95" fill="#EDF5F1" stroke="#26756C" stroke-width="1.5"/>
<text x="1000.0" y="421.7" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#26756C">在此步骤反馈</text>
<text x="1000.0" y="463.77000000000004" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#263442">“接收请求后应显示等待状态”</text>
</svg>