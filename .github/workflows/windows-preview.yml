name: Windows preview installer

on:
  push:
    branches: [main]
    paths: [code/scripts/windows/test-build.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-preview-test
  # Only the newest explicit Windows test request is useful. A superseded
  # test keeps its uploaded package; no public release job exists here.
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      reuse: ${{ steps.request.outputs.reuse }}
      cli_only: ${{ steps.request.outputs.cli_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select package or fixture-only rerun
        id: request
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('code/scripts/windows/test-build.json').read_text())
          run = request.get('reuse_package_run', 0)
          assert type(run) is int and run >= 0
          cli_only = request.get('native_cli_only', False)
          assert type(cli_only) is bool and (not cli_only or run > 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'reuse={run}', file=output)
              print(f'cli_only={str(cli_only).lower()}', file=output)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.request.outputs.reuse != '0'
        with:
          name: windows-test-package
          path: .build/windows
          run-id: ${{ steps.request.outputs.reuse }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.request.outputs.reuse == '0'
        with:
          python-version: '3.12'
      - name: Install build tools
        if: steps.request.outputs.reuse == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full
          python -m pip install -r code/requirements.txt
      - name: Build and verify installer
        if: steps.request.outputs.reuse == '0'
        run: |
          python code/scripts/windows/build.py
          7z t .build/windows/TheFourthInstitute-Setup-x64.exe
          cd .build/windows
          sha256sum --check TheFourthInstitute-Setup-x64.exe.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-package
          path: |
            .build/windows/*.exe
            .build/windows/*.sha256
            .build/windows/receipt.json
          if-no-files-found: error
          retention-days: 1

  native:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-test-package
          path: .build/windows
      - name: Install native test dependencies
        working-directory: code
        run: |
          python -m pip install -r requirements.txt pytest httpx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.package.outputs.cli_only == 'true'
        with:
          name: windows-native-evidence
          path: .build/windows-prior-native
          run-id: ${{ needs.package.outputs.reuse }}
          github-token: ${{ github.token }}
      - name: Verify the reused EXE already passed installer acceptance
        if: needs.package.outputs.cli_only == 'true'
        shell: python
        env:
          TFI_REUSED_RUN: ${{ needs.package.outputs.reuse }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          package = Path('.build/windows')
          previous = json.loads(Path('.build/windows-prior-native/native-smoke.json').read_text())
          receipt = json.loads((package / 'receipt.json').read_text())
          with (package / 'TheFourthInstitute-Setup-x64.exe').open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert previous['status'] == 'passed'
          assert previous['source_commit'] == receipt['source_commit']
          assert previous['exe_sha256'] == digest
          evidence = Path('.build/windows-native')
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'reused-installer-acceptance.json').write_text(json.dumps({
              'run_id': int(os.environ['TFI_REUSED_RUN']), 'acceptance': previous}, indent=2))
      - name: Windows permissions, process identity and local transport
        if: needs.package.outputs.cli_only != 'true'
        working-directory: code
        run: |
          New-Item -ItemType Directory -Force ../.build/windows-native | Out-Null
          $env:PORTAL_INSTANCE_ROOT = Join-Path $env:RUNNER_TEMP 'windows-unit-instance'
          python -c "import os; from pathlib import Path; from tests.cases.instance_test_support import write_instance; write_instance(Path(os.environ['PORTAL_INSTANCE_ROOT']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest --noconftest -q tests/cases/test_three_platform_private_files.py tests/cases/test_three_platform_file_lock.py tests/cases/test_service_endpoint.py tests/cases/test_windows_rpc_restart.py tests/cases/test_windows_command.py tests/cases/test_windows_process_records.py tests/cases/test_windows_service_lifecycle_log.py tests/cases/test_windows_login.py tests/cases/test_process_runtime.py tests/cases/test_release_native_dependencies.py::WindowsManifestTests tests/cases/test_claude_account_usage.py::test_cli_resolution_uses_active_sdk_without_path_fallback *> ../.build/windows-native/unit.log
          $result = $LASTEXITCODE
          Get-Content ../.build/windows-native/unit.log -Encoding utf8
          exit $result
      - name: Archive native unit diagnostics before installer checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-unit-evidence
          path: .build/windows-native/unit.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Install EXE, register, open AMA and restart with blocked download proxies
        if: ${{ !cancelled() && success() }}
        run: |
          $cliOnly = '${{ needs.package.outputs.cli_only }}' -eq 'true'
          ./code/scripts/windows/native_user_smoke.ps1 -Installer .build/windows/TheFourthInstitute-Setup-x64.exe -Evidence .build/windows-native -CliOnly:$cliOnly
      - name: Show failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          function Report-Tail($file, $count) {
            $tail = (Get-Content $file.FullName -Tail $count -Encoding utf8) -join "`n"
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            Write-Output $file.Name
            Write-Output $tail
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$($file.Name)::$escaped"
          }
          Get-ChildItem .build/windows-native -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Report-Tail $_ 150
          }
          Get-ChildItem "$env:RUNNER_TEMP/TFI native" -Filter *.log -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'runtime' } | ForEach-Object {
            Report-Tail $_ 45
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-evidence
          path: |
            .build/windows-native/*.json
            .build/windows-native/*.log
          if-no-files-found: ignore
          retention-days: 1

  # Public releases remain withdrawn: temporary test artifacts only.
