name: macOS preview installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos-preview.yml
      - code/scripts/macos/release.json

permissions:
  contents: read

concurrency:
  group: macos-preview-release
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 -r code/requirements.txt
      - name: Build, install and validate native DMG
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python code/scripts/macos/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}
          path: |
            .build/macos/*.dmg
            .build/macos/*.sha256
            .build/macos/*.json
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: macos-*
          path: .build/macos-release
          merge-multiple: true
      - name: Publish macOS preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 code/scripts/macos/publish.py --directory .build/macos-release --commit "$GITHUB_SHA"
