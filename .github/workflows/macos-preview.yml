name: macOS preview installer

on:
  workflow_dispatch:
    inputs:
      publish_to_github:
        description: '仅在用户明确要求发布到 GitHub 时勾选；默认只构建测试文件'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: macos-preview-release
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 -r code/requirements.txt
      - name: Build, install and validate native DMG
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/tfi-codex-check" @openai/codex@0.163.0
          export TFI_TEST_CODEX_BINARY="$RUNNER_TEMP/tfi-codex-check/node_modules/.bin/codex"
          python code/scripts/macos/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}
          path: |
            .build/macos/*.dmg
            .build/macos/*.sha256
            .build/macos/*.json
          if-no-files-found: error
          retention-days: 1
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_github == true }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: macos-*
          path: .build/macos-release
          merge-multiple: true
      - name: Publish macOS preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 code/scripts/macos/publish.py --publish-to-github --directory .build/macos-release --commit "$GITHUB_SHA"
