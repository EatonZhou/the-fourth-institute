name: Windows TAU readiness

on:
  push:
    branches: [main]
    paths:
      - code/scripts/windows/tau_preflight.py
      - .github/workflows/windows-tau-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Check native TAU prerequisites and enumerate active core cases
        shell: pwsh
        run: |
          $env:PORTAL_TEST_FRAMEWORK_STATE_ROOT = Join-Path $env:RUNNER_TEMP 'tau-readiness-state'
          python code/scripts/windows/tau_preflight.py --output .build/windows-tau/readiness.json
          # Missing prerequisites deliberately fail the gate; zero TAU cases ran.
          exit $LASTEXITCODE
      - name: Archive readiness and selected cases, including blocked runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-tau-readiness
          path: .build/windows-tau/readiness.json
          if-no-files-found: error
          retention-days: 7
