            paper.session || "General",
          );
          if (!result.has(key)) result.set(key, []);
          result.get(key).push(paper);
        }
        return result;
      }

      function renderTree() {
        if (state.leftFace === "ccf") {
          renderCcfTree();
          return;
        }
        updateLeftFaceTabs();
        const meta = state.library?.summary || {};
        $("libraryMeta").textContent = `${meta.visible_count || 0}/${meta.paper_count || 0} papers · ${meta.analysis_count || 0} analyses`;
        const folders = state.library?.folders || [];
        if (!folders.length) {
          const hasAny = Number(meta.paper_count || 0) > 0;
          $("folderTree").innerHTML = hasAny
            ? paperStateHtml("No paper matches current filters.", { density: "inline" })
            : paperStateHtml("No papers registered yet. Use + to register PDF and analysis paths.", {
              density: "inline",
            });
          return;
        }
        const papersByFolder = paperTreePapersByFolder();
        const paperLeafHtml = paper => window.PortalI18n.html`
          <div class="paperLeaf">
            <button class="folderLine ${!isCollectionMode() && paper.id === state.selectedId ? "selected" : ""}" type="button" data-paper-id="${esc(paper.id)}">
              <span class="statusDot ${paper.has_pdf ? "ready" : ""}" title="${paper.has_pdf ? window.PortalI18n.t("PDF available") : window.PortalI18n.t("PDF missing")}"></span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(paper.title)}</span>
            </button>
            ${paperFavoriteButton(paper.id)}
          </div>
        `;
        const rendered = [];
        const limit = state.paperTreeRenderLimit;
        let visibleCount = 0;
        const append = markup => {
          visibleCount += 1;
          if (visibleCount <= limit) rendered.push(markup());
        };
        folders.forEach(venue => {
          const venueKey = paperTreeFolderKey(venue.name);
          const venueExpanded = paperTreeNodeExpanded(venueKey, true);
          append(() => window.PortalI18n.html`
            <div class="folderNode">
              <button class="folderLine" type="button" data-paper-tree-toggle="${esc(venueKey)}" aria-expanded="${venueExpanded ? "true" : "false"}">
                ${disclosureIcon(venueExpanded)}<strong>${esc(venue.name)}</strong><span class="folderCount">${venue.count}</span>
              </button>
            </div>
          `);
          if (!venueExpanded) return;
          (venue.children || []).forEach(year => {
            const yearKey = paperTreeFolderKey(venue.name, year.name);
            const yearExpanded = paperTreeNodeExpanded(yearKey, true);
            append(() => window.PortalI18n.html`
              <div class="folderNode" style="padding-left: 12px;">
                <button class="folderLine" type="button" data-paper-tree-toggle="${esc(yearKey)}" aria-expanded="${yearExpanded ? "true" : "false"}">
                  ${disclosureIcon(yearExpanded)}${esc(year.name)}<span class="folderCount">${year.count}</span>
                </button>
              </div>
            `);
            if (!yearExpanded) return;
            (year.children || []).forEach(session => {
              const sessionKey = paperTreeFolderKey(venue.name, year.name, session.name);
              const sessionExpanded = paperTreeNodeExpanded(sessionKey, false);
              const papers = (session.papers || []).length
                ? session.papers
                : (papersByFolder.get(sessionKey) || []);
              append(() => window.PortalI18n.html`
                <div class="folderNode" style="padding-left: 24px;">
                  <button class="folderLine" type="button" data-paper-tree-toggle="${esc(sessionKey)}" aria-expanded="${sessionExpanded ? "true" : "false"}">
                    ${disclosureIcon(sessionExpanded)}${esc(session.name)}<span class="folderCount">${session.count}</span>
                  </button>
                </div>
              `);
              if (sessionExpanded) papers.forEach(paper => append(() => window.PortalI18n.html`
                <div style="padding-left: 24px;">${paperLeafHtml(paper)}</div>
              `));
            });
          });
        });
        if (visibleCount > limit) rendered.push(window.PortalI18n.html`
          <button class="folderLine" type="button" data-paper-tree-more>
            ${window.PortalI18n.t("显示更多目录")} (${visibleCount - limit})
          </button>
        `);
        $("folderTree").innerHTML = rendered.join("");
      }

      function ccfWorkspaceMeta() {
        const venue = currentCcfVenue();
        const payload = currentCcfPayload();
        const entry = currentCcfEntry();
        const chips = [chip("CCF v7", "accent")];
        if (venue) {
          chips.push(chip(ccfRankLabel(venue), "good"));
          chips.push(chip(ccfVenueShortName(venue) || state.ccfSelectedVenue || "Venue"));
          if (venue.type) chips.push(chip(venue.type));
          if (venue.category) chips.push(chip(venue.category));
        }
        if (entry?.year) chips.push(chip(entry.year));
        if (entry?.issue) chips.push(chip(`Vol. ${entry.issue}`));
        if (!entry && state.ccfSelectedYear) chips.push(chip(state.ccfSelectedYear));
        if (payload?.papers) chips.push(chip(`${payload.papers.length} DBLP papers`));
        return chips.join("");
      }

      function renderCcfPaperRow(paper, index) {
        const authors = ccfPaperAuthors(paper);
        const registered = paper.registered_paper_id ? chip("Registered", "good") : chip("Not registered", "warn");
        const doi = paper.doi ? chip(`DOI ${paper.doi}`) : "";
        return window.PortalI18n.html`
          <article class="paperRow ${state.ccfSelectedPaper === paper ? "selected" : ""}" data-ccf-paper-index="${index}">
            <div class="paperRowHead">
              <div class="paperRowTitle">${esc(paper.title || window.PortalI18n.t("Untitled DBLP paper"))}</div>
              ${paper.registered_paper_id ? window.PortalI18n.html`<span class="relevanceBadge">Open</span>` : window.PortalI18n.html`<span class="relevanceBadge">Regist</span>`}
            </div>
            <div class="workspaceMeta">
              ${registered}
              ${paper.type ? chip(paper.type) : ""}
              ${doi}
            </div>
            ${authors ? window.PortalI18n.html`<div class="paneNote">${esc(authors)}</div>` : ""}
          </article>
        `;
      }

      function renderCcfPaperPreview(paper) {
        if (!paper) return "";
        const venue = currentCcfVenue();
        const authors = ccfPaperAuthors(paper);
        const registeredId = paper.registered_paper_id || "";
        const enrichment = ccfPaperEnrichment(paper);
        const enrichmentStatus = String(enrichment?.status || "");
        const abstract = String(enrichment?.abstract || "").trim();
        const summaryZh = String(enrichment?.summary_zh || "").trim();
        const webStatus = String(enrichment?.web_status || "");
        const webSummaryZh = String(enrichment?.web_summary_zh || "").trim();
        const webFindings = Array.isArray(enrichment?.web_findings) ? enrichment.web_findings : [];
        const sources = [...new Map([
          ...(Array.isArray(enrichment?.sources) ? enrichment.sources : []),
          ...(Array.isArray(enrichment?.web_sources) ? enrichment.web_sources : []),
        ].filter(source => source && typeof source === "object")
          .map(source => [String(source.url || source.title || source.source || ""), source])).values()];
        const webRunning = webStatus === "pending" || enrichmentStatus === "web_pending";
        const webButtonHtml = !registeredId && webStatus !== "done"
          ? window.PortalI18n.html`<button class="portalButton is-compact is-quiet" type="button" data-ccf-web-enrich ${webRunning ? "disabled" : ""}>${webRunning ? "Investigating..." : (webStatus === "error" ? window.PortalI18n.t("Retry web investigation") : window.PortalI18n.t("Web investigation"))}</button>`
          : "";
        const webRunningNote = webRunning
          ? window.PortalI18n.html`<div class="paneNote">Web investigation is running in the background. Fast metadata may appear first.</div>`
          : "";
        const sourcesHtml = sources.length ? window.PortalI18n.html`
          <section class="markdownBody">
            <h4>Sources</h4>
            <ul>
              ${sources.map(source => {
                const title = String(source?.title || source?.url || "source").trim();
                const candidate = String(source?.url || "").trim();
                const url = /^https?:\/\//i.test(candidate) ? candidate : "";
                const note = String(source?.note || source?.type || source?.source || "").trim();
                return window.PortalI18n.html`<li>${url ? window.PortalI18n.html`<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(title)}</a>` : esc(title)}${note ? ` · ${esc(note)}` : ""}</li>`;
              }).join("")}
            </ul>
          </section>
        ` : "";
        const enrichmentHtml = registeredId ? "" : (
          ["done", "web_pending"].includes(enrichmentStatus)
            ? `
              ${webSummaryZh ? window.PortalI18n.html`<section class="markdownBody"><h4>网页综合调查</h4><p>${esc(webSummaryZh)}</p>${webFindings.length ? window.PortalI18n.html`<ul>${webFindings.map(item => window.PortalI18n.html`<li>${esc(item)}</li>`).join("")}</ul>` : ""}</section>` : ""}
              ${webRunningNote}
              ${webStatus === "error" ? window.PortalI18n.html`<div class="paneNote">Web investigation failed: ${esc(enrichment.web_error || window.PortalI18n.t("unknown error"))}</div>` : ""}
              ${summaryZh ? window.PortalI18n.html`<section class="markdownBody"><h4>元数据概览</h4><p>${esc(summaryZh)}</p></section>` : ""}
              ${abstract ? window.PortalI18n.html`<section class="markdownBody"><h4>Abstract</h4><p>${esc(abstract)}</p></section>` : (webRunning ? window.PortalI18n.html`<div class="paneNote">Metadata overview is still being prepared.</div>` : window.PortalI18n.html`<div class="paneNote">未从公开元数据中找到摘要。</div>`)}
              ${sourcesHtml}
            `
            : enrichmentStatus === "error"
              ? window.PortalI18n.html`<div class="paneNote">Enrichment failed: ${esc(enrichment.error || window.PortalI18n.t("unknown error"))}</div>`
              : webRunning
                ? webRunningNote
                : window.PortalI18n.html`<div class="paneNote">Enriching abstract and metadata overview in the background...</div>`
        );
        return window.PortalI18n.html`
          <div class="ccfPaperDetail">
            <div>
              <h3>${esc(paper.title || window.PortalI18n.t("Untitled DBLP paper"))}</h3>
              <div class="workspaceMeta">
                ${chip(ccfRankLabel(venue), "good")}
                ${chip(ccfVenueShortName(venue) || state.ccfSelectedVenue || "Venue")}
                ${state.ccfSelectedYear ? chip(state.ccfSelectedYear) : ""}
                ${paper.type ? chip(paper.type) : ""}
                ${paper.doi ? chip(`DOI ${paper.doi}`) : ""}
              </div>
            </div>
            ${authors ? window.PortalI18n.html`<div class="paneNote">${esc(authors)}</div>` : ""}
            ${enrichmentHtml}
            <div class="workspaceModeActions" style="justify-content:flex-start;margin-left:0;">
              ${webButtonHtml}
              ${registeredId
                ? window.PortalI18n.html`<button class="portalButton is-compact is-primary" type="button" data-paper-id="${esc(registeredId)}">Open registered paper</button>`
                : window.PortalI18n.html`<button class="portalButton is-compact is-primary" type="button" data-register-ccf-paper ${state.ccfRegisterInFlight === (paper.url || paper.title) ? "disabled" : ""}>${state.ccfRegisterInFlight === (paper.url || paper.title) ? "Registering..." : "Regist"}</button>`}
            </div>
          </div>
        `;
      }

      function renderCcfWorkspace() {
        const payload = currentCcfPayload();
        if (!state.ccfSelectedVenue || !state.ccfSelectedYear) {
          $("workspaceMain").innerHTML = paperStateHtml(
            "Select a CCF-A or CCF-B venue year or issue from the left panel.",
          );
          return;
        }
        if (!payload) {
          $("workspaceMain").innerHTML = paperStateHtml("Reading local DBLP cache…", { state: "loading" });
          loadCcfPapers(state.ccfSelectedVenue, state.ccfSelectedYear)
            .then(() => {
              renderWorkspace();
              return loadChatHistory({ paperId: activeChatPaperId(), workspaceId: activeChatWorkspaceId(), render: true });
            })
            .catch(alertError);
          return;
        }
        if (payload.error) {
          $("workspaceMain").innerHTML = paperStateHtml(payload.error, { state: "error" });
          return;
        }
        if (payload.cache_missing) {
          const fetchKey = ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear);
          const fetching = state.ccfPaperFetchInFlight === fetchKey;
          $("workspaceMain").innerHTML = paperStateHtml(
            "No local paper list cache for this entry yet.",
            {
              actionsHtml: window.PortalI18n.html`<button class="portalButton is-compact is-primary" type="button" data-fetch-ccf-papers ${fetching ? "disabled" : ""}>${fetching ? "Fetching..." : window.PortalI18n.t("Fetch DBLP paper list")}</button>`,
            },
          );
          return;
        }
        if (state.ccfSelectedPaper) {
          const selectedPaper = state.ccfSelectedPaper;
          const selectedKey = ccfPaperEnrichmentKey(selectedPaper);
          $("workspaceMain").innerHTML = renderCcfPaperPreview(selectedPaper);
          const existing = ccfPaperEnrichment(selectedPaper);
          queueMicrotask(() => {
            if (!state.ccfSelectedPaper || ccfPaperEnrichmentKey(state.ccfSelectedPaper) !== selectedKey) return;
            ensureCcfPaperEnrichment(selectedPaper, { web: String(existing?.status || "") === "web_pending" }).catch(alertError);
          });
          return;
        }
        const papers = ccfCollectionPapers();
        $("workspaceMain").innerHTML = window.PortalI18n.html`
          <div class="ccfPaperSearchBar">
            <div data-portal-search-field data-portal-search-density="compact">
              <input data-portal-search-input type="search" data-ccf-paper-search placeholder="Search title, author, DOI, ID..." value="${esc(state.ccfPaperQuery || "")}" />
            </div>
            <span class="ccfPaperSearchMeta" id="ccfPaperSearchMeta">${papers.length}/${papers.length} papers</span>
          </div>
          <div class="paperList ccfPaperList" id="ccfPaperListResults">
          </div>
          ${papers.length ? paperStateHtml(window.PortalI18n.t("No paper matches this list search."), {
            density: "compact",
            className: "hidden",
            id: "ccfPaperSearchEmpty",
          }) : ""}
          ${papers.length ? window.PortalI18n.html`<div class="portalToolbar paperToolbar" style="justify-content:center;margin-top:10px;"><button class="portalButton is-compact is-quiet" type="button" id="ccfPaperLoadMore"></button></div>` : paperStateHtml(window.PortalI18n.t("No DBLP papers found for this venue entry."))}
        `;
        queueMicrotask(applyCcfPaperListFilter);
      }

      async function registerCcfPaper(paper) {
        if (!paper) return;
        const marker = paper.url || paper.title || "ccf";
        const returnSnapshot = currentPaperWorkspaceSnapshot({
          leftFace: "ccf",
          mode: "library",
          selectedId: "",
        });
        state.ccfRegisterInFlight = marker;
        renderWorkspace();
        try {
          const relatedProject = String(state.filters.project || "").trim();
          const payload = await paperApi.request("/paper/api/ccf/register", {
            method: "POST",
            body: JSON.stringify({
              paper,
              project_ids: relatedProject ? [relatedProject] : [],
              session: relatedProject,
            }),
          });
          const registered = payload.paper || payload;
          const paperId = registered.id || payload.paper_id || "";
          if (paperId) {
            paper.registered_paper_id = paperId;
            state.previousPaperWorkspace = returnSnapshot;
            state.leftFace = "library";
            state.mode = "reader";
            state.ccfSelectedPaper = null;
            state.selectedId = paperId;
            state.detail = null;
            updateLeftFaceTabs();
            syncModeTabs();
            writeUiState();
            await loadLibrary({ keepDetail: true });
            await loadDetail(paperId, { render: true });
          } else {
            await loadLibrary({ keepDetail: true });
            renderWorkspace();
          }
        } finally {
          state.ccfRegisterInFlight = "";
          renderWorkspace();
        }
      }

      function renderWorkspace() {
        syncFavoriteButtons();
        capturePaperReaderViewState();
        $("workspaceMain")?.classList.remove("is-reader-mode");
        if (state.leftFace === "ccf" && !["library", "reader"].includes(state.mode)) {
          state.mode = "library";
          state.ccfSelectedPaper = null;
          writeUiState();
        }
        if (state.leftFace === "ccf" && state.mode === "reader" && !state.ccfSelectedPaper) {
          state.mode = "library";
          writeUiState();
        }
        if (state.leftFace === "ccf" && state.mode === "library" && state.ccfSelectedPaper) {
          state.ccfSelectedPaper = null;
          writeUiState();
        }
        syncModeTabs();
        const paper = state.detail?.paper || null;
        const librarySummary = state.library?.summary || {};
        const semantic = librarySummary.semantic_search || null;
        const collection = librarySummary.paper_collection || null;
        const isLibraryMode = state.mode === "library" || state.mode === "today";
        const isCcfMode = state.leftFace === "ccf" && (isLibraryMode || (state.mode === "reader" && !!state.ccfSelectedPaper));
        if (isCcfMode) {
          const venue = currentCcfVenue();
          const entry = currentCcfEntry();
          const workspaceTitle = state.ccfSelectedPaper
            ? (state.ccfSelectedPaper.title || window.PortalI18n.t("DBLP Paper"))
            : (venue ? ccfVenueYearLabel(venue, entry || state.ccfSelectedYear) : window.PortalI18n.t("CCF A/B Proceedings"));
          renderPaperResourceIdentity(
            workspaceTitle,
            state.ccfSelectedPaper?.registered_paper_id
              ? { ...state.ccfSelectedPaper, id: state.ccfSelectedPaper.registered_paper_id }
              : null,
          );
          renderWorkspaceDetails(
            venue?.name || "Browse CCF-A, CCF-B, and curated chip/circuit venues from DBLP.",
            ccfWorkspaceMeta(),
          );
          $("workspaceModeActions").innerHTML = "";
          renderCcfWorkspace();
          return;
        }
        const workspaceTitle = isLibraryMode
          ? (semantic ? window.PortalI18n.text`Search: ${semantic.query || window.PortalI18n.t("Semantic search")}` : (collection ? window.PortalI18n.text`Collect: ${collection.direction || window.PortalI18n.t("Paper collection")}` : (state.mode === "today" ? "Today" : window.PortalI18n.t("Paper Library"))))
          : (paper?.title || window.PortalI18n.t("Paper Research"));
        renderPaperResourceIdentity(workspaceTitle, isLibraryMode ? semantic : paper);
        const summaryText = isLibraryMode
          ? String(semantic?.query_interpretation || semantic?.notes || collection?.summary || collection?.error || (state.mode === "today" ? window.PortalI18n.t("Papers registered today.") : "")).trim()
          : String(state.detail?.summary?.content || "").trim();
        renderWorkspaceDetails(summaryText, isLibraryMode ? libraryHeaderMeta() : paperHeaderMeta(paper));
        renderWorkspaceModeActions(paper);
        if (isLibraryMode) return renderLibraryMode();
        if (state.mode === "reader") return renderReaderMode();
        if (state.mode === "review") return renderReviewMode();
        if (state.mode === "exp") return renderExpMode();
        if (state.mode === "figures") return renderFiguresMode();
        if (state.mode === "notes") return renderNotesMode();
        if (state.mode === "refs") return renderRefsMode();
        if (state.mode === "api") return renderApiMode();
      }

      function renderWorkspaceModeActions(paper) {
        const target = $("workspaceModeActions");
        if (!target) return;
        if (state.mode === "library" || state.mode === "today") {
          target.innerHTML = window.PortalI18n.html`
            <button class="portalButton is-compact is-quiet" type="button" id="exportLibraryMarkdownBtn" ${state.library?.papers?.length ? "" : "disabled"}>
              Export
            </button>
          `;
          return;
        }
        if (state.mode === "reader" && paper) {
          const deepState = deepReadStateFor(paper);
          const uploadButton = !paper.has_pdf
            ? window.PortalI18n.html`<button class="portalButton is-compact is-primary" type="button" id="uploadPaperPdfBtn" ${state.pdfUploadInFlight ? "disabled" : ""}>${state.pdfUploadInFlight ? "Uploading..." : "+ PDF"}</button>`
            : "";
          const deletePdfButton = paper.has_pdf
            ? window.PortalI18n.html`<button class="portalButton is-compact is-danger" type="button" id="deletePaperPdfBtn" ${state.pdfDeleteInFlight ? "disabled" : ""}>${state.pdfDeleteInFlight ? window.PortalI18n.t("Deleting PDF...") : window.PortalI18n.t("Delete PDF")}</button>`
            : "";
          target.innerHTML = window.PortalI18n.html`
            <span class="paneNote" id="deepReadStatusText">${esc(deepState.text)}</span>
            <span class="workspaceActionButtons">
              ${uploadButton}
              ${deletePdfButton}
              <button class="portalButton is-compact is-primary" type="button" id="deepReadBtn" ${paper.has_pdf && !deepState.running ? "" : "disabled"}>
                ${esc(deepState.buttonText)}
              </button>
              <button class="portalButton is-compact is-danger" type="button" id="deletePaperBtn">删除</button>
            </span>
          `;
          return;
        }
        if (paper) {
          target.innerHTML = window.PortalI18n.html`
            <span class="workspaceActionButtons">
              ${!paper.has_pdf ? window.PortalI18n.html`<button class="portalButton is-compact is-primary" type="button" id="uploadPaperPdfBtn" ${state.pdfUploadInFlight ? "disabled" : ""}>${state.pdfUploadInFlight ? "Uploading..." : "+ PDF"}</button>` : ""}
              <button class="portalButton is-compact is-danger" type="button" id="deletePaperBtn">删除</button>
            </span>
          `;
          return;
        }
        target.innerHTML = "";
      }

      function libraryHeaderMeta() {
        const summary = state.library?.summary || {};
        const semantic = summary.semantic_search || null;
        const collection = summary.paper_collection || null;
        const chips = [];
        if (semantic) {
          chips.push(chip("Semantic search", "accent"));
          chips.push(chip(`${summary.visible_count || 0} matches`, "good"));
          chips.push(chip(`${summary.paper_count || 0} papers in library`));
          if (semantic.updated_at) chips.push(chip(`updated ${new Date(semantic.updated_at * 1000).toLocaleString()}`));
        } else if (collection) {
          chips.push(chip("Collect", "accent"));
          chips.push(chip(`${summary.visible_count || 0} papers`, "good"));
          chips.push(chip(`${summary.paper_count || 0} papers in library`));
          if (collection.updated_at) chips.push(chip(`updated ${new Date(collection.updated_at * 1000).toLocaleString()}`));
        } else {
          chips.push(chip(`${summary.visible_count || 0}/${summary.paper_count || 0} papers`));
          chips.push(chip(`${summary.analysis_count || 0} analyses`, "good"));
          chips.push(chip(`${summary.review_count || 0} reviews`));
          const activeFilters = Object.entries(state.filters || {}).filter(([, value]) => String(value || "").trim()).map(([key, value]) => `${key}: ${value}`);
          if (state.query) activeFilters.unshift(`q: ${state.query}`);
          if (state.mode === "today") activeFilters.unshift("registered: today");
          if (activeFilters.length) chips.push(chip(activeFilters.join(" · "), "accent"));
        }
        return chips.join("");
      }

      function renderLibraryMode() {
        if (state.libraryLoading) {
          $("workspaceMain").innerHTML = paperStateHtml(
            `Loading ${state.mode === "today" ? "Today" : "Paper Library"}…`,
            { state: "loading" },
          );
          return;
        }
        const summary = state.library?.summary || {};
        const papers = state.library?.papers || [];
        const visiblePapers = papers.slice(0, state.libraryRenderLimit);
        $("workspaceMain").innerHTML = window.PortalI18n.html`
          <div class="overviewGrid">
            <div class="metric"><div class="metricValue">${summary.paper_count || 0}</div><div class="metricLabel">Registered papers</div></div>
            <div class="metric"><div class="metricValue">${summary.analysis_count || 0}</div><div class="metricLabel">Analysis ready</div></div>
            <div class="metric"><div class="metricValue">${summary.review_count || 0}</div><div class="metricLabel">AI reviews</div></div>
          </div>
          <div class="paperList">
            ${visiblePapers.length ? visiblePapers.map(renderPaperRow).join("") : paperStateHtml(window.PortalI18n.t("No paper matches current filters."))}
          </div>
          ${visiblePapers.length < papers.length ? window.PortalI18n.html`<div class="portalToolbar paperToolbar" style="justify-content:center;margin-top:10px;"><button class="portalButton is-compact is-quiet" type="button" id="loadMoreLibraryBtn">Show more · ${visiblePapers.length}/${papers.length}</button></div>` : ""}
        `;
        bindPdfSelectionEvents();
      }

      function paperFavoriteButton(paperId) {
        const favorite = state.favoriteIds.has(paperId);
        const label = favorite ? window.PortalI18n.t("取消收藏") : window.PortalI18n.t("收藏论文");
        return window.PortalI18n.html`<button class="portalButton is-icon is-quiet paperFavorite" type="button" data-paper-favorite="${esc(paperId)}" aria-pressed="${favorite}" aria-label="${label}" title="${label}" ${state.favoritePending.has(paperId) ? "disabled" : ""}>${favorite ? "★" : "☆"}</button>`;
      }

      function syncFavoriteButtons() {
        const header = $("paperFavoriteBtn");
        const paperId = state.leftFace === "library" && !isCollectionMode() ? state.detail?.paper?.id : "";
        header.hidden = !paperId;
        header.dataset.paperFavorite = paperId || "";
        document.querySelectorAll("[data-paper-favorite]").forEach(button => {
          const id = button.dataset.paperFavorite;
          const favorite = state.favoriteIds.has(id);
          const label = favorite ? window.PortalI18n.t("取消收藏") : window.PortalI18n.t("收藏论文");
          button.setAttribute("aria-pressed", String(favorite));
          button.setAttribute("aria-label", label);
          button.title = label;
          button.textContent = favorite ? "★" : "☆";
          button.disabled = state.favoritePending.has(id);
        });
      }

      async function togglePaperFavorite(paperId) {
        if (!paperId || state.favoritePending.has(paperId)) return;
        state.favoritePending.add(paperId);
        state.favoriteRevision += 1;
        syncFavoriteButtons();
        let saved = false;
        try {
          const result = await paperApi.request("/paper/api/favorites", {
            method: "POST",
            body: { paper_id: paperId, favorite: !state.favoriteIds.has(paperId) },
          });
          if (result.favorite) state.favoriteIds.add(paperId);
          else state.favoriteIds.delete(paperId);
          saved = true;
        } finally {
          state.favoriteRevision += 1;
          state.favoritePending.delete(paperId);
          syncFavoriteButtons();
        }
        if (saved && state.filters.favorite === "1") {
          await loadLibrary({ keepDetail: true, hydrateDetail: false });
        }
      }

      function renderPaperRow(paper) {
        const tags = paperTags(paper).slice(0, 7).map(t => chip(t, "accent")).join("");
        const relevance = Number.isFinite(Number(paper.semantic_score))
          ? window.PortalI18n.html`<span class="relevanceBadge" title="${esc(paper.semantic_reason || "")}">Relevance ${esc(paper.semantic_score)}</span>`
          : Number.isFinite(Number(paper.collection_rank))
            ? window.PortalI18n.html`<span class="relevanceBadge">Collected #${esc(paper.collection_rank)}</span>`
          : "";
        return window.PortalI18n.html`
          <article class="paperRow ${!isCollectionMode() && paper.id === state.selectedId ? "selected" : ""}" data-paper-id="${esc(paper.id)}">
            <div class="paperRowHead">
              <div class="paperRowTitle">${esc(paper.title)}</div>
              <div class="paperRowActions">${relevance}${paperFavoriteButton(paper.id)}</div>

      function deepReadStateFor(paper = state.detail?.paper) {
        const deep = state.deepReadStatus && state.deepReadStatus.paper_id === paper?.id ? state.deepReadStatus : null;
        const running = deep && ["queued", "running"].includes(String(deep.status || ""));
        const done = deep && String(deep.status || "") === "done";
        const error = deep && String(deep.status || "") === "error";
        const text = running
          ? `Deep Read: ${deep.step || deep.status} · ${deep.progress || 0}%`
          : done
            ? `Deep Read done${deep.usage?.total_tokens ? ` · ${deep.usage.total_tokens} tokens` : ""}`
            : error
              ? `Deep Read failed: ${deep.error || "unknown error"}`
              : paper?.has_analysis
                ? "Analysis ready"
                : "No analysis yet";
        const buttonText = running ? "Deep Reading" : paper?.has_analysis ? "Re-run Deep Read" : "Deep Read";
        return { deep, running, done, error, text, buttonText };

      function updateDeepReadControls() {
        const paper = state.detail?.paper || null;
        if (!paper) return;
        const status = deepReadStateFor(paper);
        const textEl = $("deepReadStatusText");

        if (textEl) textEl.textContent = status.text;

      function cancelPdfRendering() {
        paperPdfZoom?.dispose?.();
        paperPdfZoom = null;
        paperPdfController?.cancel?.();

      function capturePaperReaderViewState() {
        const grid = $("workspaceMain")?.querySelector(".readerGrid[data-reader-paper-id]");
        const paperId = String(grid?.dataset.readerPaperId || "").trim();
        if (!paperId) return null;
        const previous = paperReaderViewStates.get(paperId) || {};
        const analysis = $("analysisReaderContent");
        const analysisVisible = !!analysis && !analysis.closest(".readerPanel")?.classList.contains("collapsed");
        const pdfViewport = paperPdfController?.root || $("paperPdfViewer");
        const pdfVisible = !!pdfViewport && !pdfViewport.closest(".readerPanel")?.classList.contains("collapsed");
        const pdfReady = !paperPdfController || pdfViewport?.dataset.pdfStatus === "done";
        const next = {
          ...previous,
          ...(analysisVisible ? {
            analysisLeft: analysis.scrollLeft,
            analysisTop: analysis.scrollTop,
          } : {}),
          ...(pdfVisible && pdfReady ? {
            pdfAnchor: paperPdfController?.captureAnchor?.() || null,
            pdfLeft: pdfViewport.scrollLeft,
            pdfTop: pdfViewport.scrollTop,
          } : {}),
        };
        paperReaderViewStates.delete(paperId);
        paperReaderViewStates.set(paperId, next);
        while (paperReaderViewStates.size > 24) {
          paperReaderViewStates.delete(paperReaderViewStates.keys().next().value);
        }
        return next;
      }

      function restoreAnalysisReaderViewState(viewState) {
        const analysis = $("analysisReaderContent");
        if (!analysis || !viewState) return;
        analysis.scrollLeft = Number(viewState.analysisLeft || 0);
        analysis.scrollTop = Number(viewState.analysisTop || 0);
      }

      function restorePdfReaderViewState(controller, viewState) {
        const viewport = controller?.root;
        if (!viewport || !viewState) return;
        if (viewState.pdfAnchor && controller.restoreAnchor(viewState.pdfAnchor)) return;
        viewport.scrollLeft = Number(viewState.pdfLeft || 0);
        viewport.scrollTop = Number(viewState.pdfTop || 0);
      }

      async function renderPdfJsViewer(pdfUrl, title, viewState = null) {
        const viewer = $("paperPdfViewer");
        const root = $("pdfReaderContent");
        if (!viewer || !root || !pdfUrl) return;
        let userScrolledBeforeRestore = false;
        const markUserScroll = event => {
          if (event.isTrusted) userScrolledBeforeRestore = true;
        };
        viewer.addEventListener("scroll", markUserScroll, { passive: true });
        cancelPdfRendering();
        const controller = window.PortalPdfPreview.render({
          root: viewer,
          url: pdfUrl,
          title,
          statusClass: "pdfJsStatus",
          pageClass: "pdfJsPage",
          textLayerClass: "textLayer",
          minPageWidth: 360,
          maxPageWidth: 980,
          minScale: 0.5,
          horizontalPadding: 32,
          onFallback: bindPdfSelectionEvents,
          onReady: bindPdfSelectionEvents,
        });
        const zoom = window.PortalPreview.mountZoom({
          root,
          viewport: viewer,
          min: 0.5,
          max: 4,
          step: 0.1,
          enabled: false,
          captureAnchor: point => controller.captureAnchor(point),
          retargetAnchor: (anchor, point) => controller.retargetAnchor(anchor, point),
          restoreAnchor: anchor => controller.restoreAnchor(anchor),
          restoreOnChange: false,
          onChange: (value, { point, anchor }) => controller.previewGestureScale({
            scaleMultiplier: value,
            point,
            anchor,
          }),
          onCommit: async (value, { anchor, restoreAnchor }) => {
            controller.commitGestureScale({ scaleMultiplier: value });
            if (anchor) restoreAnchor(anchor);
            await controller.redraw();
          },
          onError: alertError,
        });
        paperPdfController = controller;
        paperPdfZoom = zoom;
        const pdf = await controller.promise;
        if (paperPdfController !== controller || paperPdfZoom !== zoom) return;
        zoom.setEnabled(Boolean(pdf));
        if (!userScrolledBeforeRestore) restorePdfReaderViewState(controller, viewState);
        viewer.removeEventListener("scroll", markUserScroll);
      }

      function selectionInfoFromWindow(win, offset = { left: 0, top: 0 }) {
        try {
          const selection = win?.getSelection?.();
          const text = String(selection || "").replace(/\s+/g, " ").trim();
          if (!text || !selection.rangeCount) return null;
          const rect = selection.getRangeAt(0).getBoundingClientRect();
          return {
            text,
            x: offset.left + rect.left + Math.max(0, rect.width / 2),
            y: offset.top + rect.top - 8,
          };
        } catch {}
        return null;
      }

      function currentReaderSelectionInfo(fallbackEvent = null) {
        const workspace = $("workspaceMain");
        const pageInfo = selectionInfoFromWindow(window);
        if (pageInfo && (!workspace || workspace.contains(document.getSelection?.()?.anchorNode || null))) return pageInfo;
        const frame = $("paperPdfFrame");
        try {
          const frameRect = frame?.getBoundingClientRect?.();
          const frameInfo = selectionInfoFromWindow(frame?.contentWindow, frameRect || { left: 0, top: 0 });
          if (frameInfo) return frameInfo;
        } catch {}
        const text = String(window.getSelection?.() || "").replace(/\s+/g, " ").trim();
        if (text && fallbackEvent) return { text, x: fallbackEvent.clientX, y: fallbackEvent.clientY - 8 };
        return null;
      }

      function showSelectionMenu(info) {
        if (!info?.text) return hideSelectionMenu();
        state.selectionText = info.text;
        paperSelectionPopover.open({ x: info.x, y: info.y });
      }

      function hideSelectionMenu() {
        paperSelectionPopover.close();
      }

      function maybeShowSelectionMenu(event = null) {
        setTimeout(() => {
          if (event?.target?.closest?.("#selectionMenu")) return;
          const info = currentReaderSelectionInfo(event);
          if (info?.text) showSelectionMenu(info);
          else hideSelectionMenu();
        }, 20);
      }

      function bindPdfSelectionEvents() {
        const frame = $("paperPdfFrame");
        if (!frame) return;
        const bind = () => {
          try {
            frame.contentWindow?.addEventListener("mouseup", event => maybeShowSelectionMenu(event));
            frame.contentWindow?.addEventListener("keyup", event => maybeShowSelectionMenu(event));
          } catch {}
        };
        frame.addEventListener("load", bind, { once: true });
        bind();
      }

      function selectionPrompt(action, text) {
        const clipped = text.length > 8000 ? `${text.slice(0, 8000)}\n\n[Selection truncated by Portal.]` : text;
        if (action === "translate") return `请把下面这段论文原文翻译成中文。保留关键英文术语，并在必要时补一句术语解释：\n\n${clipped}`;
        if (action === "find-ref") return `下面这段论文原文可能包含 citation、作者名、论文名或 reference marker。请结合当前论文全文，找到它引用的论文条目；输出标题、作者、年份、venue/arXiv/DOI，以及你定位它的依据：\n\n${clipped}`;
        if (action === "regist-ref") return `下面这段论文原文可能包含一个被引用论文。请结合当前论文全文定位该引用，并输出可注册到 Paper Library 的 metadata JSON，包括 title、authors、year、venue、abstract_or_note、arxiv_or_doi_or_url、reason。如果无法唯一确定，请列出候选并说明缺失信息：\n\n${clipped}`;
        return `请解释下面这段论文原文，并说明它在本文方法或实验中的作用：\n\n${clipped}`;
      }

      function addSelectionToChatDraft(text) {
        const selected = String(text || "").trim();

        const currentDraft = String(workspace.draftText?.() || "").trimEnd();
        workspace.setDraftText(currentDraft ? `${currentDraft}\n\n${selected}` : selected);
        paperChatPanel?.focusComposer?.();

        state.registrationSubmitInFlight = false;

        state.registrationDraftPollTimer = 0;
        setPaperRegistrationUploadStatus("No PDF selected");
        setPaperRegistrationControlsBusy(false);
        paperDialog.open({ focusTarget: "#paperForm [name='title']" });

      function closePaperModal() {

        state.registrationDraftInFlight = false;

      function setPaperRegistrationUploadStatus(message, { error = false } = {}) {
        const status = $("paperRegisterUploadStatus");
        if (!status) return;
        status.textContent = String(message || "");
        status.classList.toggle("is-error", !!error);
      }

      function setPaperRegistrationControlsBusy(busy) {
        const uploadButton = $("paperRegisterUploadBtn");
        const submitButton = $("submitPaperBtn");
        if (uploadButton) uploadButton.disabled = !!busy || state.registrationSubmitInFlight;
        if (submitButton) submitButton.disabled = (!!busy && !state.registrationUploadId) || state.registrationSubmitInFlight;
      }

      function setPaperFormValue(name, value, { preserveEdits = false } = {}) {
        const field = $("paperForm")?.elements?.namedItem(name);
        if (!field) return;
        const text = Array.isArray(value) ? value.join(", ") : String(value ?? "");
        if (preserveEdits && (state.registrationEditedFields.has(name) || !text.trim())) return;
        field.value = text;
      }

      function applyPaperRegistrationMetadata(metadata, { preserveEdits = false } = {}) {
        if (!metadata || typeof metadata !== "object") return;
        [
          "title", "authors", "venue", "year", "session", "abstract", "tags", "workload",
          "platform", "architecture", "optimization", "doi", "arxiv",
        ].forEach(name => {
          if (metadata[name] !== undefined && metadata[name] !== null) {
            setPaperFormValue(name, metadata[name], { preserveEdits });
          }
        });
      }

      function schedulePaperRegistrationDraftPoll(uploadId) {
        if (state.registrationDraftPollTimer) clearTimeout(state.registrationDraftPollTimer);
        state.registrationDraftPollTimer = setTimeout(() => {
          pollPaperRegistrationDraft(uploadId).catch(error => {
            if (state.registrationUploadId !== uploadId) return;
            setPaperRegistrationUploadStatus(`Metadata status unavailable: ${error.message || error}`, { error: true });
            schedulePaperRegistrationDraftPoll(uploadId);
          });
        }, 1500);
      }

      async function pollPaperRegistrationDraft(uploadId) {
        if (!uploadId || state.registrationUploadId !== uploadId || $("paperModal")?.hidden) return;
        const draft = await paperApi.get(`/paper/api/papers/registration-draft?upload_id=${encodeURIComponent(uploadId)}`);
        if (state.registrationUploadId !== uploadId) return;
        const status = String(draft.status || "");
        applyPaperRegistrationMetadata(draft.metadata || {}, { preserveEdits: true });
        if (["done", "partial", "error"].includes(status)) {
          state.registrationDraftInFlight = false;
          state.registrationDraftPollTimer = 0;
          const hidden = $("paperForm")?.elements?.namedItem("registration_upload_id");
          if (hidden) hidden.value = uploadId;
          setPaperRegistrationControlsBusy(false);
          if (status === "done") {
            setPaperRegistrationUploadStatus(`${draft.filename || "PDF"} · metadata ready`);
          } else if (status === "partial") {
            const warning = Array.isArray(draft.warnings) ? draft.warnings[0] : "";
            setPaperRegistrationUploadStatus(`${draft.filename || "PDF"} · ${warning || "partial metadata"}`, { error: true });
          } else {
            setPaperRegistrationUploadStatus(`${draft.filename || "PDF"} · ${draft.error || "metadata extraction failed"}`, { error: true });
          }
          return;
        }
        setPaperRegistrationUploadStatus(`${draft.filename || "PDF"} · ${draft.step || "extracting metadata"} · AI 尚未完成，可核对填写后直接登记，无需等待。登记采用当前表单，不会被后续提取结果覆盖。`);
        schedulePaperRegistrationDraftPoll(uploadId);
      }

      async function uploadPaperRegistrationPdf(file) {
        if (!file || state.registrationDraftInFlight || state.registrationSubmitInFlight) return;
        if (!String(file.name || "").toLowerCase().endsWith(".pdf")) {
          window.PortalUI.toast(window.PortalI18n.t("请选择 PDF 文件。"), "warning");
          return;
        }
        state.registrationDraftInFlight = true;
        state.registrationUploadId = "";
        setPaperRegistrationControlsBusy(true);
        setPaperRegistrationUploadStatus(`${file.name || "PDF"} · uploading`);
        try {
          const form = new FormData();
          form.append("file", file, file.name || "paper.pdf");
          const draft = await paperApi.postForm("/paper/api/papers/registration-draft", form);
          const uploadId = String(draft.upload_id || "").trim();
          if (!uploadId) throw new Error("Paper registration upload did not return an id");
          state.registrationUploadId = uploadId;
          setPaperRegistrationControlsBusy(true);
          const hidden = $("paperForm")?.elements?.namedItem("registration_upload_id");
          if (hidden) hidden.value = uploadId;
          setPaperRegistrationUploadStatus(`${draft.filename || file.name || "PDF"} · ${draft.step || "queued"}`);
          schedulePaperRegistrationDraftPoll(uploadId);
        } catch (error) {
          state.registrationDraftInFlight = false;
          setPaperRegistrationControlsBusy(false);
          setPaperRegistrationUploadStatus(error.message || String(error), { error: true });
          throw error;
        }
      }

      async function submitPaper(event) {
        event.preventDefault();
        if ((state.registrationDraftInFlight && !state.registrationUploadId) || state.registrationSubmitInFlight) return;
        state.registrationSubmitInFlight = true;
        setPaperRegistrationControlsBusy(true);
        const form = new FormData(event.currentTarget);
        const payload = Object.fromEntries(form.entries());
        const relatedProject = String(payload.session || "").trim();
        payload.project_ids = relatedProject ? [relatedProject] : [];
        try {
          const detail = await paperApi.request("/paper/api/papers/register", { method: "POST", body: JSON.stringify(payload) });
          closePaperModal();
          mergeDetailPayload(detail, { replace: true });
          state.selectedId = detail.paper.id;
          syncPaperLocation(state.selectedId);
          setMode("reader");
          await loadLibrary({ keepDetail: true });
        } finally {
          state.registrationSubmitInFlight = false;
          setPaperRegistrationControlsBusy(false);
        }
      }

      function scheduleReviewPoll(paperId) {
        clearTimeout(state.reviewPollTimer);
        state.reviewPollTimer = setTimeout(() => loadReviewStatus(paperId).catch(() => {}), 3000);
      }

      async function loadReviewStatus(paperId) {
        if (!paperId || String(state.selectedId || "") !== String(paperId)) return;
        try {
          const response = await paperApi.get(`/paper/api/reviews/status?paper_id=${encodeURIComponent(paperId)}`);
          if (String(state.selectedId || "") !== String(paperId)) return;
          const previous = state.reviewJob;
          state.reviewJob = response.job || null;
          state.reviewPollError = "";
          state.reviewInFlight = ["queued", "running"].includes(state.reviewJob?.status);
          clearTimeout(state.reviewPollTimer);
          state.reviewPollTimer = 0;
          if (state.reviewInFlight) scheduleReviewPoll(paperId);

          state.reviewPollError = "暂时无法获取评审状态；任务可能仍在运行，正在重试。";

          if (state.mode === "review") renderWorkspace();

      async function generateFigureDraft(figureId, sourceGeneratedId = "", requestOverride = "") {
        const id = String(figureId || "").trim();
        if (!state.selectedId || !id || state.figureGenerateInFlight) return;
        const sourceId = String(sourceGeneratedId || "").trim();
        const inputKey = figureInputKey(id, sourceId);
        const inputImages = figureInputItems(inputKey);
        if (inputImages.some(item => item.status === "uploading")) {
          alertError(new Error(window.PortalI18n.t("Please wait for pasted images to finish uploading.")));
          return;
        }
        if (inputImages.some(item => item.status === "error")) {
          alertError(new Error(window.PortalI18n.t("Remove failed image uploads before generating.")));
          return;
        }
        const input = sourceId
          ? document.querySelector(`[data-generated-variant-request="${CSS.escape(sourceId)}"]`)
          : document.querySelector(`[data-figure-request="${CSS.escape(id)}"]`);
        const request = String(requestOverride || input?.value || "").trim();
        if (!request) {
          alertError(new Error(window.PortalI18n.t("Please describe how to modify this figure.")));
          return;
        }
        state.figureGenerateInFlight = id;
        renderWorkspace();
        try {
          const result = await paperApi.request("/paper/api/figures/generate", {
            method: "POST",
            body: JSON.stringify({
              paper_id: state.selectedId,
              figure_id: id,
              request,
              source_generated_id: sourceId,
              extra_image_paths: inputImages.map(item => item.path).filter(Boolean),
            }),
          });
          if (result.figure && state.detail?.figures) {
            state.detail.figures = state.detail.figures.map(item => String(item.figure_id || "") === id ? result.figure : item);
          }
          const generatedId = String(result.generated?.generated_id || "");
          state.figureDraftGeneratedId = generatedId;
          if (input && !requestOverride) input.value = "";
          state.figureInputImages[inputKey] = [];
          refreshFigureInputTray(inputKey);
        } catch (error) {
          state.figureGenerateInFlight = "";
          state.figureDraftGeneratedId = "";
          throw error;
        } finally {
          if (state.mode === "figures") renderWorkspace();
        }
      }

      function figureContextFromInput(input) {
        const figureId = String(input?.dataset.figureId || input?.dataset.figureRequest || "").trim();
        const sourceGeneratedId = String(input?.dataset.generatedVariantRequest || "").trim();
        return { figureId, sourceGeneratedId, key: figureInputKey(figureId, sourceGeneratedId) };
      }

      function figureContextForVisibleFigure(figureId, sourceGeneratedId = "") {
        return { figureId, sourceGeneratedId, key: figureInputKey(figureId, sourceGeneratedId) };
      }

      function figureContextFromKey(key) {
        const parts = String(key || "").split("::");
        const source = parts[2] === "original" ? "" : (parts[2] || "");
        return { key, figureId: parts[1] || "", sourceGeneratedId: source };
      }

      async function uploadFigureInputFile(file, context, existingId = "", previewUrlOverride = "") {
        if (!file || !state.selectedId || !context?.key) return null;
        const id = existingId || `input-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const previewUrl = previewUrlOverride || URL.createObjectURL(file);
        const item = {
          id,
          name: file.name || "image.png",
          previewUrl,
          path: "",
          status: "uploading",
          error: "",
        };
        const current = figureInputItems(context.key).filter(existing => existing.id !== id);
        state.figureInputImages[context.key] = existingId ? [...current, item] : [...current, item];
        refreshFigureInputTray(context.key);
        try {
          const form = new FormData();
          form.append("paper_id", state.selectedId);
          form.append("file", file, item.name);
          const result = await paperApi.postForm("/paper/api/figures/input-image", form);
          item.path = result.path || "";
          item.status = "done";
          state.figureInputImages[context.key] = figureInputItems(context.key).map(existing => existing.id === id ? item : existing);
        } catch (error) {
          item.status = "error";
          item.error = error?.message || String(error);
          state.figureInputImages[context.key] = figureInputItems(context.key).map(existing => existing.id === id ? item : existing);
        }
        refreshFigureInputTray(context.key);
        return item;
      }

      function pastedImageFiles(event) {
        const files = Array.from(event.clipboardData?.files || []).filter(file => String(file.type || "").startsWith("image/"));
        if (files.length) return files;
        return Array.from(event.clipboardData?.items || [])
          .filter(item => String(item.type || "").startsWith("image/"))
          .map(item => item.getAsFile())
          .filter(Boolean);
      }

          editable: true,
          name: title || "figure-image",
          meta: { figureId: context.figureId, sourceGeneratedId: context.sourceGeneratedId, key: context.key, attachmentId: String(attachmentId || "") },
          onSave: async ({ file, previewUrl }) => {
            await uploadFigureInputFile(file, { key: context.key }, String(attachmentId || ""), previewUrl);
          },
        });
      }

      function mergePaperProjectionChanges(changes) {
        if (!changes || typeof changes !== "object") return;
        Object.entries(changes).forEach(([targetId, fields]) => {
          const target = String(targetId || "").trim();
          if (!target) return;
          const pending = pendingPaperProjectionChanges.get(target) || new Set();
          (Array.isArray(fields) ? fields : []).forEach(field => {
            const clean = String(field || "").trim();
            if (clean) pending.add(clean);
          });
          pendingPaperProjectionChanges.set(target, pending);
        });
      }

      function schedulePaperProjectionSync({ snapshot = false, changes = null } = {}) {
        if (snapshot) paperProjectionSnapshotPending = true;
        mergePaperProjectionChanges(changes);
        window.clearTimeout(paperProjectionSyncTimer);
        paperProjectionSyncTimer = 0;
        if (state.leaving || document.hidden) return;
        paperProjectionSyncTimer = window.setTimeout(() => {
          paperProjectionSyncTimer = 0;
          flushPaperProjectionSync().catch(alertError);
        }, 100);
      }

      async function syncPaperProjection(snapshot, changes) {
        const fields = new Set();
        changes.forEach(items => items.forEach(field => fields.add(field)));
        const selectedId = String(state.selectedId || "");
        const selectedChanged = !!selectedId && (snapshot || changes.has(selectedId));

        if (snapshot || fields.has("collector")) {
          await loadCollectorJobs({ render: true });
        }

        if (selectedChanged) {
          const selectedFields = changes.get(selectedId) || new Set();
          const refreshBase = snapshot || [...selectedFields].some(field => !["deep_read", "exp", "figures"].includes(field));
          if (refreshBase) await refreshAssetsProjection(selectedId);
          if (snapshot || selectedFields.has("deep_read")) {
            await refreshDeepReadProjection();
          }
          if (snapshot || selectedFields.has("exp")) {
            await refreshExpProjection({ snapshot });
          }
          if (snapshot || selectedFields.has("figures")) {
            await refreshFigureProjection();
          }
          if (selectedFields.has("review") && state.mode === "review") {
            await loadDetailSections(selectedId, ["reviews"], { render: true, force: true });
          }
          if (
            selectedFields.has("run:assets")
            && !assetsJobRunning()
            && ["refs", "figures"].includes(state.mode)
          ) {
            await loadDetailSections(selectedId, [state.mode], { render: true, force: true });
          }
        }

        if (snapshot || fields.has("ccf_enrichment")) {
          const selectedPaper = state.ccfSelectedPaper;
          if (selectedPaper) {
            const enrichment = ccfPaperEnrichment(selectedPaper);
            await ensureCcfPaperEnrichment(selectedPaper, {
              refresh: true,
              web: String(enrichment?.status || "") === "web_pending",
            });
          }
        }
      }

      async function flushPaperProjectionSync() {
        if (paperProjectionSyncRunning) return;
        paperProjectionSyncRunning = true;
        const snapshot = paperProjectionSnapshotPending;
        const changes = pendingPaperProjectionChanges;
        paperProjectionSnapshotPending = false;
        pendingPaperProjectionChanges = new Map();
        try {
          await syncPaperProjection(snapshot, changes);
        } finally {
          paperProjectionSyncRunning = false;
          if (paperProjectionSnapshotPending || pendingPaperProjectionChanges.size) {
            schedulePaperProjectionSync();
          }
        }
      }

      function bindPaperProjectionEvents() {
        if (paperProjectionEventsBound) return;
        paperProjectionEventsBound = true;
        window.addEventListener("portal:change", event => {
          const changes = event?.detail?.projection_changes?.paper;
          if (changes && typeof changes === "object") {
            schedulePaperProjectionSync({ changes });
          }
        });
        window.addEventListener("portal:events-ready", event => {
          if (event?.detail?.snapshot_required) {
            schedulePaperProjectionSync({ snapshot: true });
          }
        });
      }

          const toggle = event.currentTarget;
          const expanded = toggle.getAttribute("aria-expanded") !== "true";
          toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
          const body = $("workspaceDetailsBody");
          if (body) body.hidden = !expanded;
        });
        $("workspaceModeActions").addEventListener("click", event => {
          if (event.target.closest("#exportLibraryMarkdownBtn")) {
            exportLibraryMarkdown().catch(alertError);
            return;
          }
          if (event.target.closest("#deepReadBtn")) startDeepRead().catch(alertError);
          if (event.target.closest("#uploadPaperPdfBtn")) openPdfUploadPicker();
          if (event.target.closest("#deletePaperPdfBtn")) deleteCurrentPaperPdf().catch(alertError);
          if (event.target.closest("#deletePaperBtn")) deleteCurrentPaper().catch(alertError);
        });
        $("paperPdfUploadInput").addEventListener("change", event => {
          const file = event.target.files?.[0] || null;
          uploadCurrentPaperPdf(file).catch(alertError);
        });
        $("workspaceMain").addEventListener("input", event => {
          const input = event.target.closest("[data-ccf-paper-search]");
          if (!input) return;
          state.ccfPaperQuery = String(input.value || "");
          state.ccfRenderLimits[ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear)] = 100;
          applyCcfPaperListFilter();
        });
        $("workspaceMain").addEventListener("click", event => {
          if (event.target.closest("#loadMoreLibraryBtn")) {
            loadMoreLibrary().catch(alertError);
            return;
          }
          if (event.target.closest("#ccfPaperLoadMore")) {
            const key = ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear);
            state.ccfRenderLimits[key] = Number(state.ccfRenderLimits[key] || 100) + 100;
            applyCcfPaperListFilter();
            return;
          }
          const fetchCcfPapersBtn = event.target.closest("[data-fetch-ccf-papers]");
          if (fetchCcfPapersBtn) {
            fetchSelectedCcfPapers().catch(alertError);
            return;
          }
          const ccfWebEnrichBtn = event.target.closest("[data-ccf-web-enrich]");
          if (ccfWebEnrichBtn) {
            if (!state.ccfSelectedPaper) return;
            ccfWebEnrichBtn.disabled = true;
            ccfWebEnrichBtn.textContent = "Investigating...";
            ensureCcfPaperEnrichment(state.ccfSelectedPaper, { web: true }).catch(alertError);
            return;
          }
          const registerCcfPaperBtn = event.target.closest("[data-register-ccf-paper]");
          if (registerCcfPaperBtn) {
            if (!state.ccfSelectedPaper) return;
            registerCcfPaperBtn.disabled = true;
            registerCcfPaperBtn.textContent = "Registering...";
            registerCcfPaper(state.ccfSelectedPaper).catch(alertError);
            return;
          }
          const ccfPaperRow = event.target.closest("[data-ccf-paper-index]");
          if (ccfPaperRow) {
            const payload = currentCcfPayload();
            const paper = payload?.papers?.[Number(ccfPaperRow.dataset.ccfPaperIndex)];
            if (!paper) return;
            if (paper.registered_paper_id) {
              rememberPreviousPaperWorkspace(currentPaperWorkspaceSnapshot({
                leftFace: "library",
                mode: "reader",
                selectedId: paper.registered_paper_id,
              }));
              state.leftFace = "library";
              state.ccfSelectedPaper = null;
              updateLeftFaceTabs();
              loadDetail(paper.registered_paper_id).then(() => setMode("reader")).catch(alertError);
            } else {
              state.ccfSelectedPaper = paper;
              state.mode = "reader";
              writeUiState();
              syncModeTabs();
              renderWorkspace();
            }
            return;
          }
          const registerRefBtn = event.target.closest("[data-register-ref]");
          if (registerRefBtn) {
            event.stopPropagation();
            registerRef(registerRefBtn.dataset.registerRef || "").catch(alertError);
            return;
          }
          const refCard = event.target.closest("[data-open-ref-paper]");
          if (refCard && !event.target.closest("button,a,input,textarea,select")) {
            openRefPaper(refCard.dataset.openRefPaper || "").catch(alertError);
            return;
          }
          const row = event.target.closest("[data-paper-id]");
          if (row) {
            rememberPreviousPaperWorkspace(currentPaperWorkspaceSnapshot({
              leftFace: "library",
              mode: "reader",
              selectedId: row.dataset.paperId || "",
            }));
            loadDetail(row.dataset.paperId).then(() => {
              if (isCollectionMode()) setMode("reader");
            }).catch(alertError);
            return;
          }
          if (event.target.closest("#createReviewBtn")) createReview().catch(alertError);
          if (event.target.closest("#createExpBtn")) createExp().catch(alertError);
          if (event.target.closest("#extractFiguresBtn")) {
            extractFigures().catch(alertError);
            return;
          }
          const selectFigureBtn = event.target.closest("[data-select-figure]");
          if (selectFigureBtn) {
            state.selectedFigureId = selectFigureBtn.dataset.selectFigure || "";
            renderWorkspace();
            return;
          }
          const explainFigureBtn = event.target.closest("[data-explain-figure]");
          if (explainFigureBtn) {
            explainFigure(explainFigureBtn.dataset.explainFigure || "").catch(alertError);
            return;
          }
          const generateFigureBtn = event.target.closest("[data-generate-figure]");
          if (generateFigureBtn) {
            generateFigureDraft(generateFigureBtn.dataset.generateFigure || "").catch(alertError);
            return;
          }
          const generateFigureVariantBtn = event.target.closest("[data-generate-figure-variant]");
          if (generateFigureVariantBtn) {
            generateFigureDraft(
              generateFigureVariantBtn.dataset.generateFigureVariant || "",
              generateFigureVariantBtn.dataset.sourceGeneratedId || "",
            ).catch(alertError);
            return;
          }
          const figureInputRemove = event.target.closest("[data-figure-input-remove]");
          if (figureInputRemove) {
            const key = figureInputRemove.dataset.figureInputRemove || "";
            const id = figureInputRemove.dataset.inputId || "";
            state.figureInputImages[key] = figureInputItems(key).filter(item => item.id !== id);
            refreshFigureInputTray(key);
            return;
          }
          const figureInputOpen = event.target.closest("[data-figure-input-open]");
          if (figureInputOpen) {
            const key = figureInputOpen.dataset.figureInputOpen || "";
            const id = figureInputOpen.dataset.inputId || "";
            const item = figureInputItems(key).find(candidate => candidate.id === id);
            if (item?.previewUrl) {
              const context = figureContextFromKey(key);
              openFigureLightbox({ src: item.previewUrl }, context.figureId, context.sourceGeneratedId, item.name || "Image", id).catch(alertError);
            }
            return;
          }
          const figureImage = event.target.closest("[data-open-figure-image]");
          if (figureImage) {
            openFigureLightbox(
              figureImage,
              figureImage.dataset.lightboxFigureId || "",
              figureImage.dataset.sourceGeneratedId || "",
              figureImage.dataset.lightboxTitle || "",
            ).catch(alertError);
            return;
          }
          const deleteGeneratedFigureBtn = event.target.closest("[data-delete-generated-figure]");
          if (deleteGeneratedFigureBtn) {
            deleteGeneratedFigure(
              deleteGeneratedFigureBtn.dataset.deleteGeneratedFigure || "",
              deleteGeneratedFigureBtn.dataset.generatedId || "",
            ).catch(alertError);
            return;
          }
          if (event.target.closest("#toggleAnalysisPanelBtn")) {
            toggleReaderPanel("analysis");
            return;
          }
          if (event.target.closest("#togglePdfPanelBtn")) {
            toggleReaderPanel("pdf");
            return;
          }
          const deleteReviewBtn = event.target.closest("[data-delete-review]");
          if (deleteReviewBtn) {
            deleteReview(deleteReviewBtn.dataset.deleteReview || "").catch(alertError);
            return;
          }
          const deleteNoteBtn = event.target.closest("[data-delete-note]");
          if (deleteNoteBtn) {
            deleteNote(deleteNoteBtn.dataset.deleteNote || "").catch(alertError);
            return;
          }
        });
        $("workspaceMain").addEventListener("keydown", event => {
          if (event.isComposing || !((event.metaKey || event.ctrlKey) && event.key === "Enter")) return;
          const variantBox = event.target.closest("[data-generated-variant-request]");
          if (variantBox) {
            event.preventDefault();
            const generatedId = variantBox.dataset.generatedVariantRequest || "";
            const button = document.querySelector(`[data-source-generated-id="${CSS.escape(generatedId)}"][data-generate-figure-variant]`);
            generateFigureDraft(button?.dataset.generateFigureVariant || state.selectedFigureId || "", generatedId).catch(alertError);
            return;
          }
          const requestBox = event.target.closest("[data-figure-request]");
          if (!requestBox) return;
          event.preventDefault();
          generateFigureDraft(requestBox.dataset.figureRequest || "").catch(alertError);
        });
        $("workspaceMain").addEventListener("paste", event => {
          const input = event.target.closest("[data-figure-request], [data-generated-variant-request]");
          if (!input) return;
          const files = pastedImageFiles(event);
          if (!files.length) return;
          event.preventDefault();
          const context = figureContextFromInput(input);
          files.forEach(file => uploadFigureInputFile(file, context).catch(alertError));
        });
        $("folderTree").addEventListener("click", event => {
          if (event.target.closest("[data-paper-tree-more]")) {
            state.paperTreeRenderLimit += 240;
            renderTree();
            return;
          }
          const ccfRankBtn = event.target.closest("[data-ccf-rank]");
          if (ccfRankBtn) {
            const rank = ccfRankBtn.dataset.ccfRank || "";
            if (!rank) return;
            state.ccfCollapsedRanks = { ...(state.ccfCollapsedRanks || {}) };
            if (state.ccfCollapsedRanks[rank]) {
              delete state.ccfCollapsedRanks[rank];
            } else {
              state.ccfCollapsedRanks[rank] = true;
            }
            writeUiState();
            renderTree();
            return;
          }
          const ccfCategoryBtn = event.target.closest("[data-ccf-category]");
          if (ccfCategoryBtn) {
            const key = ccfCategoryBtn.dataset.ccfCategory || "";
            if (!key) return;
            state.ccfCollapsedCategories = { ...(state.ccfCollapsedCategories || {}) };
            if (state.ccfCollapsedCategories[key]) {
              delete state.ccfCollapsedCategories[key];
            } else {
              state.ccfCollapsedCategories[key] = true;
            }
            writeUiState();
            renderTree();
            return;
          }
          const ccfFetchYearsBtn = event.target.closest("[data-ccf-fetch-years]");
          if (ccfFetchYearsBtn) {
            const venueKey = ccfFetchYearsBtn.dataset.ccfFetchYears || "";
            fetchCcfYearsForVenue(venueKey).catch(alertError);
            return;
          }
          const ccfVenueBtn = event.target.closest("[data-ccf-venue]");
          if (ccfVenueBtn) {
            const venueKey = ccfVenueBtn.dataset.ccfVenue || "";
            state.ccfExpandedVenue = state.ccfExpandedVenue === venueKey ? "" : venueKey;
            if (state.ccfExpandedVenue) {
              state.ccfSelectedVenue = venueKey;
              state.ccfSelectedPaper = null;
            }
            writeUiState();
            renderTree();
            if (state.ccfExpandedVenue) {
              loadCcfYears(venueKey).then(() => renderTree()).catch(alertError);
            }
            return;
          }
          const ccfYearBtn = event.target.closest("[data-ccf-year]");
          if (ccfYearBtn) {
            const venueKey = ccfYearBtn.dataset.ccfYearVenue || "";
            const year = ccfYearBtn.dataset.ccfYear || "";
            state.ccfSelectedVenue = venueKey;
            state.ccfExpandedVenue = venueKey;
            state.ccfSelectedYear = year;
            state.ccfSelectedPaper = null;
            state.ccfPaperQuery = "";
            state.mode = "library";
            writeUiState();
            syncModeTabs();
            renderTree();
            renderWorkspace();
            loadCcfPapers(venueKey, year)
              .then(() => {
                renderWorkspace();
                return loadChatHistory({ paperId: activeChatPaperId(), workspaceId: activeChatWorkspaceId(), render: true });
              })
              .catch(alertError);
            return;
          }
          const paperBtn = event.target.closest("[data-paper-id]");
          const paperTreeToggle = event.target.closest("[data-paper-tree-toggle]");
          if (paperTreeToggle) {
            const key = paperTreeToggle.dataset.paperTreeToggle || "";
            if (!key) return;
            state.paperTreeExpansion = {
              ...(state.paperTreeExpansion || {}),
              [key]: paperTreeToggle.getAttribute("aria-expanded") !== "true",
            };
            renderTree();
            return;
          }
          if (paperBtn) {
            rememberPreviousPaperWorkspace(currentPaperWorkspaceSnapshot({
              leftFace: "library",
              mode: "reader",
              selectedId: paperBtn.dataset.paperId || "",
            }));
            loadDetail(paperBtn.dataset.paperId).then(() => setMode("reader")).catch(alertError);
            return;
          }
        });
        $("workspaceMain").addEventListener("mouseup", event => maybeShowSelectionMenu(event));
        $("workspaceMain").addEventListener("keyup", event => maybeShowSelectionMenu(event));
        $("selectionMenu").addEventListener("mousedown", event => event.preventDefault());
        $("selectionMenu").addEventListener("click", event => {
          const btn = event.target.closest("[data-selection-action]");
          if (!btn) return;
          runSelectionAction(btn.dataset.selectionAction || "").catch(alertError);
        });
        document.addEventListener("keydown", event => {
          if (!isPreviousPaperWorkspaceShortcut(event) || !canRestorePaperWorkspace(state.previousPaperWorkspace)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          goPreviousPaperWorkspace().catch(alertError);
        }, true);
        $("searchInput").addEventListener("input", event => {
          state.query = event.target.value;
          state.activeSemanticSearchId = "";
          state.semanticSearch?.clearActive?.({ notify: false });
          state.activeCollectorJobId = "";
          writeUiState();
          renderCollectorJobs();
          clearTimeout(state.searchTimer);
          state.searchTimer = setTimeout(() => loadLibrary({ keepDetail: false }).catch(alertError), 180);
        });
        [["yearFilter", "year"], ["venueFilter", "venue"], ["tagFilter", "tag"], ["projectFilter", "project"]].forEach(([id, key]) => {
          $(id).addEventListener("change", event => {
            state.filters[key] = event.target.value;
            writeUiState();
            loadLibrary({ keepDetail: false }).catch(alertError);
          });
        });
        document.querySelector(".portalModuleNav")?.addEventListener("click", event => {
          const target = event.target instanceof Element ? event.target : null;
          const link = target?.closest("a[href]");
          if (!link || link.target === "_blank") return;
          state.leaving = true;
          suspendPaperUpdates();
        });
        window.addEventListener("pagehide", () => {
          state.leaving = true;
          suspendPaperUpdates();
        });
        window.addEventListener("beforeunload", () => {
          state.leaving = true;
          suspendPaperUpdates();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            suspendPaperUpdates({ includeDeferred: false, includePdf: false });
          } else if (!state.leaving) {
            resumePaperUpdates();
          }
        });
      }

      function suspendPaperUpdates({ includeDeferred = true, includePdf = true } = {}) {
        if (includePdf) cancelPdfRendering();
        window.clearTimeout(paperProjectionSyncTimer);
        paperProjectionSyncTimer = 0;
        clearTimeout(state.pdfResizeTimer);
        state.pdfResizeTimer = null;
        if (includeDeferred) {
          clearTimeout(state.searchTimer);
          state.searchTimer = null;
          clearTimeout(state.ccfFilterTimer);
          state.ccfFilterTimer = null;
        }
      }

      function resumePaperUpdates() {
        schedulePaperProjectionSync({ snapshot: true });
      }

      const alertError = err => window.PortalUI.alertError(err, { leaving: state.leaving });

      async function init() {
        initPaperWorkbench();
        bindEvents();
        paperIdentityReady = loadMe();
        // Saved filters and reader state are scoped to the authenticated user.
        // Reading them as "anonymous" loses the selection on every reload.
        await paperIdentityReady;
        readUiState();
        const requestedPaperId = requestedPaperIdFromUrl();
        const requestedSemanticSearchId = requestedSemanticSearchIdFromUrl();
        const requestedChatWorkspaceId = requestedChatWorkspaceIdFromUrl();
        if (requestedChatWorkspaceId) {
          state.requestedChatWorkspaceId = requestedChatWorkspaceId;
          state.leftFace = "library";
          state.mode = "library";
          state.selectedId = "";
          state.detail = null;
        } else if (requestedPaperId) {
          state.leftFace = "library";
          state.selectedId = requestedPaperId;
          state.mode = "reader";
          state.ccfSelectedPaper = null;
          state.detail = null;
        } else if (requestedSemanticSearchId) {
          state.leftFace = "library";
          state.mode = "library";
          state.selectedId = "";
          state.detail = null;
          state.activeCollectorJobId = "";
          state.activeSemanticSearchId = requestedSemanticSearchId;
        }
        initSemanticSearch();
        if (requestedChatOpenFromUrl() && !paperWorkbench?.isPanelVisible("chat")) paperWorkbench?.showPanel("chat");
        applyPaneCollapse();
        syncModeTabs();
        // Auxiliary services must not gate library browsing, even while pending.
        loadCollectorJobs({ render: true }).catch(error => window.PortalUI.toast(`Collector：${error.message || error}`, "warning"));
        state.semanticSearch.load({ fresh: true }).catch(error => window.PortalUI.toast(window.PortalI18n.text`语义搜索：${error.message || error}`, "warning")).finally(() => {
          semanticSearchReady = true;
        });
        const libraryReady = loadLibrary({ keepDetail: true, hydrateDetail: false });
        renderChat();
        await libraryReady;
        if (state.leftFace === "ccf") {
          await loadCcfVenues();
          await ensureCcfYearsForFilter();
          if (state.ccfExpandedVenue) await loadCcfYears(state.ccfExpandedVenue);
          if (state.ccfSelectedVenue && state.ccfSelectedYear) await loadCcfPapers(state.ccfSelectedVenue, state.ccfSelectedYear);
          renderTree();
          renderWorkspace();
          await loadChatHistory({ paperId: activeChatPaperId(), workspaceId: activeChatWorkspaceId(), render: true });
        }
        if (state.selectedId && !isCollectionMode()) {
          try {
            await loadDetail(state.selectedId, { render: true });
          } catch {
            state.selectedId = "";
            state.detail = null;
            writeUiState();
            renderWorkspace();
          }
        }
        renderAssistantContext();
        bindPaperProjectionEvents();
      }

      init().catch(alertError);
    </script>
  </body>
</html>
