    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .shell {
        display: block;
        position: relative;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .leftBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
      .workspaceBody { height: calc(100% - 46px); overflow: hidden; }
      .workspacePane > .workspaceBody { width: 100%; height: 100%; min-width: 0; }
      .leftBody { padding: 9px; }
      .searchWrap { display: grid; gap: 7px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
      .collectorBox { display: grid; gap: 4px; }
      #collectorMaxPapers { flex: 0 0 58px; width: 58px; }
      .collectorJobList { display: grid; gap: 4px; }
      .collectorJobMeta { color: var(--muted); font-size: 10.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .collectorJobItem {
        border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: 7px;
        background: color-mix(in srgb, var(--panel-2) 50%, transparent);
        padding: 5px 6px;
        display: grid;
        gap: 3px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
      }
      .collectorJobItem.active { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
      .collectorJobMain {
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 3px;
      }
      .collectorJobMain:disabled { cursor: default; opacity: .72; }
      .collectorJobFailure { grid-column: 1 / -1; min-width: 0; overflow-wrap: anywhere; }
      .collectorJobFailure summary { cursor: pointer; color: var(--danger); }
      .collectorJobFailureBody { white-space: pre-wrap; }
      .collectorJobTop { display: flex; gap: 6px; align-items: center; min-width: 0; }
      .collectorJobDirection { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
      .collectorJobStatus { flex: 0 0 auto; color: var(--muted); font-size: 10.5px; }
      .collectorJobStatus.done { color: var(--success); }
      .collectorJobStatus.error { color: var(--danger); }
      .collectorJobStatus.running, .collectorJobStatus.queued { color: var(--accent); }
      .collectorJobActions { display: flex; align-items: center; gap: 2px; padding-left: 3px; }
      .collectorJobAction {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
      }
      .collectorJobAction:hover { background: var(--panel); color: var(--danger); }
      .collectorJobAction svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hidden { display: none !important; }
      .paperToolbar { gap: 5px; flex-wrap: wrap; }
      .leftFaceTabs { width: 100%; margin-bottom: 7px; }
      .leftFaceTabs button { flex: 1 1 0; }
      .ccfFilterBar { margin-bottom: 7px; }
      .portalAsyncState.ccfYearsState { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; }
      .ccfYearsState .portalAsyncStateActions { grid-column: 2; justify-content: flex-start; min-width: 0; }
      .ccfFetchYearsButton { white-space: normal; max-width: 100%; height: auto; overflow-wrap: anywhere; }
      .filterGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .folderTree { display: grid; gap: 3px; min-width: 0; }
      /* The library tree has thousands of folder lines; venues off screen
         skip layout until they scroll near the viewport. */
      .folderTree > .folderNode { content-visibility: auto; contain-intrinsic-size: auto 120px; }
      .folderNode { border-radius: 6px; min-width: 0; }
      .folderLine {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 5px 6px;
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .folderLine > :first-child { flex: 0 0 auto; }
      .folderDisclosureIcon { width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; color: currentColor; }
      .folderDisclosureIcon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .paperDisclosure > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
      .paperDisclosure > summary::-webkit-details-marker { display: none; }
      .paperDisclosureIcon { width: 18px; height: 18px; padding: 2px; border: none; border-radius: 5px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); flex: 0 0 auto; transition: transform 120ms ease; }
      .paperDisclosure[open] > summary .paperDisclosureIcon { transform: rotate(180deg); }
      .folderLine > strong,
      .folderLine > span:not(:first-child):not(.folderCount) {
        flex: 1 1 auto;
        min-width: 0;
      }
      .folderLine:hover { background: var(--panel-2); color: var(--accent); }
      .folderCount {
        flex: 0 0 auto;
        min-width: 2.5em;
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        white-space: nowrap;
      }
      .paperLeaf { padding-left: 26px; }
      .paperLeaf .folderLine { color: var(--muted); }
      .paperLeaf .folderLine.selected { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); }
      .ccfRankHeader {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 8px 0 3px;
        padding: 4px 6px;
        border: none;
        border-radius: 5px;
        background: color-mix(in srgb, var(--accent) 10%, var(--panel));
        color: var(--accent);
        text-align: left;
        font-size: 11px;
        font-weight: 760;
        letter-spacing: .02em;
        cursor: pointer;
      }
      .ccfRankHeader:hover { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
      .ccfCategoryHeader {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 5px 0 2px;
        padding: 3px 6px;
        border: none;
        background: transparent;
        color: var(--muted);
        text-align: left;
        font-size: 11px;
        font-weight: 720;
        cursor: pointer;
        border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      }
      .ccfCategoryHeader:hover { color: var(--accent); background: var(--panel-2); }
      .ccfCategoryHeader .folderCount { font-size: 10px; }
      .ccfPaperList { display: grid; gap: 7px; }
      .ccfPaperSearchBar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ccfPaperSearchMeta {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .ccfPaperDetail { display: grid; gap: 12px; max-width: 960px; }
      .statusDot { width: 7px; height: 7px; border-radius: 99px; background: var(--muted); flex: 0 0 auto; }
      .statusDot.ready { background: var(--success); }
      .workspaceBody { display: grid; grid-template-rows: auto minmax(0, 1fr); }
      .workspaceTop {
        min-width: 0;
        max-width: 100%;
        padding: 8px 12px 6px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 6px;
      }
      .titleBlock {
        min-width: 0;
        max-width: 100%;
        display: grid;
        row-gap: 2px;
      }
      .workspaceTitle {
        display: -webkit-box;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        font-size: 18px;
        font-weight: 780;
        line-height: 1.25;
        overflow-wrap: anywhere;
        white-space: normal;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      #workspaceResourceIdentity {
        min-width: 0;
        max-width: 100%;
        --portal-resource-identity-title-row-max-width: 100%;
        --portal-resource-identity-title-row-align: flex-start;
        --portal-resource-identity-title-size: 18px;
        --portal-resource-identity-title-weight: 780;
      }
      .workspaceIdentityMetaRow {
        min-width: 0;
        max-width: 100%;
        display: grid;
        grid-template-columns: var(--workspace-resource-id-width, max-content) minmax(0, 1fr);
        grid-template-rows: auto auto;
        column-gap: 6px;
        row-gap: 2px;
      }
      .workspaceResourceIdSlot {
        grid-column: 1;
        grid-row: 1;
        align-self: center;
      }
      .workspaceDetailsToggle {
        grid-column: 2;
        grid-row: 1;
        align-self: center;
        justify-self: start;
        width: fit-content;
        min-height: 16px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 10px;
        font-weight: 680;
        user-select: none;
      }
      .workspaceDetailsToggle:hover { color: var(--accent); }
      .workspaceDetailsIcon { width: 13px; height: 13px; transition: transform .16s ease; }
      .workspaceDetailsToggle[aria-expanded="true"] .workspaceDetailsIcon { transform: rotate(180deg); }
      .workspaceDetailsBody {
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
        display: grid;
        gap: 6px;
        padding: 5px 0 3px;
      }
      .workspaceDetailsBody[hidden] { display: none; }
      .workspaceSummary {
        display: none;
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        max-width: 1100px;
        overflow-wrap: anywhere;
      }
      .workspaceSummary.visible { display: block; }
      .workspaceMeta { min-width: 0; max-width: 100%; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .workspaceControls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .workspaceControls > #modeTabs {
        flex: 0 1 auto;
        flex-wrap: wrap;
        min-width: 0;
        max-width: 100%;
      }
      .workspaceModeActions {
        margin-left: auto;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
        max-width: 100%;
      }
      .workspaceModeActions > .paneNote {
        flex: 1 1 auto;
        min-width: 76px;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .workspaceActionButtons {
        min-width: 0;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: nowrap;
      }
      .workspaceMain { min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 12px 12px; }
      .workspaceMain.is-reader-mode { overflow: hidden; }
      .paperList { display: grid; gap: 8px; }
      .paperRow {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 8px;
        padding: 10px;
        display: grid;
        gap: 8px;
        cursor: pointer;
      }
      .paperRow:hover, .paperRow.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 12%, transparent); }
      .paperRowHead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
      .paperRowActions, .paperFavoriteFilter { display: flex; align-items: center; gap: 8px; }
      .paperFavoriteFilter { font-size: 12px; cursor: pointer; }
      .paperFavoriteFilter input { width: auto; }
      .paperFavorite { flex: 0 0 auto; font-size: 19px; }
      .paperFavorite[aria-pressed="true"] { color: var(--accent); }
      .paperLeaf { display: flex; align-items: center; gap: 4px; }
      .paperLeaf > .folderLine { flex: 1; min-width: 0; }
      .paperRowTitle { font-size: 14px; font-weight: 720; line-height: 1.35; overflow-wrap: anywhere; }
      .relevanceBadge {
        border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--border));
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 10%, var(--panel));
        color: var(--accent);
        padding: 3px 7px;
        font-size: 11px;
        line-height: 1.15;
        font-weight: 700;
        white-space: nowrap;
      }
      .chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; min-width: 0; max-width: 100%; }
      .paperStatusAuthor { display: inline-block; vertical-align: middle; max-width: min(100%, 920px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .overviewGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
      .metric, .reviewCard, .apiCard {
        min-width: 0;
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 11px;
      }
      .apiCard.clickable { cursor: pointer; }
      .apiCard.clickable:hover { border-color: color-mix(in srgb, var(--accent) 46%, var(--border)); }
      .refCard { display: grid; gap: 9px; padding: 13px; }
      .refHead { display: grid; gap: 7px; min-width: 0; }
      .refTitle { font-size: 14px; line-height: 1.35; font-weight: 760; color: var(--text); }
      .refActions { display: flex; justify-content: flex-start; gap: 6px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
      .refRaw {
        padding: 8px 9px;
        border-radius: 7px;
        background: color-mix(in srgb, var(--panel-2) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.48;
        overflow-wrap: anywhere;
      }
      .figureWorkspace {
        height: calc(100% - 46px);
        min-height: 420px;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
        gap: 10px;
        align-items: stretch;
      }
      .figureList {
        min-height: 0;
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 7px;
      }
      .figureListItem {
        width: 100%;
        min-width: 0;
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 7px;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }
      .figureListItem:hover,
      .figureListItem.active {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
        background: color-mix(in srgb, var(--accent) 7%, var(--panel));
      }
      .figureListThumb {
        width: 72px;
        height: 52px;
        object-fit: contain;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
      }
      .figureListText { min-width: 0; display: grid; gap: 3px; }
      .figureListTitle { font-size: 12px; font-weight: 760; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .figureListMeta { color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .figureDetailPane { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
      .figureCard { display: grid; gap: 9px; }
      .figureImage {
        width: 100%;
        max-height: min(520px, 52vh);
        object-fit: contain;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: zoom-in;
      }
      .figurePromptBox {
        width: 100%;
        min-height: 62px;
        resize: vertical;
      }
      .figureInputTray {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 0;
      }
      .figureInputChip {
        width: 150px;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        gap: 7px;
        align-items: center;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
      }
      .figureInputThumb {
        width: 42px;
        height: 34px;
        border: 0;
        border-radius: 5px;
        background: #fff;
        padding: 0;
        overflow: hidden;
        cursor: zoom-in;
      }
      .figureInputThumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .figureInputMeta { min-width: 0; display: grid; gap: 1px; }
      .figureInputName { font-size: 10.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .figureInputStatus { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .figureInputStatus.error { color: var(--danger); }
      .figureInputRemove {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .figureInputRemove:hover { background: var(--panel-2); color: var(--danger); }
      .figureGenerated { display: grid; gap: 7px; }
      .metricValue { font-size: 22px; font-weight: 780; color: var(--accent); }
      .metricLabel { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .apiCard > .paperToolbar { align-items: flex-start; }
      .apiCard > .paperToolbar h3 { flex: 1 1 240px; min-width: 0; }
      .apiCard > .paperToolbar .chips { flex: 0 1 auto; justify-content: flex-end; }
      .reviewCard h3, .apiCard h3 { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
      .reviewCard p, .apiCard p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
      .readerGrid { height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 9px; }
      .readerGrid.analysisCollapsed { grid-template-columns: 44px minmax(0, 1fr); }
      .readerGrid.pdfCollapsed { grid-template-columns: minmax(0, 1fr) 44px; }
      .readerPanel {
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--panel);
        display: grid;
        grid-template-rows: 46px minmax(0, 1fr);
      }
      .readerPanel.collapsed { grid-template-rows: 46px; }
      .readerHead {
        min-width: 0;
        padding: 6px 8px;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 84%, transparent);
        background: color-mix(in srgb, var(--panel-2) 54%, var(--panel));
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
      }
      .readerHeadIdentity {
        min-width: 0;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
      }
      .readerHeadIcon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
        border-radius: 7px;
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
        color: var(--accent);
        font: 800 8px/1 var(--mono);
        letter-spacing: .025em;
      }
      .readerHeadText {
        min-width: 0;
        display: grid;
        gap: 1px;
      }
      .readerHeadTitle {
        min-width: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        font-weight: 760;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .readerPath {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font: 9.5px/1.3 var(--mono);
      }
      .readerHeadActions {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 3px;
        flex-wrap: nowrap;
      }
      .readerHeadActions .portalButton {
        flex: 0 0 auto;
      }
      .readerPanel.collapsed .readerHead {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 6px 5px;
      }
      .readerPanel.collapsed .readerHeadIdentity { display: none; }
      .readerPanel.collapsed .readerHeadActions > *:not(.readerPanelToggle) { display: none; }
      .readerPanel.collapsed .readerContent { display: none; }
      .readerPanelToggle svg { transition: transform .16s ease; }
      .readerPanel.collapsed .readerPanelToggle svg { transform: rotate(180deg); }
      .readerContent { overflow: auto; padding: 13px; }
      .readerContent iframe { width: 100%; height: 100%; min-height: 620px; border: 0; background: #fff; }
      .readerContent.pdfReaderContent { padding: 0; background: #5a626d; }
      .pdfJsViewer {
        height: 100%;
        min-height: 620px;
        overflow: auto;
        padding: 16px;
        display: grid;
        gap: 16px;
        justify-items: center;
        align-content: start;
        background: #5a626d;
      }
      .pdfJsStatus {
        width: min(760px, 100%);
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 8px;
        padding: 12px;
        color: #fff;
        background: rgba(15, 23, 42, .44);
        text-align: center;
        line-height: 1.45;
      }
      .pdfJsViewer iframe {
        width: min(100%, 1000px);
        height: calc(100vh - 220px);
        min-height: 620px;
        border: 0;
        background: #fff;
      }
      .pdfJsPage {
        position: relative;
        background: #fff;
        box-shadow: 0 8px 26px rgba(15, 23, 42, .28);
      }
      .pdfJsPage canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      .textLayer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        line-height: 1;
        text-align: initial;
        transform-origin: 0 0;
      }
      .textLayer span,
      .textLayer br {
        position: absolute;
        color: transparent;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      .textLayer ::selection {
        background: rgba(37, 99, 235, .34);
      }
      .markdownBody:not(:where(.portalChatWorkspaceRoot *)) { font-size: 14px; line-height: 1.62; color: var(--text); overflow-wrap: anywhere; }
      .markdownBody:not(:where(.portalChatWorkspaceRoot *)) h1, .markdownBody:not(:where(.portalChatWorkspaceRoot *)) h2, .markdownBody:not(:where(.portalChatWorkspaceRoot *)) h3 { line-height: 1.25; margin: 1em 0 .5em; }
      .markdownBody:not(:where(.portalChatWorkspaceRoot *)) p { margin: .65em 0; }
      .markdownBody:not(:where(.portalChatWorkspaceRoot *)) pre { overflow: auto; padding: 10px; border-radius: 7px; background: var(--panel-2); }
      .markdownBody:not(:where(.portalChatWorkspaceRoot *)) code { font-family: var(--mono); font-size: .92em; }
      .reviewFlow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin: 12px 0; }
      .reviewCard { display: grid; gap: 8px; border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); }
      .reviewCard ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .reviewOutput { display: grid; gap: 10px; }
      .assistantContext { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.45; }
      .selectionMenu {
        position: fixed;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .selectionMenu[hidden] { display: none; }
      .selectionMenu button {
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 5px 8px;
        cursor: pointer;
      }
      .selectionMenu button:hover { background: var(--panel-2); color: var(--accent); }
      .paperRegisterSurface { --portal-detail-width: 780px; }
      .paperRegisterBody { display: grid; gap: 10px; }

      .paperRegisterUpload {

        align-items: center;
        gap: 10px;

        border: 1px dashed var(--border);

        background: var(--panel-2);
      }

      .paperRegisterUploadStatus {

        font-size: 12px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .paperRegisterUploadStatus.is-error { color: var(--danger); }
      .apiTable { width: 100%; border-collapse: collapse; font-size: 12px; }
      .apiTable th, .apiTable td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; vertical-align: top; }

      @media (max-width: 1120px) {

    <script>
      const $ = id => document.getElementById(id);
      const paperDialog = window.PortalUI.createDialogController({
        modal: "paperModal",
        bodyClass: null,
        backdropClose: true,
        escapeClose: true,
      });
      const paperSelectionPopover = window.PortalOverlay.bindFloatingPopover({
        panel: "selectionMenu",
        placement: "top",
        align: "center",
        closeOnOutside: true,
        closeOnEscape: true,
        closeOnScroll: true,
      });
      const esc = value => window.MD?.esc ? window.MD.esc(value) : String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const paperStateHtml = (message, options = {}) => window.PortalUIPrimitives.asyncStateHtml({
        state: options.state || "empty",
        title: options.title || "",
        message,

        const direct = text.match(fencePattern);
        if (direct) return direct[1].trim();
        const frontmatter = text.match(/^(---\n[\s\S]*?\n---\n*)([\s\S]*)$/);
        if (frontmatter) {

          if (fencedBody) return `${frontmatter[1].trimEnd()}\n\n${fencedBody[1].trim()}`;

        return text;

        let hash = 0;
        for (let index = 0; index < text.length; index += 1) {

        return Math.abs(hash).toString(36);

        });
        const payload = {
          mode: state.mode === "today" ? "today" : "library",
          query: String(state.query || "").trim(),
          filters,
          semantic_search_id: state.activeSemanticSearchId || "",
          collector_job_id: state.activeCollectorJobId || "",
        };
        const label = semantic
          ? window.PortalI18n.text`Semantic search: ${semantic.query || state.query || window.PortalI18n.t("current search")}`
          : collection
            ? window.PortalI18n.text`Paper collection: ${collection.direction || window.PortalI18n.t("current collection")}`
            : state.mode === "today"
              ? "Today"
              : window.PortalI18n.t("Paper Library");
        const summaryText = String(
          semantic?.query_interpretation
          || semantic?.notes
          || collection?.summary
          || collection?.error
          || (state.mode === "today" ? window.PortalI18n.t("Papers registered today.") : window.PortalI18n.t("Current paper library view."))
        ).trim();
        return { payload, label, summaryText, key: `paper-collection:${payload.mode}:${hashString(JSON.stringify(payload))}` };
      }

      function collectionPaperIds() {
        if (isCcfCollectionMode()) {
          return ccfCollectionPapers()
            .map(paper => String(paper.registered_paper_id || "").trim())
            .filter(Boolean)
            .slice(0, 120);
        }
        return (state.library?.papers || []).map(paper => String(paper.id || "").trim()).filter(Boolean).slice(0, 120);
      }

      function collectionItems() {
        if (!isCcfCollectionMode()) return [];
        return ccfCollectionPapers().slice(0, 120).map(paper => ({
          title: String(paper.title || "").trim(),
          authors: ccfPaperAuthors(paper),
          venue: ccfVenueYearLabel(currentCcfVenue(), currentCcfEntry() || state.ccfSelectedYear),
          year: String(currentCcfEntry()?.year || paper.year || "").trim(),
          doi: String(paper.doi || "").trim(),
          url: String(paper.url || paper.ee || paper.dblp_url || "").trim(),
          dblp_key: String(paper.key || paper.dblp_key || "").trim(),
          registered_paper_id: String(paper.registered_paper_id || "").trim(),
        }));
      }

      function collectionVisibleCount() {
        if (isCcfCollectionMode()) return ccfCollectionPapers().length;
        return state.library?.summary?.visible_count ?? collectionPaperIds().length;
      }

      function activeChatPaperId() {
        return isCollectionMode() ? "" : String(state.selectedId || "");
      }

      function activeChatWorkspaceId() {
        if (state.requestedChatWorkspaceId) return state.requestedChatWorkspaceId;
        return isCollectionMode() ? collectionChatScope().key : chatSessionKey(state.selectedId || "");
      }

      function activeChatContext() {
        if (state.requestedChatWorkspaceId) {
          return {
            paper_id: "",
            collection_mode: "history",
            collection_label: "Saved collection chat",
            collection_summary: "Previously saved Paper collection conversation",
            collection_query: "",
            collection_filters: {},
            semantic_search_id: "",
            collector_job_id: "",
            paper_ids: [],
            collection_items: [],
          };
        }
        if (!isCollectionMode()) return { paper_id: activeChatPaperId() };
        const scope = collectionChatScope();
        return {
          paper_id: "",
          collection_mode: scope.payload.mode,
          collection_label: scope.label,
          collection_summary: scope.summaryText,
          collection_query: scope.payload.query,
          collection_filters: scope.payload.filters,
          semantic_search_id: scope.payload.semantic_search_id,
          collector_job_id: scope.payload.collector_job_id,
          paper_ids: collectionPaperIds(),
          collection_items: collectionItems(),
        };
      }

      function chatSessionKey(paperId = state.selectedId) {
        const itemId = String(paperId || "").trim();
        return itemId ? `paper:${itemId}` : "library";
      }

      async function loadChatHistory({ paperId = activeChatPaperId(), workspaceId = activeChatWorkspaceId(), render = true } = {}) {
        const key = workspaceId || chatSessionKey(paperId);
        state.chatHistoryLoading = true;
        try {
          return await paperChatPanel?.openSurface?.({
            surface: "paper",
            workspace_key: key,
            paper_id: String(paperId || ""),
          }, { force: true, render });
        } finally {
          if (key === activeChatWorkspaceId()) state.chatHistoryLoading = false;
        }
      }

      async function loadLibrary({ keepDetail = true, hydrateDetail = true } = {}) {
        const requestSeq = ++state.libraryRequestSeq;
        const favoriteRevision = state.favoriteRevision;
        state.libraryLoading = true;
        let firstPayload;
        try {
          firstPayload = await paperApi.request(libraryQuery());
        } catch (error) {
          if (requestSeq === state.libraryRequestSeq) {
            state.libraryLoading = false;
            renderWorkspace();
          }
          throw error;
        }
        if (requestSeq !== state.libraryRequestSeq) return null;
        state.library = firstPayload;
        state.libraryRenderLimit = 100;
        state.paperTreeRenderLimit = 240;
        state.libraryPageLoading = false;
        if (normalizePaperFiltersForLibrary()) {
          writeUiState();
          let normalizedPayload;
          try {
            normalizedPayload = await paperApi.request(libraryQuery());
          } catch (error) {
            if (requestSeq === state.libraryRequestSeq) {
              state.libraryLoading = false;
              renderWorkspace();
            }
            throw error;
          }
          if (requestSeq !== state.libraryRequestSeq) return null;
          state.library = normalizedPayload;
        }
        if (favoriteRevision === state.favoriteRevision && !state.favoritePending.size) {
          state.favoriteIds = new Set(state.library.favorite_ids || []);
        }
        renderFilters();
        renderTree();
        if (!isCollectionMode()) {
          if (!keepDetail || !state.selectedId) {
            const first = state.library.papers?.[0];
            if (first) state.selectedId = first.id;
          }
          if (state.selectedId) {
            const exists = (state.library.papers || []).some(p => p.id === state.selectedId);
            if (!exists && !keepDetail) state.selectedId = state.library.papers?.[0]?.id || "";
          }
          if (hydrateDetail && state.selectedId && !state.detail) {
            try {
              await loadDetail(state.selectedId, { render: false });
            } catch {
              state.selectedId = "";
              state.detail = null;
              writeUiState();
            }
          }
        }
        if (requestSeq !== state.libraryRequestSeq) return null;
        state.libraryLoading = false;
        renderWorkspace();
        renderAssistantContext();
        await paperIdentityReady;
        if (requestSeq !== state.libraryRequestSeq) return null;
        renderChat();
        updateChatComposerState();
        if (isCollectionMode()) {
          loadChatHistory({ paperId: activeChatPaperId(), workspaceId: activeChatWorkspaceId(), render: true }).catch(alertError);
        }
        return state.library;
      }

      async function loadMoreLibrary() {
        if (state.libraryPageLoading || !state.library?.papers) return;
        const offset = state.libraryRenderLimit;
        const expected = state.library.papers.slice(offset, offset + 100);
        if (!expected.length) return;
        const requestSeq = state.libraryRequestSeq;
        const params = new URLSearchParams(libraryQuery().split("?")[1] || "");
        params.delete("preview_limit");
        params.set("rows_only", "1");
        params.set("offset", String(offset));
        params.set("limit", String(expected.length));
        state.libraryPageLoading = true;
        const button = $("loadMoreLibraryBtn");
        if (button) button.disabled = true;
        try {
          const payload = await paperApi.request(`/paper/api/library?${params}`);
          if (requestSeq !== state.libraryRequestSeq) return;
          const rows = payload.papers || [];
          if (rows.length !== expected.length || rows.some((row, index) => row.id !== expected[index].id)) {
            await loadLibrary({ keepDetail: true, hydrateDetail: false });
            return;
          }
          state.library.papers.splice(offset, rows.length, ...rows);
          state.libraryRenderLimit = offset + rows.length;
          renderWorkspace();
        } finally {
          state.libraryPageLoading = false;
          const currentButton = $("loadMoreLibraryBtn");
          if (currentButton) currentButton.disabled = false;
        }
      }

      const DETAIL_SECTIONS_BY_MODE = {
        reader: ["analysis", "summary"],
        review: ["reviews"],
        exp: ["exp"],
        figures: ["figures"],
        notes: ["notes"],
        refs: ["refs"],
      };

      function mergeDetailPayload(payload, { replace = false } = {}) {
        if (!payload?.paper) return state.detail;
        const previousId = String(state.detail?.paper?.id || "");
        const nextId = String(payload.paper.id || "");
        state.detail = replace || previousId !== nextId ? payload : { ...state.detail, ...payload, paper: payload.paper };
        if (replace || previousId !== nextId) {
          state.detailSections = new Set();
          state.detailSectionPromises = {};
        }
        (payload.loaded_sections || []).forEach(section => state.detailSections.add(String(section)));
        return state.detail;
      }

      function detailSectionsLoaded(sections) {
        return (sections || []).every(section => state.detailSections.has(section));
      }

      async function loadDetailSections(id, sections, { render = true, force = false } = {}) {
        const paperId = String(id || "").trim();
        const requested = [...new Set((sections || []).map(String).filter(Boolean))];
        const missing = force ? requested : requested.filter(section => !state.detailSections.has(section));
        if (!paperId || !missing.length) return state.detail;
        const key = `${paperId}:${missing.slice().sort().join(",")}`;
        if (state.detailSectionPromises[key]) return state.detailSectionPromises[key];
        const promise = paperApi.request(`/paper/api/papers/detail?id=${encodeURIComponent(paperId)}&sections=${encodeURIComponent(missing.join(","))}`)
          .then(payload => {
            if (String(state.selectedId || "") !== paperId) return null;
            mergeDetailPayload(payload);
            if (render) renderWorkspace();
            return state.detail;
          })
          .finally(() => { delete state.detailSectionPromises[key]; });
        state.detailSectionPromises[key] = promise;
        return promise;
      }

      async function ensureDetailForMode(mode = state.mode) {
        const sections = DETAIL_SECTIONS_BY_MODE[mode] || [];
        const detail = await loadDetailSections(state.selectedId, sections, { render: true });
        if (["reader", "review", "exp", "figures", "notes"].includes(mode)) {
          window.MD.ensureKatex().then(() => {
            if (state.mode === mode) renderWorkspace();
          }).catch(alertError);
        }
        return detail;
      }

      async function loadDetail(id, { render = true } = {}) {
        state.requestedChatWorkspaceId = "";
        const requestSeq = ++state.detailRequestSeq;
        const previousSelectedId = String(state.selectedId || "");
        if (previousSelectedId !== String(id || "")) state.selectedFigureId = "";
        state.selectedId = id;
        if (previousSelectedId !== String(id || "")) {
          clearTimeout(state.reviewPollTimer);
          state.reviewPollTimer = 0;
          state.reviewJob = null;
          state.reviewInFlight = false;
          state.reviewPollError = "";
        }
        const payload = await paperApi.request(`/paper/api/papers/detail?id=${encodeURIComponent(id)}&sections=base`);
        if (requestSeq !== state.detailRequestSeq) return null;
        mergeDetailPayload(payload, { replace: true });
        state.selectedId = state.detail?.paper?.id || id;
        writeUiState();
        syncPaperLocation(state.selectedId);
        syncSelectedPaperInTree(previousSelectedId, state.selectedId);
        renderAssistantContext();
        if (render) renderWorkspace();
        const initialSections = ["analysis", "summary", ...(DETAIL_SECTIONS_BY_MODE[state.mode] || [])];
        Promise.allSettled([
          loadDetailSections(state.selectedId, initialSections, { render: true }),
          loadDeepReadStatus(state.selectedId, { render: false }),
          loadExpStatus(state.selectedId, { render: false }),
          loadReviewStatus(state.selectedId),
          isCollectionMode()
            ? Promise.resolve(null)
            : loadChatHistory({ paperId: state.selectedId, render: true }),
        ]).then(() => {
          if (requestSeq !== state.detailRequestSeq) return;
          updateDeepReadControls();
          if (state.mode === "exp") renderWorkspace();
        });
        return state.detail;
      }

      function currentAssetsJob() {
        return state.detail?.assets_job && typeof state.detail.assets_job === "object" ? state.detail.assets_job : {};
      }

      function assetsJobRunning(job = currentAssetsJob()) {
        return ["queued", "running"].includes(String(job?.status || ""));
      }

      function assetsJobStatusText(job = currentAssetsJob()) {
        const status = String(job?.status || "");
        if (status === "queued") return window.PortalI18n.t("Automatic refs and figures extraction is queued.");
        if (status === "running") return window.PortalI18n.t("Automatic refs and figures extraction is running.");
        if (status === "done") {
          const refs = Number(job.refs ?? 0);
          const figures = Number(job.figures ?? 0);
          return window.PortalI18n.text`Automatic extraction finished: ${refs} refs, ${figures} figures.`;
        }
        if (status === "skipped") return window.PortalI18n.text`Automatic extraction skipped: ${job.reason || window.PortalI18n.t("local PDF unavailable")}.`;
        if (status === "error") return window.PortalI18n.text`Automatic extraction failed: ${job.error || (job.errors || []).join("; ") || window.PortalI18n.t("unknown error")}.`;
        return "";
      }

      async function refreshAssetsProjection(paperId) {
        const id = String(paperId || "").trim();
        if (!id || String(state.selectedId || "") !== id) return;
        const detail = await paperApi.request(`/paper/api/papers/detail?id=${encodeURIComponent(id)}&sections=base`);
        if (String(state.selectedId || "") !== id) return;
        mergeDetailPayload(detail);
        renderAssistantContext();
        const shouldRenderWorkspace = state.mode === "refs" || state.mode === "figures";
        if (shouldRenderWorkspace) renderWorkspace();
        return detail;
      }

      function renderFilters() {
        $("favoriteFilter").checked = state.filters.favorite === "1";
        $("searchInput").value = state.query;
        const filters = state.library?.filters || {};
        fillSelect("yearFilter", "All years", filters.years || [], state.filters.year);
        fillSelect("venueFilter", "All venues", filters.venues || [], state.filters.venue);
        fillSelect("tagFilter", "All tags", [...(filters.tags || []), ...(filters.workload || []), ...(filters.platform || []), ...(filters.architecture || []), ...(filters.optimization || [])], state.filters.tag);
        fillSelect("projectFilter", "All projects", filters.projects || [], state.filters.project);
      }

      function normalizePaperFiltersForLibrary() {
        const filters = state.library?.filters || {};
        const allowed = {
          year: new Set((filters.years || []).map(String)),
          venue: new Set((filters.venues || []).map(String)),
          tag: new Set([...(filters.tags || []), ...(filters.workload || []), ...(filters.platform || []), ...(filters.architecture || []), ...(filters.optimization || [])].map(String)),
          project: new Set((filters.projects || []).map(String)),
        };
        let changed = false;
        for (const key of ["year", "venue", "tag", "project"]) {
          const value = String(state.filters?.[key] || "").trim();
          if (value && !allowed[key].has(value)) {
            state.filters[key] = "";
            changed = true;
          }
        }
        return changed;
      }

      function initSemanticSearch() {
        if (state.semanticSearch) return state.semanticSearch;
        const client = {
          get: path => paperApi.request(path, { cache: "no-store" }),
          post: (path, body) => paperApi.request(path, {
            method: "POST",
            body: JSON.stringify(body || {}),
          }),
        };
        state.semanticSearch = window.PortalSemanticSearch.create({
          input: "searchInput",
          button: "semanticSearchBtn",
          panel: "semanticSearchList",
          client,
          initialActiveId: state.activeSemanticSearchId,
          projectionScope: "paper",
          startPayload: () => ({ project: String(state.filters.project || "") }),
          urls: {
            list: "/paper/api/semantic-searches",
            start: "/paper/api/semantic-search/start",
            refresh: "/paper/api/semantic-search/refresh",
            delete: "/paper/api/semantic-search/delete",
          },
          labels: { idle: "Semantic", starting: "Starting", results: "results", searching: "searching", error: "error" },
          isDisabled: () => state.leftFace === "ccf",
          confirmRemove: () => window.PortalUI.confirmAction("delete", "这个语义搜索条目"),
          onStart: () => {
            clearTimeout(state.searchTimer);
            state.searchTimer = null;
            state.query = "";
            state.activeSemanticSearchId = "";
            state.activeCollectorJobId = "";
            $("searchInput").value = "";
            writeUiState();
            renderCollectorJobs();
            if (semanticSearchReady) loadLibrary({ keepDetail: false }).catch(alertError);
          },
          onActiveChange: searchId => {
            state.activeSemanticSearchId = String(searchId || "");
            if (state.activeSemanticSearchId) state.activeCollectorJobId = "";
            writeUiState();
            renderCollectorJobs();
            if (semanticSearchReady) loadLibrary({ keepDetail: false }).catch(alertError);
          },
          onError: alertError,
        });
        return state.semanticSearch;
      }

      function currentLibraryMarkdown() {
        return (state.library?.papers || [])
          .map(paper => `- ${String(paper.title || "").trim()}`)
          .filter(line => line !== "-")
          .join("\n");
      }

      async function exportLibraryMarkdown() {
        const text = currentLibraryMarkdown();
        if (!text) return;
        await window.PortalUI.copyText(text, "Paper list");
        const btn = $("exportLibraryMarkdownBtn");
        if (btn) {
          const oldText = btn.textContent;
          btn.textContent = "Copied";
          setTimeout(() => {
            if ($("exportLibraryMarkdownBtn") === btn) btn.textContent = oldText;
          }, 1400);
        }
      }

      function collectorHasPending(jobs = state.collectorJobs) {
        return (jobs || []).some(job => ["queued", "running"].includes(String(job.status || "")));
      }

      function collectorStatusText(job) {
        const status = String(job.status || "queued");
        if (status === "done") return `${job.result_count ?? job.registered_count ?? 0} found · ${job.registered_count || 0} added`;
        if (status === "error") return "error";
        return status;
      }

      function renderCollectorJobs() {
        const box = $("collectorJobList");
        if (!box) return;
        const expandedFailures = new Set(Array.from(box.querySelectorAll("[data-collector-error][open]"), item => item.dataset.collectorError));
        const jobs = (state.collectorJobs || []).slice(0, 3);
        box.innerHTML = jobs.map(job => {
          const status = String(job.status || "queued");
          const detail = job.summary || job.error || job.step || "";
          const jobId = String(job.job_id || "");
          const selectable = Number(job.result_count || job.registered_count || 0) > 0;
          const disabled = selectable ? "" : " disabled";
          const active = jobId && jobId === state.activeCollectorJobId ? " active" : "";
          return window.PortalI18n.html`
            <div class="collectorJobItem${active}">
              <button class="collectorJobMain" type="button" data-collector-select="${esc(jobId)}"${disabled}>
                <span class="collectorJobTop">
                  <span class="collectorJobDirection">${esc(job.direction || "")}</span>
                  <span class="collectorJobStatus ${esc(status)}">${esc(collectorStatusText(job))}</span>
                </span>
                ${detail ? window.PortalI18n.html`<span class="collectorJobMeta">${esc(detail)}</span>` : ""}
              </button>
              <span class="collectorJobActions">
                <button class="collectorJobAction" type="button" data-collector-delete="${esc(jobId)}" title="删除收集任务" aria-label="删除收集任务" data-portal-icon="close"></button>
              </span>
              ${status === "error" ? window.PortalI18n.html`<details class="collectorJobFailure" data-collector-error="${esc(jobId)}"${expandedFailures.has(jobId) ? " open" : ""}>
                <summary>失败详情</summary>
                <div class="collectorJobFailureBody">${esc(job.error || window.PortalI18n.t("收集任务未完成"))}</div>
                <div>Job: <code>${esc(jobId)}</code></div>
                ${job.invocation?.resident_id ? window.PortalI18n.html`<div>Resident: <code>${esc(job.invocation.resident_id)}</code></div>` : ""}
                ${job.invocation?.input_message_id ? window.PortalI18n.html`<div>Input: <code>${esc(job.invocation.input_message_id)}</code></div>` : ""}
              </details>` : ""}
            </div>
          `;
        }).join("");
        const btn = $("collectorBtn");
        if (btn) {
          btn.disabled = !!state.collectorStarting;
          btn.textContent = state.collectorStarting ? "Starting" : "Collect";
        }
      }

      async function selectCollectorJob(jobId) {
        const job = (state.collectorJobs || []).find(item => item.job_id === jobId);
        if (!job || Number(job.result_count || job.registered_count || 0) <= 0) return;
        state.activeCollectorJobId = state.activeCollectorJobId === job.job_id ? "" : job.job_id;
        if (state.activeCollectorJobId) {
          state.activeSemanticSearchId = "";
          state.semanticSearch?.clearActive?.({ notify: false });
        }
        state.mode = "library";
        writeUiState();
        renderCollectorJobs();
        await loadLibrary({ keepDetail: false });
      }

      async function loadCollectorJobs({ render = true } = {}) {
        const hadPending = collectorHasPending();
        const hadActiveResults = activeCollectorJobHasResults();
        const payload = await paperApi.request("/paper/api/collector/jobs");
        state.collectorJobs = Array.isArray(payload.jobs) ? payload.jobs : [];
        if (state.activeCollectorJobId) {
          const active = state.collectorJobs.find(job => job.job_id === state.activeCollectorJobId);
          if (!active || Number(active.result_count || active.registered_count || 0) <= 0) {
            state.activeCollectorJobId = "";
            writeUiState();
          }
        }
        if (render) renderCollectorJobs();
        const hasPending = collectorHasPending();
        if (hadPending && !hasPending) loadLibrary({ keepDetail: true }).catch(alertError);
        else if (!hadActiveResults && activeCollectorJobHasResults()) {
          loadLibrary({ keepDetail: true }).catch(alertError);
        }
        return payload;
      }

      async function submitCollector(event) {
        event?.preventDefault?.();
        if (state.collectorStarting) return;
        const input = $("collectorInput");
        const limit = $("collectorMaxPapers");
        if (!limit.reportValidity()) return;
        const maxPapers = Number(limit.value);
        const direction = String(input?.value || "").trim();
        if (!direction) {
          window.PortalUI.toast(window.PortalI18n.t("请输入论文收集需求。"), "warning");
          return;
        }
        state.collectorStarting = true;
        renderCollectorJobs();
        try {
          const job = await paperApi.request("/paper/api/collector/start", {
            method: "POST",
            body: JSON.stringify({ direction, max_papers: maxPapers }),
          });
          if (input) input.value = "";
          state.collectorJobs = [job, ...(state.collectorJobs || []).filter(item => item.job_id !== job.job_id)];
          renderCollectorJobs();
        } finally {
          state.collectorStarting = false;
          renderCollectorJobs();
        }
      }

      async function deleteCollectorJob(jobId) {
        if (!jobId) return;
        await paperApi.request("/paper/api/collector/delete", {
          method: "POST",
          body: JSON.stringify({ job_id: jobId }),
        });
        state.collectorJobs = (state.collectorJobs || []).filter(item => item.job_id !== jobId);
        if (state.expandedCollectorJobId === jobId) state.expandedCollectorJobId = "";
        if (state.activeCollectorJobId === jobId) {
          state.activeCollectorJobId = "";
          writeUiState();
          await loadLibrary({ keepDetail: false });
        }
        renderCollectorJobs();
      }

      function ccfYearKey(venue, year) {
        return `${String(venue || "")}:${String(year || "")}`;
      }

      function currentCcfPayload() {
        return state.ccfPapersByYear[ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear)] || null;
      }

      function currentCcfVenue() {
        const venues = state.ccfVenues || [];
        return venues.find(venue => String(venue.dblp_conf_key || "") === String(state.ccfSelectedVenue || ""))
          || currentCcfPayload()?.venue
          || null;
      }

      function currentCcfEntry() {
        const entries = state.ccfYearsByVenue[state.ccfSelectedVenue] || [];
        return entries.find(entry => ccfVenueEntryId(entry) === String(state.ccfSelectedYear || ""))
          || currentCcfPayload()
          || null;
      }

      function orderCcfPapers(papers) {
        if (!Array.isArray(papers)) return [];
        return papers
          .map((paper, index) => ({ paper, index }))
          .sort((a, b) => {
            const aRegistered = !!(a.paper?.registered_paper_id || a.paper?.registered);
            const bRegistered = !!(b.paper?.registered_paper_id || b.paper?.registered);
            if (aRegistered !== bRegistered) return aRegistered ? -1 : 1;
            return a.index - b.index;
          })
          .map(item => item.paper);
      }

      function ccfCollectionPapers() {
        const payload = currentCcfPayload();
        return orderCcfPapers(payload?.papers);
      }

      function ccfVenueShortName(venue) {
        return String(venue?.short_name || venue?.abbr || venue?.dblp_conf_key || "").trim();
      }

      function ccfVenueFullName(venue) {
        return String(venue?.name || "").trim();
      }

      function ccfVenueLabel(venue) {
        const shortName = ccfVenueShortName(venue);
        const fullName = ccfVenueFullName(venue);
        if (shortName && fullName && shortName !== fullName) return `${shortName} (${fullName})`;
        return shortName || fullName || String(venue?.dblp_conf_key || "Venue");
      }

      function ccfRankLabel(venueOrRank) {
        const rank = typeof venueOrRank === "string"
          ? venueOrRank
          : String(venueOrRank?.rank || "");
        return rank === "Curated" ? "Curated" : window.PortalI18n.text`CCF-${rank || ""}`;
      }

      function ccfVenueYearLabel(venue, year) {
        const shortName = ccfVenueShortName(venue);
        const fullName = ccfVenueFullName(venue);
        if (year && typeof year === "object") {
          const issue = String(year.issue || "").trim();
          const yearText = String(year.year || "").trim();
          const value = venue?.type === "期刊" && issue
            ? [yearText, issue].filter(Boolean).join("/")
            : yearText || String(year.label || year.entry_id || "").trim();
          const prefix = [shortName, value].filter(Boolean).join(" ");
          if (prefix && fullName) return `${prefix} (${fullName})`;
          return prefix || fullName || String(year.label || year.entry_id || "");
        }
        const prefix = [shortName, year].filter(Boolean).join(" ");
        if (prefix && fullName) return `${prefix} (${fullName})`;
        return prefix || fullName || String(year || "");
      }

      function ccfVenueEntryId(entry) {
        return String(entry?.entry_id || entry?.year || entry?.issue || "").trim();
      }

      function ccfCollectionChatScope() {
        const venue = currentCcfVenue();
        const entry = currentCcfEntry();
        const papers = ccfCollectionPapers();
        const label = venue
          ? `${ccfRankLabel(venue)}: ${ccfVenueYearLabel(venue, entry || state.ccfSelectedYear)}`
          : window.PortalI18n.t("CCF A/B Proceedings");
        const summaryParts = [];
        if (venue?.category) summaryParts.push(String(venue.category));
        if (venue?.type) summaryParts.push(String(venue.type));
        if (papers.length) summaryParts.push(`${papers.length} DBLP papers in this local CCF collection`);
        const payload = {
          mode: "ccf",
          ccf_venue: String(state.ccfSelectedVenue || ""),
          ccf_year: String(state.ccfSelectedYear || ""),
          ccf_rank: String(venue?.rank || ""),
          ccf_category: String(venue?.category || ""),
          ccf_label: label,
          paper_count: papers.length,
        };
        return {
          payload,
          label,
          summaryText: summaryParts.join(" · ") || "Current CCF A/B proceedings collection.",
          key: `paper-collection:ccf:${hashString(JSON.stringify(payload))}`,
        };
      }

      function ccfCategoryKey(rank, category) {
        return `${String(rank || "").trim()}::${String(category || "Other").trim() || "Other"}`;
      }

      function ccfEntryMatchesYearFilter(entry, filterText = state.ccfYearFilter) {
        const filter = String(filterText || "").trim().toLowerCase();
        if (!filter) return true;
        const haystack = [
          entry?.year,
          entry?.issue,
          entry?.entry_id,
          entry?.label,
          entry?.file,
        ].map(value => String(value || "").toLowerCase()).join(" ");
        return haystack.includes(filter);
      }

      function ccfVenueMatchesFilter(venue, filterText = state.ccfYearFilter) {
        const filter = String(filterText || "").trim().toLowerCase();
        if (!filter) return true;
        const haystack = [
          venue?.abbr,
          venue?.short_name,
          venue?.name,
          venue?.rank,
          venue?.type,
          venue?.category,
          venue?.dblp_conf_key,
          venue?.dblp_section,
          venue?.dblp_url,
          ccfVenueLabel(venue),
        ].map(value => String(value || "").toLowerCase()).join(" ");
        return haystack.includes(filter);
      }

      async function ensureCcfYearsForFilter() {
        const filter = String(state.ccfYearFilter || "").trim();
        const venues = state.ccfVenues || [];
        if (!filter || !venues.length) return;
        const venueMatches = venues.filter(venue => ccfVenueMatchesFilter(venue, filter));
        const shouldSearchYearEntries = /\d/.test(filter) || !venueMatches.length;
        const targets = shouldSearchYearEntries ? venues : venueMatches;
        await Promise.all(targets.map(venue => {
          const key = String(venue.dblp_conf_key || "");
          if (!key || Object.prototype.hasOwnProperty.call(state.ccfYearsByVenue, key)) return Promise.resolve();
          return loadCcfYears(key).catch(() => []);
        }));
      }

      function scheduleCcfYearFilterRender() {
        if (state.ccfFilterTimer) clearTimeout(state.ccfFilterTimer);
        state.ccfFilterTimer = setTimeout(() => {
          state.ccfFilterTimer = null;
          ensureCcfYearsForFilter().then(() => {
            if (state.leftFace === "ccf") renderTree();
          }).catch(alertError);
        }, 180);
      }

      function ccfPaperAuthors(paper) {
        const authors = paper?.authors || [];
        if (Array.isArray(authors)) return authors.map(author => String(author || "").trim()).filter(Boolean).slice(0, 8).join(", ");
        return String(authors || "").trim();
      }

      function ccfPaperMatchesQuery(paper, queryText = state.ccfPaperQuery) {
        const query = String(queryText || "").trim().toLowerCase();
        if (!query) return true;
        const haystack = [
          paper?.title,
          ccfPaperAuthors(paper),
          paper?.doi,
          paper?.dblp_key,
          paper?.dblp_url,
          paper?.ee,
          paper?.venue,
          paper?.booktitle,
          paper?.year,
          paper?.registered_paper_id,
        ].map(value => String(value || "").toLowerCase()).join(" ");
        return haystack.includes(query);
      }

      function applyCcfPaperListFilter() {
        const papers = ccfCollectionPapers();
        const query = String(state.ccfPaperQuery || "").trim();
        const key = ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear);
        const limit = Number(state.ccfRenderLimits[key] || 100);
        const matches = papers
          .map((paper, index) => ({ paper, index }))
          .filter(item => ccfPaperMatchesQuery(item.paper, query));
        const visible = matches.slice(0, limit);
        const results = $("ccfPaperListResults");
        if (results) {
          results.innerHTML = visible.length
            ? visible.map(item => renderCcfPaperRow(item.paper, item.index)).join("")
            : "";
        }
        const meta = $("ccfPaperSearchMeta");
        if (meta) meta.textContent = `${visible.length}/${matches.length} matches · ${papers.length} papers`;
        const empty = $("ccfPaperSearchEmpty");
        if (empty) empty.classList.toggle("hidden", !papers.length || visible.length > 0);
        const more = $("ccfPaperLoadMore");
        if (more) {
          more.classList.toggle("hidden", visible.length >= matches.length);
          more.textContent = window.PortalI18n.text`Show more · ${visible.length}/${matches.length}`;
        }
      }

      function ccfPaperEnrichmentKey(paper) {
        return String(paper?.dblp_key || paper?.doi || paper?.dblp_url || paper?.ee || paper?.title || "").trim();
      }

      function ccfPaperEnrichment(paper) {
        const key = ccfPaperEnrichmentKey(paper);
        return (key && state.ccfEnrichmentByKey[key]) || paper?.enrichment || {};
      }

      function storeCcfPaperEnrichment(paper, enrichment) {
        const key = ccfPaperEnrichmentKey(paper);
        if (!key || !enrichment) return;
        const previous = (state.ccfEnrichmentByKey || {})[key] || paper?.enrichment || {};
        const incoming = enrichment && typeof enrichment === "object" ? enrichment : {};
        const webStatus = String(incoming.web_status || "");
        const preserveRequestedWeb = previous?.requested_web && !["done", "error"].includes(webStatus);
        const next = preserveRequestedWeb
          ? { ...incoming, status: "web_pending", web_status: "pending", requested_web: true }
          : incoming;
        state.ccfEnrichmentByKey = { ...(state.ccfEnrichmentByKey || {}), [key]: next };
        if (paper) paper.enrichment = next;
      }

      async function ensureCcfPaperEnrichment(paper, { refresh = false, web = false } = {}) {
        if (!paper || paper.registered_paper_id) return;
        const key = ccfPaperEnrichmentKey(paper);
        if (!key) return;
        const flightKey = web ? `${key}::web` : key;
        if (state.ccfEnrichmentInFlight[flightKey]) return;
        if (!web && state.ccfEnrichmentInFlight[key]) return;
        const existing = ccfPaperEnrichment(paper);
        const existingStatus = String(existing?.status || "");
        if (!web && !refresh && ["pending", "running"].includes(existingStatus)) return;
        if (!web && !refresh && ["done", "error", "web_pending"].includes(existingStatus)) return;
        if (web && !refresh && String(existing?.web_status || "") === "done") return;
        if (web && !refresh) {
          storeCcfPaperEnrichment(paper, {
            ...(existing && typeof existing === "object" ? existing : {}),
            status: "web_pending",
            web_status: "pending",
            requested_web: true,
          });
          renderWorkspace();
        }
        state.ccfEnrichmentInFlight[flightKey] = true;
        try {
          const enrichment = await paperApi.request("/paper/api/ccf/enrich", {
            method: "POST",
            body: JSON.stringify({ paper, web }),
          });
          storeCcfPaperEnrichment(paper, enrichment);
          const status = String(enrichment?.status || "");
          const nextWebStatus = String(enrichment?.web_status || "");
          const shouldRender = !["pending", "running"].includes(status) && !(status === "web_pending" && nextWebStatus === "pending");
          if (shouldRender && state.ccfSelectedPaper && ccfPaperEnrichmentKey(state.ccfSelectedPaper) === key) renderWorkspace();
        } finally {
          delete state.ccfEnrichmentInFlight[flightKey];
        }
      }

      async function loadCcfVenues({ refresh = false } = {}) {
        if (state.ccfVenues && !refresh) return state.ccfVenues;
        const payload = await paperApi.request(`/paper/api/ccf/venues${refresh ? "?refresh=1" : ""}`);
        state.ccfVenues = Array.isArray(payload.venues) ? payload.venues : [];
        return state.ccfVenues;
      }

      async function loadCcfYears(venueKey, { refresh = false } = {}) {
        const key = String(venueKey || "").trim();
        if (!key) return [];
        if (state.ccfYearsByVenue[key] && !refresh) return state.ccfYearsByVenue[key];
        const suffix = refresh ? "&refresh=1" : "";
        const payload = await paperApi.request(`/paper/api/ccf/years?venue=${encodeURIComponent(key)}${suffix}`);
        state.ccfYearsByVenue[key] = Array.isArray(payload.years) ? payload.years : [];
        return state.ccfYearsByVenue[key];
      }

      async function fetchCcfYearsForVenue(venueKey) {
        const key = String(venueKey || "").trim();
        if (!key) return;
        state.ccfYearsFetchInFlight = key;
        delete state.ccfYearsErrors[key];
        renderTree();
        try {
          const years = await loadCcfYears(key, { refresh: true });
          if (!years.length) throw new Error("DBLP 未返回可识别的年份或期次目录，无法继续选择论文。请稍后重试。");
          renderTree();
        } catch (error) {
          state.ccfYearsErrors[key] = error.message || "目录获取失败，请稍后重试。";
          throw error;
        } finally {
          if (state.ccfYearsFetchInFlight === key) state.ccfYearsFetchInFlight = "";
          renderTree();
        }
      }

      async function loadCcfPapers(venueKey, year, { refresh = false } = {}) {
        const key = ccfYearKey(venueKey, year);
        if (state.ccfPapersByYear[key] && !refresh) return state.ccfPapersByYear[key];
        const suffix = refresh ? "&refresh=1" : "";
        const payload = await paperApi.request(`/paper/api/ccf/papers?venue=${encodeURIComponent(venueKey)}&year=${encodeURIComponent(year)}${suffix}`);
        state.ccfPapersByYear[key] = payload || {};
        if (Array.isArray(state.ccfPapersByYear[key].papers)) {
          state.ccfPapersByYear[key].papers = orderCcfPapers(state.ccfPapersByYear[key].papers);
        }
        (state.ccfPapersByYear[key].papers || []).forEach(paper => {
          if (paper?.enrichment?.status) storeCcfPaperEnrichment(paper, paper.enrichment);
        });
        return state.ccfPapersByYear[key];
      }

      async function fetchSelectedCcfPapers() {
        if (!state.ccfSelectedVenue || !state.ccfSelectedYear) return;
        const key = ccfYearKey(state.ccfSelectedVenue, state.ccfSelectedYear);
        state.ccfPaperFetchInFlight = key;
        renderWorkspace();
        try {
          await loadCcfPapers(state.ccfSelectedVenue, state.ccfSelectedYear, { refresh: true });
          renderWorkspace();
          await loadChatHistory({ paperId: activeChatPaperId(), workspaceId: activeChatWorkspaceId(), render: true });
        } finally {
          if (state.ccfPaperFetchInFlight === key) state.ccfPaperFetchInFlight = "";
          renderWorkspace();
        }
      }

      function updateLeftFaceTabs() {
        document.querySelectorAll("#leftFaceTabs button[data-left-face]").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.leftFace === state.leftFace);
        });
        const isCcf = state.leftFace === "ccf";
        const paneTitle = document.querySelector(".leftPane .paneTitle");
        if (paneTitle) paneTitle.textContent = isCcf ? window.PortalI18n.t("CCF A/B + Curated") : window.PortalI18n.t("Paper Library");
        const libraryMeta = $("libraryMeta");
        if (libraryMeta && isCcf) libraryMeta.textContent = window.PortalI18n.t("CCF v7 + curated venues from DBLP");
        $("ccfFilterBar")?.classList.toggle("hidden", !isCcf);
        const ccfYearInput = $("ccfYearFilterInput");
        if (ccfYearInput && ccfYearInput.value !== state.ccfYearFilter) ccfYearInput.value = state.ccfYearFilter;
        document.querySelector(".searchWrap")?.classList.toggle("hidden", isCcf);
        document.querySelector(".filterGrid")?.classList.toggle("hidden", isCcf);
        $("semanticSearchBtn")?.toggleAttribute("disabled", isCcf);
        $("collectorBtn")?.toggleAttribute("disabled", isCcf);
      }

      async function showCcfFace({ remember = true } = {}) {
        if (remember) rememberPreviousPaperWorkspace(currentPaperWorkspaceSnapshot({ leftFace: "ccf", mode: "library" }));
        state.leftFace = "ccf";
        state.mode = "library";
        state.activeSemanticSearchId = "";
        state.semanticSearch?.clearActive?.({ notify: false });
        state.activeCollectorJobId = "";
        writeUiState();
        updateLeftFaceTabs();
        renderTree();
        renderWorkspace();
        try {
          await loadCcfVenues();
          await ensureCcfYearsForFilter();
          renderTree();
          renderWorkspace();
        } catch (error) {
          alertError(error);
        }
      }

      function showLibraryFace({ remember = true } = {}) {
        if (remember) rememberPreviousPaperWorkspace(currentPaperWorkspaceSnapshot({ leftFace: "library" }));
        state.leftFace = "library";
        writeUiState();
        updateLeftFaceTabs();
        renderTree();
        renderWorkspace();
      }

      async function refreshCurrentLeftFace() {
        if (state.leftFace !== "ccf") {
          await loadLibrary({ keepDetail: true });
          return;
        }
        await loadCcfVenues({ refresh: true });
        if (state.ccfExpandedVenue) await loadCcfYears(state.ccfExpandedVenue, { refresh: true });
        if (state.ccfSelectedVenue && state.ccfSelectedYear) {
          await loadCcfPapers(state.ccfSelectedVenue, state.ccfSelectedYear, { refresh: true });
        }
        renderTree();
        renderWorkspace();
      }

      function renderCcfTree() {
        updateLeftFaceTabs();
        const venues = state.ccfVenues || [];
        if (!venues.length) {
          if (state.ccfVenues === null) {
            $("folderTree").innerHTML = paperStateHtml("Reading local CCF A/B venue catalog…", {
              state: "loading",
              density: "inline",
            });
            loadCcfVenues().then(() => renderTree()).catch(alertError);
          } else {
            $("folderTree").innerHTML = paperStateHtml(
              "No local CCF cache yet. Use refresh to build it.",
              { density: "inline" },
            );
          }
          return;
        }
        const yearFilter = String(state.ccfYearFilter || "").trim();
        const preferredRanks = ["A", "B", "Curated"];
        const seenRanks = new Set(venues.map(venue => String(venue.rank || "")).filter(Boolean));
        const ranks = [
          ...preferredRanks.filter(rank => seenRanks.has(rank)),
          ...Array.from(seenRanks).filter(rank => !preferredRanks.includes(rank)).sort(),
        ];
        const rankHtml = ranks.map(rank => {
          const rankVenues = venues.filter(venue => String(venue.rank || "") === rank);
          const categoryMap = new Map();
          rankVenues.forEach(venue => {
            const category = String(venue.category || "Other").trim() || "Other";
            if (!categoryMap.has(category)) categoryMap.set(category, []);
            categoryMap.get(category).push(venue);
          });
          const categories = Array.from(categoryMap.entries()).sort(([a], [b]) => a.localeCompare(b, "zh-Hans-CN"));
          let rankVisibleCount = 0;
          const categoryHtml = categories.map(([category, categoryVenues]) => {
            let categoryVisibleCount = 0;
            const venueHtml = categoryVenues.map(venue => {
              const key = String(venue.dblp_conf_key || "");
              const expanded = key && key === state.ccfExpandedVenue;
              const years = state.ccfYearsByVenue[key] || [];
              const venueMatches = yearFilter ? ccfVenueMatchesFilter(venue, yearFilter) : false;
              const displayYears = yearFilter
                ? (venueMatches ? years : years.filter(year => ccfEntryMatchesYearFilter(year, yearFilter)))
                : years;
              const yearsLoaded = Object.prototype.hasOwnProperty.call(state.ccfYearsByVenue, key);
              if (yearFilter && !venueMatches && yearsLoaded && !displayYears.length) return "";
              if (yearFilter && !venueMatches && !yearsLoaded) return "";
              const showYears = expanded || !!yearFilter;
              const fetchingYears = state.ccfYearsFetchInFlight === key;
              categoryVisibleCount += 1;
              rankVisibleCount += 1;
              return window.PortalI18n.html`
                <div class="folderNode">
                  <button class="folderLine ${expanded ? "selected" : ""}" type="button" data-ccf-venue="${esc(key)}">
                    ${disclosureIcon(showYears)}
                    <strong style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(ccfVenueLabel(venue))}</strong>
                    <span class="folderCount">${esc(venue.type || venue.rank || "")}</span>
                  </button>
                  ${showYears ? window.PortalI18n.html`
                    <div style="padding-left: 14px;">
                      ${displayYears.length ? displayYears.map(year => window.PortalI18n.html`
                        <button class="folderLine ${key === state.ccfSelectedVenue && ccfVenueEntryId(year) === String(state.ccfSelectedYear || "") ? "selected" : ""}" type="button" data-ccf-year="${esc(ccfVenueEntryId(year))}" data-ccf-year-venue="${esc(key)}">
                          <span>•</span>
                          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(ccfVenueYearLabel(venue, year))}</span>
                          <span class="folderCount">${esc(year.count || "")}</span>
                        </button>
                      `).join("") : paperStateHtml(
                        state.ccfYearsErrors[key] || (yearsLoaded ? window.PortalI18n.t("No local year or issue cache yet.") : window.PortalI18n.t("Reading local cache…")),
                        {
                          state: state.ccfYearsErrors[key] ? "error" : (yearsLoaded ? "empty" : "loading"),
                          density: "inline",
                          className: "ccfYearsState",
                          actionsHtml: yearsLoaded
                            ? window.PortalI18n.html`<button class="portalButton is-compact is-primary ccfFetchYearsButton" type="button" data-ccf-fetch-years="${esc(key)}" ${fetchingYears ? "disabled" : ""}>${fetchingYears ? "Fetching..." : window.PortalI18n.t("Fetch year / issue list")}</button>`
                            : "",
                        },
                      )}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("");
            if (!venueHtml.trim()) return "";
            const categoryKey = ccfCategoryKey(rank, category);
            const collapsed = !!state.ccfCollapsedCategories[categoryKey];
            return window.PortalI18n.html`
              <button class="ccfCategoryHeader" type="button" data-ccf-category="${esc(categoryKey)}" aria-expanded="${collapsed ? "false" : "true"}">
                ${disclosureIcon(!collapsed)}
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(category)}</span>
                <span class="folderCount">${categoryVisibleCount}</span>
              </button>
              ${collapsed ? "" : venueHtml}
            `;
          }).join("");
          if (!categoryHtml.trim() && yearFilter) return "";
          const rankCollapsed = !!state.ccfCollapsedRanks[rank];
          const rankCount = yearFilter ? rankVisibleCount : rankVenues.length;
          return window.PortalI18n.html`
            <button class="ccfRankHeader" type="button" data-ccf-rank="${esc(rank)}" aria-expanded="${rankCollapsed ? "false" : "true"}">
              ${disclosureIcon(!rankCollapsed)}
              <span>${esc(ccfRankLabel(rank))}</span>
              <span class="folderCount">${rankCount}</span>
            </button>
            ${rankCollapsed ? "" : categoryHtml}
          `;
        }).join("");
        $("folderTree").innerHTML = rankHtml.trim()
          ? rankHtml
          : paperStateHtml("No local CCF entries match this search.", { density: "inline" });
      }

      function fillSelect(id, label, values, selected) {
        const seen = new Set();
        const options = [window.PortalI18n.html`<option value="">${esc(label)}</option>`];
        values.forEach(value => {
          const text = String(value || "").trim();
          if (!text || seen.has(text)) return;
          seen.add(text);
          options.push(window.PortalI18n.html`<option value="${esc(text)}"${text === selected ? " selected" : ""}>${esc(text)}</option>`);
        });
        $(id).innerHTML = options.join("");
      }

      function paperTreeFolderKey(venue, year = "", session = "") {
        return JSON.stringify([String(venue || ""), String(year || ""), String(session || "")]);
      }

      function paperTreeNodeExpanded(key, defaultExpanded) {
        if (Object.prototype.hasOwnProperty.call(state.paperTreeExpansion || {}, key)) {
          return !!state.paperTreeExpansion[key];
        }
        return !!defaultExpanded;
      }

      function paperTreePapersByFolder() {
        const result = new Map();
        for (const paper of state.library?.papers || []) {
          const key = paperTreeFolderKey(
            paper.venue || "Unsorted",
            paper.year || "Unknown",
