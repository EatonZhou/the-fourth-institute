    <div class="portalDetailOverlay lineageDialogOverlay" data-portal-detail-overlay id="residentRegisterOverlay" aria-hidden="true" hidden>
      <div data-portal-detail-surface class="portalDetailSurface" role="dialog" aria-modal="true" aria-labelledby="residentRegisterTitle">
        <div class="portalDetailHeader" data-portal-detail-header>
          <div class="residentModalTitle" id="residentRegisterTitle"><!--portal-i18n:"注册 Resident"-->注册 Resident</div>
          <button class="portalDetailClose" data-portal-detail-close data-portal-icon="close" id="residentRegisterClose" type="button" aria-label="关闭注册窗口" title="关闭" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;关闭注册窗口&quot;, &quot;title&quot;: &quot;关闭&quot;}"></button>
        </div>
        <form class="portalDetailForm residentForm" id="residentRegisterForm">
          <div class="residentFormGrid">
            <div class="residentFormRow">
              <label class="residentLabel" for="residentTitleInput"><!--portal-i18n:"标题 *"-->标题 *</label>
              <input class="residentInput" id="residentTitleInput" required autocomplete="off" />
            </div>
            <div class="residentFormRow">
              <label class="residentLabel" for="residentBackendSelect"><!--portal-i18n:"后端"-->后端</label>
              <select class="residentSelect" id="residentBackendSelect"></select>
            </div>
          </div>
          <div class="residentRuntimeGrid" id="residentRuntimeSettingsRow">
            <div class="residentFormRow" id="residentRouteField" hidden>
              <label class="residentLabel" for="residentRouteSelect"><!--portal-i18n:"Backend Account / Route"-->Backend Account / Route</label>
              <select class="residentSelect" id="residentRouteSelect" disabled></select>
              <div class="residentHint"><!--portal-i18n:"原生订阅账号与 DeepSeek 路线分开选择；配置来源为共享 Provider 目录。"-->原生订阅账号与 DeepSeek 路线分开选择；配置来源为共享 Provider 目录。</div>
            </div>
            <div class="residentFormRow">
              <label class="residentLabel" for="residentRuntimeModelSelect"><!--portal-i18n:"Model"-->Model</label>
              <select class="residentSelect" id="residentRuntimeModelSelect">
                <option value=""><!--portal-i18n:"Portal 默认模型 (default)"-->Portal 默认模型 (default)</option>
              </select>
            </div>
            <div class="residentFormRow">
              <label class="residentLabel" for="residentRuntimeEffortSelect"><!--portal-i18n:"Effort"-->Effort</label>
              <select class="residentSelect" id="residentRuntimeEffortSelect">
                <option value=""><!--portal-i18n:"xhigh (default)"-->xhigh (default)</option>
                <option value="minimal"><!--portal-i18n:"minimal"-->minimal</option>
                <option value="low"><!--portal-i18n:"low"-->low</option>
                <option value="medium"><!--portal-i18n:"medium"-->medium</option>
                <option value="high"><!--portal-i18n:"high"-->high</option>
                <option value="xhigh"><!--portal-i18n:"xhigh"-->xhigh</option>
                <option value="max"><!--portal-i18n:"max"-->max</option>
                <option value="ultra"><!--portal-i18n:"ultra"-->ultra</option>
              </select>
            </div>
            <div class="residentFormRow">
              <label class="residentLabel" for="residentRuntimeTierSelect"><!--portal-i18n:"Speed"-->Speed</label>
              <select class="residentSelect" id="residentRuntimeTierSelect">
                <option value=""><!--portal-i18n:"Standard (default)"-->Standard (default)</option>
                <option value="priority"><!--portal-i18n:"Fast"-->Fast</option>
              </select>
            </div>
            <div class="residentFormRow">
              <label class="residentLabel" for="residentRuntimePermissionSelect"><!--portal-i18n:"Permissions"-->Permissions</label>
              <select class="residentSelect" id="residentRuntimePermissionSelect">
                <option value=""><!--portal-i18n:"Full Access (default)"-->Full Access (default)</option>
                <option value="default"><!--portal-i18n:"Ask"-->Ask</option>
                <option value="auto-review"><!--portal-i18n:"Auto-review"-->Auto-review</option>
                <option value="full-access"><!--portal-i18n:"Full Access"-->Full Access</option>
              </select>
            </div>
          </div>
          <details class="residentAdvancedDetails" id="residentWorkspaceAdvancedDetails">
            <summary class="residentAdvancedSummary"><span data-portal-icon="chevron-down" data-portal-icon-class="residentDisclosureIcon" class="residentDisclosureIcon" aria-hidden="true"></span><span><!--portal-i18n:"高级工作路径"-->高级工作路径</span></summary>
            <div class="residentAdvancedBody">
              <div class="residentFormRow">
                <label class="residentLabel" for="residentAdditionalWorkspacesInput"><!--portal-i18n:"其他工作区"-->其他工作区</label>
                <textarea class="residentTextarea" id="residentAdditionalWorkspacesInput" placeholder="每行一个绝对路径"></textarea>
                <div class="residentHint"><!--portal-i18n:"每个目录登记为一个 Workspace，可由多个 Resident 使用。"-->每个目录登记为一个 Workspace，可由多个 Resident 使用。</div>
              </div>
            </div>
          </details>
          <div class="portalDetailFooter" data-portal-detail-footer>
            <button class="portalButton" type="button" id="residentRegisterCancel"><!--portal-i18n:"取消"-->取消</button>
            <button class="portalButton is-primary" type="submit" id="residentRegisterSubmit"><!--portal-i18n:"注册"-->注册</button>
          </div>
        </form>
      </div>

              <div class="residentAttachInlinePanel" id="residentAttachForkPanel"></div>
            </div>
          </details>
        </div>
