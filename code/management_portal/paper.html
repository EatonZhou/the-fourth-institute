<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-portal-site-title="[&quot;Paper&quot;]" data-portal-site-separator=" - ">Paper</title>
    <link rel="stylesheet" href="/static/portal_components.css" />
    <link rel="stylesheet" href="/static/portal_image_editor.css" />
    <link rel="stylesheet" href="/static/portal_collection_board.css" />
    <link rel="stylesheet" href="/static/portal_workbench.css" />
    <link rel="stylesheet" href="/static/portal_design_system.css" data-portal-skin="default" />
    <link rel="stylesheet" href="/static/portal_themes.css" data-portal-skin-provider="themes" />
    <link rel="stylesheet" href="/static/portal_board_toolbar.css" />
    <script data-portal-script-group="portal-foundation"></script>
    <script src="/static/portal_page_state.js"></script>
    <script src="/static/portal_api.js"></script>
    <script src="/static/portal_instruction_client.js"></script>
    <script src="/static/portal_society_service.js"></script>
    <script src="/static/portal_resident_service.js"></script>
    <script src="/static/portal_passkeys.js"></script>
    <script src="/static/portal_identity.js"></script>
    <script data-portal-script-group="portal-shell"></script>
    <script src="/static/portal_form_controls.js"></script>
    <script src="/static/portal_button_tooltips.js"></script>
    <script src="/static/portal_editor_open_service.js"></script>
    <script src="/static/portal_command_registry.js"></script>
    <script src="/static/portal_workbench_context.js"></script>
    <script src="/static/portal_workbench.js"></script>
    <script src="/static/portal_document_statistics.js"></script>
    <script src="/static/portal_workspace_surface.js"></script>
    <script src="/static/portal_toolbar.js"></script>
    <script src="/static/portal_board_toolbar.js"></script>
    <script src="/static/portal_detail_surface.js"></script>
    <script src="/static/portal_resource_header.js"></script>
    <script src="/static/portal_semantic_search.js"></script>
    <script src="/static/portal_resource_routes.js"></script>
    <script src="/static/portal_preview_contract.js"></script>
    <script src="/static/portal_resource_chips.js"></script>
    <script src="/static/portal_file_links.js"></script>
    <script src="/static/resident_projection.js"></script>
    <script src="/static/portal_image_editor.js"></script>
    <script src="/static/portal_model_api_settings.js"></script>
    <script src="/static/portal_resident_runtime_controller.js"></script>
    <script data-portal-script-group="chat-workspace"></script>
    <script src="/static/portal_preview_runtime.js"></script>
    <script src="/static/portal_pdf_preview.js"></script>
    <script src="/static/portal_preview_renderers.js"></script>
    <script src="/static/portal_command_palette.js"></script>
    <script src="/static/markdown.js"></script>
    <link rel="stylesheet" href="/static/paper.css" />
  </head>
  <body class="portalBoardShell">
    <header class="portalSiteHeader" data-portal-site-header data-portal-nav-active="paper"></header>

    <main class="portalPageFrame portalWorkbenchViewportShell" id="paperPageFrame">
    <div class="shell portalWorkbenchViewportRoot" id="paperWorkbench" data-portal-boot-required="Paper 工作台初始化">
      <section class="pane leftPane" id="paperLibraryPane" aria-label="Paper Library" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Paper Library&quot;}">
        <div class="paneHead">
          <div class="paneHeadText">
            <div class="paneTitle"><!--portal-i18n:"Paper Library"-->Paper Library</div>
            <div class="paneNote" id="libraryMeta"><!--portal-i18n:"Loading..."-->Loading...</div>
          </div>
          <div class="paneHeadActions portalToolbar paperToolbar">
            <button class="portalButton is-icon is-quiet iconBtn paneToggle" data-portal-icon="chevron-left" id="toggleLibraryPaneBtn" type="button" title="Collapse Paper Library" aria-label="Collapse Paper Library" data-portal-i18n-attrs="{&quot;title&quot;: &quot;Collapse Paper Library&quot;, &quot;aria-label&quot;: &quot;Collapse Paper Library&quot;}"></button>
            <button class="portalButton is-icon is-quiet iconBtn" data-portal-icon="refresh" id="refreshBtn" type="button" title="刷新" aria-label="刷新" data-portal-i18n-attrs="{&quot;title&quot;: &quot;刷新&quot;, &quot;aria-label&quot;: &quot;刷新&quot;}"></button>
            <button class="portalButton is-icon is-quiet iconBtn" id="newPaperBtn" type="button" title="Register paper" aria-label="Register paper" data-portal-icon="plus" data-portal-i18n-attrs="{&quot;title&quot;: &quot;Register paper&quot;, &quot;aria-label&quot;: &quot;Register paper&quot;}"></button>
          </div>
        </div>
        <div class="leftBody">
          <div class="portalSegmented leftFaceTabs" id="leftFaceTabs">
            <button type="button" data-left-face="library" class="active" title="切换到论文库目录" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文库目录&quot;}"><!--portal-i18n:"Library"-->Library</button>
            <button type="button" data-left-face="ccf" title="切换到 CCF A/B 论文目录" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到 CCF A/B 论文目录&quot;}"><!--portal-i18n:"CCF A/B"-->CCF A/B</button>
          </div>
          <div class="ccfFilterBar hidden" data-portal-search-field id="ccfFilterBar">
            <label for="ccfYearFilterInput"><!--portal-i18n:"Search CCF"-->Search CCF</label>
            <input data-portal-search-input id="ccfYearFilterInput" type="search" placeholder="Search CCF, year / issue, e.g. PPoPP or 2025"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;Search CCF, year / issue, e.g. PPoPP or 2025&quot;}"/>
          </div>
          <div class="searchWrap">
            <div data-portal-board-toolbar aria-label="Paper Library search" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Paper Library search&quot;}">
              <div data-portal-board-search>
                <label for="searchInput"><!--portal-i18n:"Search papers"-->Search papers</label>
                <input data-portal-board-search-input id="searchInput" type="search" placeholder="Search title, tags, analysis, ID..."  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;Search title, tags, analysis, ID...&quot;}"/>
                <button data-portal-board-semantic id="semanticSearchBtn" type="button" title="根据输入内容发起论文语义检索" aria-label="根据输入内容发起论文语义检索" data-portal-i18n-attrs="{&quot;title&quot;: &quot;根据输入内容发起论文语义检索&quot;, &quot;aria-label&quot;: &quot;根据输入内容发起论文语义检索&quot;}">
                  <span data-semantic-label><!--portal-i18n:"Semantic"-->Semantic</span>
                </button>
              </div>
            </div>
            <div class="portalSemanticPanel" id="semanticSearchList"></div>
            <form class="collectorBox" id="collectorForm">
              <div data-portal-board-toolbar aria-label="Collect papers" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Collect papers&quot;}">
                <div data-portal-board-search>
                  <label for="collectorInput"><!--portal-i18n:"Collect papers"-->Collect papers</label>
                  <input data-portal-board-search-input id="collectorInput" type="search" placeholder="Collect papers by need..."  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;Collect papers by need...&quot;}"/>
                </div>
                <div data-portal-board-slot class="portalToolbar">
                  <label for="collectorMaxPapers"><!--portal-i18n:"最多收集"-->最多收集</label>
                  <input class="portalControl" id="collectorMaxPapers" type="number" min="1" max="50" step="1" value="50" required aria-label="最多收集论文数" title="最多收集论文数（1–50）"  data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;最多收集论文数&quot;, &quot;title&quot;: &quot;最多收集论文数（1–50）&quot;}"/>
                  <button class="portalButton is-compact is-primary" id="collectorBtn" type="submit" title="根据输入需求收集论文" data-portal-i18n-attrs="{&quot;title&quot;: &quot;根据输入需求收集论文&quot;}"><!--portal-i18n:"Collect"-->Collect</button>
                </div>
              </div>
              <div class="collectorJobList" id="collectorJobList"></div>
            </form>
            <div class="filterGrid">
              <select class="portalControl" id="yearFilter"><option value=""><!--portal-i18n:"All years"-->All years</option></select>
              <select class="portalControl" id="venueFilter"><option value=""><!--portal-i18n:"All venues"-->All venues</option></select>
              <select class="portalControl" id="tagFilter"><option value=""><!--portal-i18n:"All tags"-->All tags</option></select>
              <select class="portalControl" id="projectFilter"><option value=""><!--portal-i18n:"All projects"-->All projects</option></select>
              <label class="paperFavoriteFilter"><input id="favoriteFilter" type="checkbox" /><!--portal-i18n:"只看收藏"-->只看收藏</label>
            </div>
          </div>
          <div class="folderTree" id="folderTree"></div>
        </div>
      </section>

      <section class="pane workspacePane" id="paperWorkspacePane" aria-label="Paper Research Workspace" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Paper Research Workspace&quot;}">
        <div class="workspaceBody">
          <div class="workspaceTop portalPanelHeadSurface">
            <div class="titleBlock">
              <div id="workspaceResourceIdentity">
                <div class="portalResourceIdentity">
                  <div class="portalResourceIdentityTitleRow">
                    <div class="portalResourceIdentityTitle workspaceTitle" id="workspaceTitle"><!--portal-i18n:"Paper Research"-->Paper Research</div>
                  </div>
                </div>
              </div>
              <div class="workspaceIdentityMetaRow">
                <div class="workspaceResourceIdSlot" id="workspaceResourceIdSlot"></div>
                <button class="workspaceDetailsToggle" id="workspaceDetailsToggle" type="button" aria-expanded="false" aria-controls="workspaceDetailsBody">
                  <span><!--portal-i18n:"Details"-->Details</span>
                  <span class="workspaceDetailsIcon" data-portal-icon="chevron-down" aria-hidden="true"></span>
                </button>
                <div class="workspaceDetailsBody" id="workspaceDetailsBody" hidden>
                  <div class="workspaceSummary" id="workspaceSummary"></div>
                  <div class="workspaceMeta" id="workspaceMeta"><!--portal-i18n:"Browse, read, chat, and review papers from one workspace."-->Browse, read, chat, and review papers from one workspace.</div>
                </div>
              </div>
            </div>
            <div class="workspaceControls">
              <button class="portalButton is-icon is-quiet paperFavorite" id="paperFavoriteBtn" type="button" hidden aria-label="收藏论文" aria-pressed="false" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;收藏论文&quot;}">☆</button>
              <div class="portalSegmented" id="modeTabs">
                <button type="button" data-mode="library" class="active" title="切换到论文库视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文库视图&quot;}"><!--portal-i18n:"Library"-->Library</button>
                <button type="button" data-mode="today" title="切换到今日论文视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到今日论文视图&quot;}"><!--portal-i18n:"Today"-->Today</button>
                <button type="button" data-mode="reader" title="切换到论文阅读视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文阅读视图&quot;}"><!--portal-i18n:"Reader"-->Reader</button>
                <button type="button" data-mode="review" title="切换到论文 Review 视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文 Review 视图&quot;}"><!--portal-i18n:"Review"-->Review</button>
                <button type="button" data-mode="exp" title="切换到论文实验分析视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文实验分析视图&quot;}"><!--portal-i18n:"Exp"-->Exp</button>
                <button type="button" data-mode="figures" title="切换到论文图表视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文图表视图&quot;}"><!--portal-i18n:"Figure"-->Figure</button>
                <button type="button" data-mode="notes" title="切换到论文笔记视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文笔记视图&quot;}"><!--portal-i18n:"Notes"-->Notes</button>
                <button type="button" data-mode="refs" title="切换到论文参考文献视图" data-portal-i18n-attrs="{&quot;title&quot;: &quot;切换到论文参考文献视图&quot;}"><!--portal-i18n:"Refs"-->Refs</button>
              </div>
              <div class="workspaceModeActions" id="workspaceModeActions"></div>
            </div>
          </div>
          <div class="workspaceMain" id="workspaceMain"></div>
        </div>
      </section>

    </div>
    </main>

    <div class="portalDetailOverlay" data-portal-detail-overlay data-portal-overlay-layer="dialog" id="paperModal" hidden>
      <form class="portalDetailSurface paperRegisterSurface" data-portal-detail-surface id="paperForm">
        <header class="portalDetailHeader">
          <strong><!--portal-i18n:"Register Paper & Analysis"-->Register Paper & Analysis</strong>
          <button class="portalDetailClose" type="button" id="closePaperModal" aria-label="Close" data-portal-icon="close" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Close&quot;}"></button>
        </header>
        <div class="portalDetailBody paperRegisterBody">
          <div class="paperRegisterUpload" id="paperRegisterUploadDropzone">
            <button class="portalButton is-compact" id="paperRegisterUploadBtn" type="button" data-portal-icon="upload"><!--portal-i18n:"Upload PDF"-->Upload PDF</button>
            <span class="paperRegisterUploadStatus" id="paperRegisterUploadStatus" aria-live="polite"><!--portal-i18n:"No PDF selected"-->No PDF selected</span>
            <input id="paperRegisterUploadInput" type="file" accept="application/pdf,.pdf" hidden />
            <input name="registration_upload_id" type="hidden" />
          </div>
          <div class="formGrid">
            <label class="portalField paperRegisterField full"><!--portal-i18n:"Title"-->Title<input name="title" required /></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Venue"-->Venue<input name="venue" placeholder="ISCA"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;ISCA&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Year"-->Year<input name="year" placeholder="2026" /></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Related project / Folder"-->Related project / Folder<input name="session" placeholder="OSForAgent"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;OSForAgent&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Authors"-->Authors<input name="authors" /></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"DOI"-->DOI<input name="doi" placeholder="10.1145/..." /></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"arXiv ID"-->arXiv ID<input name="arxiv" placeholder="2607.01088" /></label>
            <label class="portalField paperRegisterField full"><!--portal-i18n:"PDF path or URL"-->PDF path or URL<input name="pdf_path" placeholder="/absolute/path/to/paper.pdf"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;/absolute/path/to/paper.pdf&quot;}"/></label>
            <label class="portalField paperRegisterField full"><!--portal-i18n:"Analysis markdown path or URL"-->Analysis markdown path or URL<input name="analysis_path" placeholder="/absolute/path/to/analysis.md"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;/absolute/path/to/analysis.md&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Tags"-->Tags<input name="tags" placeholder="LLM, Quantization, DSA"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;LLM, Quantization, DSA&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Workload"-->Workload<input name="workload" placeholder="LLM inference"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;LLM inference&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Platform"-->Platform<input name="platform" placeholder="accelerator, GPU, PIM"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;accelerator, GPU, PIM&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Architecture"-->Architecture<input name="architecture" placeholder="CIM, systolic array"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;CIM, systolic array&quot;}"/></label>
            <label class="portalField paperRegisterField"><!--portal-i18n:"Optimization"-->Optimization<input name="optimization" placeholder="quantization, scheduling"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;quantization, scheduling&quot;}"/></label>
            <label class="portalField paperRegisterField full"><!--portal-i18n:"Abstract / note"-->Abstract / note<textarea name="abstract"></textarea></label>
          </div>
        </div>
        <footer class="portalDetailFooter">
          <button class="portalButton" type="button" id="cancelPaperModal"><!--portal-i18n:"取消"-->取消</button>
          <button class="portalButton is-primary" id="submitPaperBtn" type="submit"><!--portal-i18n:"Register"-->Register</button>
        </footer>
      </form>
    </div>

    <div class="selectionMenu" id="selectionMenu" role="menu" aria-label="Paper selection actions" hidden data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Paper selection actions&quot;}">
      <button type="button" data-selection-action="add-chat"><!--portal-i18n:"Add to Chat"-->Add to Chat</button>
      <button type="button" data-selection-action="translate"><!--portal-i18n:"Translate"-->Translate</button>
      <button type="button" data-selection-action="find-ref"><!--portal-i18n:"Find Ref"-->Find Ref</button>
      <button type="button" data-selection-action="regist-ref"><!--portal-i18n:"Regist Ref"-->Regist Ref</button>
      <button type="button" data-selection-action="explain"><!--portal-i18n:"Explain"-->Explain</button>
    </div>
    <input id="paperPdfUploadInput" type="file" accept="application/pdf,.pdf" hidden />

    <script src="/static/paper_location.js"></script>
    <script src="/static/paper_layout.js"></script>
    <script src="/static/paper_library.js"></script>
    <script src="/static/paper_library_view.js"></script>
    <script src="/static/paper_collector.js"></script>
    <script src="/static/paper_ccf_catalog.js"></script>
    <script src="/static/paper_ccf_view.js"></script>
    <script src="/static/paper_detail.js"></script>
    <script src="/static/paper_workspace_view.js"></script>
    <script src="/static/paper_reader.js"></script>
    <script src="/static/paper_reviews.js"></script>
    <script src="/static/paper_notes_refs.js"></script>
    <script src="/static/paper_figures.js"></script>
    <script src="/static/paper_chat.js"></script>
    <script src="/static/paper_registration.js"></script>
    <script src="/static/paper_record.js"></script>
    <script src="/static/paper_projection.js"></script>
    <script src="/static/paper_events.js"></script>
    <script src="/static/paper.js"></script>
  </body>
</html>
