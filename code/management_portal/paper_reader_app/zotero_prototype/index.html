<!doctype html>
<meta charset="utf-8">
<title>Zotero Reader isolated prototype</title>
<style>body{margin:0;font:16px sans-serif}iframe{width:100%;height:90vh;border:0}</style>
<label>Local test PDF <input id="pdf" type="file" accept="application/pdf"></label>
<button id="close">Close</button><output id="status">Select a test PDF. Data stays in this browser.</output>
<div id="root"></div>
<script type="module">
import {mountReader} from './host.js';
let host;
const status = text => document.querySelector('#status').textContent = text;
document.querySelector('#pdf').onchange = async event => {
  try {
    if(host) {await host.close(); host=null;}
    const pdf=new Uint8Array(await event.target.files[0].arrayBuffer());
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',pdf)),x=>x.toString(16).padStart(2,'0')).join('');
    const key='zotero-prototype:'+digest;
    let data=JSON.parse(localStorage.getItem(key)||'{"annotations":[],"position":null}');
    const persist=()=>localStorage.setItem(key,JSON.stringify(data));
    const frame=document.createElement('iframe');
    frame.src='./upstream/reader.html';
    const ready=new Promise(resolve=>frame.onload=resolve);
    document.querySelector('#root').append(frame); await ready;
    host=await mountReader(frame,{
      load:async()=>({...data,pdf,author:'Prototype user'}), status,
      save:async annotations=>{const records=new Map(data.annotations.map(a=>[a.id,a]));for(const a of annotations) records.set(a.id,a);data.annotations=[...records.values()];persist();status('Saved locally');},
      remove:async ids=>{data.annotations=data.annotations.filter(a=>!ids.includes(a.id));persist();status('Deleted locally');},
      savePosition:async position=>{data.position=position;persist();},
    });
    window.prototypeHost=host;
    status('Ready: highlight, add comment, click sidebar annotation, delete, then reopen');
  } catch(error) {status(error.message);}
};
document.querySelector('#close').onclick=async()=>{try{await host?.close();host=null;status('Closed');}catch(error){status(error.message);}};
</script>
