<div class="templateWorkshop">
  <nav class="workshopLibrary" data-workshop-library aria-label="工具箱模板" data-portal-i18n-attrs="{&quot;aria-label&quot;:&quot;工具箱模板&quot;}" hidden><header><!--portal-i18n:"模板"-->模板</header><div data-workshop-library-items></div></nav>
  <section id="workshopCanvas" class="workshopCanvas"><form id="workshopEditor"></form>
    <p id="workshopError" role="alert" hidden></p>
    <button type="button" class="portalButton is-icon workshopToolboxButton" data-workshop-toolbox data-portal-icon="archive" aria-label="工具箱" data-portal-i18n-attrs="{&quot;aria-label&quot;:&quot;工具箱&quot;}"></button>
    <aside id="workshopToolbox" class="workshopToolbox" hidden><header><strong><!--portal-i18n:"工具箱"-->工具箱</strong><button type="button" class="portalButton is-icon" data-workshop-store data-portal-icon="archive" aria-label="模板商店" title="模板商店"></button><button type="button" class="portalButton" data-workshop-toolbox><!--portal-i18n:"关闭"-->关闭</button></header><div id="workshopShelf" class="templateShelf"></div></aside>
  </section>
  <aside class="workshopChatColumn"><header><strong><!--portal-i18n:"工坊助手"-->工坊助手</strong><button type="button" class="portalButton" data-workshop-chat><!--portal-i18n:"收起"-->收起</button></header>
    <div id="workshopChat"></div><p id="workshopChatStatus" role="status"></p>
    <p id="workshopUnsaved" hidden><span><!--portal-i18n:"助手看到的是上次保存的版本"-->助手看到的是上次保存的版本</span> <button type="button" class="portalButton is-compact" id="workshopChatSave" translate="no">Save</button></p>
  </aside>
</div>
