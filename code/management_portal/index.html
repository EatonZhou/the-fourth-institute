    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Page body ── */
      .wrap {
        display: grid;
        gap: 16px;
      }
      .filter-wrap { position: relative; }
      .filter-panel {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 40;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
        min-width: 300px;
        max-width: 380px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .filter-panel.open { display: block; }
      .filter-group { margin-bottom: 16px; }
      .filter-group:last-child { margin-bottom: 0; }
      .filter-group-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .filter-options {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filter-option {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }
      .filter-option input {
        margin-top: 2px;
        cursor: pointer;
        accent-color: var(--accent);
      }
      .filter-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 14px 0;
      }
      .filter-active-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-left: 5px;
        vertical-align: middle;
      }

      .home-overview-section {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: clamp(380px, 52vh, 520px);
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel-2) 42%, var(--panel));
      }
      .home-overview-section > .value {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 13px;
        font-size: 12px;
        line-height: 1.5;
      }
      .agent-access-panel {
        display: grid;
        min-height: 100%;
        grid-template-columns: minmax(0, 1fr);
      }
      .agent-access-command,
      .agent-access-recent-item {
        display: grid;
        min-width: 0;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
      }
      .agent-access-command {
        padding: 10px 11px;
        border-bottom: 1px solid var(--border);
      }
      .agent-access-command:hover,
      .agent-access-command:focus-visible,
      .agent-access-recent-item:hover,
      .agent-access-recent-item:focus-visible {
        outline: 0;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .agent-access-copy {
        display: grid;
        min-width: 0;
        gap: 2px;
      }
      .agent-access-title {
        overflow: hidden;
        font-size: 12px;
        font-weight: 750;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agent-access-meta,
      .agent-access-empty {
        color: var(--muted);
        font-size: 9px;
        line-height: 1.35;
      }
      .agent-access-meta {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agent-access-arrow {
        width: 15px;
        height: 15px;
        color: var(--muted);
      }
      .agent-access-recent {
        grid-column: 1 / -1;
        min-height: 0;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        padding-top: 7px;
      }
      .agent-access-recent-label {
        padding: 4px 11px 6px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 750;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .agent-access-recent-list {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        overflow: auto;
      }
      .agent-access-recent-item {
        padding: 8px 11px;
        border-top: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
      }
      .agent-access-empty { padding: 10px 11px; }
      .home-overview-section > [data-daily-news] {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .daily-news-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
      }
      .daily-news-toolbar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .daily-news-meta {
        overflow: hidden;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.35;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .daily-news-body {
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        overflow: auto;
        padding: 2px 5px 2px 1px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
      }
      .daily-news-body h1,
      .daily-news-body h2,
      .daily-news-body h3 {
        color: var(--text);
        line-height: 1.4;
      }
      .daily-news-body h1 {
        display: none;
      }
      .daily-news-body h2 {
        margin: 11px 0 5px;
        padding-top: 9px;
        border-top: 1px solid var(--border);
        color: var(--text);
        font-size: 10px;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .daily-news-body h2:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
      .daily-news-body h3 {
        margin: 9px 0 4px;
        font-size: 12px;
      }
      .daily-news-body p,
      .daily-news-body ul,
      .daily-news-body ol { margin: 0 0 9px; }
      .daily-news-body li { margin: 0 0 3px; }
      .daily-news-body a { color: var(--accent); }
      .daily-news-body blockquote {
        margin: 0 0 9px;
        padding-left: 10px;
        border-left: 2px solid var(--accent);
        color: var(--muted);
      }
      .daily-news-empty,
      .daily-news-error {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .daily-news-error { color: #dc2626; }
      .pulse-panel {
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      .pulse-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
      }
      .pulse-toolbar-meta {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .pulse-tabs {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--panel-2) 82%, transparent);
        max-width: 100%;
      }
      .pulse-tab {
        min-height: 26px;
        padding-inline: 9px;
        font-size: 10px;
      }
      .pulse-summary {
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
      }
      .pulse-brief {
        display: grid;
        gap: 5px;
        padding: 10px 11px;
        border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--border));
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 5%, var(--panel));
      }
      .pulse-brief-label {
        color: var(--accent);
        font-size: 8px;
        font-weight: 850;
        letter-spacing: .09em;
        text-transform: uppercase;
      }
      .pulse-brief p {
        margin: 0;
        color: var(--text);
        font-size: 11px;
        line-height: 1.5;
      }
      .pulse-meta {
        color: var(--muted);
        font-size: 9px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .pulse-section {
        display: grid;
        gap: 8px;
      }
      .pulse-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .pulse-section-title {
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        line-height: 1.3;
        letter-spacing: .07em;
        text-transform: uppercase;
      }
      .pulse-list {
        display: grid;
        gap: 8px;
      }
      .pulse-row {
        display: grid;
        gap: 6px;
        padding: 10px 11px;
        border: 1px solid color-mix(in srgb, var(--border) 86%, transparent);
        border-radius: 10px;
        background: var(--panel);
      }
      .pulse-row-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .pulse-row-title {
        min-width: 0;
        color: var(--text);
        font-size: 11px;
        font-weight: 750;
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pulse-row-text {
        color: var(--text);
        font-size: 10.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .pulse-row .portalStatus,
      .pulse-section-head .portalStatus,
      .daily-news-toolbar .portalStatus,
      .pulse-toolbar .portalStatus {
        flex: 0 0 auto;
        min-height: 19px;
        padding: 1px 7px;
        font-size: 8px;
      }
      .pulse-evidence {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 5px;
        overflow: hidden;
      }
      .pulse-evidence-label {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 8px;
        font-weight: 750;
        letter-spacing: .05em;
        text-transform: uppercase;
      }
      .pulse-evidence-chip {
        min-width: 0;
        overflow: hidden;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--muted);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 8px;
        line-height: 1.45;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pulse-action {
        min-height: 25px;
        padding-inline: 8px;
        font-size: 9px;
      }
      .pulse-empty,
      .pulse-error {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .pulse-error {
        color: #b45309;
      }
      .agent-status-card {
        min-height: 700px;
      }
      .agent-status-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .agent-status-head > [data-agent-status-runboard] {
        min-width: 0;
        flex: 1 1 auto;
      }
      .agent-status-creature-strip {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 4px 5px;
        min-height: 38px;
      }
      .agent-status-account-group {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: 100%;
      }
      .agent-status-account-icons {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px 5px;
        max-width: 100%;
      }
      .agent-status-account-divider {
        height: 28px;
        display: inline-flex;
        align-items: center;
        align-self: center;
        flex: 0 0 auto;
        gap: 2px;
        margin: 0 2px;
      }
      .agent-status-account-label {
        min-width: 7px;
        max-width: 100%;
        overflow-wrap: anywhere;
        align-self: center;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        font-weight: 900;
        line-height: 1;
        opacity: 0.72;
        text-align: center;
        text-rendering: geometricPrecision;
      }
      :root[data-portal-theme="dark"] .agent-status-account-label {
        color: var(--muted);
        opacity: 0.82;
      }
      .agent-status-account-divider-line {
        width: 1px;
        height: 28px;
        flex: 0 0 1px;
        background: var(--border);
        opacity: 0.72;
      }
      a.agent-status-creature {
        border-radius: 8px;
        outline-offset: 2px;
        cursor: pointer;
        text-decoration: none;
      }
      a.agent-status-creature:hover {
        transform: translateY(-1px);
        filter: saturate(1.35) brightness(1.16);
      }
      .agent-status-creature.running {
        filter: saturate(1.2) brightness(1.08);
        animation: agent-status-creature-swim 2.4s ease-in-out infinite;
        animation-delay: var(--creature-delay, 0s);
      }
      .agent-status-creature.running.rarity-ssr {
        filter:
          saturate(1.42)
          brightness(1.2)
          drop-shadow(0 0 2px rgba(255, 196, 74, 0.78))
          drop-shadow(0 0 4px rgba(163, 109, 255, 0.5));
        animation:
          agent-status-creature-swim 2.4s ease-in-out infinite,
          agent-status-creature-ssr-glow 1.45s ease-in-out infinite;
        animation-delay: var(--creature-delay, 0s), 0s;
      }
      .agent-status-creature.running.rarity-sssr {
        position: relative;
        isolation: isolate;
        background-image: none;
        animation: agent-status-creature-swim 2.4s ease-in-out infinite;
        animation-delay: var(--creature-delay, 0s);
      }
      .agent-status-creature-sssr-glow,
      .agent-status-creature-sssr-glow-source,
      .agent-status-creature.running.rarity-sssr::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .agent-status-creature-sssr-glow {
        inset: -18px;
        z-index: 0;
        -webkit-mask-image: radial-gradient(
          circle at center,
          #000 0 44%,
          rgba(0, 0, 0, 0.92) 55%,
          rgba(0, 0, 0, 0.45) 68%,
          transparent 84%
        );
        mask-image: radial-gradient(
          circle at center,
          #000 0 44%,
          rgba(0, 0, 0, 0.92) 55%,
          rgba(0, 0, 0, 0.45) 68%,
          transparent 84%
        );
      }
      .agent-status-creature-sssr-glow.outer {
        opacity: 0.36;
        filter: blur(9px) saturate(2.15) brightness(1.16);
      }
      .agent-status-creature-sssr-glow.inner {
        opacity: 1;
        filter: blur(4px) saturate(2.35) brightness(1.32);
      }
      .agent-status-creature-sssr-glow-source {
        --sssr-glow-angle: 0deg;
        inset: 18px;
        background: conic-gradient(
          from var(--sssr-glow-angle),
          #ff1744,
          #ffb300,
          #00c853,
          #00b8d4,
          #304ffe,
          #aa00ff,
          #ff1744
        );
        -webkit-mask-image: url("/static/assets/deep-sea-agent-glow-masks.png?v=20260825-remove-dolphin");
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: 272px 204px;
        -webkit-mask-position: var(--sprite-position, 0 0);
        mask-image: url("/static/assets/deep-sea-agent-glow-masks.png?v=20260825-remove-dolphin");
        mask-repeat: no-repeat;
        mask-size: 272px 204px;
        mask-position: var(--sprite-position, 0 0);
        animation: agent-status-creature-sssr-contour-flow 4.8s linear infinite;
      }
      .agent-status-creature.running.rarity-sssr::after {
        content: "";
        z-index: 1;
        background-image: url("/static/assets/deep-sea-agent-sprites.png?v=20260825-remove-dolphin");
        background-repeat: no-repeat;
        background-size: 272px 204px;
        background-position: var(--sprite-position, 0 0);
        image-rendering: pixelated;
        filter: saturate(1.28) brightness(1.16);
      }
      .agent-status-creature.queued {
        filter: grayscale(1) saturate(0) brightness(0.68);
        opacity: 0.55;
        animation: none;
        box-shadow: none;
      }
      a.agent-status-creature.queued:hover {
        transform: none;
      }
      .agent-status-creature.unread {
        filter: saturate(0.92) brightness(0.9);
        opacity: 0.82;
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #0f766e) 58%, transparent);
      }
      .agent-status-creature-more {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        height: 34px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .agent-status-resource-line {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        border: 1px solid rgba(26, 116, 92, 0.22);
        background: rgba(26, 116, 92, 0.06);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.35;
      }
      .agent-status-resource-line > span {
        white-space: nowrap;
      }
      .agent-status-resource-line > span:not(:last-child)::after {
        content: "·";
        color: var(--muted);
        font-weight: 400;
        margin-left: 8px;
      }
      .agent-status-gpu-card {
        border: 1px solid rgba(26, 116, 92, 0.22);
        background: var(--panel-2);
        border-radius: 8px;
        padding: 9px 10px;
        display: grid;
        gap: 8px;
      }
      .agent-status-gpu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        font-weight: 750;
      }
      .agent-status-gpu-grid {
        display: grid;
        gap: 8px;
      }
      .agent-status-gpu-resource-list {
        display: grid;
        gap: 8px;
      }
      .agent-status-gpu-resource-card {
        display: grid;
        gap: 8px;
        border-top: 1px solid rgba(26, 116, 92, 0.22);
        padding-top: 8px;
      }
      .agent-status-gpu-resource-card:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .agent-status-gpu-row {
        display: grid;
        gap: 4px;
        font-size: 12px;
      }
      .agent-status-gpu-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-weight: 750;
      }
      .agent-status-gpu-name {
        font-weight: 500;
      }
      .agent-status-gpu-name strong {
        color: var(--text);
        font-weight: 800;
      }
      .agent-status-gpu-meta,
      .agent-status-gpu-process {
        color: var(--muted);
        line-height: 1.35;
      }
      .agent-status-gpu-process strong {
        color: var(--text);
      }
      .agent-status-gpu-command {
        overflow-wrap: anywhere;
      }
      @keyframes agent-status-creature-swim {

      :root[data-portal-theme="dark"] .scheduled-triggered-badge.ok { color: #7dd3bc; }
      :root[data-portal-theme="dark"] .scheduled-triggered-badge.warn { color: #f1c27d; }
      :root[data-portal-theme="dark"] .scheduled-triggered-badge.error { color: #fca5a5; }
      .scheduled-triggered-detail {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: minmax(0, 1fr);
        row-gap: 14px;
        border-top: 1px solid var(--border);
        background: rgba(148, 163, 184, 0.045);
        padding: 11px 14px 13px 22px;
      }
      .scheduled-triggered-detail[hidden] {
        display: none;
      }
      .scheduled-triggered-detail-section {
        display: grid;
        align-content: start;
        gap: 7px;
        min-width: 0;
        padding: 10px 0 0;
        border-top: 1px solid var(--border);
      }
      .scheduled-triggered-detail-section:first-child {
        padding-top: 0;
        border-top: 0;
      }
      .scheduled-triggered-detail-copy {
        display: grid;
        gap: 3px;
        min-width: 0;
      }
      .agent-status-section-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .agent-status-rows {
        display: grid;
        gap: 5px;
      }
      .agent-status-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        line-height: 1.35;
      }
      .agent-status-row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agent-status-row-value {
        color: var(--muted);
        white-space: nowrap;
      }
      .agent-status-progress {
        height: 4px;
        border-radius: 999px;
        background: var(--chip);
        overflow: hidden;
      }
      .agent-status-progress > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: rgba(26, 116, 92, 0.72);
      }
      .agent-status-error {
        color: #b45309;
        font-size: 12px;
      }
      :root[data-portal-theme="dark"] .agent-status-error { color: #f1c27d; }
      .agent-status-details {
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .agent-status-details summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      .agent-status-details summary::-webkit-details-marker { display: none; }
      .agent-status-details[open] summary {
        margin-bottom: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-portal-theme="light"]) .agent-status-bar {
          background: linear-gradient(180deg, rgba(142, 199, 255, 0.86), rgba(86, 182, 194, 0.28));
        }
        :root:not([data-portal-theme="light"]) .agent-status-error { color: #f1c27d; }
      }
      @container home-accounts (max-width: 1050px) {
        .agent-status-limit-list {
          grid-template-columns: max-content minmax(0, 1fr);
        }
        .agent-status-account-limit { align-items: start; }
        .agent-status-account-windows { display: flex; flex-wrap: wrap; }
        .agent-status-account-rate-windows { flex: 1 1 100%; }
        .agent-status-account-refresh {
          flex: 1 1 100%;
          white-space: normal;
        }
      }
      @container home-accounts (min-width: 761px) {
        .agent-status-account-balance { grid-template-columns: 6em 18ch 245px; }
        .agent-status-account-balance .agent-status-balance-coins { grid-column: 3; }
      }
      @container home-accounts (max-width: 760px) {
        .agent-status-limit-list { grid-template-columns: minmax(0, 1fr); gap: 18px; }
        .agent-status-account-name,
        .agent-status-account-windows { grid-column: 1; }
        .agent-status-account-details { grid-column: 1; }
      }
      @container home-panel (max-width: 900px) {
        .scheduled-triggered-grid {
          grid-template-columns: 10px minmax(170px, 1.35fr) minmax(140px, 0.9fr) auto;
        }
        .scheduled-triggered-recent {
          display: none;
        }
      }
      @media (max-width: 620px) {
        .agent-status-usage-summary { grid-template-columns: 1fr; }
      }
      @container home-panel (max-width: 620px) {
        .scheduled-triggered-grid {
          grid-template-columns: 10px minmax(0, 1fr) auto;
          column-gap: 9px;
        }
        .scheduled-triggered-row,
        .scheduled-triggered-main {
          column-gap: 9px;
        }
        .scheduled-triggered-main {
          row-gap: 9px;
          padding: 9px 2px;
        }
        .scheduled-triggered-status-dot {
          grid-column: 1;
          grid-row: 1;
        }
        .scheduled-triggered-identity {
          grid-column: 2;
          grid-row: 1;
        }
        .scheduled-triggered-row-tools {
          grid-column: 3;
          grid-row: 1;
        }
        .scheduled-triggered-primary {
          grid-column: 2 / -1;
          grid-row: 2;
          padding-right: 36px;
        }
        .scheduled-triggered-row-tools .scheduled-triggered-badge {
          display: none;
        }
        .scheduled-triggered-detail {
          padding: 10px 12px 12px 19px;
        }
      }

    </style>
  </head>
