  <body class="portalBoardShell">
    <header class="portalSiteHeader" data-portal-site-header data-portal-nav-active=""></header>

    <div class="wrap homeWorkbenchPage portalPageFrame portalWorkbenchViewportShell" id="homeRoot" data-home-component="home-shell">
      <main class="homeWorkbenchRoot portalWorkbenchViewportRoot" id="homeWorkbenchRoot" aria-label="Home Workbench" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Home Workbench&quot;}"></main>

      <div class="homeWorkbenchStaging" id="homeWorkbenchStaging" hidden>
        <section class="homeWorkbenchGroup" id="homeOverviewCard" data-home-component="get-me-aligned">
          <div class="homeNestedWorkbench" id="getMeAlignedWorkbench"></div>
          <div class="homeWorkbenchStaging" id="getMeAlignedStaging" hidden>
            <section class="home-overview-section" data-home-component="daily-news">
              <div class="value" data-daily-news><!--portal-i18n:"正在读取今日新闻…"-->正在读取今日新闻…</div>
            </section>
            <section class="home-overview-section home-overview-agent-access" data-home-component="agent-access">
              <div class="value" data-agent-access><!--portal-i18n:"正在读取 Resident…"-->正在读取 Resident…</div>
            </section>
          </div>
        </section>

        <section class="homeWorkbenchGroup" data-home-component="my-pulse-publish">
          <div class="homeNestedWorkbench" id="myPulseWorkbench"></div>
          <div class="homeWorkbenchStaging" id="myPulseStaging" hidden>
            <section class="homeWorkbenchContentPanel" data-home-component="knowledge-pulse">
              <div class="value" data-summary-value="urgent-work"><!--portal-i18n:"正在读取知识库变化摘要…"-->正在读取知识库变化摘要…</div>
            </section>
            <section class="homeWorkbenchContentPanel" data-home-component="personal-pulse">
              <div class="value" data-summary-value="contribution-window"><!--portal-i18n:"正在读取个人进展摘要…"-->正在读取个人进展摘要…</div>
            </section>
          </div>
        </section>

        <section class="homeWorkbenchGroup agent-status-card" data-home-component="agent-status">
          <div class="homeNestedWorkbench" id="agentStatusWorkbench"></div>
          <div class="homeWorkbenchStaging" id="agentStatusStaging" hidden>
            <section class="homeWorkbenchContentPanel" data-home-component="agent-accounts"><div class="agent-status-muted"><!--portal-i18n:"正在读取活动 Agent 与 AI 账号…"-->正在读取活动 Agent 与 AI 账号…</div></section>
            <section class="homeWorkbenchContentPanel" data-home-component="system-resources"><div class="agent-status-muted"><!--portal-i18n:"正在读取 GPU 与磁盘资源…"-->正在读取 GPU 与磁盘资源…</div></section>
            <section class="homeWorkbenchContentPanel" data-home-component="scheduled-triggered"></section>
            <section class="homeWorkbenchContentPanel" data-home-component="usage-attribution"></section>
          </div>
        </section>
      </div>
    </div>

    <script src="/static/markdown.js"></script>
