<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title data-portal-site-title="[&quot;重置密码&quot;]" data-portal-site-separator=" - ">重置密码</title>
    <link rel="stylesheet" href="/static/portal_components.css" />
    <link rel="stylesheet" href="/static/portal_design_system.css" data-portal-skin="default" />
    <link rel="stylesheet" href="/static/portal_themes.css" data-portal-skin-provider="themes" />
    <script data-portal-script-group="portal-foundation"></script>
    <script src="/static/portal_api.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; min-height: 100vh; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; padding: 24px 16px; }
      .resetCard { width: min(100%, 380px); padding: 32px 36px; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      .resetIntro { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      form { display: grid; gap: 14px; }
      .resetSubmit { width: 100%; }
      .resetStatus { margin: 16px 0 0; font-size: 13px; line-height: 1.5; }
      .resetStatus.error { color: var(--danger); }
      .resetBack { display: inline-block; margin-top: 18px; color: var(--accent); font-size: 13px; }
    </style>
  </head>
  <body>
    <div data-portal-public-language></div>
    <main class="portalDetailSurface resetCard">
      <h1><!--portal-i18n:"重置密码"-->重置密码</h1>
      <p class="resetIntro"><!--portal-i18n:"输入管理员为你的 Portal 账户登记的邮箱。"-->输入管理员为你的 Portal 账户登记的邮箱。</p>
      <form data-reset-request-form>
        <label class="portalField"><!--portal-i18n:"邮箱"-->邮箱<input data-reset-email type="email" autocomplete="email" required autofocus /></label>
        <button class="portalButton is-primary resetSubmit" type="submit"><!--portal-i18n:"发送重置链接"-->发送重置链接</button>
      </form>
      <p class="resetStatus" data-reset-status role="status" hidden></p>
      <a class="resetBack" href="/login"><!--portal-i18n:"返回登录"-->返回登录</a>
    </main>
    <script>
      (() => {
        const form = document.querySelector("[data-reset-request-form]");
        const email = document.querySelector("[data-reset-email]");
        const status = document.querySelector("[data-reset-status]");
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const button = form.querySelector("button");
          button.disabled = true;
          status.hidden = true;
          try {
            const payload = await window.PortalAPI.post("/api/auth/password-reset/request", {
              email: email.value.trim(),
            }, { detectLoginRedirect: false });
            form.hidden = true;
            status.className = "resetStatus";
            status.textContent = payload.message;
            status.hidden = false;
          } catch (error) {
            status.className = "resetStatus error";
            status.textContent = error.message || window.PortalI18n.t("暂时无法提交请求，请稍后重试。");
            status.hidden = false;
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
