<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title data-portal-site-title="[&quot;设置新密码&quot;]" data-portal-site-separator=" - ">设置新密码</title>
    <link rel="stylesheet" href="/static/portal_components.css" />
    <link rel="stylesheet" href="/static/portal_design_system.css" data-portal-skin="default" />
    <link rel="stylesheet" href="/static/portal_themes.css" data-portal-skin-provider="themes" />
    <script data-portal-script-group="portal-foundation"></script>
    <script src="/static/portal_api.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; min-height: 100vh; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; padding: 24px 16px; }
      .resetCard { width: min(100%, 420px); padding: 32px 36px; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      .resetIntro { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .resetRequirements { display: block; margin: 0 0 14px; color: var(--muted); font-size: 11px; line-height: 1.4; }
      form { display: grid; gap: 14px; }
      .resetSubmit { width: 100%; }
      .resetStatus { margin: 16px 0 0; font-size: 13px; line-height: 1.5; }
      .resetStatus.error { color: var(--danger); }
      .resetBack { display: inline-block; margin-top: 18px; color: var(--accent); font-size: 13px; }
    </style>
  </head>
  <body>
    <div data-portal-public-language></div>
    <main class="portalDetailSurface resetCard">
      <h1><!--portal-i18n:"设置新密码"-->设置新密码</h1>
      <p class="resetIntro"><!--portal-i18n:"此链接只能使用一次，并会在发送后 30 分钟失效。"-->此链接只能使用一次，并会在发送后 30 分钟失效。</p>
      <small class="resetRequirements"><!--portal-i18n:"Include at least three of: uppercase letters, lowercase letters, numbers, and symbols."-->Include at least three of: uppercase letters, lowercase letters, numbers, and symbols.</small>
      <form data-reset-form>
        <label class="portalField"><!--portal-i18n:"新密码"-->新密码<input data-reset-password type="password" maxlength="256" autocomplete="new-password" required autofocus /></label>
        <label class="portalField"><!--portal-i18n:"确认新密码"-->确认新密码<input data-reset-confirmation type="password" maxlength="256" autocomplete="new-password" required /></label>
        <button class="portalButton is-primary resetSubmit" type="submit"><!--portal-i18n:"重置密码"-->重置密码</button>
      </form>
      <p class="resetStatus" data-reset-status role="status" hidden></p>
      <a class="resetBack" href="/login"><!--portal-i18n:"返回登录"-->返回登录</a>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";
        if (token) history.replaceState({}, "", "/reset-password");
        const form = document.querySelector("[data-reset-form]");
        const password = document.querySelector("[data-reset-password]");
        const confirmation = document.querySelector("[data-reset-confirmation]");
        const status = document.querySelector("[data-reset-status]");
        if (!token) {
          form.hidden = true;
          status.className = "resetStatus error";
          status.textContent = window.PortalI18n.t("重置链接无效或已经失效。");
          status.hidden = false;
          return;
        }
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const button = form.querySelector("button");
          if (password.value !== confirmation.value) {
            status.className = "resetStatus error";
            status.textContent = window.PortalI18n.t("两次输入的密码不一致。");
            status.hidden = false;
            return;
          }
          button.disabled = true;
          status.hidden = true;
          try {
            const payload = await window.PortalAPI.post("/api/auth/password-reset/confirm", {
              token,
              new_password: password.value,
              new_password_confirmation: confirmation.value,
            }, { detectLoginRedirect: false });
            form.hidden = true;
            status.className = "resetStatus";
            status.textContent = payload.message;
            status.hidden = false;
          } catch (error) {
            status.className = "resetStatus error";
            status.textContent = error.message || window.PortalI18n.t("无法重置密码。");
            status.hidden = false;
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
