    description: "Knowledge 资源界面把 actor、archive_id 和候选/草稿传给 Web 归档客户端；客户端调用外部 /api/archive/* HTTP API，返回结构化 job/draft/result。资源类型提供界面与引用，外部归档服务拥有任务处理；此边界不证明其内部正文更新方式。"
    example: "用户提交归档草稿：Web 客户端发送 actor、archive_id、draft_ids 到 /api/archive/apply；503/连接失败报告服务不可用，400/403/404按原错误分类返回。"

