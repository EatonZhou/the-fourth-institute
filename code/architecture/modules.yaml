    description: "测试框架 CatalogRepository 拥有测试定义；ResourceService 的 test provider 将 case.public 投影为正式资源。Test 功能通过 resource.index_adapters 提供 TestCatalogAdapter，索引刷新调用 CatalogRepository.projection 生成摘要并保留逐项错误。Web 测试接口读取目录/执行接口，WALL 保存条目与测试绑定。绑定的测试 ID 不复制测试定义。"
    example: "资源索引刷新 → TestCatalogAdapter.scan → catalog_repository().projection → Test 摘要与资源级错误；test provider → CatalogRepository.get → canonical Test resource；test_framework.web 查询/执行框架 API；wall.test_binding/point_test_binding 关联项目条目。"

