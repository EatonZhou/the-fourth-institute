    description: "CreateUpload 返回上传 ID、用途、过期时间与字节通道；服务按 purpose 校验大小、真实媒体类型和归属。Workspace 图片入口另经 workspace_contracts 校验后保存文件；读取端用已授权文件描述与范围参数返回字节。Notice Board 图片复用 purpose=post_image，不另造上传库。"
    example: "CreateUpload(purpose,target,metadata/source_address) → resources.isa 创建句柄 → 上传/校验 → Resource/Workspace 读取；ASGI download → workspace provider.read_content_range → 单一 Range 响应。"

  - id: "home-directory-view"
    title: "Home 目录、公开摘要与运行观察"
    modules:
      - "interface.home"
      - "interface.workbenches"
      - "web.community"
      - "web"
      - "lineage.conversation"
      - "lineage"
