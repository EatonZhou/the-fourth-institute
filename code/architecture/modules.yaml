  - id: "execution-account-registration"
    title: "AI Backend 账号登记与 Provider 登录接口"
    modules:
      - "execution.scheduling"
      - "execution.providers"
      - "interface.shell"
      - "interface.home"
      - "web.identity"
    designs: []
    related_designs:
      - "decision_7956d7cb4bde"
    description: "Execution 拥有账号登记、启停、登录会话和 Backend 角色映射；账号适配器按 Provider 能力与模型 API 条目派生执行账号，Provider 登录工具维护各自的认证目录。Web 会话接口提供指令权限摘要，管理页据此呈现入口，并经指令读取和修改登记。Home 账号详情中的 AI Backend 入口定位当前账号的管理页，重新登录复用管理页的登录组件；凭据正文不进入返回值，页面权限摘要不替代指令执行时的授权。"
    example: "Home 显示账号登录已过期 → 用户打开共享登录组件 → 组件经指令请求 Execution 打开登录会话并轮询状态 → Provider 完成认证后返回登录状态；账号登记与额度调度观察仍各自由原 owner 维护。"
