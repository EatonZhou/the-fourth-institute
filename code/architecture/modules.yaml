    designs:
      - "decision_ccbb1cac24aa"
    related_designs:
      - "decision_3dd52c0692c1"
      - "decision_8b2fa224616b"
    description: "Resident execution_settings/harness_config 是 Lineage 配置真值；执行准备通过 Provider 声明和账号 runtime_catalog 验证 model/effort/tier/options，再解析已绑定会话路由。四个原生入口（Family chat、Family menu/settings、Resident menu/settings、Resident composer）以选中成员 resident_id 绑定 interface.conversation 的 ResidentRuntimeController；控制器统一 settings/catalog、权限、差量保存、过期目标与缓存失效。interface.shell 的 PortalResidentService 独占 ISA/HTTP 及既有重启幂等、pending receipt、取消与观察；视图仅适配挂载、焦点和刷新，不另造运行状态机。能力选择沿用统一设置；执行前固定本轮装配快照，Provider 已确认、已发送与未知分开记录。保存配置不启动模型推理；账号切换通过既有 Session 控制，保留上下文准备失败时保留旧绑定，不静默降级。"
    example: "四视图 → ResidentRuntimeController → PortalResidentService → Get/UpdateResidentSettings 或 RestartSession/CancelSessionRestart → split_runtime_settings → resident_storage/state_store 提交 → codex_runtime_settings/native_options 对照账号目录 → BackendInvocation；已有 binding 继续解释实际运行账号。"

  - id: "execution-account-observation"
    title: "执行账号额度与用量观察"
    modules:
      - "execution.providers"
      - "execution.scheduling"
      - "lineage.conversation"
      - "interface.home"
      - "interface.conversation"
      - "interface.shell"
      - "web"
      - "web.projections"
    designs: []
    related_designs:
      - "decision_4dea0db1f45a"
      - "decision_f1331d57be89"
      - "decision_fc26f883773d"
      - "decision_3dd52c0692c1"
    description: "Provider Adapter 产生原生调用用量及额度/余额观察；Execution 按账号、稳定调用标识、观察时间聚合，Lineage 投影 Resident 用量，Home 显示账号资源。原生 turn 用量、上下文用量、订阅窗口额度与货币余额保持不同字段和来源。 BillingObservations 按 account 锁与缓存采样；失败保留最后成功样本并标 stale/error，不填零。日用量与逐轮小时账本分开，模型目录不在该观察输出内。resident_execution_gate 根据当前 Session binding 批量读取 Scheduler quota_states，投影 open/closed/unknown 及保护原因和已确认豁免；人工 intake 和工作状态独立，查询失败不视为放行。原生状态视图消费同一保护事实和 send_hint，缺字段的工作事件不清空保护；正式批量读取刷新，不以 Conversation cursor 充当额度版本。"
    example: "Codex/Claude/native request 观察 → provider_turn_usage/account_monitor → account_resources 按汇率快照换算展示 → resident_usage_projection/Home 重读。"

