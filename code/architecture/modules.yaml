    example: "requestStatus(independentStatusEndpoint) → 控制面快照；requestStatus(endpoint) → 应用可达性；组件比较响应后继续等待或恢复页面。"

  - id: "exploration-frontier"
    title: "探索前沿的共享入口、来源核验与投递回执"
    modules:
      - "interface.workbenches"
      - "lineage.automation"
      - "lineage.conversation"
      - "resources"
      - "web.community"
    designs: []
    related_designs:
      - "decision_82deabe891a5"
      - "decision_71ba0494b93e"
      - "decision_9d15ae2053c4"
    description: "浏览器以 Lineage 共享单元保存探索种子的局部身份、来源与介入要求，使用 expected_value 比较保存；来源正文和执行状态仍由原资源与消息服务拥有。ResolveResource 失败时隐藏入口及关系，Project 只聚合可读团队；稍后关注属个人页面偏好，不改变业务。投递前复核来源权限和版本，先 CAS 冻结 dispatch，再以同一消息 ID 和幂等键提交 DeliverMessage；GetInputState 的已有回复不代表目标完成。"
    example: "独立 /frontier、HATG 前沿视图或项目研究地图 → mountFrontier 按当前 Lineage/Project 加载同一共享入口 → ResolveResource/ReadResource 鉴权并内联查看来源 → D3 图与卡片共用对象 → UpdateSharedState CAS 保存并冻结投递 → DeliverMessage → GetInputState。个人布局和聚焦由 PortalPageState 保存，销毁及切换阻止旧请求更新新视图；投递回执丢失重用原请求，不根据摘要启动第二份工作。"

  - id: "lineage-template-view"
