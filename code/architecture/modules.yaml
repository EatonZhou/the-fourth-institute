    example: "管理员调用 UpdateExecutionSettings 开启权限 → Lineage 经受认证的 permission.rebuild RPC 要求 ResourceService 按当前模板和现有对象重建 → 成功后保存开关 → 各进程重新读取模式并使用 PAR 实例判定。"
