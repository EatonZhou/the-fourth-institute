    description: "测试工作台组合资源 chip、Chat、命令注册、上下文、演示播放器和导览组件。测试页面通过它们的浏览器 API 传递正式测试/Run 引用和局部交互状态；测试执行真值仍在框架。这里描述组合 API 和数据引用，不建立从 engineering 服务到 CSS/DOM 的网络连接。"
    example: "WALL/test 页面选测试或 Run → Workbench context/command registry 注册操作 → chips/Chat/演示/导览组件呈现并路由动作 → 测试框架接口返回真实 Run。"

