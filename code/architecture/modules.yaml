  - id: "knowledge-project-move"
    title: "知识条目项目迁移与在线索引确认"
    modules:
      - "kernel.isa"
      - "resources.types"
      - "resources.access"
      - "resources.permissions"
      - "storage"
    designs: []
    related_designs:
      - "decision_3ece26686464"
      - "decision_4648f7fa3295"
      - "decision_ad3e21094f14"
    description: "目标 Project 的 knowledge.move 动作由 Knowledge/Skill owner 维护主文件、伴随目录、版本与登记；ResourceService 用真实 actor 检查源条目及源/目标项目权限，并协调修改串行边界和在线索引。平面或目录型 Markdown Knowledge、单文件或目录型 Skill 采用相同的目录归属规则；全批预检版本、路径及独立子资源后才准备，同一文件系统内伴随文件硬链接暂存。编辑、删除与迁移共用稳定资源 ID 锁。逐项事务切换目录登记、权限事实及操作回执，登记仍是位置唯一权威，日志不充当第二索引；批量不承诺整体原子。已提交结果由各 adapter 读取新位置摘要，同一索引事务批量持久化，代次保护防止旧扫描覆盖新位置，随后处理旧路径。"
    example: "RunResourceAction(目标Project, knowledge.move, items及expected_version, operation_id) → 全批预检 → 保持源登记可读并准备目标文件 → 逐项提交登记/权限/回执 → 从新权威路径批量投影在线索引 → 校验身份并清理旧位置。只有全部完成才返回 completed；partial 保留 committed/pending/projected，恢复沿同一 operation_id 和原参数，必要时换指令调用键继续，已提交条目不重复增版。未提交源变更时只撤回能证明归属的准备文件，未知路径保留报告，超时不推定未提交。"

  - id: "family-chat-preferences"
    title: "Family 个人对话偏好与受理时路由快照"
    modules:
      - "kernel.isa"
      - "lineage.family"
      - "lineage.conversation"
      - "interface.conversation"
    designs: []
    related_designs:
      - "decision_9ad68dd077d4"
    description: "Society 按调用者和 Family 门面保存 Mute/Solo；查看者的当前偏好过滤对话、进度与问题，发送者在输入受理时冻结的偏好约束 Router 候选及最终转交。Mute 同时隐藏直属成员关联的门面往来、排除后续自动选择和延续，Solo 可显式选择已 Mute 成员；问题答案仍交原承接者，非 Solo 的合法引用可直接选择成员。两项不改变权限、成员接单状态、在途工作或 Mailbox 通知。旧 Mute/Exclude 合并读取为 Mute，修改后清空旧 Exclude；私有旧字段保留已受理输入的不可变快照，不作为独立公开控制。"
    example: "用户在门面开启某成员 Mute → UpdateFamilyChatPreferences 保存个人偏好 → 服务端分页与浏览器增量按当前查看者隐藏其往来 → 下一条输入受理时冻结路由约束 → Router 候选与 RelayFamilyMessage 最终检查均排除自动选中该成员。进入该成员 Solo 可继续显式对话，退出后恢复 Mute；解除 Mute 恢复历史可见，不重派旧输入，原问题回答和 Mailbox 提醒照常。"

