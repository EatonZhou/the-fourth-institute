      - "decision_e30897dd3dc3"
      - "decision_865ac8ebef25"
    description: "Home 装配独立业务目录：Notice Board 公开摘要、Daily News 和 active Resident 观察。页面组件消费各目录返回的正式 ID/内容与运行投影；发布摘要是内容副本，active 读模型来自 Lineage/Execution 观察。"
    example: "Home 可见时装配目录 → Web 公告/运行投影接口 → active_agent_projection 合并现有状态或读取公开摘要 → 返回 Home 卡片及稳定链接。"

  - id: "resident-discovery"
    title: "Resident 发现与上下文检索"
    modules:
      - "interface.home"
      - "interface.workbenches"
      - "web.workflows"
      - "lineage.conversation"
      - "kernel.isa"
      - "interface.shell"
