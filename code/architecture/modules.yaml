    example: "lineage_workbench → http_agent_workbench → Resident session/workspace 读取 → 界面更新绑定导航。"

  - id: "test-catalog-binding"
    title: "测试目录资源与 WALL 绑定"
    modules:
      - "engineering.validation"
      - "resources.types"
      - "web"
      - "web.workflows"
      - "resources.access"
      - "interface.workbenches"
    designs: []
    related_designs:
      - "decision_8273271b67b1"
      - "decision_f2a6a5dd4646"
      - "decision_8dc6b3d03ca7"
    description: "测试框架 CatalogRepository 拥有测试定义；ResourceService 的 test provider 将 case.public 投影为正式资源。Test 功能通过 resource.index_adapters 提供 TestCatalogAdapter，索引刷新调用 CatalogRepository.projection 生成摘要并保留逐项错误。Web 测试接口读取目录/执行接口，WALL 保存条目与测试绑定。绑定的测试 ID 不复制测试定义。"
    example: "资源索引刷新 → TestCatalogAdapter.scan → catalog_repository().projection → Test 摘要与资源级错误；test provider → CatalogRepository.get → canonical Test resource；test_framework.web 查询/执行框架 API；wall.test_binding/point_test_binding 关联项目条目。"

  - id: "test-workbench-composition"
    title: "测试工作台与通用浏览器组件组合"
    modules:
      - "engineering.validation"
      - "interface.workbenches"
      - "interface.shell"
      - "interface.conversation"
      - "interface.content"
      - "interface"
    designs: []
    related_designs:
      - "decision_f2a6a5dd4646"
    description: "测试工作台组合资源 chip、Chat、命令注册、上下文、演示播放器和导览组件。测试页面通过它们的浏览器 API 传递正式测试/Run 引用和局部交互状态；测试执行真值仍在框架。这里描述组合 API 和数据引用，不建立从 engineering 服务到 CSS/DOM 的网络连接。"
    example: "WALL/test 页面选测试或 Run → Workbench context/command registry 注册操作 → chips/Chat/演示/导览组件呈现并路由动作 → 测试框架接口返回真实 Run。"

