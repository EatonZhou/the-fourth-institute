    related_designs:
      - "decision_8fe87d812a4c"
      - "decision_152d5c046a23"
    description: "浏览器/业务入口提交正式 Resident 搜索；Lineage 上下文目录保存摘要证据、嵌入和版本，SearchResidents 以当前主体过滤结果。嵌入器加载固定本地模型，是目录检索组件，和运行账号模型目录无关。"
    example: "portal_resident_discovery_service/SearchResidents → Lineage context.store → evidence 有界摘要 + embedder → 结果 ID/摘要/关联范围 → Home/工作台选择。"

  - id: "site-configuration-read"
    title: "站点配置读取与公开名称投影"
    modules:
      - "delivery.services"
      - "web"
      - "web.identity"
      - "interface"
      - "interface.shell"
    designs: []
    related_designs:
      - "decision_15aab18c0ab3"
    description: "部署拥有站点配置；调用方每次读取当前文件，缺省名称为 TFI Portal。环境变量只读取规范名称，显式空值不回退；格式标记仅接受精确的规范名称与版本，不读取旧环境别名或历史格式映射。deployment.compatibility.domain_values 仅保留显式本站部署参数，不启用旧名称兼容。Web 仅投影 site_name、公开 paths 和固定为空的 format_namespaces、browser_identifiers，私有部署值不进入页面；邮件和认证展示使用同源名称，认证身份不随显示名变化。"
    example: "PORTAL_SITE_CONFIG 或安装目录 config/site.json → management_common.site_config → 页面 bootstrap、邮件正文与认证展示。"

  - id: "component-status-read"
    title: "Component 恢复状态读取"
    modules:
      - "delivery.services"
      - "web"
      - "interface"
    designs: []
    related_designs:
      - "decision_99bb5dc0f96b"
    description: "component_recovery 读取独立服务状态端点和当前应用端点；服务换代状态由 Lifecycle/控制面拥有，浏览器只据返回状态提供恢复操作与等待提示。"
    example: "requestStatus(independentStatusEndpoint) → 控制面快照；requestStatus(endpoint) → 应用可达性；组件比较响应后继续等待或恢复页面。"

