    description: "lineage_primitive_definitions.json 为浏览器组件库提供静态展示元数据，HTML/CSS 负责图控件呈现；执行计划及可执行指令由 Lineage 的运行定义验证。Lineage 在本契约中是图编译入口，不宣称编辑器直连其每个内部组件。"
    example: "静态 primitive 定义 → 浏览器原语库/配置表单 → 提交组件配置 → Lineage 编译与指令目录验证。"

  - id: "resident-workspace-view"
    title: "Resident 工作区视图"
    modules:
