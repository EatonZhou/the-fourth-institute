  - id: "resident-runtime-settings"
    title: "Resident 能力配置、会话装配与账号切换"
    modules:
      - "interface.conversation"
      - "interface.shell"
      - "interface.home"
      - "lineage.conversation"
      - "execution.scheduling"
      - "execution.providers"
      - "lineage.definition"
      - "execution.agent-data"
      - "worker.harness"
    designs:
      - "decision_ccbb1cac24aa"
    related_designs:
      - "decision_3dd52c0692c1"
      - "decision_8b2fa224616b"
    description: "Resident execution_settings/harness_config 是 Lineage 配置真值；执行准备通过 Provider 声明和账号 runtime_catalog 验证 model/effort/tier/options，再解析已绑定会话路由。四个原生入口（Family chat、Family menu/settings、Resident menu/settings、Resident composer）以选中成员 resident_id 绑定 interface.conversation 的 ResidentRuntimeController；控制器统一 settings/catalog、权限、差量保存、过期目标与缓存失效。interface.shell 的 PortalResidentService 独占 ISA/HTTP 及既有重启幂等、pending receipt、取消与观察；视图仅适配挂载、焦点和刷新，不另造运行状态机。能力选择沿用统一设置；执行前固定本轮装配快照，Provider 已确认、已发送与未知分开记录。保存配置不启动模型推理；账号切换通过既有 Session 控制，保留上下文准备失败时保留旧绑定，不静默降级。汇报策略 reporting 由 Society 单独保存，通过同一 Get/UpdateResidentSettings 读取与条件更新；普通输入使用目标 Resident 自身汇报配置；可信转交请求通过既有持久 ledger 与输入绑定沿原请求选择有效策略，协作成员自身配置不否决该请求，也不因此取得其他 Resident 配置读写权。Society 将有效策略物化为标准输入提示，Execution 不解释汇报业务；Web、Report、Media、Authoring 与 CLI 不把汇报配置当作业务准入，资源权限、身份、摘要和版本校验保持独立。"
    example: "四视图 → ResidentRuntimeController → PortalResidentService → Get/UpdateResidentSettings 或 RestartSession/CancelSessionRestart → split_runtime_settings → resident_storage/state_store 提交 → codex_runtime_settings/native_options 对照账号目录 → BackendInvocation；已有 binding 继续解释实际运行账号。"

  - id: "execution-account-observation"
    title: "执行账号额度与用量观察"
    modules:
      - "execution.providers"
      - "execution.scheduling"
      - "lineage.conversation"
      - "interface.home"
      - "interface.conversation"
      - "interface.shell"
      - "web"
      - "web.projections"
    designs: []
    related_designs:
      - "decision_d40f59f5508f"
      - "decision_c47a13e8b962"
      - "decision_4dea0db1f45a"
      - "decision_f1331d57be89"
      - "decision_fc26f883773d"
      - "decision_3dd52c0692c1"
    description: "Provider Adapter 产生原生调用用量及额度/余额观察；Execution 按账号、稳定调用标识、观察时间聚合，Lineage 投影 Resident 用量，Home 显示账号资源。原生 turn 用量、上下文用量、订阅窗口额度与货币余额保持不同字段和来源。适配器以非空 quota_group 声明共享额度池，Home 只在同组窗口之间显示明确零读数形成的约束，保留原始百分比；限制来源全部过期时显示待确认，不按名称、窗口时长或同账号猜测依赖。分组不修改 Scheduler 保护或恢复规则。 BillingObservations 按 account 锁与缓存采样；失败保留最后成功样本并标 stale/error，不填零。日用量与逐轮小时账本分开，模型目录不在该观察输出内。resident_execution_gate 根据当前 Session binding 批量读取 Scheduler quota_states，投影 open/closed/unknown 及保护原因和已确认豁免；人工 intake 和工作状态独立，查询失败不视为放行。原生状态视图消费同一保护事实和 send_hint，缺字段的工作事件不清空保护；正式批量读取刷新，不以 Conversation cursor 充当额度版本。"
    example: "Codex/Claude/native request 观察 → provider_turn_usage/account_monitor → account_resources 按汇率快照换算展示 → resident_usage_projection/Home 重读。人类明确确认目标账号后，Society 经既有 Execution 控制端口提交本次候选 Execution 的 credits_scope；会话成功提升后改为实际 Provider Session 引用，Scheduler 在派发和运行保护中核验账号、范围及新鲜 credits 观察。Fork 初始化也由 Society 持有本次确认：RetryResidentInitialization 核对人类身份、当前初始化 ID、目标账号与幂等键，只授权当前创建或首轮前压缩步骤的唯一 Execution；完成后先同步实际 Session 授权，再恢复原队列。已提交结果只补授权同步，换用新候选须重新确认，确认不进入普通输入偏好。取消或失败只收尾候选授权，其他 Session 和 Family 角色不继承本次确认。"

