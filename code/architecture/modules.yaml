# Portal 的运行单元、组件与协议；规范：decision_13e1a748cf04。
# model_version=2：Design 由系统、一个模块或协议唯一拥有；系统只拥有总览 Design，related_designs 只表示协议依据。
schema: "tfi.portal-architecture.v1"
model_version: 2
repository: "repo_711b6ab6d5c8"
system:
  id: "portal"
  title: "TFI Portal"
  responsibility: "以统一资源与可恢复团队执行为基础，让用户和 Resident 协作管理知识、工作台与模型执行。"
  designs:
    - "decision_463fd3e76150"
  boundary: "同一主机上的多进程领域服务，浏览器客户端和外部模型端点；数据库共享部署但按领域分权。"
external_actors:
  - id: "human"
    title: "用户与管理员"
    interacts_with:
      - "interface"
    description: "导航资源、提出请求、配置团队和部署。"
  - id: "agent-client"
    title: "Resident 与外部 Agent 客户端"
    interacts_with:
      - "web"
      - "resources"
      - "lineage"
    description: "使用自身认证身份调用 HATG ISA，不从 cwd 推断授权。"
  - id: "model-vendor"
    title: "模型供应商"
    module: "model-services"
    description: "为本地 Provider 客户端或登记 API 提供推理。"
  - id: "shared-nas"
    title: "共享知识与备份设施"
    interacts_with:
      - "storage"
      - "delivery.backup"
    description: "提供共享目录和外部备份执行设施。"
view:
  initial_level: "runtime"
  layers:
    - "frontend"
    - "entry"
    - "service"
    - "storage"
    - "external"
  expand: "选择运行单元后显示 parent 指向它的组件；协议独立检索，流程只用场景解释。"
scenarios:
  - id: "explain-module"
    title: "从投影反馈到 Family 回复"
    mode: "simulated"
    protocols:
      - "projection-family"
      - "hatg-isa"
      - "resident-execution"
      - "provider-capabilities"
    steps:
      - "浏览器重读当前模块资源，宿主携带五字段对象提交反馈。"
      - "Web 将反馈交给 Lineage 中的 Family 门面；门面按团队分工路由。"
      - "Lineage 提交 Resident 执行，Worker 经 Adapter 调用 Provider。"
      - "回复归入同一对话；门面呈现回复，较旧 focus_revision 的响应不覆盖新焦点。"
    evidence:
      - "decision_7a5ae487e2e9"
      - "decision_425e428410e0"
      - "decision_6ad0384e020d"
  - id: "audit-release"
    title: "发布后自动架构核对"
    mode: "simulated"
    protocols:
      - "deployment-control"
      - "release-events"
      - "lineage-events-effects"
      - "resource-access"
    steps:
      - "发布控制面保存带 commit 和 publication_id 的发布完成事实。"
      - "Lineage 事件源沿游标消费并按显式 run_as 主体激活 Effect。"
      - "RunScript 从该 commit 读取地图与索引，读取当前 Design 并保存版本证据。"
      - "核对完成事件带报告状态，偏离交给架构成员；检查失败明确标 audit_failed。"
    evidence:
      - "decision_13e1a748cf04"
      - "decision_4adcc1ff2f2c"
id_migrations:
  - previous: "kernel"
    replacements:
      - "web"
      - "postgres"
      - "notifications"
    reason: "旧节点混合公共库和契约，拆到实际宿主与运行单元；协议另列。"
  - previous: "kernel.data"
    replacements:
      - "postgres"
      - "notifications"
      - "storage"
    reason: "数据契约分别挂在数据库、通知和文件协议；这些替代不是运行轨迹。"
  - previous: "instruction-dispatch"
    replacements:
      - "hatg-isa"
    kind: "protocol"
  - previous: "provider-turn"
    replacements:
      - "provider-capabilities"
      - "provider-native"
    kind: "protocol"
  - previous: "release-activation"
    replacements:
      - "deployment-control"
    kind: "protocol"
  - previous: "architecture-audit"
    replacements:
      - "release-events"
    kind: "protocol"
