semantics:
  directions: >-
    directions[].id 是本文件内稳定的局部身份，表示一个产品构想；标题调整不改变身份，
    构想被另一个构想替代时分配新 ID。方向为 proposed，concept、future_experience、
    why_feasible、first_step 分别说明构想、未来体验、可行基础和第一步。
    description 只供画廊短说明，不代替四项叙事。方向独立于 Plan 存在。
  retirement: >-
    retired_directions 是旧方向的退役记录，不进入当前画廊、默认选择和方向计数。
    旧书签或 focus 命中退役 ID 时显示其已退役及原因，不按标题猜测或自动改指向。
    replaced_by 仅登记明确承接同一构想的新方向；空数组表示没有语义继承者。
    六个旧方向均因 v8 调整内容范围而退役，不把旧方向换名复用。
  plans: >-
    顶层 plans 保留 IMPROVE.md 中的正式 Plan 资料索引，正文与生命周期以 source.ref 为准；
    source.version 是本次读取的资源版本。status=proposed 表示候选方案，
    不表达其各阶段尚未实现、已经批准执行或通过验证。方向的 plans 是关联 Plan ID 数组，
    允许为空；plan_contributions 说明每份 Plan 对构想的实际贡献。关联只在方向一侧保存，
    不从未挂接 Plan、同模块或历史分类自动生成方向，也不把所有旧 Plan 强配到新方向。
  modules: >-
    方向与 Plan 的 modules 均引用 module_map.ref 指向的当前地图中的真实模块 ID。
    方向直接声明将拓展的架构部分，即使 plans 为空也能联动；module_roles 解释拓展位置。
    module_map.model_version 表示地图的建模版本；本次为运行单元与内部组件模型，schema 仍为 v1。
    当前地图的来源、schema 与建模版本一致且模块 ID 仍存在时，可以联动；
    文本或协议说明的变化不改变模块身份，不按 Git 提交或文件摘要冻结地图。
    来源或建模版本改变、模块 ID 删除时，保留方向叙事并由演化成员更新绑定及引用；
    不读取历史地图，不按旧名称猜新 ID。
    module_mapping=needs_review 表示原入口已失效、当前映射仅为拟议承接位置。
  visuals: >-
    visual.kind=storyboard 表示可供前端制作的分镜，文件本身就是分镜入口，尚无独立演示应用。
    visual.status 与每帧 status 均为 simulated；角色、活动、产物与手势反馈均为示意。
    storyboard[].scene/user_action/animation/caption 分别描述画面、操作、响应和字幕，
    duration_ms 是建议播放时长，module_focus 只引用该方向的 modules。
    前端可用本地 SVG、Canvas 或组件实现分镜；播放、拖拽和点按仅改变模拟场景，
    不触发真实团队、消息、资源写入或发布。当前架构模块仍按 current 呈现，构想按 proposed 呈现。
  depends_on: >-
    只登记实施前必须完成的另一份 Plan；方向相同、links.related 或可复用机制
    本身不构成前置依赖。首版未找到明确的跨 Plan 硬前置，均保留空数组。
    空数组不表示业务前提、授权或验证已经满足。新增边时在 dependency_reasons
    中以被依赖 Plan ID 为键写明原因及依据。
  suggested_after: >-
    [{id, reason}] 是依据 Plan 边界提出的可选实施顺序；可以并行或独立交付，
    不参与硬依赖阻塞与解锁计算。原因中的范围条件必须保留。
  cost: >-
    cost 是供页面直接显示的代价说明，cost_level 为 low、medium、high 或 unknown；
    按方案的跨模块范围、并发/恢复语义和验证负担作定性估计。
    这些估计未经实施测量，不代表工时、预算或优先级；失效入口尚未重定时用 unknown。

directions:
  - id: agent-society-city
    title: 一座会工作的 Agent 城市
    status: proposed
    description: Resident 成为会走动的角色，团队成为街区，协作像城市里的接力一样自然可见。
    concept: >-
      把 Agent Society 变成可漫游的动态卡通城市。一个团队占据一间工作室，Resident 有自己的角色造型；
      讨论、写作和交付通过聚拢、工作台亮起与作品递送表现。城市布局跟随团队关系生长，
      让人在一幅有生活感的画面里认识共同工作的 AI。
    future_experience: >-
      打开 Portal，看到研究街区正在讨论一个问题，开发工作室把新作品送到体验台。
      拉近一个角色，听它用一句话介绍正在做的事；点击作品就进入对应工作台。
      拉远以后仍能看见团队之间的接力，像观察一座由自己参与建设的小城。
    why_feasible: >-
      Portal 已有 Resident、Family、Lineage 和各自的工作状态，能够为角色、街区和活动提供身份与位置。
      投影协议已有绑定、门面对话和对象联动，新的城市画面可以接在这些能力上。
      第一版的主要新增是视觉语言和状态到动作的映射，可先在一个团队的小场景中试出有趣的表达。
    first_step: >-
      制作一个包含三个示例角色与两间工作室的本地动画样场，用“讨论—制作—交付”走完一次接力。
      让用户选角色造型、缩放街区并点开作品占位；确定表现方式后，再把一个真实 Family 的活动接入同一画面。
    modules: [lineage.definition, lineage.family, lineage.conversation, lineage.automation, web.projections, interface.workbenches, interface.conversation]
    module_roles:
      lineage.definition: 为角色提供 Resident 身份、成员定义与 Lineage 归属。
      lineage.family: 为街区提供 Family 结构、门面路由与协作关系。
      lineage.conversation: 为角色的一句话近况和对话入口提供内容。
      lineage.automation: 为团队协作的接力动作提供事件与运行事实。
      web.projections: 提供城市投影的团队绑定、资源调用代理和焦点反馈宿主。
      interface.workbenches: 承载城市画面、缩放和作品入口。
      interface.conversation: 在点选角色后打开对应对话。
    plans: []
    plan_contributions: {}
    visual:
      kind: storyboard
      status: simulated
      title: 三个角色把一个想法变成作品
      composition: 等距卡通街区；左侧是研究屋，中间是开发工作室，右侧是体验台，三位角色有不同造型。
      interaction: 缩放街区、点选角色、沿作品的递送路径回放；只使用样例角色与本地动画。
      storyboard:
        - id: city-morning
          status: simulated
          title: 小城醒来
          duration_ms: 3500
          scene: 两间工作室的灯依次亮起，研究员、开发者、体验员走到自己的桌边；画面保留可漫游的空地。
          user_action: 滚轮拉近研究屋。
          animation: 镜头平滑靠近，屋顶淡出，出现正在交换想法的角色和一张发光便签。
          caption: 每个团队都有一个可以走进去的地方。
          module_focus: [lineage.definition, lineage.family, interface.workbenches]
        - id: city-handoff
          status: simulated
          title: 想法穿过街道
          duration_ms: 4500
          scene: 研究员把便签折成纸飞机，飞向开发工作室；开发者接过后铺开一张小画布。
          user_action: 点选纸飞机。
          animation: 路径暂时高亮，角色气泡用一句话说明这次交接的内容。
          caption: 看见同伴之间正在发生的协作。
          module_focus: [lineage.automation, lineage.conversation]
        - id: city-creation
          status: simulated
          title: 作品开始成形
          duration_ms: 4000
          scene: 开发工作室里逐步拼出一个微型页面，体验员走近工作台。
          user_action: 点选开发者角色。
          animation: 角色转身介绍正在制作的内容，右侧出现模拟对话气泡，城市仍保持活动。
          caption: 既能远远观察，也能走近问一句。
          module_focus: [interface.conversation, lineage.conversation]
        - id: city-opening
          status: simulated
          title: 去作品里看看
          duration_ms: 4000
          scene: 新页面作为小展品出现在体验台，周围角色聚过来。
          user_action: 点击展品。
          animation: 从展品放大到示例工作台，再收回城市全景；全程使用本地占位内容。
          caption: 团队的工作变成可以直接走进去的成果。
          module_focus: [web.projections, interface.workbenches]

  - id: team-command-table
    title: 像带领游戏小队一样指挥团队
    status: proposed
    description: 在一张动态指挥桌上编队、布置目标，让不同专长的小队协作完成一场任务。
    concept: >-
      为人与 AI 团队建立游戏式的指挥语言。用户面对的是目标区域、角色和可组合的小队，
      可以圈选成员、把任务放到地图上、调整探索与制作的分工。操作表达意图，
      Family 门面与 Lineage 把意图组织成实际协作。
    future_experience: >-
      为一个新产品寻找机会时，用户把研究小队放进“了解用户”的区域，把原型小队放进“试做”的区域。
      两支队伍带回不同成果，用户在桌面上把有趣的想法拖给另一个小队继续发展。
      改变方向就像重新布阵，同时可以和选中的队长交谈。
    why_feasible: >-
      Family 已提供面向一个门面的团队协作，Lineage 用成员、事件和连线表达工作关系，
      HATG 提供对应操作入口。投影可以把这些对象组织成空间化的操作界面。
      团队与工作身份已有基础，新的部分集中在把圈选、拖放和口头意图转换成合适的协作表达。
    first_step: >-
      用两个固定样例小队制作桌面原型，只做圈选、投放一个目标、把一个成果交给另一队三种动作。
      观察用户能否自然表达“你们探索、你们试做、把这个继续下去”，再选择一种动作接入真实门面。
    modules: [lineage.definition, lineage.family, lineage.automation, lineage.conversation, web.projections, interface.workbenches, interface.conversation]
    module_roles:
      lineage.definition: 保存小队的成员定义、可复用组合与组织配置。
      lineage.family: 维护小队的 Family 门面，把目标与转向意图路由给协作成员。
      lineage.automation: 把目标与交接对应到团队的事件和协作流程。
      lineage.conversation: 承接用户向小队表达的意图与后续交流。
      web.projections: 将指挥桌的对象焦点与反馈接入绑定团队，并代理宿主调用。
      interface.workbenches: 承载目标区域、编队手势和成果移动。
      interface.conversation: 提供与当前队长连续交谈的入口。
    plans: []
    plan_contributions: {}
    visual:
      kind: storyboard
      status: simulated
      title: 两支小队共同设计一个小产品
      composition: 俯视的桌面沙盘；左侧为探索区、右侧为制作区，中间是共享成果区；角色使用棋子式造型。
      interaction: 框选棋子、拖放目标旗、把成果拖给另一队；动作只改变本地模拟。
      storyboard:
        - id: table-assemble
          status: simulated
          title: 选择这次的搭档
          duration_ms: 3500
          scene: 五枚示例角色棋子散布在桌上，两个空的小队圆环位于探索区和制作区。
          user_action: 框选三个角色放入探索小队。
          animation: 选中棋子靠拢形成队形，队长图标浮起，其余角色保持原位。
          caption: 用一眼可见的方式组织合作。
          module_focus: [lineage.definition, lineage.family, interface.workbenches]
        - id: table-objective
          status: simulated
          title: 把目标放到桌上
          duration_ms: 4000
          scene: 一面写着“做一个雨天出行助手”的目标旗出现在桌边。
          user_action: 把旗拖到探索区，补充“先看看通勤的人需要什么”。
          animation: 队长展开一张任务纸，棋子沿两条路线出发，右侧出现模拟门面对话。
          caption: 像说话和布阵一样表达目标。
          module_focus: [lineage.family, lineage.conversation, interface.conversation]
        - id: table-relay
          status: simulated
          title: 好想法继续向前
          duration_ms: 4500
          scene: 探索小队带回三张机会卡，其中一张画着拥挤的公交站。
          user_action: 把公交站机会卡拖给制作小队。
          animation: 两队之间出现短暂的接力弧线，制作区升起一个可点击的界面模型。
          caption: 一个团队的发现成为另一个团队的起点。
          module_focus: [lineage.automation, web.projections, interface.workbenches]
        - id: table-redirect
          status: simulated
          title: 让整个团队转向
          duration_ms: 4000
          scene: 两条可能的产品路线并排展开，小队围绕现有原型站定。
          user_action: 指向“无障碍路线”并对队长说“继续发展这个”。
          animation: 棋子重新组成队形，镜头沿新的目标路径展开后续场景。
          caption: 用户决定方向，小队组织具体的工作。
          module_focus: [lineage.definition, lineage.family, lineage.conversation, interface.workbenches]

  - id: goal-grown-studio
    title: 一句话长出一个软件工作室
    status: proposed
    description: 说出想做的软件，Portal 为它生长出团队、协作方式和可以亲自使用的工作台。
    concept: >-
      把软件工程的起点变成一个目标。用户描述希望做成的产品，Portal 组织适合它的成员和协作流程，
      同时生成面向这项工作的投影：研究、实现、体验与日常使用各有入口。
      团队和界面随着产品逐渐长大，形成这个工程自己的软件工作室。
    future_experience: >-
      输入“做一个给实验室安排设备预约的工具”，看到设计、开发和体验角色陆续加入，
      一个预约日历和团队对话同时出现。用户在日历里试一次预约，把感受告诉工作室，
      团队继续改进；以后增加新目标时，工作室会长出相应成员和功能区。
    why_feasible: >-
      Portal 已有以目标组织 Lineage 与 Family 的基础，既有模板和 Function Block 能表达可复用协作。
      投影协议将工作台绑定到团队，已定义多功能区与应用包的承载方式。
      可以先选择一种熟悉的小型软件，把团队实例化和页面生成串成一条完整路径，再逐步扩大产品范围。
    first_step: >-
      以“实验室设备预约工具”为唯一样例，制作目标输入到团队出现、预约界面出现、用户试用并反馈的连续原型。
      选用一套已有的有效团队结构作为起点，先把可替换目标、资源和交付物说清楚，再实现这一类工作室的生成。
    modules: [lineage.definition, lineage.family, lineage.automation, resources.types, storage.artifacts, web.projections, interface.workbenches]
    module_roles:
      lineage.definition: 为目标实例化成员、团队定义和可复用的模板与 Function Block。
      lineage.family: 组织工作室的 Family 与门面，路由产品目标和试用反馈。
      lineage.automation: 组织生成、实现和体验各阶段的工作。
      resources.types: 把工程代码与设计资料接入统一资源类型和生命周期接口。
      storage.artifacts: 按版本保存生成的投影应用包与脚本产物，供宿主读取。
      web.projections: 托管生成工作台的页面与应用绑定，将产品反馈交回工作室团队。
      interface.workbenches: 在浏览器装载生成的产品界面与团队工作台，并发送对象焦点。
    plans: [plan_f9e0b86ba4b9]
    plan_contributions:
      plan_f9e0b86ba4b9: >-
        从有效协作中提炼可参数化流程，可作为工作室团队生成的一个起点。
        该 Plan 不包含产品界面生成，也不代表整条方向已经形成实施计划。
    visual:
      kind: storyboard
      status: simulated
      title: 从设备预约需求长出一个工作室
      composition: 一张留白画布从一句话开始，向左生长团队、向右生长产品界面，底部逐渐出现可使用的作品。
      interaction: 输入样例目标、切换样例范围、在生成的本地预约日历中试用并给出反馈。
      storyboard:
        - id: studio-seed
          status: simulated
          title: 写下想做的事
          duration_ms: 3500
          scene: 画布中央只有一句“给实验室做一个设备预约工具”，旁边有设备和日历的小图形。
          user_action: 选择“先服务一个实验室”的样例范围。
          animation: 句子化成一颗种子，展开日历、设备和使用者三个分支。
          caption: 从一个具体目标开始。
          module_focus: [web.projections, lineage.family]
        - id: studio-team
          status: simulated
          title: 工作室有人了
          duration_ms: 4500
          scene: 三个角色从目标分支中出现，分别围绕设计画板、代码桌和体验台工作。
          user_action: 点开设计角色，看看它准备做出的预约流程。
          animation: 团队连线生长到各个桌面，示例对话与产物缩略图在同一画面出现。
          caption: 团队与工作方式一起形成。
          module_focus: [lineage.definition, lineage.family, lineage.automation]
        - id: studio-product
          status: simulated
          title: 第一件作品能用了
          duration_ms: 5000
          scene: 右侧展开设备预约日历，示例显微镜有几个可选时段；下方显示生成中的工程资料。
          user_action: 在本地日历里选择一个时段并填入示例用途。
          animation: 预约块落入日历，产品画面成为画布的主体，团队缩成侧边仍可见的小工作室。
          caption: 直接进入团队做出的软件。
          module_focus: [interface.workbenches, web.projections, resources.types, storage.artifacts]
        - id: studio-grow
          status: simulated
          title: 使用让工作室继续生长
          duration_ms: 4500
          scene: 用户在日历旁写下“还想知道设备维护的时间”，团队旁边留出新功能的位置。
          user_action: 选择样例反馈“加上维护日程”。
          animation: 一个维护日程分区在日历边展开，团队把新工作接到原有流程上。
          caption: 新需要带来新的能力和协作。
          module_focus: [lineage.family, lineage.automation, web.projections, interface.workbenches]

retired_directions:
  - id: reliable-changes
    title: 让确认准确约束实际变更
    retired_reason: v8 将权限与变更约束归入日常工程工作，退出未来产品方向画廊。
    replaced_by: []
  - id: traceable-execution
    title: 让执行过程可追溯、可控制
    retired_reason: v8 不再把运行记录与可追溯性作为演化方向。
    replaced_by: []
  - id: focused-decisions
    title: 减少重复审阅，形成有依据的反馈
