<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-portal-i18n-text="&quot;Knowledge Board&quot;">Knowledge Board</title>
    <link rel="stylesheet" href="/static/portal_components.css" />
    <link rel="stylesheet" href="/static/portal_collection_board.css" />
    <link rel="stylesheet" href="/static/portal_workbench.css" />

    <link rel="stylesheet" href="/static/resource_tabs.css" />
    <link rel="stylesheet" href="/static/portal_design_system.css" data-portal-skin="default" />
    <link rel="stylesheet" href="/static/portal_themes.css" data-portal-skin-provider="themes" />
    <link rel="stylesheet" href="/static/portal_board_toolbar.css" />
    <script data-portal-script-group="portal-foundation"></script>
    <script src="/static/portal_page_state.js"></script>
    <script src="/static/portal_api.js"></script>
    <script src="/static/portal_instruction_client.js"></script>
    <script src="/static/portal_resident_service.js"></script>

    <script src="/static/portal_overlay.js"></script>
    <script src="/static/portal_events.js"></script>
    <script src="/static/portal_refresh_coordinator.js"></script>
    <script src="/static/portal_conversation_store.js"></script>
    <script src="/static/portal_ui_primitives.js"></script>
    <script src="/static/portal_nav.js"></script>
    <script src="/static/portal_resource_routes.js"></script>
    <script src="/static/resource_tabs.js"></script>
    <script src="/static/resident_protocol.js"></script>
    <script src="/static/resident_projection.js"></script>
    <script src="/static/portal_ui.js"></script>
    <script src="/static/portal_form_controls.js"></script>
    <script src="/static/portal_button_tooltips.js"></script>
    <script src="/static/portal_toolbar.js"></script>
    <script src="/static/portal_board_toolbar.js"></script>
    <script src="/static/portal_detail_surface.js"></script>
    <script src="/static/portal_resource_header.js"></script>
    <script src="/static/portal_semantic_search.js"></script>
    <script src="/static/portal_resource_detail.js"></script>
    <script src="/static/portal_resource_chips.js"></script>
    <script src="/static/portal_file_links.js"></script>
    <script src="/static/portal_preview_contract.js"></script>
    <script src="/static/portal_preview_runtime.js"></script>
    <script src="/static/portal_pdf_preview.js"></script>
    <script src="/static/portal_preview_renderers.js"></script>
    <script src="/static/portal_editor_open_service.js"></script>
    <script src="/static/portal_command_registry.js"></script>
    <script src="/static/portal_workbench_context.js"></script>
    <script data-portal-script-group="portal-workbench"></script>
    <script src="/static/portal_document_statistics.js"></script>
    <script data-portal-script-group="portal-workspace-surface"></script>
    <script src="/static/portal_board_shell.js"></script>
    <script src="/static/portal_image_editor.js"></script>
    <script src="/static/portal_resident_runtime_controller.js"></script>
    <script data-portal-script-group="chat-workspace"></script>
    <script src="/static/portal_command_palette.js"></script>
    <script src="/static/vendor/d3/d3.v7.9.0.min.js"></script>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body[data-resource-detail-embedded] {
        background: transparent;
      }

      body[data-resource-detail-embedded] > header,
      body[data-resource-detail-embedded] > main,
      body[data-resource-detail-embedded] > #archiveModal {
        display: none !important;
      }

      /* ── Board layout ── */
      .detailExploreButton { text-decoration: none; }
      .portalButton.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      .srOnly {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .knowledgeModeActions {
        display: inline-flex;
        align-items: center;
        height: 30px;
        gap: 1px;
        margin-left: 0;
        padding: 2px;
        border: 0;
        border-radius: 6px;
        background: var(--panel-2);
      }

      .knowledgeViewTab {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        gap: 5px;
        padding: 0 8px;
        min-height: 26px;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 650;
        box-shadow: none;
      }

      .knowledgeViewTab:hover { color: var(--text); }

      .knowledgeViewTab.active {
        background: var(--panel);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      .knowledgeViewTab svg {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Grid ── */
      .grid {
        position: relative;
        display: block;
        width: 100%;
      }

      .grid[hidden] {
        display: none;
      }

      .virtualCanvas {
        position: relative;
        width: 100%;
        min-height: 1px;
      }

      .virtualWindow {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
        align-items: start;
        will-change: transform;
      }

      .project {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .projectHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }

      .projectHeader h2 { margin: 0; font-size: 14px; }

      .projectHeader[draggable="true"] {
        cursor: grab;
      }

      .projectHeader[draggable="true"]:active {
        cursor: grabbing;
      }

      .project.dragOverBefore { box-shadow: inset 0 3px 0 var(--accent), var(--shadow); }
      .project.dragOverAfter { box-shadow: inset 0 -3px 0 var(--accent), var(--shadow); }
      .project.collapsed .projectHeader { border-bottom: 0; }

      .projectHeaderActions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .count { font-size: 12px; color: var(--muted); }
      #meta { display: flex; flex-wrap: wrap; gap: 0.75em; }

      .projectExpandBtn {
        appearance: none;
        width: 24px;
        height: 24px;
        padding: 4px;
        min-height: 30px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .projectExpandBtn:hover { background: var(--panel); color: var(--accent); }
      .projectExpandBtn svg, .archivePaneToggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

      .items {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
        padding: 12px;
      }

      @media (max-width: 1200px) { .items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 900px)  { .items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px)  { .items { grid-template-columns: 1fr; } }

      .card[hidden] { display: none; }

      .card {
        position: relative;
        min-width: 0;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 12px;
        padding: 12px 12px 28px;
        cursor: pointer;
        user-select: none;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(17, 24, 39, 0.02);
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }

      .typeChip {
        position: absolute;
        bottom: 9px;
        right: 9px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 2px 7px;
        border-radius: 999px;
        color: #fff;
        pointer-events: none;
        white-space: nowrap;
      }
      .typeChip[data-type="decision"]    { background: rgba(100, 130, 195, 0.42); }
      .typeChip[data-type="question"]    { background: rgba(190, 130,  85, 0.42); }
      .typeChip[data-type="thinking"]    { background: rgba(150, 120, 200, 0.42); }
      .typeChip[data-type="insight"]     { background: rgba( 70, 160, 130, 0.42); }
      .typeChip[data-type="information"] { background: rgba(120, 125, 135, 0.42); }
      .typeChip[data-type="idea"]        { background: rgba(175, 148,  60, 0.42); }
      .typeChip[data-type="concept"]     { background: rgba( 55, 148, 170, 0.42); }
      .typeChip[data-type="plan"]        { background: rgba( 92, 150, 115, 0.42); }
      .typeChip[data-type="task"]        { background: rgba(190,  85, 100, 0.42); }
      .typeChip[data-type="experiment"]  { background: rgba(120, 120, 200, 0.42); }
      .typeChip[data-type="hypothesis"]  { background: rgba(195,  95, 150, 0.42); }
      .typeChip[data-type="risk"]        { background: rgba(195,  95,  95, 0.42); }
      .typeChip[data-type="patent"]      { background: rgba(165, 120,  75, 0.42); }
      .typeChip[data-type="skill"]       { background: rgba( 60, 145, 135, 0.42); }
      .typeChip:not([data-type])         { background: rgba(110, 118, 130, 0.42); }

      .card:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
      }

      .cardTitle {
        min-width: 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
        font-size: 14px;
        margin: 0 0 6px;
        line-height: 1.25;
        font-weight: 600;
      }

      .cardMeta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
        min-width: 0;
        align-items: center;
      }

      .cardMeta > div {
        min-width: 0;
      }

      .cardMeta > div:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cardMeta > div:last-child {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }

      .cardResourceId {
        display: block;
        min-width: 0;
        margin: -2px 0 7px;
        color: var(--accent);
        font-size: 10px;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .badge {
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--muted);
        background: var(--chip);
      }

      .preview {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
      }

      .empty {
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 16px;
        color: var(--muted);
        text-align: center;
        background: var(--panel);
      }

      .knowledgeDetailHeading {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .modalTitle {
        font-size: 14px;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #mResourceIdentity {
        --portal-resource-identity-title-size: 14px;
        --portal-resource-identity-title-weight: 700;
      }

      .modalSub {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .knowledgeDetailActions { display: flex; align-items: center; gap: 8px; }

      .detailModalBody {
        display: grid;
        grid-template-columns: minmax(190px, 250px) minmax(0, 1fr) minmax(340px, 420px);
        gap: 12px;
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
        padding: 12px 14px;
      }

      .detailContentPane,
      .knowledgeRightRail,
      .knowledgeChatPane,
      .knowledgeFilePane {
        min-height: 0;
        overflow: auto;
      }

      .knowledgeFilePane {
        padding: 9px 7px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in srgb, var(--panel-2) 72%, transparent);
        font-size: 11px;
        overscroll-behavior: contain;
        display: grid;
        grid-template-rows: minmax(0, 1fr) minmax(170px, 1fr);
        gap: 8px;
        overflow: hidden;
      }

      body[data-resource-detail-hide-graph] .knowledgeFilePane {
        grid-template-rows: minmax(0, 1fr);
      }

      body[data-resource-detail-hide-graph] .knowledgeGraphSection {
        display: none !important;
      }

      .knowledgeFileSection,
      .knowledgeGraphSection {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .knowledgeFileSection { overflow: auto; }
      .knowledgeFileSection > #mFiles { width: max-content; min-width: 100%; }

      .knowledgeFilePaneTitle {
        margin: 2px 5px 7px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .knowledgeFileRoot,
      .knowledgeFileFolder,
      .knowledgeFileLeaf {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 5px;
        width: max-content;
        min-width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--text);
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        text-align: left;
      }

      .knowledgeFileRoot { padding: 5px; color: var(--accent-2); font-weight: 800; }
      .knowledgeFileFolder { padding: 4px 5px; cursor: pointer; font-weight: 700; }
      .knowledgeFileLeaf { padding: 4px 5px; cursor: pointer; }
      .knowledgeFileFolder:hover,
      .knowledgeFileLeaf:hover,
      .knowledgeFileLeaf.active { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
      .knowledgeFileToggle { display: inline-block; width: 9px; color: var(--muted); transition: transform 120ms ease; }
      .knowledgeFileToggle.collapsed { transform: rotate(-90deg); }
      .knowledgeFileChildren { display: grid; gap: 1px; padding-left: 14px; }
      .knowledgeFileName { white-space: nowrap; }
      .knowledgeFileKind { margin-left: auto; color: var(--muted); font-size: 9px; }
      .knowledgeLinkedFiles {
        display: grid;
        gap: 1px;
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      }
      .knowledgeLinkedFileLeaf { padding-left: 5px; }

      .knowledgeGraphSection {
        border-top: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
        padding-top: 8px;
      }

      .knowledgeGraphHeading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 0 5px 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .knowledgeGraphMeta {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        white-space: nowrap;
      }

      .knowledgeRelationGraph {
        min-height: 0;
        flex: 1;
        overflow: auto;
        border-radius: 7px;
        background: color-mix(in srgb, var(--panel) 58%, transparent);
        cursor: grab;
      }

      .knowledgeRelationGraph.panning { cursor: grabbing; }

      .knowledgeRelationGraph svg {
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 0;
        height: auto;
        aspect-ratio: 1;
        touch-action: none;
      }

      .knowledgeRelationGraphEmpty {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 14px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
        text-align: center;
      }

      .detailGraphEdge {
        stroke: var(--graph-edge, var(--border-strong));
        stroke-width: 1.65;
        opacity: 0.82;
        vector-effect: non-scaling-stroke;
      }

      .detailGraphNode {
        fill: color-mix(in srgb, var(--graph-node, var(--accent)) 38%, var(--panel));
        stroke: var(--graph-node, var(--accent));
        stroke-width: 1.7;
        cursor: pointer;
        transition: r 120ms ease, stroke-width 120ms ease, filter 120ms ease;
      }

      .detailGraphNode:hover,
      .detailGraphNode:focus {
        stroke-width: 3.2;
        filter: brightness(1.15);
        outline: none;
      }

      .detailGraphRoot {
        fill: color-mix(in srgb, var(--accent) 64%, var(--panel));
        stroke: var(--accent-2);
        stroke-width: 2.5;
      }

      .detailContentPane {
        padding-right: 4px;
      }

      .knowledgeChatPane {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }

      .knowledgeRightRail {
        display: grid;
        grid-template-rows: minmax(330px, 1fr);
        overflow: hidden;
      }

      .detailEditor {
        width: 100%;
        min-height: min(62vh, 720px);
        resize: vertical;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        color: var(--text);
        padding: 12px;
        outline: none;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      .detailEditor:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .detailDocument {
        display: grid;
        gap: 12px;
      }

      .detailMetadataCard {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
      }

      .detailMetadataSummary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        list-style: none;
        color: var(--text);
        font-size: 11.5px;
        font-weight: 650;
      }

      .detailMetadataSummary::-webkit-details-marker { display: none; }

      .detailMetadataSummaryMeta {
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 500;
      }

      .detailMetadataSummary::after {
        content: "⌄";
        color: var(--muted);
        transform: rotate(-90deg);
        transition: transform 120ms ease;
      }

      .detailMetadataCard[open] .detailMetadataSummary::after { transform: rotate(0deg); }

      .detailMetadataBody {
        display: grid;
        gap: 10px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
      }

      .detailMetadataGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
      }

      .detailMetadataItem {
        min-width: 0;
        border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
        border-radius: 8px;
        background: var(--panel-2);
        padding: 7px 8px;
      }

      .detailMetadataKey {
        color: var(--muted);
        font-size: 10.5px;
        margin-bottom: 2px;
      }

      .detailMetadataValue {
        color: var(--text);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .detailMetadataValue[data-copy-kb-id] {
        cursor: copy;
      }

      .detailMetadataValue[data-copy-kb-id].copied {
        color: var(--accent);
      }

      .detailMetadataLinks {
        display: grid;
        gap: 5px;
      }

      .detailVersion {
        border-top: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
        padding-top: 9px;
        display: grid;
        gap: 8px;
      }

      .detailVersionHeader,
      .detailVersionIdentity {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .detailVersionTitle {
        color: var(--text);
        font-size: 11.5px;
        font-weight: 650;
      }

      .detailVersionBadge,
      .detailVersionIdentity span {
        border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 10px;
        line-height: 18px;
        padding: 0 7px;
      }

      .detailVersionEvents {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 7px;
      }

      .detailVersionEvent {
        border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
        border-radius: 8px;
        background: var(--panel-2);
        padding: 8px;
        display: grid;
        gap: 5px;
      }

      .detailVersionEventHead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .detailVersionEventHead strong {
        color: var(--text);
        font-size: 11px;
      }

      .detailVersionEventHead time,
      .detailVersionUnknown {
        color: var(--muted);
        font-size: 10.5px;
      }

      .detailMetadataLinkRow {
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }

      .detailEditorLayout {
        display: grid;
        gap: 12px;
      }

      .detailMetaEditor {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
        display: grid;
        gap: 10px;
      }

      .detailMetaForm {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 9px;
      }

      .detailMetaField {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .detailMetaField label,
      .detailMetaLinks label,
      .detailMetaOther label {

    <script>
      // ── markdown renderer (shared) ────────────────────────────────────────
      const renderMarkdown = (src, options = {}) => window.MD.render(src, options) || "<p></p>";
      const renderInlineMarkdown = (text) => window.MD.renderInline(text);
      const escapeHtml = (value) => window.PortalUIPrimitives.escapeHtml(value);
      const portalIcon = (name, options = {}) => window.PortalUIPrimitives.iconHtml(name, options);
      const knowledgeStateHtml = (message, options = {}) => window.PortalUIPrimitives.asyncStateHtml({
        state: options.state || "empty",
        title: options.title || "",
        message,
        density: options.density || "compact",
        icon: options.icon,
      });
      const verticalDisclosureIcon = (expanded) => portalIcon(expanded ? "chevron-up" : "chevron-down");
      const horizontalDisclosureIcon = (expanded) => portalIcon(expanded ? "chevron-left" : "chevron-right");
      const MESSAGE_ATTACHMENT_REF_RE = /\[(image|file):\s*([^\]]+)\]/g;

      // ── Filter state ──────────────────────────────────────────────────────
      const filter = {
        type: null,       // null = all types (string when set)
        projects: null,   // null = all (Set when set)
        date: "all",      // "all" | "2d" | "7d" | "30d"
        importance: 0,    // min importance (0 = no filter)
        status: "",       // "" = all | "__none__" | "open" | "done" | "dismiss" | "obsolete"
      };

      const state = {
        raw: null,
        // A confirmed deletion must survive older paginated/index responses.
        deletedKnowledgeIds: new Set(),
        query: "",
        selected: null,
        indexPaging: {
          pageSize: 200,
          requestSeq: 0,
          nextOffset: 0,
          total: 0,
          hasMore: false,
          prefetching: false,
          error: "",
        },
        exactQuery: { seq: 0, id: "", status: "", error: "" },
        projectDisplayDefault: "three",
        projectDisplays: {},
        projectOrder: [],
        projectResizeObservers: [],
        virtualProjects: {
          groups: [],
          heights: new Map(),
          defaultHeight: 245,
          raf: 0,
          bound: false,
          renderStart: -1,
          renderEnd: -1,
          renderTopOffset: -1,
          renderTotalHeight: -1,
          canvasEl: null,
          windowEl: null,
        },
        semanticSearch: null,
        activeSemanticSearchId: "",
        detailFileId: "",
        detailSelectedFileId: "",
        detailSelectedFileKind: "markdown",
        detailSelectedFileLinked: false,
        detailReadOnly: false,
        detailLinkedFiles: new Map(),
        detailLinkedFileProbes: new Set(),
        detailLinkDiscoverySequence: 0,
        detailExpandedFolders: new Set([""]),
        detailPath: "",
        detailRawUrl: "",
        detailDownloadUrl: "",
        detailMediaType: "",
        detailLanguage: "",
        detailText: "",
        detailDraft: "",
        detailBodyDraft: "",
        detailMetaDraft: null,
        detailEditing: false,
        detailSaving: false,
        detailDeleting: false,
        detailGraph: {
          fileId: "",
          payload: null,
          loading: false,
          positions: {},
          basePositions: null,
        },
        detailChat: {
          fileId: "",
          loading: false,
          attachments: [],
        },
        knowledgeMap: {
          open: false,
          project: "",
          type: "",
          relation: "",
          query: "",
          selectedId: "",
          connectedOnly: true,
          neighborsOnly: false,
          graph: null,
          loading: false,
          error: "",
          requestSeq: 0,
          signature: "",
          simulation: null,
          zoom: null,
          currentData: null,
          positions: new Map(),
          renderTimer: null,
          fittedSignature: "",
        },
        knowledgeRadar: { signature: "" },
        archive: {
          open: false,
          jobs: [],
          currentId: "",
          current: null,
          creating: false,
          attachments: [],
          policy: "strict",
          candidateSaveTimer: null,
          candidateDirty: false,
          candidateSaving: false,
          inputCollapsed: false,
          serviceError: "",
          localStatus: "",
        },
      };
      let portalUsername = "anonymous";
      let detailDocumentSession = null;
      let detailResourceGuest = null;
      let detailPreviewRoot = null;
      const knowledgePageState = window.PortalPageState.create("knowledge", {
        getUser: () => portalUsername || "anonymous",
        delay: 160,
      });

      function readKnowledgeUiState() {
        return knowledgePageState.read();
      }

      function writeKnowledgeUiState(patch) {
        knowledgePageState.write(patch || {});
      }

      function writeKnowledgeUiStateSoon(patch) {
        knowledgePageState.debounceWrite(patch || {});
      }

      function filterSnapshot() {
        return {
          status: filter.status || "",
          type: filter.type || null,
          projects: filter.projects ? knowledgePageState.setToArray(filter.projects) : null,
          date: filter.date || "all",
          importance: Number(filter.importance || 0),
        };
      }

      function compactKnowledgeFilterValues(values) {
        const items = [...values].map(String).filter(Boolean);
        if (items.length <= 2) return items.join("、");
        return `${items.slice(0, 2).join("、")} 等 ${items.length} 项`;
      }

      function knowledgeFilterSummaryItems() {
        const items = [];
        const dateLabels = {
          "2d": window.PortalI18n.t("最近两天"),
          "7d": window.PortalI18n.t("最近一周"),
          "30d": window.PortalI18n.t("最近一月"),
        };
        if (filter.date !== "all") items.push({ label: window.PortalI18n.t("日期"), value: dateLabels[filter.date] || filter.date });
        if (filter.status) {
          items.push({ label: window.PortalI18n.t("状态"), value: filter.status === "__none__" ? "无状态" : filter.status });
        }
        if (filter.projects instanceof Set) {
          items.push({ label: window.PortalI18n.t("Project"), value: compactKnowledgeFilterValues(filter.projects) });
        }
        if (filter.type) items.push({ label: window.PortalI18n.t("类型"), value: filter.type });
        if (filter.importance > 0) items.push({ label: "Importance", value: `≥ ${filter.importance}` });
        return items;
      }

      function syncKnowledgeFilterInputs() {
        const statusInput = document.querySelector(`input[name="fp_status"][value="${CSS.escape(filter.status || "")}"]`);
        const dateInput = document.querySelector(`input[name="fp_date"][value="${CSS.escape(filter.date || "all")}"]`);
        const importanceInput = document.querySelector(`input[name="fp_imp"][value="${CSS.escape(String(filter.importance || 0))}"]`);
        if (statusInput) statusInput.checked = true;
        if (dateInput) dateInput.checked = true;
        if (importanceInput) importanceInput.checked = true;
      }

      function clearKnowledgeFilters() {
        filter.status = "";
        filter.type = null;
        filter.projects = null;
        filter.date = "all";
        filter.importance = 0;
        saveKnowledgeUiState();
        buildFilterOptions();
        syncKnowledgeFilterInputs();
        updateKnowledgeMatrixUrl("", "");
        renderAll();
        knowledgeBoardShell.syncFilterState();
      }

      function applyKnowledgeUiState() {
        const saved = readKnowledgeUiState();
        if (typeof saved.query === "string") state.query = saved.query;
        if (saved.view === "map") state.knowledgeMap.open = true;
        if (typeof saved.activeSemanticSearchId === "string") state.activeSemanticSearchId = saved.activeSemanticSearchId;
        if (["collapsed", "three", "expanded"].includes(saved.projectDisplay)) state.projectDisplayDefault = saved.projectDisplay;
        if (saved.projectDisplays && typeof saved.projectDisplays === "object" && !Array.isArray(saved.projectDisplays)) {
          state.projectDisplays = Object.fromEntries(

      // ── Date helpers ──────────────────────────────────────────────────────
      function cutoffDate(range) {
        if (range === "all") return null;
        const now = Date.now();
        const days = range === "2d" ? 2 : range === "7d" ? 7 : 30;
        return new Date(now - days * 86400 * 1000);
      }

      // ── Filter application ────────────────────────────────────────────────
      function matchesFilter(item) {
        if (filter.status) {
          const itemStatus = String(item.status || "").trim();
          if (filter.status === "__none__") {
            if (itemStatus) return false;
          } else if (itemStatus !== filter.status) return false;
        }
        // Type
        if (filter.type && item.type !== filter.type) return false;
        // Project
        if (filter.projects !== null && !filter.projects.has(item.project)) return false;
        // Date (based on file mtime, not created_at)
        if (filter.date !== "all") {
          const cutoff = cutoffDate(filter.date);
          const d = item.mtime ? new Date(item.mtime * 1000) : null;
          if (!d || d < cutoff) return false;
        }
        // Importance
        if (filter.importance > 0 && (item.importance ?? 0) < filter.importance) return false;
        return true;
      }

      function matchesQuery(item, q) {
        if (!q) return true;
        const hay = `${item.title || ""}\n${item.preview || ""}\n${item.kb_id || ""}`.toLowerCase();
        return hay.includes(q.toLowerCase());
      }

      function looksLikeKnowledgeId(value) {
        return /^[a-z][a-z0-9-]*_[0-9a-f]+$/i.test(String(value || "").trim());
      }

      async function resolveExactKnowledgeQuery(value) {
        const query = String(value || "").trim();
        const seq = state.exactQuery.seq + 1;
        state.exactQuery = { seq, id: query, status: "", error: "" };
        if (!looksLikeKnowledgeId(query)) return;
        if ((state.raw?.items || []).some(item => String(item.kb_id || "").toLowerCase() === query.toLowerCase())) return;
        state.exactQuery.status = "loading";
        renderAll();
        try {
          const result = await knowledgeApi.requestResult(
            `/knowledge/api/item?kb_id=${encodeURIComponent(query)}`,
            { cache: "no-store", detectLoginRedirect: false },
          );
          if (seq !== state.exactQuery.seq) return;
          if (!result.response.ok) {
            throw new Error(result.response.status === 404 ? "未找到这个 Resource ID" : `查询失败（HTTP ${result.response.status}）`);
          }
          const item = knowledgeApi.requireJson(result);
          if (!item?.kb_id) throw new Error("服务返回了无效的知识条目");
          if (state.deletedKnowledgeIds.has(item.kb_id)) return;
          const existing = (state.raw?.items || []).filter(entry => entry.kb_id !== item.kb_id);
          state.raw = { ...(state.raw || {}), items: [item, ...existing] };
          state.indexPaging.total = Math.max(state.indexPaging.total, state.raw.items.length);
          state.exactQuery = { seq, id: query, status: "resolved", error: "" };
          renderAll();
        } catch (error) {
          if (seq !== state.exactQuery.seq) return;
          state.exactQuery = { seq, id: query, status: "error", error: error.message || String(error) };
          renderAll();
        }
      }

      // ── Render ────────────────────────────────────────────────────────────
      function groupByProject(items) {
        const map = new Map();
        for (const it of items) {
          const pid = it.project || "unknown";
          if (!map.has(pid)) map.set(pid, []);
          map.get(pid).push(it);
        }
        // sort items within each project by mtime desc
        for (const list of map.values()) {
          list.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
        }
        // Keep a user's explicit order first. New projects still fall back to recency.
        const entries = [...map.entries()];
        const order = new Map(state.projectOrder.map((projectId, index) => [projectId, index]));
        entries.sort((a, b) => {
          const orderA = order.get(a[0]);
          const orderB = order.get(b[0]);
          if (orderA !== undefined || orderB !== undefined) {
            if (orderA === undefined) return 1;
            if (orderB === undefined) return -1;
            if (orderA !== orderB) return orderA - orderB;
          }
          const maxA = a[1].reduce((m, i) => Math.max(m, i.mtime || 0), 0);
          const maxB = b[1].reduce((m, i) => Math.max(m, i.mtime || 0), 0);
          return maxB - maxA;
        });
        return entries;
      }

      function moveProjectBefore(projectId, targetId, after) {
        if (!projectId || !targetId || projectId === targetId) return;
        const knownProjects = new Set((state.raw?.items || []).map(item => item.project || "unknown"));
        const existing = state.projectOrder.filter(project => knownProjects.has(project));
        for (const [project] of groupByProject(state.raw?.items || [])) {
          if (!existing.includes(project)) existing.push(project);
        }
        const from = existing.indexOf(projectId);
        const target = existing.indexOf(targetId);
        if (from < 0 || target < 0) return;
        existing.splice(from, 1);
        const nextTarget = existing.indexOf(targetId);
        existing.splice(nextTarget + (after ? 1 : 0), 0, projectId);
        state.projectOrder = existing;
        state.virtualProjects.heights.clear();
        saveKnowledgeUiState();
        renderAll();
      }

        header.appendChild(h2);
        header.appendChild(actions);
        section.appendChild(header);

        const itemsEl = document.createElement("div");
        itemsEl.className = "items";
        const columns = getProjectColumnCount();
        const visibleCount = Math.max(1, columns) * 3;
        const renderedItems = display === "expanded"
          ? list
          : display === "three"
            ? list.slice(0, visibleCount)
            : [];

        for (const it of renderedItems) {
          itemsEl.appendChild(createKnowledgeCard(it));
        }

        header.addEventListener("dragstart", (event) => {
          if (event.target.closest("button")) {
            event.preventDefault();
            return;
          }
          projectDragId = projectId;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", projectId);
        });
        header.addEventListener("dragend", () => {
          projectDragId = "";
          clearProjectDragMarkers();
        });
        section.addEventListener("dragover", (event) => {
          const sourceId = projectDragId || event.dataTransfer.getData("text/plain");
          if (!sourceId || sourceId === projectId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          const after = event.clientY > section.getBoundingClientRect().top + section.getBoundingClientRect().height / 2;
          clearProjectDragMarkers();
          section.classList.add(after ? "dragOverAfter" : "dragOverBefore");
        });
        section.addEventListener("dragleave", (event) => {
          if (!section.contains(event.relatedTarget)) section.classList.remove("dragOverBefore", "dragOverAfter");
        });
        section.addEventListener("drop", (event) => {
          const sourceId = projectDragId || event.dataTransfer.getData("text/plain");
          if (!sourceId || sourceId === projectId) return;
          event.preventDefault();
          const after = event.clientY > section.getBoundingClientRect().top + section.getBoundingClientRect().height / 2;
          projectDragId = "";
          clearProjectDragMarkers();
          moveProjectBefore(sourceId, projectId, after);
        });

        if (renderedItems.length) section.appendChild(itemsEl);
        return section;
      }

      function ensureVirtualProjectListeners() {
        if (state.virtualProjects.bound) return;
        state.virtualProjects.bound = true;
        window.addEventListener("scroll", () => scheduleVirtualProjectRender(), { passive: true });
        window.addEventListener("resize", () => {
          state.virtualProjects.heights.clear();
          scheduleVirtualProjectRender({ force: true });
        }, { passive: true });
      }

      function scheduleVirtualProjectRender(options = {}) {
        if (!state.virtualProjects.groups.length) return;
        if (state.virtualProjects.raf) return;
        state.virtualProjects.raf = window.requestAnimationFrame(() => {
          state.virtualProjects.raf = 0;
          renderVirtualProjects(options);
        });
      }

      function getProjectVirtualExtent(index, gap) {
        const groups = state.virtualProjects.groups;
        const total = groups.length;
        const projectHeight = projectVirtualHeight(groups[index][0]);
        return projectHeight + (index < total - 1 ? gap : 0);
      }

      function getVirtualProjectWindow() {
        const groups = state.virtualProjects.groups;
        const total = groups.length;
        const gridRect = el.grid.getBoundingClientRect();
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
        const scrollTop = Math.max(0, -gridRect.top);
        const startBoundary = Math.max(0, scrollTop - viewportHeight * 1.2);
        const endBoundary = scrollTop + viewportHeight * 2.2;
        const gap = getVirtualProjectGap();

        let start = 0;
        let topOffset = 0;
        let offset = 0;
        while (start < total) {
          const extent = getProjectVirtualExtent(start, gap);
          if (offset + extent >= startBoundary) break;
          offset += extent;
          start += 1;
        }
        topOffset = offset;

        let end = start;
        while (end < total && offset < endBoundary) {
          offset += getProjectVirtualExtent(end, gap);
          end += 1;
        }

        let totalHeight = 0;
        for (let i = 0; i < total; i += 1) {
          totalHeight += getProjectVirtualExtent(i, gap);
        }

        return { start, end, topOffset, totalHeight };
      }

      function measureRenderedProjects() {
        let changed = false;
        for (const section of el.grid.querySelectorAll(".project[data-project-id]")) {
          const projectId = section.dataset.projectId;
          const height = Math.ceil(section.getBoundingClientRect().height);
          const previous = state.virtualProjects.heights.get(projectId);
          if (Number.isFinite(height) && height > 0 && Math.abs((previous || 0) - height) > 8) {
            state.virtualProjects.heights.set(projectId, height);
            changed = true;
          }
        }
        if (changed) scheduleVirtualProjectRender();
      }

      function renderVirtualProjects(options = {}) {
        const groups = state.virtualProjects.groups;
        if (!groups.length) {
          el.grid.innerHTML = "";
          state.virtualProjects.renderStart = -1;
          state.virtualProjects.renderEnd = -1;
          state.virtualProjects.renderTopOffset = -1;
          state.virtualProjects.renderTotalHeight = -1;
          state.virtualProjects.canvasEl = null;
          state.virtualProjects.windowEl = null;
          return;
        }

        const { canvas, windowEl } = ensureVirtualCanvas();
        const { start, end, topOffset, totalHeight } = getVirtualProjectWindow();
        canvas.style.height = `${Math.max(1, Math.round(totalHeight))}px`;
        windowEl.style.transform = `translateY(${Math.round(topOffset)}px)`;

        if (!options.force
          && start === state.virtualProjects.renderStart
          && end === state.virtualProjects.renderEnd
          && Math.abs(topOffset - state.virtualProjects.renderTopOffset) <= 1
          && Math.abs(totalHeight - state.virtualProjects.renderTotalHeight) <= 1) {
          return;
        }

        state.virtualProjects.renderStart = start;
        state.virtualProjects.renderEnd = end;
        state.virtualProjects.renderTopOffset = topOffset;
        state.virtualProjects.renderTotalHeight = totalHeight;

        const fragment = document.createDocumentFragment();
        for (let i = start; i < end; i += 1) {
          const [projectId, list] = groups[i];
          fragment.appendChild(renderProjectSection(projectId, list));
        }
        windowEl.replaceChildren(fragment);

        window.requestAnimationFrame(measureRenderedProjects);
      }

      function renderProjects(items) {
        for (const ro of state.projectResizeObservers) ro.disconnect();
        state.projectResizeObservers = [];

        state.virtualProjects.groups = groupByProject(items);
        state.virtualProjects.renderStart = -1;
        state.virtualProjects.renderEnd = -1;
        state.virtualProjects.renderTopOffset = -1;
        state.virtualProjects.renderTotalHeight = -1;
        ensureVirtualProjectListeners();
        renderVirtualProjects({ force: true });
      }

      function renderAll() {
        if (!state.raw) return;
        const items = (state.raw.items || [])
          .filter((x) => matchesFilter(x))
          .filter((x) => matchesQuery(x, state.query));

        const loadedTotal = state.raw.items?.length || 0;
        const total = state.indexPaging.total || loadedTotal;
        const typeLabel = filter.type || window.PortalI18n.t("全部类型");
        const semantic = state.raw.semantic_search || null;
        const summary = semantic
          ? window.PortalI18n.text`语义检索：${semantic.query || ""} · ${items.length} 项`
          : window.PortalI18n.text`${typeLabel} · ${items.length} / ${total} 项`;
        el.meta.replaceChildren(
          Object.assign(document.createElement("span"), { textContent: summary }),
          Object.assign(document.createElement("span"), {
            textContent: state.indexPaging.error
              ? window.PortalI18n.text`已加载 ${loadedTotal}/${total} · 索引加载失败`
              : window.PortalI18n.text`已加载 ${loadedTotal}/${total}`,
            title: state.indexPaging.error || "",
          }),
        );
        if (!items.length) {
          if (state.exactQuery.status === "loading" && state.exactQuery.id === state.query) {
            el.empty.textContent = window.PortalI18n.text`正在按 Resource ID 查询 ${state.query}…`;
          } else if (state.exactQuery.status === "error" && state.exactQuery.id === state.query) {
            el.empty.textContent = window.PortalI18n.text`${state.exactQuery.error}。请检查 ID 或访问权限后重试。`;
          } else if (state.indexPaging.error) {
            el.empty.textContent = window.PortalI18n.text`索引加载失败：${state.indexPaging.error}。请点击刷新后重试。`;
          } else if (state.query) {
            el.empty.textContent = window.PortalI18n.t("没有本地匹配。自然语言问题可使用搜索框旁的“语义检索”。");
          } else {
            el.empty.textContent = window.PortalI18n.t("没有匹配的条目");
          }
        }
        el.empty.style.display = items.length ? "none" : "block";
        renderProjects(items);
        if (state.knowledgeMap.open) {
          buildKnowledgeMapControls();
          renderKnowledgeMap();
        }
        renderKnowledgeRadar();
        syncKnowledgeView();
        syncKnowledgeMatrixSelection();
      }

      // ── Load ──────────────────────────────────────────────────────────────
      function indexRequestParams(offset, { refresh = false, waitSeconds = 0 } = {}) {
        const params = new URLSearchParams({ active_only: "0" });
        if (activeSemanticSearchHasResults()) params.set("semantic", state.activeSemanticSearchId);
        params.set("offset", String(Math.max(0, Number(offset || 0))));
        params.set("limit", String(state.indexPaging.pageSize || 200));
        if (refresh && !activeSemanticSearchHasResults()) params.set("refresh", "1");
        if (waitSeconds > 0 && !activeSemanticSearchHasResults()) params.set("wait", String(waitSeconds));
        return params;
      }

      async function waitForRefreshedIndex(initialGeneratedAt, requestSeq) {
        const refresh = state.raw?.refresh || {};
        if (!refresh.running || activeSemanticSearchHasResults()) return;
        try {
          const params = indexRequestParams(0, { waitSeconds: 5 });
          const result = await knowledgeApi.requestResult(`/knowledge/api/index?${params}`, {
            cache: "no-store",
            detectLoginRedirect: false,
          });
          if (!result.response.ok || requestSeq !== state.indexPaging.requestSeq) return;
          const page = knowledgeApi.requireJson(result);
          if (String(page.generated_at || "") !== String(initialGeneratedAt || "")) {
            const refreshedSeq = beginIndexLoad();
            applyLoadedIndex(page, refreshedSeq, {
              preserveScroll: true,
              scrollY: window.scrollY,
            });
          }
        } catch (_) {
          // The initial cards remain usable if the optional wait request fails.
        }
      }

      function applyIndexPage(page, { reset = false } = {}) {
        const pageInfo = page?.page || {};
        const pageItems = (Array.isArray(page?.items) ? page.items : [])
          .filter(item => !state.deletedKnowledgeIds.has(item.kb_id));
        if (reset || !state.raw) {
          state.raw = page || {};
          state.raw.items = pageItems;
        } else {
          const seen = new Set((state.raw.items || []).map(item => item.kb_id));
          const merged = [...(state.raw.items || [])];
          for (const item of pageItems) {
            if (!seen.has(item.kb_id)) {
              merged.push(item);
              seen.add(item.kb_id);
            }
          }
          state.raw = { ...state.raw, ...page, items: merged };
        }
        state.indexPaging.nextOffset = Number(pageInfo.next_offset ?? (state.raw.items || []).length);
        state.indexPaging.total = Number(pageInfo.total ?? (state.raw.items || []).length);
        state.indexPaging.hasMore = !!pageInfo.has_more;
      }

      function updateIndexMeta() {
        if (!state.raw) return;
        const loaded = state.raw.items?.length || 0;
        const total = state.indexPaging.total || loaded;
        if (state.indexPaging.hasMore || state.indexPaging.prefetching) {
          el.meta.textContent = window.PortalI18n.text`已加载 ${loaded} / ${total} 项${state.indexPaging.prefetching ? window.PortalI18n.t("，继续加载中…") : ""}`;
        }
      }

      async function prefetchIndexPages(seq) {
        if (state.indexPaging.prefetching || !state.indexPaging.hasMore) return;
        state.indexPaging.prefetching = true;
        updateIndexMeta();
        try {
          while (seq === state.indexPaging.requestSeq && state.indexPaging.hasMore) {
            const params = indexRequestParams(state.indexPaging.nextOffset);
            const result = await knowledgeApi.requestResult(`/knowledge/api/index?${params}`, {
              cache: "no-store",
              detectLoginRedirect: false,
            });
            if (!result.response.ok) throw new Error(`HTTP ${result.response.status}`);
            const page = knowledgeApi.requireJson(result);
            if (seq !== state.indexPaging.requestSeq) return;
            applyIndexPage(page);
            buildFilterOptions();
            renderAll();
            await new Promise(resolve => setTimeout(resolve, 80));
          }
        } catch (err) {
          if (seq === state.indexPaging.requestSeq) {
            state.indexPaging.error = err.message || String(err);
            renderAll();
          }
          console.warn("knowledge index prefetch failed", err);
        } finally {
          if (seq === state.indexPaging.requestSeq) {
            state.indexPaging.prefetching = false;
            renderAll();
          }
        }
      }

      function beginIndexLoad() {
        const seq = state.indexPaging.requestSeq + 1;
        state.indexPaging.requestSeq = seq;
        state.indexPaging.nextOffset = 0;
        state.indexPaging.total = 0;
        state.indexPaging.hasMore = false;
        state.indexPaging.prefetching = false;
        state.indexPaging.error = "";
        el.meta.textContent = window.PortalI18n.t("加载中…");
        return seq;
      }

      function applyLoadedIndex(firstPage, seq, { preserveScroll = false, scrollY = 0 } = {}) {
        if (seq !== state.indexPaging.requestSeq) return;
        applyIndexPage(firstPage, { reset: true });
        // Default type to first allowed type if unset
        if (filter.type === null) {
          // keep null = show all on first load, or set to first type:
          // filter.type = state.raw.allowed_types?.[0] || null;
        }
        normalizeFilterStateForIndex();
        buildFilterOptions();
        syncKnowledgeFilterInputs();
        knowledgeBoardShell.syncFilterState();
        renderAll();
        prefetchIndexPages(seq);
        if (preserveScroll) {
          window.requestAnimationFrame(() => window.scrollTo({ top: scrollY }));
        }
      }

      async function loadIndex({ refresh = false, preserveScroll = false, waitForRefresh = true } = {}) {
        const scrollY = preserveScroll ? window.scrollY : 0;
        const seq = beginIndexLoad();
        try {
          const result = await knowledgeApi.requestResult(
            `/knowledge/api/index?${indexRequestParams(0, { refresh })}`,
            { cache: "no-store", detectLoginRedirect: false },
          );
          if (seq !== state.indexPaging.requestSeq) return;
          if (!result.response.ok) throw new Error(`HTTP ${result.response.status}`);
          const firstPage = knowledgeApi.requireJson(result);
          applyLoadedIndex(firstPage, seq, { preserveScroll, scrollY });
          if (waitForRefresh) waitForRefreshedIndex(firstPage.generated_at, seq);
        } catch (error) {
          if (seq !== state.indexPaging.requestSeq) return;
          state.indexPaging.error = error.message || String(error);
          if (state.raw) renderAll();
          else el.meta.textContent = window.PortalI18n.text`索引加载失败：${state.indexPaging.error}。请点击刷新后重试。`;
          throw error;
        }
      }

      // ── Modal ─────────────────────────────────────────────────────────────
      const DETAIL_META_FIELDS = ["kb_id", "type", "project", "created_at", "importance", "ai_generated", "status"];
      const DETAIL_LINK_FIELDS = ["source", "related", "supersedes", "derived_from"];
      const DETAIL_STATUS_OPTIONS = ["", "open", "done", "dismiss", "obsolete"];

      function stripYamlQuotes(value) {
        const text = String(value ?? "").trim();
        if (text.length >= 2 && ((text[0] === '"' && text[text.length - 1] === '"') || (text[0] === "'" && text[text.length - 1] === "'"))) {
          return text.slice(1, -1);
        }
        return text;
      }

      function parseYamlListValue(value) {
        const text = stripYamlQuotes(value);
        if (!text || text === "[]") return [];
        if (text.startsWith("[") && text.endsWith("]")) {
          const inner = text.slice(1, -1).trim();
          if (!inner) return [];
          return inner.split(",").map(item => stripYamlQuotes(item)).filter(Boolean);
        }
        return [text].filter(Boolean);
      }

      function parseDetailFrontmatter(raw) {
        const meta = {
          fields: {},
          links: Object.fromEntries(DETAIL_LINK_FIELDS.map(key => [key, []])),
          otherLines: [],
        };
        let activeLink = "";
        for (const line of String(raw || "").split(/\r?\n/)) {
          const top = line.match(/^([A-Za-z_][A-Za-z0-9_-]*):\s*(.*)$/);
          if (top) {
            activeLink = "";
            const key = top[1];
            const value = top[2] || "";
            if (key === "links") continue;
            if (DETAIL_META_FIELDS.includes(key)) meta.fields[key] = stripYamlQuotes(value);
            else meta.otherLines.push(line);
            continue;
          }
          const linkHead = line.match(/^ {2}(source|related|supersedes|derived_from):\s*(.*)$/);
          if (linkHead) {
            activeLink = linkHead[1];
            meta.links[activeLink] = parseYamlListValue(linkHead[2] || "");
            continue;
          }
          const linkItem = line.match(/^ {2,}-\s*(.*)$/);
          if (linkItem && activeLink) {
            const value = stripYamlQuotes(linkItem[1] || "");
            if (value) meta.links[activeLink].push(value);
            continue;
          }
          meta.otherLines.push(line);
        }
        return meta;
      }

      function parseSkillDetailFields(raw) {
        const fields = {};
        let section = "";
        for (const line of String(raw || "").split(/\r?\n/)) {
          const top = line.match(/^([A-Za-z_][A-Za-z0-9_-]*):\s*(.*)$/);
          if (top) {
            const key = top[1];
            const value = stripYamlQuotes(top[2] || "");
            section = value ? "" : key;
            if (["name", "description"].includes(key) && value) fields[key] = value;
            continue;
          }
          const nested = line.match(/^ {2}([A-Za-z_][A-Za-z0-9_-]*):\s*(.*)$/);
          if (section === "metadata" && nested?.[1] === "id") {
            const value = stripYamlQuotes(nested[2] || "");
            if (value) fields.id = value;
          }
        }
        return fields;
      }

      function splitDetailMarkdown(text) {
        const content = String(text || "");
        const match = content.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)([\s\S]*)$/);
        if (!match) {
          return {
            hasFrontmatter: false,
            rawFrontmatter: "",
            meta: parseDetailFrontmatter(""),
            body: content,
          };
        }
        return {
          hasFrontmatter: true,
          rawFrontmatter: match[1] || "",
          meta: parseDetailFrontmatter(match[1] || ""),
          body: match[2] || "",
        };
      }

      function yamlScalar(value, { numeric = false, boolean = false } = {}) {
        const text = String(value ?? "").trim();
        if (numeric) return String(Number.parseInt(text || "0", 10) || 0);
        if (boolean) return text === "true" ? "true" : "false";
        if (!text) return '""';
        if (/^[A-Za-z0-9_./@#:-]+$/.test(text)) return text;
        return JSON.stringify(text);
      }

      function yamlListLines(key, values) {
        const items = Array.isArray(values) ? values.map(v => String(v || "").trim()).filter(Boolean) : [];
        if (!items.length) return [`  ${key}: []`];
        return [`  ${key}:`, ...items.map(item => `    - ${yamlScalar(item)}`)];
      }

      function composeDetailMarkdown(meta, body) {
        const fields = meta?.fields || {};
        const links = meta?.links || {};
        const otherLines = Array.isArray(meta?.otherLines) ? meta.otherLines.filter(line => String(line || "").trim()) : [];
        const lines = ["---"];
        for (const key of ["kb_id", "type", "project", "created_at"]) {
          if (fields[key] !== undefined && fields[key] !== "") lines.push(`${key}: ${yamlScalar(fields[key])}`);
        }
        const importance = Math.min(10, Math.max(1, Number.parseInt(fields.importance || "5", 10) || 5));
        lines.push(`importance: ${importance}`);
        lines.push(`ai_generated: ${yamlScalar(fields.ai_generated === "true" ? "true" : "false", { boolean: true })}`);
        if (fields.status) lines.push(`status: ${yamlScalar(fields.status)}`);
        lines.push("links:");
        for (const key of DETAIL_LINK_FIELDS) lines.push(...yamlListLines(key, links[key] || []));
        if (otherLines.length) {
          lines.push("");
          lines.push(...otherLines);
        }
        lines.push("---");
        return `${lines.join("\n")}\n\n${String(body || "").replace(/^\n+/, "")}`;
      }

      function detailSelectOptions(values, current) {
        const seen = new Set();
        const items = [];
        for (const value of [current, ...(values || [])]) {
          const clean = String(value || "").trim();
          if (!clean || seen.has(clean)) continue;
          seen.add(clean);
          items.push(clean);
        }
        return items.map(value => window.PortalI18n.html`<option value="${escapeHtml(value)}"${value === current ? " selected" : ""}>${escapeHtml(value)}</option>`).join("");
      }

      function detailMetadataHtml(parsed, schema = "knowledge") {
        if (!parsed?.hasFrontmatter) return "";
        const skillFields = schema === "skill" ? parseSkillDetailFields(parsed.rawFrontmatter) : {};
        const fields = parsed.meta?.fields || {};
        const links = parsed.meta?.links || {};
        const fieldEntries = schema === "skill"
          ? [
              ["name", skillFields.name],
              ["description", skillFields.description],
              ["metadata.id", skillFields.id],
            ]
          : [
              ["kb_id", fields.kb_id],
              ["type", fields.type],
              ["project", fields.project],
              ["importance", fields.importance],
              ["ai generated", fields.ai_generated],
              ["status", fields.status],
            ];
        const rows = fieldEntries.filter(([, value]) => String(value || "").trim()).map(([key, value]) => window.PortalI18n.html`
          <div class="detailMetadataItem">
            <div class="detailMetadataKey">${escapeHtml(key)}</div>
            <div class="detailMetadataValue"${key === "kb_id" ? window.PortalI18n.text` data-copy-kb-id="${escapeHtml(value)}" title="双击复制条目 ID"` : ""}>${escapeHtml(value)}</div>
          </div>
        `).join("");
        const linkRows = DETAIL_LINK_FIELDS
          .map(key => [key, (links[key] || []).filter(Boolean)])
          .filter(([, values]) => values.length)
          .map(([key, values]) => window.PortalI18n.html`<div class="detailMetadataLinkRow"><strong>${escapeHtml(key)}</strong>: ${escapeHtml(values.join(", "))}</div>`)
          .join("");
        const versionHtml = schema === "knowledge"
          ? detailVersionHtml(parsed, state.selected || {})
          : "";
        if (!rows && !linkRows && !versionHtml) return "";
        const fieldCount = fieldEntries.filter(([, value]) => String(value || "").trim()).length;
        const relationCount = DETAIL_LINK_FIELDS.reduce((count, key) => count + (links[key] || []).filter(Boolean).length, 0);
        const summary = [fieldCount ? window.PortalI18n.text`${fieldCount} 项` : "", relationCount ? window.PortalI18n.text`${relationCount} 个关系` : "", versionHtml ? window.PortalI18n.t("含版本记录") : ""]
          .filter(Boolean)
          .join(" · ");
        return window.PortalI18n.html`
          <details class="detailMetadataCard">
            <summary class="detailMetadataSummary"><span>资源元数据</span><span class="detailMetadataSummaryMeta">${escapeHtml(summary)}</span></summary>
            <div class="detailMetadataBody">
              ${rows ? window.PortalI18n.html`<div class="detailMetadataGrid">${rows}</div>` : ""}
              ${linkRows ? window.PortalI18n.html`<div class="detailMetadataLinks">${linkRows}</div>` : ""}
              ${versionHtml}
            </div>
          </details>
        `;
      }

      function detailVersionTime(value) {
        const raw = String(value || "").trim();
        if (!raw) return "未记录";
        if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
        const parsed = new Date(raw);
        if (Number.isNaN(parsed.getTime())) return raw;
        return new Intl.DateTimeFormat(window.PortalI18n.locale(), {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(parsed);
      }

      function detailVersionPrincipal(value) {
        const principal = value && typeof value === "object" ? value : {};
        return {
          user: String(principal.user || "").trim(),
          agent: String(principal.agent || "").trim(),
        };
      }

      function detailVersionEventHtml(label, timestamp, principal) {
        const identity = detailVersionPrincipal(principal);
        const identities = [

      async function copyTextToClipboard(text) {
        const value = String(text || "");
        if (!value) return;
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
          return;
        }
        const input = document.createElement("textarea");
        input.value = value;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.left = "-9999px";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      function intrinsicDetailFiles() {
        const item = state.selected || {};
        const files = Array.isArray(item.files) ? item.files : [];
        if (files.length) return files;

          address: item.kb_id,

      function detailFiles() {

      function normalizeDetailRelativePath(value) {
        const parts = [];
        for (const part of String(value || "").replaceAll("\\", "/").split("/")) {
          if (!part || part === ".") continue;
          if (part === "..") {
            if (parts.length) parts.pop();
            continue;
          }
          parts.push(part);
        }
        return parts.join("/");
      }

      function detailFileByPath(path) {
        const targetPath = String(path || "").replaceAll("\\", "/");
        if (!targetPath) return null;
        const files = intrinsicDetailFiles();
        const current = files.find(file =>
          String(file.address || "") === String(state.detailSelectedFileId || "")
        );
        if (!current) return null;
        const currentRelativePath = normalizeDetailRelativePath(
          current?.relative_path || "",
        );
        const currentAbsolutePath = String(state.detailPath || "").replaceAll("\\", "/");
        let contentRoot = "";
        if (
          currentRelativePath
          && currentAbsolutePath.endsWith(`/${currentRelativePath}`)
        ) {
          contentRoot = currentAbsolutePath.slice(0, -(currentRelativePath.length + 1));
        } else if (
          currentRelativePath
          && currentAbsolutePath === currentRelativePath
        ) {
          contentRoot = "";
        } else if (currentAbsolutePath) {
          contentRoot = currentAbsolutePath.slice(0, currentAbsolutePath.lastIndexOf("/"));
        }
        const targetRelativePath = contentRoot && targetPath.startsWith(`${contentRoot}/`)
          ? targetPath.slice(contentRoot.length + 1)
          : "";
        if (!targetRelativePath) return null;
        return files.find(file =>
          normalizeDetailRelativePath(file.relative_path || "") === targetRelativePath
        ) || null;
      }

      function skillInternalFileTarget(rawTarget) {
        if (String((state.selected || {}).type || "") !== "skill") return null;
        const targetText = String(rawTarget || "").trim();
        if (!/^\.\/(?:[^/?#\s`]+\/)*[^/?#\s`]+\.md$/i.test(targetText)) return null;
        const files = intrinsicDetailFiles();
        const current = files.find(file =>
          String(file.address || "") === String(state.detailSelectedFileId || "")
        );
        const currentPath = String(current?.relative_path || "")
          .replaceAll("\\", "/")
          .replace(/^\/+|\/+$/g, "");
        const baseParts = currentPath.split("/").filter(Boolean).slice(0, -1);
        const targetParts = targetText.slice(2).split("/").filter(Boolean);
        const relativePath = [...baseParts, ...targetParts].join("/");
        const target = files.find(file =>
          String(file.relative_path || "")
            .replaceAll("\\", "/")
            .replace(/^\/+|\/+$/g, "") === relativePath
        );
        if (
          !target
          || String(target.address || "") === String(state.detailSelectedFileId || "")
        ) return null;
        return target;
      }

      function detailLinkedFile(descriptor, metadata = {}) {
        const path = String(descriptor?.path || "").trim();
        if (!path) return null;
        const kind = String(metadata.kind || descriptor.kind || window.PortalFileLinks?.kindForPath?.(path) || "text");
        return {
          address: `linked-file:${path}`,
          linked: true,
          path,
          name: String(descriptor.name || window.PortalFileLinks?.fileName?.(path) || "file"),
          relative_path: String(descriptor.name || window.PortalFileLinks?.fileName?.(path) || "file"),
          kind,
          primary: false,
        };

      function detailFilePathResolver(parsed) {
        if (!window.PortalFileLinks) return null;
        const absolutePaths = [...new Set(
          DETAIL_LINK_FIELDS.flatMap(key => parsed?.meta?.links?.[key] || [])
            .map(value => window.PortalFileLinks.describe(value))
            .filter(Boolean)
            .map(descriptor => descriptor.path),
        )];
        if (!absolutePaths.length) return null;
        return descriptor => {
          const rawPath = window.PortalFileLinks.normalizePath(descriptor?.raw || "");
          if (!rawPath || rawPath.startsWith("/") || rawPath.startsWith("~/")) {
            return descriptor?.path || "";
          }
          const relativePath = rawPath.replace(/^\.\/+/, "");
          const suffixMatches = absolutePaths.filter(path =>
            path === relativePath || path.endsWith(`/${relativePath}`)
          );
          if (suffixMatches.length === 1) return suffixMatches[0];
          const name = window.PortalFileLinks.fileName(relativePath);
          const nameMatches = absolutePaths.filter(path =>
            window.PortalFileLinks.fileName(path) === name
          );
          return nameMatches.length === 1 ? nameMatches[0] : descriptor?.path || "";
        };
      }

      async function registerDetailLinkedFiles(descriptors) {
        if (!window.PortalFileLinks || !Array.isArray(descriptors) || !descriptors.length) return;
        const resourceId = state.detailFileId;
        const discoverySequence = state.detailLinkDiscoverySequence;
        const currentPath = String(state.detailPath || "");
        const pendingPaths = state.detailLinkedFileProbes;
        const candidates = [...new Map(descriptors.map(descriptor => [
          String(descriptor?.path || ""),
          descriptor,
        ])).values()].filter(descriptor => {
          const path = String(descriptor?.path || "");
          return path
            && String(descriptor?.kind || "") !== "binary"
            && path !== currentPath
            && !detailFileByPath(path)
            && !state.detailLinkedFiles.has(path)
            && !pendingPaths.has(path);
        });
        if (!candidates.length) return;
        candidates.forEach(descriptor => pendingPaths.add(descriptor.path));
        // Text discovery yields candidates, not filesystem facts (e.g. H.264/H.265).
        // Publish only files confirmed by the actor-bound metadata probe.
        let inspected = [];
        try {
          inspected = await Promise.all(candidates.map(async descriptor => {
            try {
              const metadata = await window.PortalFileLinks.probe(descriptor.path);
              return metadata ? detailLinkedFile(descriptor, metadata) : null;
            } catch {
              return null;
            }
          }));
        } finally {
          candidates.forEach(descriptor => pendingPaths.delete(descriptor.path));
        }
        if (
          resourceId !== state.detailFileId
          || discoverySequence !== state.detailLinkDiscoverySequence
        ) return;
        let changed = false;
        inspected.filter(Boolean).forEach(file => {
          if (detailFileByPath(file.path)) return;
          const current = state.detailLinkedFiles.get(file.path);
          if (
            current
            && current.kind === file.kind
          ) return;
          state.detailLinkedFiles.set(file.path, file);
          changed = true;
        });
        if (changed) renderDetailFileTree();
      }

      async function openDetailLinkedFile(request) {

          return;

        const path = String(request?.path || request?.href || "").trim();
        if (!path) return;
        const intrinsicFile = detailFileByPath(path);
        if (intrinsicFile) {
          await openDetailFile(intrinsicFile);
          return;
        }
        let file = state.detailLinkedFiles.get(path);
        if (!file) {
          file = detailLinkedFile({
            ...request,
            path,
            name: request?.name || window.PortalFileLinks?.fileName?.(path),
          });
          if (!file) return;
          state.detailLinkedFiles.set(path, file);
          renderDetailFileTree();
        }
        await openDetailFile(file);
      }

      function buildDetailFileTree(files) {
        const root = { dirs: new Map(), files: [] };
        for (const file of files) {
          const rawPath = String(file.relative_path || "").replace(/^\/+|\/+$/g, "");
          if (!rawPath) continue;
          const parts = rawPath.split("/").filter(Boolean);
          let node = root;
          let prefix = "";
          for (const part of parts.slice(0, -1)) {
            prefix = prefix ? `${prefix}/${part}` : part;
            if (!node.dirs.has(part)) node.dirs.set(part, { path: prefix, dirs: new Map(), files: [] });
            node = node.dirs.get(part);
          }
          node.files.push({ ...file, path: rawPath });
        }
        return root;
      }
