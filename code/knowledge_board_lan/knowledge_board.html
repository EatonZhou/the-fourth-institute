      const DETAIL_GRAPH_TYPE_COLORS = {
        decision: "#6684c6",
        question: "#bd8558",
        thinking: "#9b79c8",
        insight: "#4ca485",
        information: "#7b858f",
        idea: "#b39742",
        concept: "#3f97ad",
        plan: "#5d9b78",
        task: "#bd7063",
        experiment: "#a56c88",
      };
      const DETAIL_GRAPH_RELATION_COLORS = {
        source: "#8b96a3",
        related: "#45a392",
        supersedes: "#d07a59",
        derived_from: "#7f8fc8",
      };

      function detailGraphNodeColor(type) {
        return DETAIL_GRAPH_TYPE_COLORS[String(type || "").toLowerCase()] || "#78939a";
      }

      function detailGraphRelationColor(relation) {
        return DETAIL_GRAPH_RELATION_COLORS[String(relation || "").toLowerCase()] || "#87939d";
      }

      function resetDetailGraph() {
        state.detailGraph = { fileId: "", payload: null, loading: false, positions: {}, basePositions: null };
        renderDetailGraph();
      }

      function detailGraphRingPositions(root, first, second) {
        const size = 360;
        const center = { x: size / 2, y: size / 2 };
        const positions = new Map();
        if (root) positions.set(String(root.kb_id || ""), center);
        const placeRing = (items, radius) => {
          items.forEach((node, index) => {
            const angle = -Math.PI / 2 + (Math.PI * 2 * index / Math.max(1, items.length));
            positions.set(String(node.kb_id || ""), {
              x: center.x + Math.cos(angle) * radius,
              y: center.y + Math.sin(angle) * radius,
            });
          });
        };
        placeRing(first, 84);
        placeRing(second, 148);
        return { size, positions };
      }

      function detailGraphSegmentsCross(a, b, c, d) {
        const cross = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
        const abC = cross(a, b, c);
        const abD = cross(a, b, d);
        const cdA = cross(c, d, a);
        const cdB = cross(c, d, b);
        const epsilon = 0.001;
        return ((abC > epsilon && abD < -epsilon) || (abC < -epsilon && abD > epsilon))
          && ((cdA > epsilon && cdB < -epsilon) || (cdA < -epsilon && cdB > epsilon));
      }

      function detailGraphCrossingCount(root, first, second, edges) {
        const positions = detailGraphRingPositions(root, first, second).positions;
        const uniqueEdges = new Map();
        for (const edge of edges) {
          const source = String(edge.source || "");
          const target = String(edge.target || "");
          if (source && target && source !== target) uniqueEdges.set(`${source}:${target}`, { source, target });
        }
        const segments = [...uniqueEdges.values()].filter(edge => positions.has(edge.source) && positions.has(edge.target));
        let crossings = 0;
        for (let i = 0; i < segments.length; i += 1) {
          for (let j = i + 1; j < segments.length; j += 1) {
            const a = segments[i];
            const b = segments[j];
            if (a.source === b.source || a.source === b.target || a.target === b.source || a.target === b.target) continue;
            if (detailGraphSegmentsCross(positions.get(a.source), positions.get(a.target), positions.get(b.source), positions.get(b.target))) crossings += 1;
          }
        }
        return crossings;
      }

      function optimizeDetailGraphLayerOrder(root, first, second, edges) {
        let currentFirst = first.slice();
        let currentSecond = second.slice();
        // Each attempted swap scores every edge pair. Two-hop graphs are not
        // necessarily small: cap total work and keep the preceding barycentric
        // ordering when exhaustive refinement would block document rendering.
        const edgePairs = Math.max(1, edges.length * (edges.length - 1) / 2);
        const evaluationLimit = Math.min(512, Math.floor(200000 / edgePairs));
        if (evaluationLimit < 2) return { first: currentFirst, second: currentSecond };
        let currentCost = detailGraphCrossingCount(root, currentFirst, currentSecond, edges);
        let evaluations = 1;
        // Greedy pair swaps converge quickly for the small two-level detail graph.
        for (let pass = 0; pass < 16; pass += 1) {
          let best = null;
          for (const layer of ["first", "second"]) {
            const items = layer === "first" ? currentFirst : currentSecond;
            for (let i = 0; i < items.length; i += 1) {
              for (let j = i + 1; j < items.length; j += 1) {
                if (evaluations >= evaluationLimit) {
                  return best
                    ? { first: best.first, second: best.second }
                    : { first: currentFirst, second: currentSecond };
                }
                const candidateFirst = currentFirst.slice();
                const candidateSecond = currentSecond.slice();
                const candidate = layer === "first" ? candidateFirst : candidateSecond;
                [candidate[i], candidate[j]] = [candidate[j], candidate[i]];
                const cost = detailGraphCrossingCount(root, candidateFirst, candidateSecond, edges);
                evaluations += 1;
                if (cost < currentCost && (!best || cost < best.cost)) {
                  best = { cost, first: candidateFirst, second: candidateSecond };
                }
              }
            }
          }
          if (!best) break;
          currentFirst = best.first;
          currentSecond = best.second;
          currentCost = best.cost;
        }
        return { first: currentFirst, second: currentSecond };
      }

      function detailGraphOrderedLayers(nodes, edges) {
        const byDepth = new Map([[0, []], [1, []], [2, []]]);
        const nodeById = new Map();
        for (const node of nodes) {
          const depth = Math.max(0, Math.min(2, Number(node.depth || 0)));
          const item = { ...node, depth };
          byDepth.get(depth).push(item);
          nodeById.set(String(item.kb_id || ""), item);
        }
        const titleOrder = (a, b) => String(a.title || a.kb_id || "").localeCompare(String(b.title || b.kb_id || ""));
        let first = (byDepth.get(1) || []).slice().sort(titleOrder);
        let second = (byDepth.get(2) || []).slice().sort(titleOrder);
        const parents = new Map(second.map(node => [String(node.kb_id || ""), []]));
        const children = new Map(first.map(node => [String(node.kb_id || ""), []]));
        for (const edge of edges) {
          const source = String(edge.source || "");
          const target = String(edge.target || "");
          if (nodeById.get(source)?.depth === 1 && nodeById.get(target)?.depth === 2) {
            parents.get(target)?.push(source);
            children.get(source)?.push(target);
          }
        }
        const averageIndex = (ids, indexById) => {
          const indexes = ids.map(id => indexById.get(id)).filter(index => Number.isFinite(index));
          if (!indexes.length) return Number.MAX_SAFE_INTEGER;
          return indexes.reduce((total, index) => total + index, 0) / indexes.length;
        };
        // Alternate the two layer orders so related nodes share a radial sector.
        for (let pass = 0; pass < 3; pass += 1) {
          const firstIndex = new Map(first.map((node, index) => [String(node.kb_id || ""), index]));
          second = second.slice().sort((a, b) => {
            const delta = averageIndex(parents.get(String(a.kb_id || "")) || [], firstIndex)
              - averageIndex(parents.get(String(b.kb_id || "")) || [], firstIndex);
            return delta || titleOrder(a, b);
          });
          const secondIndex = new Map(second.map((node, index) => [String(node.kb_id || ""), index]));
          first = first.slice().sort((a, b) => {
            const delta = averageIndex(children.get(String(a.kb_id || "")) || [], secondIndex)
              - averageIndex(children.get(String(b.kb_id || "")) || [], secondIndex);
            return delta || titleOrder(a, b);
          });
        }
        const root = (byDepth.get(0) || [])[0] || null;
        const optimized = optimizeDetailGraphLayerOrder(root, first, second, edges);
        return { root, first: optimized.first, second: optimized.second };
      }

      function detailGraphBasePositions(nodes, edges) {
        const { root, first, second } = detailGraphOrderedLayers(nodes, edges);
        return detailGraphRingPositions(root, first, second);
      }

      function detailGraphPositions(nodes, edges, manualPositions = {}, basePositions = null) {
        const { size, positions: automaticPositions } = basePositions
          ? { size: 360, positions: new Map(Object.entries(basePositions)) }
          : detailGraphBasePositions(nodes, edges);
        const positions = new Map(automaticPositions);
        for (const [fileId, point] of Object.entries(manualPositions || {})) {
          if (!positions.has(fileId)) continue;
          const x = Number(point?.x);
          const y = Number(point?.y);
          if (Number.isFinite(x) && Number.isFinite(y)) positions.set(fileId, { x, y });
        }
        return { size, positions };
      }

      function detailGraphLinePosition(source, target, offset) {
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const length = Math.hypot(dx, dy) || 1;
        const shiftX = (-dy / length) * offset;
        const shiftY = (dx / length) * offset;
        return {
          x1: source.x + shiftX,
          y1: source.y + shiftY,
          x2: target.x + shiftX,
          y2: target.y + shiftY,
        };
      }

      function syncDetailGraphSvgPositions(svg) {
        const graph = state.detailGraph || {};
        const nodes = Array.isArray(graph.payload?.nodes) ? graph.payload.nodes : [];
        const edges = Array.isArray(graph.payload?.edges) ? graph.payload.edges : [];
        const { positions } = detailGraphPositions(nodes, edges, graph.positions || {}, graph.basePositions);
        svg.querySelectorAll("[data-detail-graph-node]").forEach(circle => {
          const point = positions.get(circle.dataset.detailGraphNode || "");
          if (!point) return;
          circle.setAttribute("cx", point.x);
          circle.setAttribute("cy", point.y);
        });
        svg.querySelectorAll("[data-detail-graph-edge]").forEach(line => {
          const source = positions.get(line.dataset.detailGraphSource || "");
          const target = positions.get(line.dataset.detailGraphTarget || "");
          if (!source || !target) return;
          const point = detailGraphLinePosition(source, target, Number(line.dataset.detailGraphOffset || 0));
          line.setAttribute("x1", point.x1);
          line.setAttribute("y1", point.y1);
          line.setAttribute("x2", point.x2);
          line.setAttribute("y2", point.y2);
        });
      }

      function detailGraphPointerPosition(event, svg) {
        const rect = svg.getBoundingClientRect();
        const viewBox = svg.viewBox.baseVal;
        const width = viewBox.width || 360;
        const height = viewBox.height || 360;
        const x = ((event.clientX - rect.left) / Math.max(1, rect.width)) * width;
        const y = ((event.clientY - rect.top) / Math.max(1, rect.height)) * height;
        return {
          x: Math.max(8, Math.min(width - 8, x)),
          y: Math.max(8, Math.min(height - 8, y)),
        };
      }

      function renderDetailGraph() {
        if (!detailGraphEnabled()) {
          el.mGraphMeta.textContent = "";
          el.mGraph.innerHTML = "";
          return;
        }
        const graph = state.detailGraph || {};
        const payload = graph.payload;
        if (!state.detailFileId) {
          el.mGraphMeta.textContent = "";
          el.mGraph.innerHTML = "";
          return;
        }
        if (graph.loading) {
          el.mGraphMeta.textContent = "";
          el.mGraph.innerHTML = window.PortalI18n.markup('<div class="knowledgeRelationGraphEmpty">读取关系图谱…</div>');
          return;
        }
        const nodes = Array.isArray(payload?.nodes) ? payload.nodes : [];
        const edges = Array.isArray(payload?.edges) ? payload.edges : [];
        if (!nodes.length) {
          el.mGraphMeta.textContent = "";
          el.mGraph.innerHTML = window.PortalI18n.markup('<div class="knowledgeRelationGraphEmpty">当前条目没有可定位的知识库连接。</div>');
          return;
        }
        el.mGraphMeta.textContent = `${nodes.length} nodes · ${edges.length} links`;
        if (!graph.basePositions) {
          graph.basePositions = Object.fromEntries(detailGraphBasePositions(nodes, edges).positions);
        }
        const { size, positions } = detailGraphPositions(nodes, edges, graph.positions || {}, graph.basePositions);
        const edgesByPair = new Map();
        for (const edge of edges) {
          const key = `${edge.source || ""}:${edge.target || ""}`;
          if (!edgesByPair.has(key)) edgesByPair.set(key, []);
          edgesByPair.get(key).push(edge);
        }
        const edgeSvg = [...edgesByPair.values()].flatMap(group => group.map((edge, index) => {
          const source = positions.get(String(edge.source || ""));
          const target = positions.get(String(edge.target || ""));
          if (!source || !target) return "";
          const offset = (index - (group.length - 1) / 2) * 3;
          const point = detailGraphLinePosition(source, target, offset);
          const relation = String(edge.relation || "related");
          return window.PortalI18n.html`<line class="detailGraphEdge" data-detail-graph-edge data-detail-graph-source="${escapeHtml(edge.source || "")}" data-detail-graph-target="${escapeHtml(edge.target || "")}" data-detail-graph-offset="${offset}" style="--graph-edge:${detailGraphRelationColor(relation)}" x1="${point.x1}" y1="${point.y1}" x2="${point.x2}" y2="${point.y2}"><title>${escapeHtml(relation)}</title></line>`;
        })).join("");
        const nodeSvg = nodes.map(node => {
          const position = positions.get(String(node.kb_id || ""));
          if (!position) return "";
          const depth = Number(node.depth || 0);
          const secondLevelCount = nodes.filter(item => Number(item.depth || 0) === 2).length;
          const radius = depth === 0 ? 19 : depth === 1 ? 10 : (secondLevelCount > 64 ? 4 : 5.5);
          const title = `${node.title || node.kb_id}${node.type ? ` · ${node.type}` : ""}`;
          const rootClass = depth === 0 ? " detailGraphRoot" : "";
          return window.PortalI18n.html`<g data-detail-graph-open="${escapeHtml(node.kb_id || "")}" role="button" tabindex="0"><title>${escapeHtml(title)}</title><circle class="detailGraphNode${rootClass}" data-detail-graph-node="${escapeHtml(node.kb_id || "")}" style="--graph-node:${detailGraphNodeColor(node.type)}" cx="${position.x}" cy="${position.y}" r="${radius}"></circle></g>`;
        }).join("");
        el.mGraph.innerHTML = window.PortalI18n.html`<svg data-portal-visualization="knowledge-detail-graph" viewBox="0 0 ${size} ${size}" role="img" aria-label="以当前知识条目为中心的两级关系图谱">${edgeSvg}${nodeSvg}</svg>`;
      }

      async function loadDetailGraph(fileId) {
        const cleanId = String(fileId || "").trim();
        if (!cleanId || !detailGraphEnabled()) return;
        state.detailGraph = { fileId: cleanId, payload: null, loading: true, positions: {}, basePositions: null };
        renderDetailGraph();
        try {
          const payload = await knowledgeApi.request(`/knowledge/api/item-graph?kb_id=${encodeURIComponent(cleanId)}`, { cache: "no-store" });
          if (state.detailFileId !== cleanId) return;
          state.detailGraph = { fileId: cleanId, payload, loading: false, positions: {}, basePositions: null };
        } catch (error) {
          if (state.detailFileId === cleanId) {
            state.detailGraph = { fileId: cleanId, payload: null, loading: false, positions: {}, basePositions: null };
          }
          throw error;
        } finally {
          if (state.detailFileId === cleanId) renderDetailGraph();
        }
      }

      function openModal() {
        detailModalController.open();
        detailResourceGuest?.setResource({
          resourceId: state.detailFileId,
          resourceType: state.selected?.type,
          detailKind: knowledgeDetailKind(),
        });
        detailResourceGuest?.ready();
      }

      function detailIsDirty() {
        return !!detailDocumentSession?.snapshot?.().dirty;
      }

      const DETAIL_NON_EDITABLE_KINDS = new Set([
        "audio", "binary", "directory", "image", "office", "pdf", "remote-link", "video",
      ]);

      function detailSelectedFileEditable() {
        return !state.detailSelectedFileLinked
          && !DETAIL_NON_EDITABLE_KINDS.has(state.detailSelectedFileKind);
      }

      function disposeDetailPreview() {
        if (detailPreviewRoot) window.PortalPreview?.dispose?.(detailPreviewRoot);
        detailPreviewRoot = null;
      }

      function initDetailDocumentSession() {
        detailDocumentSession = window.PortalDocumentSession.create({
          canEdit: detailSelectedFileEditable,
          onStateChange: snapshot => {
            state.detailText = String(snapshot.payload?.content || "");
            state.detailDraft = snapshot.draft;
            state.detailEditing = snapshot.editing;
            state.detailSaving = snapshot.saving;
            syncDetailButtons();
          },
          onPresent: payload => {
            if (payload) renderDetailBody();
          },
        });
      }

      function initDetailResourceGuest() {
        detailResourceGuest = window.PortalResourceDetail.createGuest({
          resourceId: () => state.detailFileId || initialKnowledgeItemId(),
          resourceType: () => state.selected?.type,
          detailKind: knowledgeDetailKind,
          guardClose: () => !detailDocumentSession || detailDocumentSession.guardDiscard(),
        });
      }

      function usesPackageStyleEditor() {
        return ["skill", "experiment"].includes(String((state.selected || {}).type || ""));
      }

      async function closeModal(context = {}) {
        if (detailResourceGuest?.embedded()) return detailResourceGuest.requestClose();
        return detailModalController.close(context);
      }

      function finalizeDetailClose(context = {}) {
        state.selected = null;
        state.detailFileId = "";
        state.detailSelectedFileId = "";
        state.detailSelectedFileKind = "markdown";
        state.detailSelectedFileLinked = false;
        state.detailReadOnly = false;
        delete el.modal.dataset.portalLiveTourReadonly;
        state.detailLinkedFiles = new Map();
        state.detailLinkedFileProbes = new Set();
        state.detailLinkDiscoverySequence += 1;
        state.detailExpandedFolders = new Set([""]);
        state.detailPath = "";
        state.detailRawUrl = "";
        state.detailDownloadUrl = "";
        state.detailMediaType = "";
        state.detailLanguage = "";
        disposeDetailPreview();
        detailDocumentSession?.show?.({ status: "empty", payload: null }, { reason: "detail-close" });
        state.detailBodyDraft = "";
        state.detailMetaDraft = null;
        state.detailDeleting = false;
        resetDetailGraph();
        resetDetailChat();
        if (!detailResourceGuest?.embedded() && context.updateLocation !== false) {
          detailHistory.close();
        }
      }

      function syncDetailButtons() {
        const selectedType = String((state.selected || {}).type || "");
        const deleteProtected = ["article", "experiment"].includes(selectedType);
        const selectedFile = detailFiles().find(value => String(value.address || "") === state.detailSelectedFileId);
        window.PortalPreview.configureDownloadLink(el.mDownload, {
          url: state.detailDownloadUrl || state.detailRawUrl,
          filename: selectedFile?.relative_path
            || selectedFile?.name
            || state.detailPath
            || state.selected?.filename
            || state.detailSelectedFileId,
        });
        el.mEdit.hidden = !state.detailSelectedFileId
          || state.detailSelectedFileLinked
          || state.detailEditing
          || !detailSelectedFileEditable();
        el.mDelete.hidden = deleteProtected || !state.detailFileId || state.detailFileId !== state.detailSelectedFileId || state.detailEditing;
        el.mCancelEdit.hidden = !state.detailEditing;
        el.mSave.hidden = !state.detailEditing;
        el.mSave.disabled = state.detailSaving || state.detailDeleting || !detailIsDirty();
        el.mCancelEdit.disabled = state.detailSaving || state.detailDeleting;
        el.mEdit.disabled = state.detailSaving || state.detailDeleting;
        el.mDelete.disabled = state.detailSaving || state.detailDeleting;
        el.mClose.disabled = state.detailSaving || state.detailDeleting;
        el.mSave.textContent = state.detailSaving ? window.PortalI18n.t("保存中…") : window.PortalI18n.t("保存");
        el.mDelete.textContent = state.detailDeleting ? window.PortalI18n.t("删除中…") : window.PortalI18n.t("删除");
      }

      function renderDetailBody() {
        disposeDetailPreview();
        syncDetailButtons();
        if (state.detailEditing) {
          if (usesPackageStyleEditor()) {
            el.mText.className = "detailEditorLayout";
            el.mText.innerHTML = window.PortalI18n.html`<textarea class="detailEditor" id="detailEditor" data-detail-body spellcheck="false"></textarea>`;
            const editor = document.getElementById("detailEditor");
            editor.value = state.detailDraft;
            editor.addEventListener("input", updateDetailDraftFromDom);
            setTimeout(() => editor.focus(), 0);
            return;
          }
          if (state.detailSelectedFileId !== state.detailFileId || state.detailSelectedFileKind !== "markdown") {
            el.mText.className = "detailEditorLayout";
            el.mText.innerHTML = window.PortalI18n.html`<textarea class="detailEditor" id="detailEditor" data-detail-body spellcheck="false"></textarea>`;
            const editor = document.getElementById("detailEditor");
            editor.value = state.detailDraft;
            editor.addEventListener("input", updateDetailDraftFromDom);
            setTimeout(() => editor.focus(), 0);
            return;
          }
          const meta = state.detailMetaDraft || parseDetailFrontmatter("");
          el.mText.className = "detailEditorLayout";
          el.mText.innerHTML = window.PortalI18n.html`
            ${renderDetailMetaEditor(meta)}
            <textarea class="detailEditor" id="detailEditor" data-detail-body spellcheck="false"></textarea>
          `;
          const editor = document.getElementById("detailEditor");
          editor.value = state.detailBodyDraft;
          el.mText.querySelectorAll("[data-detail-meta], [data-detail-link], [data-detail-meta-other], [data-detail-body]").forEach(input => {
            input.addEventListener("input", updateDetailDraftFromDom);
            input.addEventListener("change", updateDetailDraftFromDom);
          });
          setTimeout(() => editor.focus(), 0);
          return;
        }
        const markdown = state.detailSelectedFileKind === "markdown";
        const parsed = markdown ? splitDetailMarkdown(state.detailText || "") : null;
        const current = detailFiles().find(value => String(value.address || "") === state.detailSelectedFileId);
        const metadataSchema = String((state.selected || {}).type || "") === "skill"
          && (current?.primary || String(current?.relative_path || "").split("/").pop() === "SKILL.md")
          ? "skill"
          : "knowledge";
        el.mText.className = "detailDocument";
        el.mText.innerHTML = markdown ? detailMetadataHtml(parsed, metadataSchema) : "";
        const previewRoot = document.createElement("div");
        previewRoot.dataset.detailPreviewRoot = "";
        el.mText.appendChild(previewRoot);
        const linkedRawUrl = state.detailPath
          ? `/api/agent-workbench/link-file-raw?path=${encodeURIComponent(state.detailPath)}`
          : "";
        const rawUrl = state.detailRawUrl || (state.detailSelectedFileLinked ? linkedRawUrl : "");
        const downloadUrl = state.detailDownloadUrl || rawUrl;
        detailPreviewRoot = previewRoot;
        const previewHandle = window.PortalPreview.render({
          root: previewRoot,
          document: {
            id: state.detailSelectedFileId,
            title: String(current?.relative_path || state.detailPath || window.PortalI18n.t("Preview")).split("/").pop(),
            path: state.detailPath,
            contentKind: state.detailSelectedFileKind,
            mediaType: state.detailMediaType,
            language: state.detailLanguage,
            content: markdown ? (parsed.body || state.detailText || "") : state.detailText,
            rawUrl,
            downloadUrl,
          },
          context: {
            markdownLayout: "document",
            renderMarkdown,
            unsupportedText: state.detailPath
              ? `此文件已在目录中列出，但不能直接预览：${state.detailPath}`
              : "此文件已在目录中列出，但不能直接预览。",
            bindLinks: root => {
              if (!markdown) return;
              bindSkillInternalFileLinks(el.mText);
              window.PortalFileLinks?.enhance?.(root, {
                basePath: state.detailPath,
                resolvePath: detailFilePathResolver(parsed),
                source: "resource-detail",
                onOpen: state.detailReadOnly
                  ? () => openDetailLinkedFile({})
                  : openDetailLinkedFile,
                onDiscover: state.detailReadOnly ? undefined : registerDetailLinkedFiles,
              });
            },
          },
        });
        void previewHandle.promise.catch(alertError);
      }

      async function setDetailEditing(editing) {
        if (!state.detailSelectedFileId || state.detailSaving) return;
        if (editing && state.detailSelectedFileLinked) return;
        if (editing && !detailSelectedFileEditable()) return;
        if (editing) {
          if (!detailDocumentSession.beginEdit()) return;
          if (usesPackageStyleEditor()) {
            state.detailMetaDraft = null;
            state.detailBodyDraft = state.detailText;
          } else if (state.detailSelectedFileId === state.detailFileId && state.detailSelectedFileKind === "markdown") {
            const parsed = splitDetailMarkdown(state.detailText);
            state.detailMetaDraft = parsed.meta;
            state.detailBodyDraft = parsed.body;
          } else {
            state.detailMetaDraft = null;
            state.detailBodyDraft = state.detailText;
          }
        } else {
          if (!await detailDocumentSession.cancelEdit()) return;
          state.detailBodyDraft = "";
          state.detailMetaDraft = null;
        }
        renderDetailBody();
      }

      async function saveDetail() {
        if (!state.detailSelectedFileId || state.detailSelectedFileLinked) return;
        return detailDocumentSession.save({
          save: async ({ draft }) => {
            const data = await knowledgeApi.request("/knowledge/api/detail/save", {
              method: "POST",
              body: JSON.stringify({ kb_id: state.detailSelectedFileId, text: draft }),
            });
            return { ...data, content: String(data.text || "") };
          },
          onSaved: async () => {
          state.detailBodyDraft = "";
          state.detailMetaDraft = null;
          detailResourceGuest?.changed({
            resourceId: state.detailFileId,
            kind: "updated",
          });
          let item = state.selected;
          if (!detailResourceGuest?.embedded()) {
            await loadIndex({ refresh: true });
            item = byId(state.detailFileId) || state.selected;
            state.selected = item;
          }
          if (item) {
            renderKnowledgeResourceIdentity(item, state.detailFileId);
            const file = detailFiles().find(value => String(value.address || "") === String(state.detailSelectedFileId || ""));
            el.mSub.textContent = `${item.project || ""} · ${item.type || ""} · ${file?.relative_path || item.filename || ""}`;
          }
          renderDetailFileTree();
          if (detailGraphEnabled()) loadDetailGraph(state.detailFileId).catch(() => {});
          if (detailChatPayload()) loadDetailChat(state.detailFileId, { silent: true }).catch(() => {});
            window.PortalUI.toast(window.PortalI18n.t("资源已保存"));
          },
          onError: err => window.PortalUI.toast(window.PortalUI.errorMessage(window.PortalI18n.t("保存"), err), "error", {
            retry: saveDetail,
          }),
        });
      }

      async function deleteDetail() {
        if (!state.detailFileId || state.detailSaving || state.detailDeleting) return;
        const item = byId(state.detailFileId) || state.selected || {};
        const title = item.title || item.filename || state.detailFileId;
        const isSkill = String(item.type || "") === "skill";
        if (!await window.PortalUI.confirmAction("delete", title, {
          consequence: isSkill
            ? "整个 Skill（包括附属文件）会移动到对应来源的 .trash/，不会直接永久删除。"
            : "文件会移动到项目 knowledge_base/.trash/，不会直接永久删除。",
        })) return;
        const fileId = state.detailFileId;
        state.detailDeleting = true;
        syncDetailButtons();
        try {
          const receipt = await knowledgeApi.request("/knowledge/api/detail/delete", {
            method: "POST",
            body: JSON.stringify({ kb_id: fileId }),
          });
          if (receipt?.deleted !== true || String(receipt.kb_id || receipt.skill_id || "") !== fileId) {
            throw new Error("删除结果未确认，请刷新后核对条目状态。");
          }
          state.deletedKnowledgeIds.add(fileId);
          // Invalidate both in-flight list pages and direct-ID lookups before
          // rendering the acknowledged deletion; neither may resurrect it.
          state.indexPaging.requestSeq += 1;
          state.indexPaging.prefetching = false;
          state.exactQuery = { seq: state.exactQuery.seq + 1, id: "", status: "", error: "" };
          if (state.raw) {
            state.raw = { ...state.raw, items: (state.raw.items || []).filter(entry => entry.kb_id !== fileId) };
            state.indexPaging.total = Math.max(state.raw.items.length, state.indexPaging.total - 1);
            renderAll();
          }
          const embedded = detailResourceGuest?.deleted({
            resourceId: fileId,
            kind: "deleted",
          });
          if (state.detailFileId === fileId) closeModal();
          if (!embedded) await loadIndex({ refresh: true });
        } catch (err) {
          alertError(err);
          state.detailDeleting = false;
          syncDetailButtons();
        }
      }

      function resetDetailChat() {
        detailChatPanel?.closeSurface?.();
        detailChatWorkspace?.saveDraft?.({ immediate: true });
        state.detailChat = {
          fileId: "",
          loading: false,
          attachments: [],
        };
        renderDetailChat();
      }

      function detailChatPayload() {
        return detailChatPanel?.currentDetail?.() || null;

      function detailChatResidentState() {

      function detailChatStatusText() {
        if (state.detailChat.loading) return window.PortalI18n.t("加载中");
        const residentState = detailChatResidentState();
        if (detailChatIsActive()) {
          const label = residentState.work_state === "queued" ? window.PortalI18n.t("等待 Codex 启动") : residentState.work_state === "stopping" ? window.PortalI18n.t("Codex 正在停止") : window.PortalI18n.t("Codex 正在处理");
          return `${label}${Number(residentState.queued_count || 0) ? window.PortalI18n.text`，队列 ${residentState.queued_count}` : ""}`;
        }
        if ((detailChatPanel?.snapshot?.()?.messages || []).length) return window.PortalI18n.t("等待继续");

      }

      function detailChatQueueText() {
        if (detailHasLoadingAttachments()) return "正在读取文件，完成后可发送";
        const residentState = detailChatResidentState();
        if (detailChatIsActive()) {
          const count = Number(residentState.queued_count || 0);
          const workState = String(residentState.work_state || "");
          const current = workState === "running"
            ? "当前轮运行中"
            : workState === "stopping"
              ? "当前轮正在停止"
              : "当前轮等待启动";
          if (count) return `${current}，队列中还有 ${count} 条`;
          return `${current}，继续发送会进入队列`;
        }
        if ((detailChatPanel?.snapshot?.()?.messages || []).length) return "Ctrl/⌘+Enter 发送";

        const relativeParts = String(file?.relative_path || "")
          .replaceAll("\\", "/")
          .split("/")
          .filter(Boolean);
        let parentPath = "";
        for (const part of relativeParts.slice(0, -1)) {
          parentPath = parentPath ? `${parentPath}/${part}` : part;
          state.detailExpandedFolders.add(parentPath);
        }
        await detailDocumentSession.open({
          key: targetFileId,
          confirmDiscard: options.skipDiscard ? () => true : undefined,
          onLoading: () => {
            state.detailSelectedFileId = targetFileId;
            state.detailSelectedFileKind = String(file?.kind || "markdown");
            state.detailSelectedFileLinked = linkedFile;
            state.detailPath = linkedFile ? linkedPath : "";

              return window.PortalFileLinks.load(linkedPath, {
                signal,
              });

            const result = await knowledgeApi.requestResult(
              `/knowledge/api/detail?kb_id=${encodeURIComponent(targetFileId)}`,
              { cache: "no-store", detectLoginRedirect: false, signal },
            );
            if (!result.response.ok) throw new Error(`HTTP ${result.response.status}`);
            const data = knowledgeApi.requireJson(result);
            return { ...data, content: String(data.text || "") };
          },
          onPresent: data => {
            state.detailPath = String(data.path || linkedPath || "");
            state.detailRawUrl = String(data.raw_url || "");
            state.detailDownloadUrl = String(data.download_url || data.raw_url || "");

                title: String(data.title || item.title || ""),
                project: String(data.project || item.project || ""),
                type: String(data.type || item.type || ""),
                filename: String(data.filename || item.filename || ""),
                created_at: String(data.created_at || item.created_at || ""),
                mtime: Number(data.mtime || item.mtime || 0),

                  : (item.version || {}),
                files: Array.isArray(data.files) ? data.files : (item.files || []),
              };
              renderKnowledgeResourceIdentity(state.selected, targetFileId);

            const displayItem = state.selected || item;

      async function loadKnowledgeGraph({ refresh = false } = {}) {
        const seq = state.knowledgeMap.requestSeq + 1;
        state.knowledgeMap.requestSeq = seq;
        state.knowledgeMap.loading = true;
        state.knowledgeMap.error = "";
        if (state.knowledgeMap.open) {
          setKnowledgeMapOverlay("loading", "正在读取真实知识关系…");
          el.knowledgeMapSub.textContent = window.PortalI18n.t("正在加载图谱…");
        }
        try {
          const path = `/knowledge/api/graph${refresh ? "?refresh=1" : ""}`;
          const result = await knowledgeApi.requestResult(path, {
            cache: "no-store",
            detectLoginRedirect: false,
          });
          if (!result.response.ok) throw new Error(`HTTP ${result.response.status}`);
          const payload = knowledgeApi.requireJson(result);
          if (seq !== state.knowledgeMap.requestSeq) return;
          state.knowledgeMap.graph = {
            ...payload,
            nodes: Array.isArray(payload.nodes) ? payload.nodes : [],
            edges: Array.isArray(payload.edges) ? payload.edges : [],
          };
          state.knowledgeMap.signature = "";
          state.knowledgeMap.fittedSignature = "";
          buildKnowledgeMapControls();
        } catch (error) {
          if (seq !== state.knowledgeMap.requestSeq) return;
          state.knowledgeMap.error = error?.message || String(error);
        } finally {
          if (seq === state.knowledgeMap.requestSeq) {
            state.knowledgeMap.loading = false;
            if (state.knowledgeMap.open) renderKnowledgeMap({ force: true });
          }
        }
      }

      function buildKnowledgeMapData() {
        const payload = state.knowledgeMap.graph || { nodes: [], edges: [] };
        const indexItems = new Map(knowledgeMapBaseItems().map(item => [String(item.kb_id || ""), item]));
        const eligibleNodes = [];
        const eligibleIds = new Set();
        for (const raw of payload.nodes || []) {
          const kbId = String(raw?.kb_id || "").trim();
          const indexItem = indexItems.get(kbId);
          if (!kbId || !indexItem) continue;
          const node = { ...raw, ...indexItem, kb_id: kbId, degree: Number(raw.degree || 0) };
          if (state.knowledgeMap.project && node.project !== state.knowledgeMap.project) continue;
          if (state.knowledgeMap.type && node.type !== state.knowledgeMap.type) continue;
          eligibleNodes.push(node);
          eligibleIds.add(kbId);
        }

        const relationEdges = [];
        for (const raw of payload.edges || []) {
          const source = knowledgeMapEndpointId(raw.source);
          const target = knowledgeMapEndpointId(raw.target);
          const relation = String(raw.relation || "related");
          if (!eligibleIds.has(source) || !eligibleIds.has(target)) continue;
          if (state.knowledgeMap.relation && relation !== state.knowledgeMap.relation) continue;
          relationEdges.push({ source, target, relation });
        }

        const connectedIds = new Set();
        for (const edge of relationEdges) {
          connectedIds.add(edge.source);
          connectedIds.add(edge.target);
        }
        if (state.knowledgeMap.selectedId && !eligibleIds.has(state.knowledgeMap.selectedId)) {
          state.knowledgeMap.selectedId = "";
          state.knowledgeMap.neighborsOnly = false;
        }

        let visibleIds = new Set(eligibleIds);
        if (state.knowledgeMap.neighborsOnly && state.knowledgeMap.selectedId) {
          visibleIds = new Set([state.knowledgeMap.selectedId]);
          for (const edge of relationEdges) {
            if (edge.source === state.knowledgeMap.selectedId) visibleIds.add(edge.target);
            if (edge.target === state.knowledgeMap.selectedId) visibleIds.add(edge.source);
          }
        } else if (state.knowledgeMap.connectedOnly) {
          visibleIds = connectedIds;
        }

        const nodes = eligibleNodes
          .filter(node => visibleIds.has(node.kb_id))
          .map(node => ({ ...node }));
        const nodeIds = new Set(nodes.map(node => node.kb_id));
        const edges = relationEdges
          .filter(edge => nodeIds.has(edge.source) && nodeIds.has(edge.target))
          .map(edge => ({ ...edge }));
        const byIdMap = new Map(nodes.map(node => [node.kb_id, node]));
        const projects = new Set(nodes.map(node => node.project).filter(Boolean));
        return {
          nodes,
          edges,
          byIdMap,
          eligibleCount: eligibleNodes.length,
          connectedCount: connectedIds.size,
          hiddenIsolatedCount: Math.max(0, eligibleNodes.length - connectedIds.size),
          projectCount: projects.size,
          unresolvedLinks: Number(payload.unresolved_links || 0),
        };
      }

      function knowledgeMapNodeRadius(node) {
        const degree = Math.max(0, Number(node.degree || 0));
        const importance = Math.max(0, Number(node.importance || 0));
        return Math.min(15, 5.5 + Math.sqrt(degree) * 1.8 + importance * 0.32);
      }

      function knowledgeMapHash(value) {
        let hash = 2166136261;
        for (const char of String(value || "")) {
          hash ^= char.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function knowledgeMapProjectTargets(nodes, width, height) {
        const projects = [...new Set(nodes.map(node => node.project || "未分类"))].sort();
        const radius = Math.min(width, height) * (projects.length > 1 ? 0.23 : 0);
        return new Map(projects.map((project, index) => {
          const angle = (Math.PI * 2 * index) / Math.max(1, projects.length) - Math.PI / 2;
          return [
            project,
            {
              x: width / 2 + Math.cos(angle) * radius,
              y: height / 2 + Math.sin(angle) * radius,
            },
          ];
        }));
      }

      function knowledgeMapEdgeKey(edge) {
        return `${knowledgeMapEndpointId(edge.source)}→${knowledgeMapEndpointId(edge.target)}:${edge.relation}`;
      }

      function assignKnowledgeMapEdgeCurves(edges) {
        const groups = new Map();
        for (const edge of edges) {
          const source = knowledgeMapEndpointId(edge.source);
          const target = knowledgeMapEndpointId(edge.target);
          const key = [source, target].sort().join("↔");
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(edge);
        }
        for (const group of groups.values()) {
          group.forEach((edge, index) => {
            edge.curve = group.length === 1 ? 0 : index - (group.length - 1) / 2;
          });
        }
      }

      function knowledgeMapEdgeGeometry(edge) {
        const source = edge.source;
        const target = edge.target;
        if (!source || !target) return null;
        if (source === target || source.kb_id === target.kb_id) {
          const radius = knowledgeMapNodeRadius(source) + 10;
          return {
            path: `M${source.x},${source.y - radius / 2}a${radius},${radius} 0 1,1 1,0`,
            labelX: source.x + radius,
            labelY: source.y - radius,
          };
        }
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / distance;
        const uy = dy / distance;
        const sourceRadius = knowledgeMapNodeRadius(source) + 1;
        const targetRadius = knowledgeMapNodeRadius(target) + 5;
        const sx = source.x + ux * sourceRadius;
        const sy = source.y + uy * sourceRadius;
        const tx = target.x - ux * targetRadius;
        const ty = target.y - uy * targetRadius;
        const curveOffset = Number(edge.curve || 0) * 24;
        const cx = (sx + tx) / 2 - uy * curveOffset;
        const cy = (sy + ty) / 2 + ux * curveOffset;
        return {
          path: `M${sx},${sy}Q${cx},${cy} ${tx},${ty}`,
          labelX: (sx + 2 * cx + tx) / 4,
          labelY: (sy + 2 * cy + ty) / 4,
        };
      }

      function ensureKnowledgeMapMarkers() {
        const svg = window.d3.select(el.knowledgeMapSvg);
        let defs = svg.select("defs.knowledgeGraphDefs");
        if (defs.empty()) defs = svg.insert("defs", ":first-child").attr("class", "knowledgeGraphDefs");
        for (const [relation, meta] of Object.entries(knowledgeMapRelations)) {
          const markerId = `knowledge-map-arrow-${relation}`;
          let marker = defs.select(`#${markerId}`);
          if (marker.empty()) {
            marker = defs.append("marker")
              .attr("id", markerId)
              .attr("viewBox", "0 -5 10 10")
              .attr("refX", 9)
              .attr("refY", 0)
              .attr("markerWidth", 5)
              .attr("markerHeight", 5)
              .attr("orient", "auto")
              .attr("markerUnits", "userSpaceOnUse");
            marker.append("path").attr("d", "M0,-4L9,0L0,4Z");
          }
          marker.select("path").attr("fill", meta.color);
        }
      }

      function truncateKnowledgeMapLabel(value, maxLength = 30) {
        const text = String(value || "");
