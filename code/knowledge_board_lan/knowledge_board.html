      }

      function renderKnowledgeMapLegend(data) {
        const counts = new Map();
        for (const node of data.nodes) {
          const type = String(node.type || "other");
          counts.set(type, Number(counts.get(type) || 0) + 1);
        }
        const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
        el.knowledgeMapLegend.hidden = entries.length === 0;
        el.knowledgeMapLegend.innerHTML = entries.map(([type, count]) => window.PortalI18n.html`
          <span class="knowledgeMapLegendItem">
            <span class="knowledgeMapLegendDot" style="--legend-color:${knowledgeMapTypeColors[type] || knowledgeMapTypeColors.other}"></span>
            ${escapeHtml(type)} ${count}
          </span>
        `).join("");
      }

      function renderKnowledgeMapSide(data) {
        const selected = data.byIdMap.get(state.knowledgeMap.selectedId) || null;
        if (!selected) {
          const relationCounts = new Map();
          for (const edge of data.edges) {
            relationCounts.set(edge.relation, Number(relationCounts.get(edge.relation) || 0) + 1);
          }
          el.knowledgeMapSide.innerHTML = window.PortalI18n.html`
            <div class="knowledgeMapPanel">
              <div class="knowledgeMapPanelTitle">知识关系图谱</div>
              <div class="knowledgeMapPanelText">点击节点查看真实关系。拖拽节点整理位置，拖动画布或滚轮缩放；双击节点可快速聚焦。</div>
              <div class="knowledgeMapStats">
                <div class="knowledgeMapStat"><strong>${data.nodes.length}</strong><span>当前节点</span></div>
                <div class="knowledgeMapStat"><strong>${data.edges.length}</strong><span>真实关系</span></div>
                <div class="knowledgeMapStat"><strong>${data.projectCount}</strong><span>Projects</span></div>
                <div class="knowledgeMapStat"><strong>${data.hiddenIsolatedCount}</strong><span>无关系条目</span></div>
              </div>
            </div>
            <div class="knowledgeMapPanel">
              <div class="knowledgeMapPanelTitle">关系分布</div>
              <div class="knowledgeMapRelatedList">
                ${[...relationCounts.entries()].length
                  ? [...relationCounts.entries()].map(([relation, count]) => {
                      const meta = knowledgeMapRelationInfo(relation);
                      return window.PortalI18n.html`<span class="knowledgeMapRelation" style="--relation-color:${meta.color}">${escapeHtml(meta.label)} · ${count}</span>`;
                    }).join("")
                  : window.PortalI18n.html`<div class="knowledgeMapPanelText">当前范围内尚未建立真实关系。可以关闭“只看关联”检查孤立条目。</div>`}
              </div>
            </div>
          `;
          return;
        }

        const relations = data.edges
          .filter(edge => knowledgeMapEndpointId(edge.source) === selected.kb_id || knowledgeMapEndpointId(edge.target) === selected.kb_id)
          .map(edge => {
            const outgoing = knowledgeMapEndpointId(edge.source) === selected.kb_id;
            const otherId = outgoing ? knowledgeMapEndpointId(edge.target) : knowledgeMapEndpointId(edge.source);
            return {
              edge,
              outgoing,
              other: data.byIdMap.get(otherId),
            };
          })
          .filter(entry => entry.other)
          .sort((a, b) => String(a.other.title || "").localeCompare(String(b.other.title || "")));
        el.knowledgeMapSide.innerHTML = window.PortalI18n.html`
          <div class="knowledgeMapPanel">
            <div class="knowledgeMapPanelTitle">${escapeHtml(selected.title || selected.filename || selected.kb_id)}</div>
            <div class="knowledgeMapPanelMeta">${escapeHtml(selected.project || window.PortalI18n.t("无 Project"))} · ${escapeHtml(selected.type || "other")} · importance ${escapeHtml(selected.importance ?? 0)}</div>
            <div class="knowledgeMapPanelText">${escapeHtml(selected.preview || window.PortalI18n.t("暂无预览内容。"))}</div>
            <div class="knowledgeMapPanelActions">
              <button class="portalButton" type="button" data-map-open-detail="${escapeHtml(selected.kb_id)}">打开条目</button>
              <button class="portalButton" type="button" data-map-focus="${escapeHtml(selected.kb_id)}">居中</button>
            </div>
          </div>
          <div class="knowledgeMapPanel">
            <div class="knowledgeMapPanelTitle">直接关系 · ${relations.length}</div>
            <div class="knowledgeMapRelatedList">
              ${relations.length ? relations.map(({ edge, outgoing, other }) => {
                const meta = knowledgeMapRelationInfo(edge.relation);
                return window.PortalI18n.html`
                  <button class="knowledgeMapRelated" type="button" data-map-select="${escapeHtml(other.kb_id)}">
                    <span class="knowledgeMapRelation" style="--relation-color:${meta.color}">${outgoing ? "→" : "←"} ${escapeHtml(meta.label)}</span>
                    <span>${escapeHtml(other.title || other.filename || other.kb_id)}</span>
                    <span class="knowledgeMapPanelMeta">${escapeHtml(other.project || "")} · ${escapeHtml(other.type || "")}</span>
                  </button>
                `;
              }).join("") : window.PortalI18n.html`<div class="knowledgeMapPanelText">这个条目尚未建立当前类型的关系。</div>`}
            </div>
          </div>
        `;
      }

      function knowledgeMapVisibleLabelLimit(data, scale = 1) {
        if (data.nodes.length <= 60) return data.nodes.length;
        if (scale < 0.55) return 16;
        if (scale < 0.9) return 28;
        if (scale < 1.4) return 54;
        if (scale < 2.1) return 100;
        return data.nodes.length;
      }

      function updateKnowledgeMapLabelVisibility(scale) {
        const data = state.knowledgeMap.currentData;
        if (!data?.nodeLabelSelection) return;
        data.zoomScale = Number.isFinite(Number(scale)) ? Number(scale) : Number(data.zoomScale || 1);
        const selectedId = data.byIdMap.has(state.knowledgeMap.selectedId)
          ? state.knowledgeMap.selectedId
          : "";
        const neighbors = new Set(selectedId ? [selectedId] : []);
        for (const edge of data.edges) {
          const source = knowledgeMapEndpointId(edge.source);
          const target = knowledgeMapEndpointId(edge.target);
          if (source === selectedId) neighbors.add(target);
          if (target === selectedId) neighbors.add(source);
        }
        const limit = knowledgeMapVisibleLabelLimit(data, data.zoomScale);
        data.nodeLabelSelection.attr("opacity", node => {
          if (neighbors.has(node.kb_id)) return 1;
          return Number(node.labelRank || 0) < limit ? 0.82 : 0;
        });
      }

      function updateKnowledgeMapSelection({ renderSide = true } = {}) {
        const data = state.knowledgeMap.currentData;
        if (!data) return;
        const selectedId = data.byIdMap.has(state.knowledgeMap.selectedId)
          ? state.knowledgeMap.selectedId
          : "";
        if (!selectedId) state.knowledgeMap.selectedId = "";
        const neighbors = new Set(selectedId ? [selectedId] : []);
        for (const edge of data.edges) {
          const source = knowledgeMapEndpointId(edge.source);
          const target = knowledgeMapEndpointId(edge.target);
          if (source === selectedId) neighbors.add(target);
          if (target === selectedId) neighbors.add(source);
        }
        data.nodeSelection
          ?.classed("is-selected", node => node.kb_id === selectedId)
          .classed("is-muted", node => Boolean(selectedId) && !neighbors.has(node.kb_id));
        data.linkSelection
          ?.classed("is-active", edge => {
            const source = knowledgeMapEndpointId(edge.source);
            const target = knowledgeMapEndpointId(edge.target);
            return Boolean(selectedId) && (source === selectedId || target === selectedId);
          })
          .classed("is-muted", edge => {
            const source = knowledgeMapEndpointId(edge.source);
            const target = knowledgeMapEndpointId(edge.target);
            return Boolean(selectedId) && source !== selectedId && target !== selectedId;
          });
        updateKnowledgeMapLabelVisibility(data.zoomScale);
        data.edgeLabelSelection?.attr("display", edge => {
          const source = knowledgeMapEndpointId(edge.source);
          const target = knowledgeMapEndpointId(edge.target);
          return selectedId && (source === selectedId || target === selectedId) ? null : "none";
        });
        el.knowledgeMapNeighborsOnly.disabled = !selectedId;
        el.knowledgeMapNeighborsOnly.classList.toggle("active", state.knowledgeMap.neighborsOnly);
        el.knowledgeMapNeighborsOnly.setAttribute("aria-pressed", state.knowledgeMap.neighborsOnly ? "true" : "false");
        if (renderSide) renderKnowledgeMapSide(data);
      }

      function fitKnowledgeMap({ animate = true } = {}) {
        if (!state.knowledgeMap.zoom || !state.knowledgeMap.currentData?.nodes.length) return;
        let bounds;
        try {
          bounds = el.knowledgeMapScene.getBBox();
        } catch (_) {
          return;
        }
        if (!bounds.width || !bounds.height) return;
        const rect = el.knowledgeMapViewport.getBoundingClientRect();
        const width = Math.max(320, rect.width);
        const height = Math.max(320, rect.height);
        const scale = Math.max(0.18, Math.min(2.1, 0.86 / Math.max(bounds.width / width, bounds.height / height)));
        const transform = window.d3.zoomIdentity
          .translate(width / 2 - scale * (bounds.x + bounds.width / 2), height / 2 - scale * (bounds.y + bounds.height / 2))
          .scale(scale);
        const svg = window.d3.select(el.knowledgeMapSvg);
        const target = animate ? svg.transition().duration(260) : svg;
        target.call(state.knowledgeMap.zoom.transform, transform);
      }

      function focusKnowledgeMapNode(kbId, { scale = 1.45 } = {}) {
        const node = state.knowledgeMap.currentData?.byIdMap.get(String(kbId || ""));
        if (!node || !state.knowledgeMap.zoom || !Number.isFinite(node.x) || !Number.isFinite(node.y)) return;
        const rect = el.knowledgeMapViewport.getBoundingClientRect();
        const transform = window.d3.zoomIdentity
          .translate(rect.width / 2 - node.x * scale, rect.height / 2 - node.y * scale)
          .scale(scale);
        window.d3.select(el.knowledgeMapSvg)
          .transition()
          .duration(280)
          .call(state.knowledgeMap.zoom.transform, transform);
      }

      function selectKnowledgeMapNode(kbId, { focus = false } = {}) {
        const cleanId = String(kbId || "");
        const clearedNeighborScope = !cleanId && state.knowledgeMap.neighborsOnly;
        state.knowledgeMap.selectedId = cleanId;
        if (!cleanId) state.knowledgeMap.neighborsOnly = false;
        if (state.knowledgeMap.neighborsOnly || clearedNeighborScope) {
          renderKnowledgeMap({ force: true });
        } else {
          updateKnowledgeMapSelection();
        }
        if (focus && cleanId) {
          window.requestAnimationFrame(() => focusKnowledgeMapNode(cleanId));
        }
      }

      function renderKnowledgeMapD3(data, signature) {
        stopKnowledgeMapSimulation();
        ensureKnowledgeMapMarkers();
        const rect = el.knowledgeMapViewport.getBoundingClientRect();
        const width = Math.max(640, rect.width || 0);
        const height = Math.max(500, rect.height || 0);
        el.knowledgeMapSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        const targets = knowledgeMapProjectTargets(data.nodes, width, height);
        const labelRanks = new Map(
          data.nodes
            .slice()
            .sort((a, b) => {
              const scoreA = Number(a.degree || 0) * 12 + Number(a.importance || 0);
              const scoreB = Number(b.degree || 0) * 12 + Number(b.importance || 0);
              return scoreB - scoreA || Number(b.mtime || 0) - Number(a.mtime || 0);
            })
            .map((node, index) => [node.kb_id, index]),
        );

        for (const node of data.nodes) {
          const previous = state.knowledgeMap.positions.get(node.kb_id);
          const target = targets.get(node.project || "未分类") || { x: width / 2, y: height / 2 };
          const hash = knowledgeMapHash(node.kb_id);
          const angle = ((hash % 360) * Math.PI) / 180;
          const spread = 24 + (hash % 110);
          node.x = Number.isFinite(previous?.x) ? previous.x : target.x + Math.cos(angle) * spread;
          node.y = Number.isFinite(previous?.y) ? previous.y : target.y + Math.sin(angle) * spread;
          node.labelRank = Number(labelRanks.get(node.kb_id) || 0);
          node.showLabel = data.nodes.length <= 60 || node.labelRank < 28;
        }
        assignKnowledgeMapEdgeCurves(data.edges);

        const d3 = window.d3;
        const svg = d3.select(el.knowledgeMapSvg);
        const scene = d3.select(el.knowledgeMapScene);
        if (!state.knowledgeMap.zoom) {
          state.knowledgeMap.zoom = d3.zoom()
            .scaleExtent([0.16, 4])
            .on("zoom", event => {
              scene.attr("transform", event.transform);
              updateKnowledgeMapLabelVisibility(event.transform.k);
            });
        }
        svg.call(state.knowledgeMap.zoom).on("dblclick.zoom", null);
        svg.on("click.knowledge-map", event => {
          if (event.target.closest?.(".knowledgeGraphNode")) return;
          selectKnowledgeMapNode("");
        });

        const linkSelection = d3.select(el.knowledgeMapEdges)
          .selectAll("path.knowledgeGraphEdge")
          .data(data.edges, knowledgeMapEdgeKey)
          .join("path")
          .attr("class", "knowledgeGraphEdge")
          .attr("stroke", edge => knowledgeMapRelationInfo(edge.relation).color)
          .attr("marker-end", edge => `url(#knowledge-map-arrow-${edge.relation in knowledgeMapRelations ? edge.relation : "related"})`);

        const edgeLabelSelection = d3.select(el.knowledgeMapEdgeLabels)
          .selectAll("text.knowledgeGraphRelationLabel")
          .data(data.edges, knowledgeMapEdgeKey)
          .join("text")
          .attr("class", "knowledgeGraphRelationLabel")
          .text(edge => knowledgeMapRelationInfo(edge.relation).label)
          .attr("display", "none");

        const nodeSelection = d3.select(el.knowledgeMapNodes)
          .selectAll("g.knowledgeGraphNode")
          .data(data.nodes, node => node.kb_id)
          .join(enter => {
            const group = enter.append("g")
              .attr("class", "knowledgeGraphNode")
              .attr("role", "button")
              .attr("tabindex", 0);
            group.append("circle").attr("class", "knowledgeGraphNodeHalo");
            group.append("circle").attr("class", "knowledgeGraphNodeDot");
            group.append("text").attr("class", "knowledgeGraphNodeLabel");
            group.append("title");
            return group;
          })
          .attr("aria-label", node => `${node.title || node.kb_id}，${node.type || "other"}，${Number(node.degree || 0)} 个关系`)
          .on("click", (event, node) => {
            event.stopPropagation();
            selectKnowledgeMapNode(node.kb_id);
          })
          .on("dblclick", (event, node) => {
            event.stopPropagation();
            selectKnowledgeMapNode(node.kb_id, { focus: true });
          })
          .on("keydown", (event, node) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            selectKnowledgeMapNode(node.kb_id, { focus: true });
          });

        nodeSelection.select(".knowledgeGraphNodeHalo")
          .attr("r", node => knowledgeMapNodeRadius(node) + 5);
        nodeSelection.select(".knowledgeGraphNodeDot")
          .attr("r", knowledgeMapNodeRadius)
          .attr("fill", node => knowledgeMapTypeColors[node.type] || knowledgeMapTypeColors.other);
        const nodeLabelSelection = nodeSelection.select(".knowledgeGraphNodeLabel")
          .attr("x", node => knowledgeMapNodeRadius(node) + 6)
          .attr("y", 3.5)
          .text(node => truncateKnowledgeMapLabel(node.title || node.filename || node.kb_id))
          .attr("opacity", node => node.showLabel ? 0.82 : 0);
        nodeSelection.select("title")
          .text(node => `${node.title || node.kb_id}\n${node.project || ""} · ${node.type || ""}\n${Number(node.degree || 0)} 个关系`);

        const drag = d3.drag()
          .on("start", (event, node) => {
            event.sourceEvent?.stopPropagation?.();
            if (!event.active) state.knowledgeMap.simulation?.alphaTarget(0.16).restart();
            node.fx = node.x;
            node.fy = node.y;
          })
          .on("drag", (event, node) => {
            node.fx = event.x;
            node.fy = event.y;
          })
          .on("end", (event, node) => {
            if (!event.active) state.knowledgeMap.simulation?.alphaTarget(0);
            node.fx = null;
            node.fy = null;
            state.knowledgeMap.positions.set(node.kb_id, { x: node.x, y: node.y });
          });
        nodeSelection.call(drag);

        data.nodeSelection = nodeSelection;
        data.nodeLabelSelection = nodeLabelSelection;
        data.linkSelection = linkSelection;
        data.edgeLabelSelection = edgeLabelSelection;
        state.knowledgeMap.currentData = data;
        data.zoomScale = Number(svg.property("__zoom")?.k || 1);

        const simulation = d3.forceSimulation(data.nodes)
          .force("link", d3.forceLink(data.edges)
            .id(node => node.kb_id)
            .distance(edge => edge.relation === "related" ? 92 : 112)
            .strength(0.38))
          .force("charge", d3.forceManyBody().strength(node => -58 - Math.min(70, Number(node.degree || 0) * 5)))
          .force("collide", d3.forceCollide().radius(node => knowledgeMapNodeRadius(node) + (node.showLabel ? 20 : 5)).iterations(2))
          .force("x", d3.forceX(node => (targets.get(node.project || "未分类") || { x: width / 2 }).x).strength(0.032))
          .force("y", d3.forceY(node => (targets.get(node.project || "未分类") || { y: height / 2 }).y).strength(0.032))
          .alpha(0.9)
          .alphaDecay(0.045);
        state.knowledgeMap.simulation = simulation;
        let ticks = 0;
        simulation.on("tick", () => {
          ticks += 1;
          linkSelection.attr("d", edge => knowledgeMapEdgeGeometry(edge)?.path || "");
          edgeLabelSelection
            .attr("x", edge => knowledgeMapEdgeGeometry(edge)?.labelX || 0)
            .attr("y", edge => knowledgeMapEdgeGeometry(edge)?.labelY || 0);
          nodeSelection.attr("transform", node => `translate(${node.x},${node.y})`);
          if (ticks === 28 && state.knowledgeMap.fittedSignature !== signature) {
            state.knowledgeMap.fittedSignature = signature;
            fitKnowledgeMap();
          }
        });
        updateKnowledgeMapSelection();
      }

      function knowledgeMapSummaryText(data) {
        const hidden = state.knowledgeMap.connectedOnly && data.hiddenIsolatedCount
          ? window.PortalI18n.text` · 隐藏 ${data.hiddenIsolatedCount} 个孤立节点`
          : "";
        return window.PortalI18n.text`${data.nodes.length} 节点 · ${data.edges.length} 关系${hidden}`;
      }

      function renderKnowledgeMap({ force = false } = {}) {
        if (!state.knowledgeMap.open) return;
        buildKnowledgeMapControls();
        if (!window.d3) {
          setKnowledgeMapOverlay("error", "D3.js 未能加载，无法绘制知识图谱。");
          return;
        }
        if (state.knowledgeMap.loading) {
          setKnowledgeMapOverlay("loading", "正在读取真实知识关系…");
          return;
        }
        if (state.knowledgeMap.error) {
          setKnowledgeMapOverlay("error", `图谱加载失败：${state.knowledgeMap.error}`);
          el.knowledgeMapSub.textContent = window.PortalI18n.t("加载失败");
          return;
        }
        if (!state.knowledgeMap.graph) {
          loadKnowledgeGraph().catch(error => {
            state.knowledgeMap.error = error?.message || String(error);
            renderKnowledgeMap({ force: true });
          });
          return;
        }
        if (state.indexPaging.prefetching && !force) {
          window.clearTimeout(state.knowledgeMap.renderTimer);
          state.knowledgeMap.renderTimer = window.setTimeout(
            () => renderKnowledgeMap({ force: true }),
            180,
          );
          return;
        }

        const data = buildKnowledgeMapData();
        const signature = JSON.stringify({
          nodes: data.nodes.map(node => node.kb_id),
          edges: data.edges.map(knowledgeMapEdgeKey),
          project: state.knowledgeMap.project,
          type: state.knowledgeMap.type,
          relation: state.knowledgeMap.relation,
          connectedOnly: state.knowledgeMap.connectedOnly,
          neighborsOnly: state.knowledgeMap.neighborsOnly,
          neighborRoot: state.knowledgeMap.neighborsOnly ? state.knowledgeMap.selectedId : "",
        });
        el.knowledgeMapSub.textContent = knowledgeMapSummaryText(data);
        if (!data.nodes.length) {
          stopKnowledgeMapSimulation();
          state.knowledgeMap.currentData = data;
          window.d3.select(el.knowledgeMapEdges).selectAll("*").remove();
          window.d3.select(el.knowledgeMapEdgeLabels).selectAll("*").remove();
          window.d3.select(el.knowledgeMapNodes).selectAll("*").remove();
          el.knowledgeMapLegend.hidden = true;
          renderKnowledgeMapSide(data);
          setKnowledgeMapOverlay(
            "empty",
            state.knowledgeMap.connectedOnly
              ? "当前筛选范围内还没有真实知识关系。"
              : "当前筛选范围内没有可显示的知识条目。",
          );
          state.knowledgeMap.signature = signature;
          return;
        }
        setKnowledgeMapOverlay("", "");
        renderKnowledgeMapLegend(data);
        if (!force && signature === state.knowledgeMap.signature) {
          state.knowledgeMap.currentData = state.knowledgeMap.currentData || data;
          updateKnowledgeMapSelection();
          return;
        }
        state.knowledgeMap.signature = signature;
        renderKnowledgeMapD3(data, signature);
      }

      function knowledgeMapSearchCandidates() {
        const query = String(state.knowledgeMap.query || "").trim().toLowerCase();
        if (!query || !state.knowledgeMap.graph) return [];
        const baseIds = new Set(knowledgeMapBaseItems().map(item => String(item.kb_id || "")));
        return (state.knowledgeMap.graph.nodes || [])
          .filter(node => baseIds.has(String(node.kb_id || "")))
          .filter(node => !state.knowledgeMap.project || node.project === state.knowledgeMap.project)
          .filter(node => !state.knowledgeMap.type || node.type === state.knowledgeMap.type)
          .map(node => {
            const haystack = `${node.title || ""}\n${node.kb_id || ""}\n${node.preview || ""}`.toLowerCase();
            return { node, haystack, starts: String(node.title || "").toLowerCase().startsWith(query) };
          })
          .filter(entry => entry.haystack.includes(query))
          .sort((a, b) => Number(b.starts) - Number(a.starts) || Number(b.node.degree || 0) - Number(a.node.degree || 0))
          .slice(0, 8)
          .map(entry => entry.node);
      }

      function renderKnowledgeMapSuggestions() {
        const candidates = knowledgeMapSearchCandidates();
        el.knowledgeMapSuggestions.innerHTML = candidates.map((node, index) => window.PortalI18n.html`
          <button class="knowledgeMapSuggestion${index === 0 ? " active" : ""}" type="button" role="option" data-map-suggestion="${escapeHtml(node.kb_id)}">
            <span class="knowledgeMapSuggestionTitle">${escapeHtml(node.title || node.kb_id)}</span>
            <span class="knowledgeMapSuggestionMeta">${escapeHtml(node.type || "")}</span>
            <span class="knowledgeMapSuggestionMeta">${escapeHtml(node.project || "")}</span>
            <span class="knowledgeMapSuggestionMeta">${Number(node.degree || 0)} 关系</span>
          </button>
        `).join("");
        if (candidates.length) knowledgeMapSearchPopover.open();
        else knowledgeMapSearchPopover.close();
      }

      function revealKnowledgeMapNode(kbId) {
        const cleanId = String(kbId || "");
        if (!cleanId) return;
        state.knowledgeMap.selectedId = cleanId;
        const visible = state.knowledgeMap.currentData?.byIdMap.has(cleanId);
        if (!visible) state.knowledgeMap.connectedOnly = false;
        buildKnowledgeMapControls();
        renderKnowledgeMap({ force: !visible || state.knowledgeMap.neighborsOnly });
        knowledgeMapSearchPopover.close();
        window.requestAnimationFrame(() => focusKnowledgeMapNode(cleanId));
      }

      // ── Knowledge overview ───────────────────────────────────────────────
      function clampNumber(value, min = 0, max = 100) {
        const n = Number(value || 0);
        if (!Number.isFinite(n)) return min;
        return Math.max(min, Math.min(max, n));
      }

      function knowledgeRadarItems() {
        return knowledgeMapBaseItems();
      }

      function itemAgeDays(item) {
        const ts = Number(item?.mtime || 0);
        if (!Number.isFinite(ts) || ts <= 0) return Infinity;
        return Math.max(0, (Date.now() - ts * 1000) / 86400000);
      }

      function groupRadarProjects(items) {
        const map = new Map();
        for (const item of items) {
          const project = item.project || "unknown";
          if (!map.has(project)) map.set(project, []);
          map.get(project).push(item);
        }
        return [...map.entries()].map(([project, list]) => {
          const total = list.length;
          const recent = list.filter(item => itemAgeDays(item) <= 14).length;
          const stale = list.filter(item => Number(item.importance || 0) >= 4 && itemAgeDays(item) > 120).length;
          const thin = list.filter(item => String(item.preview || "").trim().length < 80).length;
          const decisions = list.filter(item => item.type === "decision").length;
          const ideas = list.filter(item => item.type === "idea" || item.type === "question").length;
          const insights = list.filter(item => item.type === "insight" || item.type === "concept").length;
          const activity = clampNumber((recent / Math.max(1, total)) * 100 + Math.min(22, total));
          const decisionCoverage = clampNumber((decisions / Math.max(1, ideas + decisions)) * 100);
          const insightDensity = clampNumber((insights / Math.max(1, total)) * 160);
          const staleRisk = clampNumber((stale / Math.max(1, total)) * 220);
          const thinRisk = clampNumber((thin / Math.max(1, total)) * 130);
          const score = clampNumber(activity * 0.35 + decisionCoverage * 0.25 + insightDensity * 0.2 + (100 - staleRisk) * 0.2);
          return { project, total, recent, stale, thin, decisions, ideas, insights, activity, decisionCoverage, insightDensity, staleRisk, thinRisk, score };
        }).sort((a, b) => b.score - a.score || b.total - a.total);
      }

      function buildKnowledgeRadarData() {
        const items = knowledgeRadarItems();
        const total = items.length;
        const projects = groupRadarProjects(items);
        const recent7 = items.filter(item => itemAgeDays(item) <= 7).length;
        const recent30 = items.filter(item => itemAgeDays(item) <= 30).length;
        const highImportance = items.filter(item => Number(item.importance || 0) >= 4).length;
        const staleHigh = items.filter(item => Number(item.importance || 0) >= 4 && itemAgeDays(item) > 120).length;
        const decisions = items.filter(item => item.type === "decision").length;
        const ideasQuestions = items.filter(item => item.type === "idea" || item.type === "question").length;
        const insightsConcepts = items.filter(item => item.type === "insight" || item.type === "concept").length;
        const thin = items.filter(item => String(item.preview || "").trim().length < 80).length;
        const projectCount = projects.length;
        const projectsWithDecision = projects.filter(project => project.decisions > 0).length;
        const freshness = clampNumber((recent30 / Math.max(1, total)) * 180);
        const decisionCoverage = clampNumber((projectsWithDecision / Math.max(1, projectCount)) * 100);
        const insightDensity = clampNumber((insightsConcepts / Math.max(1, total)) * 170);
        const maintenance = clampNumber(100 - (staleHigh / Math.max(1, highImportance || total)) * 130);
        const focus = clampNumber(100 - Math.abs(ideasQuestions - decisions) / Math.max(1, ideasQuestions + decisions) * 75);
        const axes = [
          { label: "Freshness", value: freshness },
          { label: "Decision", value: decisionCoverage },
          { label: "Insight", value: insightDensity },
          { label: "Focus", value: focus },
          { label: "Maintenance", value: maintenance },
        ];
        const signals = [
          {
            title: window.PortalI18n.t("Recent movement"),
            value: `${recent7} / 7d`,
            text: `${recent30} items changed in 30 days across ${projectCount} projects.`,
            level: freshness,
          },
          {
            title: window.PortalI18n.t("Decision coverage"),
            value: `${projectsWithDecision}/${projectCount}`,
            text: `${decisions} decision items currently anchor project memory.`,
            level: decisionCoverage,
          },
          {
            title: window.PortalI18n.t("High-importance stale"),
            value: String(staleHigh),
            text: `${staleHigh} high-importance items have not changed for more than 120 days.`,
            level: 100 - maintenance,
            risk: true,
          },
          {
            title: window.PortalI18n.t("Thin previews"),
            value: String(thin),
            text: `${thin} loaded items have short previews and may need clearer summaries.`,
            level: clampNumber((thin / Math.max(1, total)) * 100),
            risk: true,
          },
        ];
        return {
          items,
          total,
          projectCount,
          recent7,
          recent30,
          highImportance,
          staleHigh,
          decisions,
          insightsConcepts,
          thin,
          axes,
          projects,
          signals,
        };
      }

      function radarPolygonPoints(values, radius, cx, cy) {
        const count = values.length;
        return values.map((value, idx) => {
          const angle = -Math.PI / 2 + (Math.PI * 2 * idx) / count;
          const r = radius * clampNumber(value) / 100;
          return `${(cx + Math.cos(angle) * r).toFixed(1)},${(cy + Math.sin(angle) * r).toFixed(1)}`;
        }).join(" ");
      }

      function renderRadarChart(axes) {
        const cx = 180;
        const cy = 170;
        const radius = 108;
        const levels = [25, 50, 75, 100];
        const grid = levels.map(level => window.PortalI18n.html`<polygon class="radarGrid" points="${radarPolygonPoints(axes.map(() => level), radius, cx, cy)}" />`).join("");
        const axisLines = axes.map((axis, idx) => {
          const angle = -Math.PI / 2 + (Math.PI * 2 * idx) / axes.length;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          const lx = cx + Math.cos(angle) * (radius + 34);
          const ly = cy + Math.sin(angle) * (radius + 28);
          return window.PortalI18n.html`
            <line class="radarAxis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" />
            <text class="radarLabel" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${escapeHtml(axis.label)}</text>
          `;
        }).join("");
        const shape = radarPolygonPoints(axes.map(axis => axis.value), radius, cx, cy);
        const dots = axes.map((axis, idx) => {
          const angle = -Math.PI / 2 + (Math.PI * 2 * idx) / axes.length;
          const r = radius * clampNumber(axis.value) / 100;
          return window.PortalI18n.html`<circle class="radarDot" cx="${(cx + Math.cos(angle) * r).toFixed(1)}" cy="${(cy + Math.sin(angle) * r).toFixed(1)}" r="3.4" />`;
        }).join("");
        return window.PortalI18n.html`<svg data-portal-visualization="knowledge-radar" viewBox="0 0 360 340" role="img" aria-label="Knowledge overview">${grid}${axisLines}<polygon class="radarShape" points="${shape}" />${dots}</svg>`;
      }

      function radarMetricHtml(value, label) {
        return window.PortalI18n.html`
          <div class="radarMetric">
            <div class="radarMetricValue">${escapeHtml(value)}</div>
            <div class="radarMetricLabel">${escapeHtml(label)}</div>
          </div>
        `;
      }

      function radarBarHtml(label, value, kind = "") {
        const pct = clampNumber(value);
        return window.PortalI18n.html`
          <div class="radarBar">
            <span>${escapeHtml(label)}</span>
            <span class="radarBarTrack"><span class="radarBarFill ${escapeHtml(kind)}" style="width:${pct}%"></span></span>
            <span>${Math.round(pct)}</span>
          </div>
        `;
      }

      function renderKnowledgeRadar({ force = false } = {}) {
        const data = buildKnowledgeRadarData();
        const signature = JSON.stringify({
          ids: data.items.map(item => item.kb_id),
          axes: data.axes.map(axis => Math.round(axis.value)),
          projects: data.projects.map(project => `${project.project}:${project.total}:${Math.round(project.score)}`),
        });
        if (!force && signature === state.knowledgeRadar.signature) return;
        state.knowledgeRadar.signature = signature;
        el.knowledgeRadarSub.textContent = `${data.total} items · ${data.projectCount} projects`;
        el.knowledgeRadarChart.innerHTML = data.total ? renderRadarChart(data.axes)
          : knowledgeStateHtml("当前没有可评估的知识条目，暂不显示评分。", { density: "inline", icon: false });
        el.knowledgeRadarMetrics.innerHTML = [
          radarMetricHtml(data.total, "Loaded items"),
          radarMetricHtml(data.recent7, "Changed in 7d"),
          radarMetricHtml(data.decisions, "Decisions"),
          radarMetricHtml(data.insightsConcepts, "Insights/concepts"),
          radarMetricHtml(data.highImportance, "Importance >= 4"),
          radarMetricHtml(data.staleHigh, "Stale high-value"),
        ].join("");
        const signals = data.total ? data.signals : [];
        el.knowledgeRadarSignalCount.textContent = `${signals.length} signals`;
        el.knowledgeRadarSignals.innerHTML = signals.length ? signals.map(signal => window.PortalI18n.html`
          <div class="radarSignal">
            <div class="radarSignalTop">
              <div class="radarSignalTitle">${escapeHtml(signal.title)}</div>
              <div class="radarSignalValue">${escapeHtml(signal.value)}</div>
            </div>
            <div class="radarSignalText">${escapeHtml(signal.text)}</div>
            <div class="radarBars">${radarBarHtml(signal.risk ? "risk" : "signal", signal.level, signal.risk ? "risk" : "good")}</div>
          </div>
        `).join("") : knowledgeStateHtml("暂无数据，无法生成指标。", { density: "inline", icon: false });
        const topProjects = data.projects.slice(0, 12);
        el.knowledgeRadarProjectCount.textContent = `${data.projects.length} projects`;
        el.knowledgeRadarProjects.innerHTML = topProjects.length ? topProjects.map(project => window.PortalI18n.html`
          <div class="radarProject">
            <div class="radarProjectTop">
              <div class="radarProjectName">${escapeHtml(project.project)}</div>
              <div class="radarProjectScore">${Math.round(project.score)} score · ${project.total} items</div>
            </div>
            <div class="radarBars">
              ${radarBarHtml("activity", project.activity, "good")}
              ${radarBarHtml("decision", project.decisionCoverage, "")}
              ${radarBarHtml("insight", project.insightDensity, "")}
              ${radarBarHtml("stale", project.staleRisk, "risk")}
            </div>
          </div>
        `).join("") : knowledgeStateHtml("当前过滤条件下没有可展示的项目。", {
          density: "inline",
          icon: false,
        });
      }

      // ── Archive workspace ────────────────────────────────────────────────
      function archiveCurrent() {
        return state.archive.current || null;
      }

      function bindArchiveResident(payload) {
        const residentId = String(payload?.resident_id || "").trim();
        if (!residentId) {
          archiveChatPanel?.closeSurface?.();
          return;
        }
        archiveChatPanel?.setResident(residentId, { load: true }).catch(alertError);
      }

      function setArchiveCurrent(payload) {
        state.archive.current = payload || null;
        const archiveId = String(payload?.job?.archive_id || "").trim();
        if (archiveId) state.archive.currentId = archiveId;
        bindArchiveResident(payload);
      }

      function archiveResidentState() {
        return archiveChatPanel?.snapshot?.()?.state || {};
      }

      function archiveIsActive() {
        return ["queued", "running", "stopping"].includes(
          String(archiveResidentState().work_state || ""),
        );
      }

      function openArchiveModal() {
        state.archive.open = true;
        archiveDialogController.open();
        loadArchiveJobs().catch(alertError);
      }

      function finalizeArchiveClose() {
        if (state.archive.candidateDirty) {
          clearTimeout(state.archive.candidateSaveTimer);
          state.archive.candidateSaveTimer = null;
          saveArchiveCandidates({ silent: true }).catch(alertError);
        }
        state.archive.open = false;
        archiveChatRefresh?.stop?.();
        archiveChatPanel?.closeSurface?.();
      }

      function closeArchiveModal() {
        archiveDialogController.close();
      }

      async function loadArchiveJobs(options = {}) {
        const selectFirst = options.selectFirst !== false;
        let payload;
        try {
          payload = await knowledgeApi.request("/knowledge/api/archive/jobs?limit=30", { cache: "no-store" });
        } catch (error) {
          state.archive.jobs = [];
          setArchiveCurrent(null);
          state.archive.currentId = "";
          state.archive.serviceError = String(error?.message || error || "KnowledgeArchiveAgent 未运行，归档功能暂不可用。");
          renderArchiveJobs();
          renderArchiveWorkspace();
          return;
        }
        state.archive.serviceError = "";
        state.archive.jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
        if (!state.archive.currentId && selectFirst && state.archive.jobs[0]) state.archive.currentId = state.archive.jobs[0].archive_id || "";
        renderArchiveJobs();
        if (state.archive.currentId) await loadArchiveJob(state.archive.currentId);
        else renderArchiveWorkspace();
      }

      async function loadArchiveJob(archiveId) {
        if (!archiveId) return;
        clearTimeout(state.archive.candidateSaveTimer);
        state.archive.candidateSaveTimer = null;
        state.archive.candidateDirty = false;
        state.archive.candidateSaving = false;
        const payload = await knowledgeApi.request(`/knowledge/api/archive/job?id=${encodeURIComponent(archiveId)}`, { cache: "no-store" });
        state.archive.currentId = payload.job?.archive_id || archiveId;
        setArchiveCurrent(payload);
        renderArchiveJobs();
        renderArchiveWorkspace();
        scheduleArchiveRefresh();
      }

      function scheduleArchiveRefresh() {
        if (!archiveChatRefresh || !state.archive.open || !state.archive.currentId) {
          archiveChatRefresh?.stop?.();
          return;
        }
        archiveChatRefresh.start();
      }

      function renderArchiveJobs() {
        if (state.archive.serviceError) {
          el.archiveJobCount.textContent = "unavailable";
          el.archiveJobList.innerHTML = knowledgeStateHtml(state.archive.serviceError, {
            state: "error",
            density: "inline",
          });
          return;
        }
        const jobs = state.archive.jobs || [];
        el.archiveJobCount.textContent = `${jobs.length} jobs`;
        if (!jobs.length) {
          el.archiveJobList.innerHTML = knowledgeStateHtml("暂无归档任务。", {
            density: "inline",
            icon: false,
          });
          return;
        }
        el.archiveJobList.innerHTML = jobs.map(job => {
          const active = job.archive_id === state.archive.currentId ? " active" : "";
          const title = job.title || job.archive_id;
          const meta = `${job.status || "idle"} · ${job.source_kind || ""} · ${job.updated_at || ""}`;
          return window.PortalI18n.html`
            <button class="archiveJobItem${active}" type="button" data-archive-job="${escapeHtml(job.archive_id)}">
              <div class="archiveJobTitle">${escapeHtml(title)}</div>
              <div class="archiveJobId">Job ID: ${escapeHtml(job.archive_id || "")}</div>
              <div class="archiveJobMeta">${escapeHtml(meta)}</div>
            </button>
          `;
        }).join("");
      }

      function renderArchivePolicy() {
        el.archivePolicy.querySelectorAll("[data-archive-policy]").forEach(button => {
          button.classList.toggle("active", button.dataset.archivePolicy === state.archive.policy);
        });
      }

      function renderArchiveInputCollapse() {
        const collapsed = !!state.archive.inputCollapsed;
        el.archiveBody.classList.toggle("inputCollapsed", collapsed);
        el.archiveInputToggle.innerHTML = horizontalDisclosureIcon(collapsed);
        const label = collapsed ? window.PortalI18n.t("展开输入区") : window.PortalI18n.t("折叠输入区");
        el.archiveInputToggle.title = label;
        el.archiveInputToggle.setAttribute("aria-label", label);
      }

      function renderArchiveWorkspace() {
        const data = archiveCurrent();
        const job = data?.job || {};
        const residentState = archiveResidentState();
        const active = archiveIsActive();
        const serviceUnavailable = !!state.archive.serviceError;
        const loadingAttachments = archiveHasLoadingAttachments();
        const archiveStatus = active
          ? String(residentState.work_state || "running")
          : (job.status || "idle");
        renderArchiveSourceTray();
        renderArchivePolicy();
        renderArchiveInputCollapse();
        el.archiveTitle.textContent = job.title ? window.PortalI18n.text`知识库归档 · ${job.title}` : window.PortalI18n.t("知识库归档");
        el.archiveSub.textContent = serviceUnavailable
          ? window.PortalI18n.t("KnowledgeArchiveAgent 未运行，归档功能暂不可用。")
          : job.archive_id
          ? window.PortalI18n.text`Job ID: ${job.archive_id} · ${archiveStatus}`
          : window.PortalI18n.t("给材料 -> 选候选 -> 确认入库");

        el.archiveCreate.disabled = serviceUnavailable || state.archive.creating || loadingAttachments;
        const saveMaterial = archiveUsesMaterialSave();
        el.archiveCreate.textContent = state.archive.creating
          ? window.PortalI18n.t("生成中…")
          : (loadingAttachments ? window.PortalI18n.t("读取文件中…") : (saveMaterial ? window.PortalI18n.t("判断项目") : window.PortalI18n.t("生成方案")));
        el.archiveDrafts.hidden = saveMaterial;
        el.archiveDrafts.textContent = archivePlanCompletedWithoutCandidates() ? window.PortalI18n.t("重新生成候选") : window.PortalI18n.t("生成/更新草稿");
        el.archiveApply.textContent = window.PortalI18n.t("Apply 到知识库");
        el.archiveDrafts.disabled = saveMaterial || serviceUnavailable || !job.archive_id || archiveIsActive() || (!approvedArchiveCandidates().length && !archivePlanCompletedWithoutCandidates());
        el.archiveApply.disabled = serviceUnavailable || !job.archive_id || archiveIsActive() || (saveMaterial ? !archiveCandidates().length : (!unappliedArchiveDrafts().length && !archivePlanCompletedWithoutCandidates()));
        archiveChatPanel?.updateControls?.();
        renderArchiveCandidates();
        renderArchiveDrafts();
      }

      function archiveCandidates() {
        return (archiveCurrent()?.plan?.candidates || []).filter(item => item && typeof item === "object");
      }

      function archivePlanCompletedWithoutCandidates() {
        const data = archiveCurrent();
        return !!data?.job?.archive_id && !archiveIsActive() && !archiveCandidates().length;
      }

      function approvedArchiveCandidates() {
        return archiveCandidates().filter(item => (item.decision || "approve") === "approve");
      }

      function archiveUsesMaterialSave() {
        const jobPolicy = archiveCurrent()?.job?.archive_policy || "";
        return (jobPolicy || state.archive.policy || "") === "save_material";
      }

      function appliedArchiveDraftIds() {
        return new Set((archiveCurrent()?.applied || [])
          .map(item => String(item?.draft_id || ""))
          .filter(Boolean));
      }

      function unappliedArchiveDrafts() {
        const applied = appliedArchiveDraftIds();
        return (archiveCurrent()?.drafts || []).filter(item => {
          const draftId = String(item?.draft_id || "");
          return draftId && !applied.has(draftId);
        });
      }

      function renderArchiveCandidates() {
        const candidates = archiveCandidates();
        if (!archiveCurrent()?.job?.archive_id) {
          el.archiveCandidates.innerHTML = knowledgeStateHtml(
            "创建归档任务后，Codex 会在这里生成候选方案。",
          );
          return;
        }
        if (!candidates.length) {
          if (archivePlanCompletedWithoutCandidates()) {
            el.archiveCandidates.innerHTML = knowledgeStateHtml(
              "Codex 已完成筛选，但没有发现值得归档的候选条目。可以在右侧追加要求，让 Codex 重新生成 archive_plan.json，或清空本次任务。",
            );
            return;
          }
          el.archiveCandidates.innerHTML = knowledgeStateHtml(
            "还没有候选。可以等待 Codex 完成，或在右侧继续要求它生成 archive_plan.json。",
          );
          return;
        }
        el.archiveCandidates.innerHTML = candidates.map((item, idx) => window.PortalI18n.html`
          <div class="archiveCandidate" data-candidate-index="${idx}">
            <div class="archiveCandidateTop">
              <input class="archiveInput archiveCandidateTitle" data-candidate-field="title" value="${escapeHtml(item.title || "")}" placeholder="标题" />
              <select class="archiveSelect" data-candidate-field="decision">
                ${["approve", "needs_edit", "reject"].map(value => window.PortalI18n.html`<option value="${value}" ${(item.decision || "approve") === value ? "selected" : ""}>${value}</option>`).join("")}
              </select>
            </div>
            <div class="archiveCandidateGrid">
              <input class="archiveInput" data-candidate-field="project" value="${escapeHtml(item.project || "")}" placeholder="project" />
              <select class="archiveSelect" data-candidate-field="type">
                ${["concept", "idea", "insight", "question", "decision", "plan", "thinking", "information", "material"].map(value => window.PortalI18n.html`<option value="${value}" ${(item.type || "") === value ? "selected" : ""}>${value}</option>`).join("")}
              </select>
              <input class="archiveInput" data-candidate-field="importance" type="number" min="1" max="10" value="${escapeHtml(item.importance || 5)}" />
            </div>
            <textarea class="archiveTextarea archiveCandidateInstruction" data-candidate-field="instruction" placeholder="给这条候选的补充指示，可留空">${escapeHtml(item.instruction || "")}</textarea>
          </div>
        `).join("");
      }

      function renderArchiveDrafts() {
        const activeDraftInput = document.activeElement?.closest?.("[data-draft-content-id]");
        if (activeDraftInput && activeDraftInput.value !== (activeDraftInput.dataset.originalContent || "")) return;
        const drafts = archiveCurrent()?.drafts || [];
        if (archiveUsesMaterialSave()) {
          el.archiveDraftList.innerHTML = knowledgeStateHtml(
            "点击 Apply 到知识库后，会保存 approve 的文件；全部 reject 时保存 0 份并清空当前流程。",
          );
          return;
        }
        if (!drafts.length) {
          if (archivePlanCompletedWithoutCandidates()) {
            el.archiveDraftList.innerHTML = knowledgeStateHtml(
              "没有候选条目，因此不会生成 Markdown 草稿。",
            );
            return;
          }
          el.archiveDraftList.innerHTML = knowledgeStateHtml("通过候选后生成 Markdown 草稿。");
          return;
        }
        const applied = appliedArchiveDraftIds();
        el.archiveDraftList.innerHTML = drafts.map(draft => {
          const draftId = String(draft.draft_id || "");
          const isApplied = applied.has(draftId);
          const isMaterial = (draft.type || "") === "material";
          return window.PortalI18n.html`
          <div class="archiveDraft${isApplied ? " applied" : ""}">
            <div class="archiveDraftTop">
              <div>
                <div class="archiveDraftTitle">${escapeHtml(draft.title || draft.filename || draft.draft_id)}</div>
                <div class="archiveSmallText">${escapeHtml(`${draft.project || ""} · ${draft.type || ""} · ${draft.filename || ""}`)}</div>
                ${isApplied ? window.PortalI18n.html`<div class="archiveDraftStatus">applied</div>` : ""}
              </div>
              <input type="checkbox" data-draft-id="${escapeHtml(draftId)}" ${isApplied ? "disabled" : "checked"} />
            </div>
            ${draft.summary ? window.PortalI18n.html`<div class="archiveSmallText">${escapeHtml(draft.summary)}</div>` : ""}
            ${isMaterial ? window.PortalI18n.html`<div class="archiveSmallText">${escapeHtml(`source: ${draft.source_path || draft.path || ""}`)}</div>` : window.PortalI18n.html`<textarea class="archiveDraftPreview" data-draft-content-id="${escapeHtml(draftId)}" ${(isApplied || draft.content_truncated) ? "disabled" : ""}>${escapeHtml(draft.content || "")}</textarea>`}
            ${draft.content_truncated ? window.PortalI18n.html`<div class="archiveSmallText">内容过长，当前只加载了前段预览，暂不支持在这里直接编辑。</div>` : ""}
          </div>
        `;
        }).join("");
      }

      async function createArchiveJob() {
        if (archiveHasLoadingAttachments()) {
          state.archive.localStatus = "文件仍在读取，请稍后再生成方案。";
          renderArchiveWorkspace();
          return;
        }
        const payload = {
          source_kind: "auto",
          title: el.archiveTitleInput.value.trim(),
          project_hint: el.archiveProjectHint.value.trim(),
          archive_policy: state.archive.policy || "strict",
          user_hint: "",
          source_text: archiveSourceRawValue(),
          source_items: (state.archive.attachments || []).filter(item => !item.loading && item.data_url).map(item => ({
            kind: "file",
            name: item.name,
            mime: item.mime,
            size_bytes: item.size_bytes,
            data_url: item.data_url,
          })),
        };
        if (!payload.source_text.trim() && !payload.source_items.length) {
          state.archive.localStatus = "请先输入材料或添加附件。";
          renderArchiveWorkspace();
          window.PortalUI.toast(window.PortalI18n.t("请先输入材料或添加附件。"), "warning");
          return;
        }
        state.archive.creating = true;
        state.archive.localStatus = "正在创建归档任务，等待 KnowledgeArchiveAgent 返回…";
        renderArchiveWorkspace();
        try {
          const data = await knowledgeApi.request("/knowledge/api/archive/create", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          setArchiveCurrent(data);
          state.archive.currentId = data.job?.archive_id || "";
          state.archive.inputCollapsed = false;
          state.archive.localStatus = "";
          el.archiveSourceText.innerHTML = "";
          state.archive.attachments = [];
          renderArchiveSourceTray();
          renderArchiveWorkspace();
          scheduleArchiveRefresh();
          await loadArchiveJobs();
        } catch (error) {
          state.archive.localStatus = `创建归档任务失败：${String(error?.message || error || "unknown error")}`;
          renderArchiveWorkspace();
          throw error;
        } finally {
          state.archive.creating = false;
          renderArchiveWorkspace();
        }
      }

      function readArchiveCandidateEdits() {
        const candidates = archiveCandidates().map(item => ({ ...item }));
        el.archiveCandidates.querySelectorAll("[data-candidate-index]").forEach(card => {
          const idx = Number(card.dataset.candidateIndex || -1);
          if (!Number.isInteger(idx) || idx < 0 || !candidates[idx]) return;
          card.querySelectorAll("[data-candidate-field]").forEach(input => {
            const field = input.dataset.candidateField;
            if (!field) return;
            candidates[idx][field] = field === "importance" ? Number(input.value || 5) : input.value;
          });
        });
        return candidates;
      }

        const data = archiveCurrent();
        if (!data?.job?.archive_id) return [];
        const candidates = readArchiveCandidateEdits();
        if (!data.plan || typeof data.plan !== "object") data.plan = { candidates: [] };
        data.plan.candidates = candidates;
        state.archive.candidateDirty = true;
        el.archiveDrafts.disabled = archiveIsActive() || !approvedArchiveCandidates().length;
        return candidates;
      }

      function scheduleArchiveCandidateAutosave() {
        updateArchiveCandidatesFromDom();
        clearTimeout(state.archive.candidateSaveTimer);
        state.archive.candidateSaveTimer = setTimeout(() => {

        }, 600);

      async function saveArchiveCandidates(options = {}) {
        const data = archiveCurrent();
        if (!data?.job?.archive_id) return;
        const candidates = readArchiveCandidateEdits();
        if (!data.plan || typeof data.plan !== "object") data.plan = { candidates: [] };
        data.plan.candidates = candidates;
        state.archive.candidateSaving = true;
        if (!options.silent) renderArchiveWorkspace();
        try {
          const updated = await knowledgeApi.request("/knowledge/api/archive/candidates", {
            method: "POST",
            body: JSON.stringify({ archive_id: data.job.archive_id, candidates }),
          });
          setArchiveCurrent(updated);
          state.archive.candidateDirty = false;
        } finally {
          state.archive.candidateSaving = false;
          if (!options.silent) renderArchiveWorkspace();
          else {
            el.archiveDrafts.disabled = archiveIsActive() || !approvedArchiveCandidates().length;
          }
        }
      }

      function archiveAttachmentLabel(item) {
        const size = Number(item.size_bytes || 0);
        const unit = size > 1024 * 1024 ? `${(size / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(size / 1024))} KB`;
        return `${item.name || "attachment"} · ${unit}`;
      }

      function archiveAttachmentKind(item) {
        return String(item?.mime || "").startsWith("image/") ? "image" : "file";
      }

      function archiveHasLoadingAttachments() {
        return (state.archive.attachments || []).some(item => !!item.loading);
      }

      function renderArchiveSourceTray() {
        const attachments = state.archive.attachments || [];
        const loadingCount = attachments.filter(item => !!item.loading).length;
        el.archiveSourceMeta.textContent = attachments.length
          ? (loadingCount ? window.PortalI18n.text`正在读取 ${loadingCount}/${attachments.length} 个文件` : `${attachments.length} attachment${attachments.length > 1 ? "s" : ""}`)
          : window.PortalI18n.t("支持文本、链接、路径、图片和文件");
        el.archiveSourceTray.innerHTML = attachments.map(item => {
          const isImage = archiveAttachmentKind(item) === "image";
          const preview = isImage && item.data_url ? window.PortalI18n.html`<img class="archiveSourceThumb" src="${escapeHtml(item.data_url)}" alt="" />` : window.PortalI18n.html`<span class="archiveSourceFileIcon">F</span>`;
          const progress = Math.max(0, Math.min(100, Number(item.progress || 0)));
          const loading = !!item.loading;
          const label = loading ? window.PortalI18n.text`读取中 ${Math.round(progress)}% · ${archiveAttachmentLabel(item)}` : archiveAttachmentLabel(item);
          return window.PortalI18n.html`
            <span class="archiveSourceChip${loading ? " loading" : ""}" ${isImage && item.data_url ? `data-portal-preview-image="${escapeHtml(item.data_url)}"` : ""} title="${escapeHtml(label)}">
              ${preview}
              <span>
                <span class="archiveSourceChipName">${escapeHtml(item.name || "attachment")}</span>
                <span class="archiveSourceChipPath">${escapeHtml(label)}</span>
              </span>
              <button class="archiveSourceRemove" type="button" data-archive-remove-attachment="${escapeHtml(item.id)}" aria-label="Remove attachment" data-portal-icon="close"></button>
              ${loading ? window.PortalI18n.html`<span class="archiveSourceProgress" aria-label="${escapeHtml(label)}"><span style="width: ${progress}%"></span></span>` : ""}
            </span>
          `;
        }).join("");
        window.PortalChatWorkspace.bindImagePreview(el.archiveSourceTray);
      }

      function archiveSourceRefNode(item) {
        const span = document.createElement("span");
        const kind = archiveAttachmentKind(item);
        span.className = "archiveSourceRef";
        span.contentEditable = "false";
        span.dataset.archiveRefId = item.id || "";
        span.dataset.archiveRefKind = kind;
        span.title = item.name || kind;
        if (kind === "image" && item.data_url) {
          const img = document.createElement("img");
          img.className = "archiveSourceRefThumb";
          img.alt = "";
          img.src = item.data_url;
          span.appendChild(img);
        } else {
          const icon = document.createElement("span");
          icon.className = "archiveSourceRefIcon";
          icon.textContent = kind === "file" ? "F" : "I";
          span.appendChild(icon);
        }
        const label = document.createElement("span");
        label.className = "archiveSourceRefLabel";
        label.textContent = kind;
        span.appendChild(label);
        const remove = document.createElement("button");
        remove.className = "archiveSourceRefRemove";
        remove.type = "button";
        remove.dataset.portalIcon = "close";
        remove.setAttribute("aria-label", window.PortalI18n.t("移除附件引用"));
        remove.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          removeArchiveAttachment(item.id || "");
        });
        span.appendChild(remove);
        return span;
      }

      function appendArchiveSourceRef(item) {
        const input = el.archiveSourceText;
        if (!input) return;
        const kind = archiveAttachmentKind(item);
        if (input.textContent.trim() && !input.textContent.endsWith("\n")) input.appendChild(document.createTextNode("\n"));
        input.appendChild(document.createTextNode(kind === "image" ? "图片: " : "文件: "));
        input.appendChild(archiveSourceRefNode(item));
        input.appendChild(document.createTextNode("\n"));
        input.focus();
      }

      function removeArchiveAttachment(attachmentId) {
        const target = String(attachmentId || "");
        if (!target) return;
        state.archive.attachments = (state.archive.attachments || []).filter(item => item.id !== target);
        el.archiveSourceText.querySelectorAll(`[data-archive-ref-id="${CSS.escape(target)}"]`).forEach(node => node.remove());
        renderArchiveWorkspace();
      }

      function archiveSourceRawValue() {
        const input = el.archiveSourceText;
        if (!input) return "";
        function walk(node) {
          if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || "";
          if (node.nodeType !== Node.ELEMENT_NODE) return "";
          const elNode = node;
          if (elNode.dataset?.archiveRefId) {
            const item = (state.archive.attachments || []).find(row => row.id === elNode.dataset.archiveRefId);
            const kind = archiveAttachmentKind(item || {});
            return `[[archive-${kind}:${item?.name || elNode.dataset.archiveRefId}]]`;
          }
          const tag = elNode.tagName;
          let text = "";
          elNode.childNodes.forEach(child => { text += walk(child); });
          if (tag === "DIV" || tag === "P" || tag === "BR") text += "\n";
          return text;
        }
        return walk(input).replace(/\n{3,}/g, "\n\n").trim();
      }

      function fileToDataUrl(file, onProgress) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onprogress = (event) => {
            if (!event.lengthComputable || !event.total) return;
            onProgress?.(Math.round((event.loaded / event.total) * 100));
          };
          reader.onload = () => {
            onProgress?.(100);
            resolve(String(reader.result || ""));
          };
          reader.onerror = () => reject(reader.error || new Error("file read failed"));
          reader.readAsDataURL(file);
        });
      }

      function archiveAttachmentDraft(file) {
        return {
          id: `att_${Date.now().toString(36)}_${Math.random().toString(16).slice(2)}`,
          kind: "file",
          name: file.name || "attachment",
          mime: file.type || "application/octet-stream",
          size_bytes: file.size || 0,
          data_url: "",
          loading: true,
          progress: 0,
          file,
        };
      }

      async function addArchiveFiles(files) {
        const list = Array.from(files || []).filter(Boolean);
        if (!list.length) return;
        const tooLarge = list.find(file => Number(file.size || 0) > 128 * 1024 * 1024);
        if (tooLarge) {
          window.PortalUI.toast(window.PortalI18n.text`文件过大：${tooLarge.name || "attachment"}。当前单文件上限是 128MB。`, "warning");
          return;
        }
        const drafts = list.map(archiveAttachmentDraft);
        state.archive.attachments = [...(state.archive.attachments || []), ...drafts];
        renderArchiveWorkspace();
        for (const draft of drafts) {
          try {
            let lastProgress = -1;
            const dataUrl = await fileToDataUrl(draft.file, (progress) => {
              const item = (state.archive.attachments || []).find(row => row.id === draft.id);
              if (!item) return;
              const nextProgress = Math.max(0, Math.min(100, Number(progress || 0)));
              if (nextProgress === lastProgress) return;
              lastProgress = nextProgress;
              item.progress = nextProgress;
              renderArchiveSourceTray();
            });
            const item = (state.archive.attachments || []).find(row => row.id === draft.id);
            if (!item) continue;
            item.data_url = dataUrl;
            item.loading = false;
            item.progress = 100;
            delete item.file;
            appendArchiveSourceRef(item);
            renderArchiveWorkspace();
          } catch (error) {
            state.archive.attachments = (state.archive.attachments || []).filter(item => item.id !== draft.id);
            renderArchiveWorkspace();
            throw error;
          }
        }
      }

        saveArchiveDraftContent(draftId, input.value).catch(alertError);
      });
      el.archiveDrafts.addEventListener("click", () => generateArchiveDrafts().catch(alertError));
      el.archiveApply.addEventListener("click", () => applyArchiveDrafts().catch(alertError));
      el.mClose.addEventListener("click", closeModal);
      el.mDelete.addEventListener("click", () => deleteDetail());
      el.mEdit.addEventListener("click", () => setDetailEditing(true));
      el.mCancelEdit.addEventListener("click", () => setDetailEditing(false));
      el.mSave.addEventListener("click", () => saveDetail());
      const openDetailGraphNode = (fileId) => {
        if (!fileId || fileId === state.detailFileId) return;
        openDetail(fileId).catch(alertError);
      };
      el.mGraph.addEventListener("click", (event) => {
        const target = event.target.closest?.("[data-detail-graph-open]");
        const fileId = target?.dataset?.detailGraphOpen || "";
        if (fileId && detailGraphSuppressClickId === fileId) {
          detailGraphSuppressClickId = "";
          return;
        }
        openDetailGraphNode(fileId);
      });
      el.mGraph.addEventListener("pointerdown", (event) => {
        const target = event.target.closest?.("[data-detail-graph-open]");
        const fileId = target?.dataset?.detailGraphOpen || "";
        const svg = event.target.closest?.("svg");
        if (!svg || event.button !== 0) return;
        if (!fileId) {
          detailGraphPan = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            scrollLeft: el.mGraph.scrollLeft,
            scrollTop: el.mGraph.scrollTop,
          };
          el.mGraph.classList.add("panning");
          el.mGraph.setPointerCapture?.(event.pointerId);
          event.preventDefault();
          return;
        }
        detailGraphDrag = {
          fileId,
          pointerId: event.pointerId,
          svg,
          start: detailGraphPointerPosition(event, svg),
          moved: false,
        };
        svg.setPointerCapture?.(event.pointerId);
      });
      el.mGraph.addEventListener("pointermove", (event) => {
        const pan = detailGraphPan;
        if (pan && pan.pointerId === event.pointerId) {
          el.mGraph.scrollLeft = pan.scrollLeft - (event.clientX - pan.startX);
          el.mGraph.scrollTop = pan.scrollTop - (event.clientY - pan.startY);
          event.preventDefault();
          return;
        }
        const drag = detailGraphDrag;
        if (!drag || drag.pointerId !== event.pointerId) return;
        const point = detailGraphPointerPosition(event, drag.svg);
        if (Math.hypot(point.x - drag.start.x, point.y - drag.start.y) > 2) drag.moved = true;
        state.detailGraph.positions = { ...(state.detailGraph.positions || {}), [drag.fileId]: point };
        syncDetailGraphSvgPositions(drag.svg);
        event.preventDefault();
      });
      const finishDetailGraphDrag = (event) => {
        const pan = detailGraphPan;
        if (pan && pan.pointerId === event.pointerId) {
          el.mGraph.releasePointerCapture?.(event.pointerId);
          el.mGraph.classList.remove("panning");
          detailGraphPan = null;
          return;
        }
        const drag = detailGraphDrag;
        if (!drag || drag.pointerId !== event.pointerId) return;
        drag.svg.releasePointerCapture?.(event.pointerId);
        detailGraphDrag = null;
        detailGraphSuppressClickId = drag.fileId;
        setTimeout(() => {
          if (detailGraphSuppressClickId === drag.fileId) detailGraphSuppressClickId = "";
        }, 120);
        if (!drag.moved) openDetailGraphNode(drag.fileId);
      };
      el.mGraph.addEventListener("pointerup", finishDetailGraphDrag);
      el.mGraph.addEventListener("pointercancel", finishDetailGraphDrag);
      el.mGraph.addEventListener("keydown", (event) => {
        if (!['Enter', ' '].includes(event.key)) return;
        const target = event.target.closest?.("[data-detail-graph-open]");
        if (!target) return;
        event.preventDefault();
        target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      });
      el.mText.addEventListener("dblclick", (event) => {
        const target = event.target.closest("[data-copy-kb-id]");
        if (!target) return;
        copyKnowledgeIdFromDetail(target).catch(alertError);
      });
      knowledgeBoardShell.bindFilter({
        button: el.filterBtn,
        panel: el.filterPanel,
        summaryTarget: el.filterSummary,
        summary: knowledgeFilterSummaryItems,
        onClear: clearKnowledgeFilters,
        isActive: () => filter.status !== ""
          || filter.type !== null
          || filter.projects !== null
          || filter.date !== "all"
          || filter.importance > 0,
      });

      window.addEventListener("portal:knowledge-filter-request", (event) => {
        if (document.body.dataset.resourceDetailReturn) return;
        event.preventDefault();
        applyKnowledgeMatrixFilter(event.detail?.type || "", event.detail?.project || "");
      });
      window.addEventListener("popstate", () => {
        applyDetailHistoryState().catch(alertError);
      });

      // Status filter
      el.fpStatus.addEventListener("change", (e) => {
        if (e.target.name === "fp_status") { filter.status = e.target.value; saveKnowledgeUiState(); renderAll(); knowledgeBoardShell.syncFilterState(); }
      });

      // Date filter
      document.getElementById("fpDate").addEventListener("change", (e) => {
        if (e.target.name === "fp_date") { filter.date = e.target.value; saveKnowledgeUiState(); renderAll(); knowledgeBoardShell.syncFilterState(); }
      });

      // Importance filter
      document.getElementById("fpImportance").addEventListener("change", (e) => {
        if (e.target.name === "fp_imp") { filter.importance = parseInt(e.target.value, 10); saveKnowledgeUiState(); renderAll(); knowledgeBoardShell.syncFilterState(); }
      });

      async function init() {
        initDetailDocumentSession();
        initDetailResourceGuest();
        const currentUser = await window.PortalUI.loadCurrentUser().catch(() => ({ username: "anonymous" }));
        portalUsername = currentUser.username || "anonymous";
        detailChatWorkspace?.restoreDraft?.();
        archiveChatWorkspace?.restoreDraft?.();
        applyKnowledgeUiState();
        const targetItemId = initialKnowledgeItemId();
        if (targetItemId && detailResourceGuest.embedded()) {
          document.body.classList.remove("knowledgeInitializing");
          await openDetail(targetItemId, { updateHistory: false }).catch(error => {
            detailResourceGuest.failed({ error: error.message || String(error) });
            alertError(error);
          });
          return;
        }
        const requestedSearchId = requestedSemanticSearchId();
        if (requestedSearchId) {
          state.activeSemanticSearchId = requestedSearchId;
          state.query = "";
          state.knowledgeMap.open = false;
        }
        const requestedFilter = requestedKnowledgeMatrixFilter();
        if (requestedFilter.hasType) filter.type = requestedFilter.type || null;
        if (requestedFilter.hasProject) {
          filter.projects = requestedFilter.project ? new Set([requestedFilter.project]) : null;
        }
        el.q.value = state.query || "";
        syncKnowledgeView();
        const semanticSearch = initSemanticSearch();
        await semanticSearch.load({ fresh: true });
        semanticSearchReady = true;
        await loadIndex();
        document.body.classList.remove("knowledgeInitializing");
        if (targetItemId) openDetail(targetItemId, { updateHistory: false }).catch(alertError);
      }

      init();
    </script>
  </body>
</html>
