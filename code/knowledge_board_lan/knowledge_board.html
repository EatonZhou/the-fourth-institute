    <header class="resourceSectionPageHeader">
      <div class="portalSiteHeader" data-portal-site-header data-portal-nav-active="knowledge"></div>
      <div class="resourceSectionFrame portalPageHeaderFrame">
        <div class="portalBoardHeader" data-resource-section-header>
          <div data-resource-tabs data-resource-category="knowledge"></div>
          <div data-portal-board-toolbar>
            <div data-portal-board-search>
              <label for="q"><!--portal-i18n:"搜索知识条目"-->搜索知识条目</label>
              <input data-portal-board-search-input id="q" type="search" placeholder="本地筛选：标题、预览或 Knowledge ID…" autocomplete="off"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;本地筛选：标题、预览或 Knowledge ID…&quot;}"/>
              <button data-portal-board-semantic id="semanticBtn" type="button" aria-label="根据输入内容发起知识库语义检索" title="根据输入内容发起知识库语义检索" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;根据输入内容发起知识库语义检索&quot;, &quot;title&quot;: &quot;根据输入内容发起知识库语义检索&quot;}"><span><!--portal-i18n:"AI 语义检索"-->AI 语义检索</span></button>
            </div>
            <div data-portal-board-actions aria-label="Knowledge actions" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Knowledge actions&quot;}">
              <div data-portal-board-filter class="filter-wrap" data-portal-toolbar-item data-portal-toolbar-priority="normal">
                <button data-portal-board-action="filter" id="filterBtn" type="button" aria-label="按日期、状态、类型和项目筛选知识条目" title="按日期、状态、类型和项目筛选知识条目" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;按日期、状态、类型和项目筛选知识条目&quot;, &quot;title&quot;: &quot;按日期、状态、类型和项目筛选知识条目&quot;}"><span><!--portal-i18n:"筛选"-->筛选</span></button>
                <div class="filter-panel" id="filterPanel">
              <div class="filter-group">
                <div class="filter-group-label"><!--portal-i18n:"日期"-->日期</div>
                <div class="filter-options" id="fpDate">
                  <label class="filter-option"><input type="radio" name="fp_date" value="all" checked><!--portal-i18n:" 全部"--> 全部</label>
                  <label class="filter-option"><input type="radio" name="fp_date" value="2d"><!--portal-i18n:" 最近两天"--> 最近两天</label>
                  <label class="filter-option"><input type="radio" name="fp_date" value="7d"><!--portal-i18n:" 最近一周"--> 最近一周</label>
                  <label class="filter-option"><input type="radio" name="fp_date" value="30d"><!--portal-i18n:" 最近一月"--> 最近一月</label>
                </div>
              </div>
              <hr class="filter-divider">
              <div class="filter-group">
                <div class="filter-group-label"><!--portal-i18n:"条目状态"-->条目状态</div>
                <div class="filter-options" id="fpStatus">
                  <label class="filter-option"><input type="radio" name="fp_status" value="" checked><!--portal-i18n:" 全部"--> 全部</label>
                  <label class="filter-option"><input type="radio" name="fp_status" value="__none__"><!--portal-i18n:" 无状态"--> 无状态</label>
                  <label class="filter-option"><input type="radio" name="fp_status" value="open"><!--portal-i18n:" open"--> open</label>
                  <label class="filter-option"><input type="radio" name="fp_status" value="done"><!--portal-i18n:" done"--> done</label>
                  <label class="filter-option"><input type="radio" name="fp_status" value="dismiss"><!--portal-i18n:" dismiss"--> dismiss</label>
                  <label class="filter-option"><input type="radio" name="fp_status" value="obsolete"><!--portal-i18n:" obsolete"--> obsolete</label>
                </div>
              </div>
              <hr class="filter-divider">
              <div class="filter-group">
                <div class="filter-group-label"><!--portal-i18n:"Projects"-->Projects</div>
                <div class="filter-options" id="fpProjects"></div>
              </div>
              <hr class="filter-divider">
              <div class="filter-group">
                <div class="filter-group-label"><!--portal-i18n:"知识库标签 (类型)"-->知识库标签 (类型)</div>
                <div class="filter-options" id="fpType"></div>
              </div>
              <hr class="filter-divider">
              <div class="filter-group">
                <div class="filter-group-label"><!--portal-i18n:"Importance"-->Importance</div>
                <div class="filter-options" id="fpImportance">
                  <label class="filter-option"><input type="radio" name="fp_imp" value="0" checked><!--portal-i18n:" 全部"--> 全部</label>
                  <label class="filter-option"><input type="radio" name="fp_imp" value="3"> ≥ 3</label>
                  <label class="filter-option"><input type="radio" name="fp_imp" value="5"> ≥ 5</label>
                </div>
              </div>
                </div>
              </div>
              <button class="portalButton is-compact is-quiet" data-portal-toolbar-item data-portal-toolbar-priority="high" id="archiveBtn" type="button" aria-label="打开知识归档工作区" title="打开知识归档工作区" data-portal-icon="archive" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;打开知识归档工作区&quot;, &quot;title&quot;: &quot;打开知识归档工作区&quot;}"><span><!--portal-i18n:"归档"-->归档</span></button>
              <button data-portal-board-action="refresh" data-portal-toolbar-item data-portal-toolbar-priority="low" id="reload" type="button" aria-label="重新加载知识库索引和当前条目" title="刷新" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;重新加载知识库索引和当前条目&quot;, &quot;title&quot;: &quot;刷新&quot;}"></button>
              <span data-portal-board-divider data-portal-toolbar-item data-portal-toolbar-priority="normal" aria-hidden="true"></span>
              <div class="knowledgeModeActions" data-portal-toolbar-item data-portal-toolbar-priority="critical" role="tablist" aria-label="知识视图" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;知识视图&quot;}">
                <button class="knowledgeViewTab active" id="knowledgeBoardBtn" type="button" data-knowledge-view="board" role="tab" aria-label="打开知识列表" aria-selected="true" data-portal-icon="list" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;打开知识列表&quot;}"><span><!--portal-i18n:"Board"-->Board</span></button>
                <button class="knowledgeViewTab" id="knowledgeMapBtn" type="button" data-knowledge-view="map" role="tab" aria-label="打开知识图谱" aria-selected="false" data-portal-icon="network" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;打开知识图谱&quot;}"><span><!--portal-i18n:"Map"-->Map</span></button>
              </div>
            </div>
            <span data-portal-board-meta id="meta"><!--portal-i18n:"加载中…"-->加载中…</span>
          </div>
          <div data-portal-board-slot="filter-summary" id="knowledgeFilterSummary"></div>
          <div class="portalSemanticPanel" data-portal-board-slot="semantic" id="semanticPanel"></div>
        </div>
      </div>
    </header>

    <main class="portalPageFrame">
      <div class="portalSemanticIdentity" id="knowledgeSemanticIdentity" hidden></div>
      <div class="knowledgeMapPage" id="knowledgeMapPage" hidden>
        <section class="knowledgeMapStage">
          <div class="knowledgeMapToolbar">
            <div class="knowledgeMapSearchWrap" data-portal-search-field data-portal-search-density="compact">
              <label class="srOnly" for="knowledgeMapSearch"><!--portal-i18n:"定位知识节点"-->定位知识节点</label>
              <input data-portal-search-input id="knowledgeMapSearch" type="search" placeholder="搜索并定位节点…" autocomplete="off"  data-portal-i18n-attrs="{&quot;placeholder&quot;: &quot;搜索并定位节点…&quot;}"/>

            </div>
            <select class="knowledgeMapSelect" id="knowledgeMapProject" aria-label="按 Project 筛选图谱" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;按 Project 筛选图谱&quot;}"></select>
            <select class="knowledgeMapSelect" id="knowledgeMapType" aria-label="按类型筛选图谱" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;按类型筛选图谱&quot;}"></select>
            <select class="knowledgeMapSelect" id="knowledgeMapRelation" aria-label="按关系筛选图谱" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;按关系筛选图谱&quot;}"></select>
            <button class="knowledgeMapToggle active" id="knowledgeMapConnectedOnly" type="button" aria-pressed="true" title="隐藏尚未建立关系的条目" data-portal-i18n-attrs="{&quot;title&quot;: &quot;隐藏尚未建立关系的条目&quot;}"><!--portal-i18n:"只看关联"-->只看关联</button>

            <span class="knowledgeMapCount" id="knowledgeMapSub"><!--portal-i18n:"正在准备图谱…"-->正在准备图谱…</span>
          </div>
          <div class="knowledgeMapCanvasWrap" id="knowledgeMapViewport">
            <svg class="knowledgeMapSvg" data-portal-visualization="knowledge-map" id="knowledgeMapSvg" role="img" aria-label="Knowledge 自由关系图谱" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;Knowledge 自由关系图谱&quot;}">
              <g id="knowledgeMapScene">
                <g id="knowledgeMapEdges"></g>
                <g id="knowledgeMapEdgeLabels"></g>
                <g id="knowledgeMapNodes"></g>
              </g>
            </svg>
            <div class="knowledgeMapOverlay" id="knowledgeMapOverlay">
              <div class="knowledgeMapOverlayCard" id="knowledgeMapOverlayCard">
                <span class="knowledgeMapSpinner" aria-hidden="true"></span>
                <span><!--portal-i18n:"正在读取真实知识关系…"-->正在读取真实知识关系…</span>
              </div>
            </div>
            <div class="knowledgeMapLegend" id="knowledgeMapLegend" hidden></div>
            <div class="knowledgeMapViewportControls" aria-label="图谱画布控制" data-portal-i18n-attrs="{&quot;aria-label&quot;: &quot;图谱画布控制&quot;}">
              <button class="knowledgeMapViewportButton" id="knowledgeMapZoomOut" type="button" title="缩小" aria-label="缩小图谱" data-portal-icon="minus" data-portal-i18n-attrs="{&quot;title&quot;: &quot;缩小&quot;, &quot;aria-label&quot;: &quot;缩小图谱&quot;}"></button>
              <button class="knowledgeMapViewportButton" id="knowledgeMapFit" type="button" title="适合画布" aria-label="让全部节点适合画布" data-portal-icon="fit-view" data-portal-i18n-attrs="{&quot;title&quot;: &quot;适合画布&quot;, &quot;aria-label&quot;: &quot;让全部节点适合画布&quot;}"></button>
              <button class="knowledgeMapViewportButton" id="knowledgeMapZoomIn" type="button" title="放大" aria-label="放大图谱" data-portal-icon="plus" data-portal-i18n-attrs="{&quot;title&quot;: &quot;放大&quot;, &quot;aria-label&quot;: &quot;放大图谱&quot;}"></button>
            </div>
          </div>
        </section>
        <aside class="knowledgeMapSide" id="knowledgeMapSide"></aside>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display: none"><!--portal-i18n:"没有匹配的条目"-->没有匹配的条目</div>
      <div class="knowledgeRadarPage" id="knowledgeRadarPage" hidden>
        <section class="knowledgeRadarHero">
          <div class="knowledgeRadarTitle">
            <h2><!--portal-i18n:"Knowledge overview"-->Knowledge overview</h2>
            <span id="knowledgeRadarSub"><!--portal-i18n:"Demo"-->Demo</span>
          </div>
          <div class="knowledgeRadarChart" id="knowledgeRadarChart"></div>
          <div class="knowledgeRadarMetrics" id="knowledgeRadarMetrics"></div>
        </section>
        <section class="knowledgeRadarStack">
          <div class="knowledgeRadarPanel">
            <div class="knowledgeRadarPanelHeader">
              <h3><!--portal-i18n:"Signals"-->Signals</h3>
              <span id="knowledgeRadarSignalCount"><!--portal-i18n:"0 signals"-->0 signals</span>
            </div>
            <div class="knowledgeRadarSignals" id="knowledgeRadarSignals"></div>
          </div>
          <div class="knowledgeRadarPanel">
            <div class="knowledgeRadarPanelHeader">
              <h3><!--portal-i18n:"Projects"-->Projects</h3>
              <span id="knowledgeRadarProjectCount"><!--portal-i18n:"0 projects"-->0 projects</span>
            </div>
            <div class="knowledgeRadarProjects" id="knowledgeRadarProjects"></div>
          </div>
        </section>
      </div>
    </main>

    <div class="portalDetailOverlay" data-portal-detail-overlay id="modal" hidden>
      <div class="portalDetailSurface detailModalCard" data-portal-detail-surface data-portal-detail-size="workbench" role="dialog" aria-modal="true">

    <div class="portalDetailOverlay" data-portal-detail-overlay id="archiveModal" hidden>

          </div>
        </div>
        <div class="portalDetailBody is-flush archiveBody" data-portal-detail-body id="archiveBody">

            <div class="archivePaneHeader">
              <div class="archivePaneTitle"><!--portal-i18n:"输入"-->输入</div>

                <button class="archivePaneToggle" id="archiveInputToggle" type="button" title="折叠输入区" aria-label="折叠输入区" data-portal-icon="chevron-left" data-portal-i18n-attrs="{&quot;title&quot;: &quot;折叠输入区&quot;, &quot;aria-label&quot;: &quot;折叠输入区&quot;}"></button>

                        <button class="portalButton" id="archiveCreate" type="button"><!--portal-i18n:"生成方案"-->生成方案</button>
                      </div>
                    </div>
                  </div>
                  <input id="archiveFileInput" type="file" multiple hidden />
                </div>
              </div>
              <div class="archiveJobList" id="archiveJobList"></div>

            <div class="archivePaneHeader">

              <div class="archiveActions">
                <button class="portalButton" id="archiveDrafts" type="button"><!--portal-i18n:"生成/更新草稿"-->生成/更新草稿</button>
                <button class="portalButton" id="archiveApply" type="button"><!--portal-i18n:"Apply 到知识库"-->Apply 到知识库</button>
              </div>
            </div>
            <div class="archiveScroll">
              <div class="archiveCandidateList" id="archiveCandidates"></div>
              <hr class="filter-divider">
              <div class="archiveDraftList" id="archiveDraftList"></div>
            </div>
          </section>
          <section class="archivePane" id="archiveChatWorkspace"></section>
